# Rate sheet pt-deposits-2026.1 — the treasury-authored SOURCE of the term-deposit
# rates that are live in the local demo stack.
#
# Plain English: this YAML file IS the rate sheet. It is the auditor-readable
# source of truth a treasury / ALM author edits; deploying it serialises it 1:1
# into an immutable row in the `rate_sheets` Postgres table. You never edit the
# stored row or the database — you edit THIS file and deploy a new version of it.
# A correction or a new tier ships forward-only as a NEW file (a new
# `rate_sheet_version_id` with a later `effective_from`); a published sheet is
# never edited in place.
#
# ADR-PC-008 §P1/§P2: the stored JSONB `body` is "1:1 with the deployed YAML",
# bounded by the verified pack's `max_consumer_rate_bps`; idempotency is keyed on
# `rate_sheet_version_id` (identical re-deploy → 200, a different body under the
# same id → 409). Owner: Treasury / ALM (see CODEOWNERS). Cadence: daily–weekly.
# The numbers below are illustrative demo values, not a real PT rate card.
#
# How to deploy this file: `make deploy-rate-sheet SHEET=rate-sheets/term_deposit/pt-deposits-2026.1.yaml`
# (or scripts/deploy-rate-sheet.sh) — the YAML-native deploy tool serialises this
# file to JSON 1:1 and POSTs it. The demo scripts (make demo-mcp / demo-saga / demo)
# deploy straight from THIS file, so it is the single source and cannot drift from the
# demo. Full loop: docs/product-docs/how-to/author-and-deploy-a-rate-sheet.md (bd babelstone-alfy).

# --- Envelope: these fields become columns on the immutable stored row. ---
rate_sheet_version_id: pt-deposits-2026.1     # PRIMARY KEY. A new version = a new file.
product_family: term_deposit                  # The family this sheet prices.
pack_version: pt.2026.1                        # The verified pack whose max_consumer_rate_bps bounds every TAN.
effective_from: "2026-01-01T00:00:00+00:00"   # Active from this instant. UNIQUE within the family.
approved_by: treasury.alm@bank.internal       # The treasury / ALM approver, recorded on the row.
approval_ref: ALM-2026-019                     # The treasury sign-off reference.

# --- Body: products -> role -> ordered principal bands (the priceable data). ---
# Each band is { principal_cents: [from, to], tan_basis_points: N }. Bands are
# half-open [from, to) — lower inclusive, upper exclusive — and exactly the
# highest band is open-ended, written `to: null`. The bands for one (product,
# role) must be contiguous, non-overlapping, and exhaustive. This starter sheet
# offers a single open-ended `standard` band per product.
products:
  dpz_pt_12m_juros_venc:
    standard:
      bands:
        - { principal_cents: [0, null], tan_basis_points: 300 }   # 3.00% TAN, all principals
  dpz_pt_12m_juros_mensal:
    standard:
      bands:
        - { principal_cents: [0, null], tan_basis_points: 325 }   # 3.25% TAN, all principals
  dpz_pt_12m_juros_antecip:
    standard:
      bands:
        - { principal_cents: [0, null], tan_basis_points: 300 }   # 3.00% TAN, all principals
