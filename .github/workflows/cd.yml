name: CD — promote to P.6 (Kubernetes)

# Continuous delivery for the deployed P.6 Kubernetes environments (Q.6 / bd babelstone-4c81).
#
# In plain English: CI (ci.yml) proves a change is sound; image-build.yml builds + cosign-signs
# each deployable by immutable digest (Q.5). THIS workflow is the next step — it PROMOTES those
# signed images into a P.6 Kubernetes environment. Before anything serves traffic it: (1) verifies
# the images it is about to deploy are genuinely the cosign-signed bytes (verify by digest, never
# by a movable tag); (2) gates the forward-only DB migrations (refuse a release that rewrote an
# already-applied migration or would roll the schema backward); (3) renders + kubeconforms the
# environment's Kustomize overlay; (4) runs a declarative Kong `deck sync` with the REAL edge
# mTLS + IAM key material pulled from OpenBao at sync time (bd babelstone-4c81.1) — never the
# committed POC placeholders; and (5) reconciles the first-party Logto Management-API config
# (the MCP API resource + scopes, the ops-console client, default-tenant MFA) that lives in Logto's
# own DB and is NOT captured in any manifest — so a Logto re-onboard self-heals on the next promote
# instead of leaving the substrate ADR-IC-021 C1/C5/C4/C7 depend on silently wiped (bd zla1.10.x).
#
# Honours, as the deploy-time realisation of decisions CI only validates:
#   • ADR-PC-019 §P1 — path-scoped monorepo CI; this is the promotion lane those subtrees feed.
#   • ADR-IC-006 §P1 — DB-less declarative Kong; the edge is converged by `deck sync`, never an
#     Admin-API mutation. §P5 — Boundary-2 upstream mTLS (real internal-CA cert + tls_verify on).
#     §P7 — JWT key registration/rotation as the deliberate 3-step `deck sync`.
#   • ADR-PC-018 — the SoR-routing edge config rides the same one git-tracked kong.yml this syncs.
#   • ADR-IC-021 — the IAM authorization server. §C1/C5 (aud-bound MCP resource + per-tool scopes) and
#     §C4/C7 (step-up MFA factors) are kept reproducible by the configure-logto job; §C6 (curated
#     client registration / the DCR gap) stays a deliberate HAND step — this job does NOT onboard
#     arbitrary clients, only the first-party MCP resource, ops-console client, and default MFA.
#
# Promotion targets (P.6): the Kustomize overlays under infra/k8s/overlays — `ha`
# (the P.7 production-shaped topology) and `staging` (the always-on demo box —
# single-replica + durable hcloud storage + the public TLS edge; bd babelstone-zla1).
# (The single-replica, non-HA backing-infra rendering is `infra/k8s/base` itself —
# it is what the overlays diverge from, not a promotable environment of its own.)
# The TARGET is chosen by the manual dispatch input; a push-to-main run does the hermetic gates
# only (no cluster credentials on the default runner — applying to a real cluster is an
# environment-gated, human-dispatched step). NOTE: promoting `staging` additionally needs its
# cluster-scoped bootstrap (cert-manager + the Let's Encrypt ClusterIssuer) applied once first —
# see infra/k8s/overlays/staging/bootstrap/.
#
# Security: NO real cert/key material is committed. The deck-sync step pulls the real material from
# OpenBao at run time (a deploy-scoped token in an environment secret, never root, never the browser).
# The committed kong.yml carries only the CI-parseable POC placeholder PEM that the render replaces.

on:
  # Hermetic gate lane: every push to main re-proves the promotion gates are GREEN (the
  # render path, the cosign-verify wiring, the forward-only migration gate, the overlay
  # render) without touching a live cluster/registry — the same path-scoped posture as CI.
  push:
    branches: [main]
    paths: &cd_paths
      - 'infra/k8s/**'
      - 'infra/kong/**'
      - 'scripts/deck-sync.sh'
      - 'scripts/cd-migrate.sh'
      - 'scripts/cd-secret-preflight.sh'
      - 'scripts/iam/**'
      - 'engine/src/Babelstone.EventStore.Migrations/**'
      - 'orchestrator/src/Babelstone.Orchestrator.Substrate/Migrations/**'
      - 'families/term-deposit/src/Babelstone.Families.TermDeposit.Application/Migrations/**'
      - '.github/workflows/cd.yml'
  pull_request:
    paths: *cd_paths
  # Real promotion lane: a human dispatches a deploy to a named environment. The `environment:`
  # binding (below) is where the deploy kubeconfig (the SCOPED cd-deployer ServiceAccount one,
  # never cluster-admin — bd babelstone-zla1.12.1), the registry pull creds, and the OpenBao
  # deploy token live as protected environment secrets — gated by whatever approvers the env requires.
  workflow_dispatch:
    inputs:
      overlay:
        description: 'Kustomize overlay to promote (infra/k8s/overlays/<overlay>)'
        type: choice
        options: [ha, staging]
        default: staging
      apply:
        description: 'Actually apply to the cluster + deck sync (needs the environment secrets); false = gates + render only'
        type: boolean
        default: false
      configure_logto:
        description: 'Reconcile the first-party Logto Management-API config (MCP resource/scopes, ops-console client, default MFA). Runs after a staging apply, or standalone (apply=false) to re-heal a re-onboarded Logto without re-promoting. staging only.'
        type: boolean
        default: true

concurrency:
  # One promotion of a given ref at a time; never cancel an in-flight apply (a half-applied
  # deploy is worse than a queued one), so cancel only on non-main refs.
  group: cd-${{ github.ref }}-${{ github.event.inputs.overlay || 'gate' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ── 1 · cosign-verify the signed images by digest (Q.5 → Q.6 hand-off) ──────────────
  verify-images:
    name: verify signed images (cosign, by digest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read     # read image manifests/signatures from GHCR
      id-token: write     # cosign verify resolves the Fulcio/Rekor identity (keyless)
    steps:
      - uses: actions/checkout@v7
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      # On a real promotion the deployer pins each image by DIGEST (the exact bytes Q.5 signed)
      # and verifies the keyless signature against the workflow OIDC identity that produced it —
      # the image-build.yml identity (the engine-team identity in v1; bank-internal OIDC in prod,
      # ADR-PC-007 §P2). We do NOT verify against live GHCR here (a push-to-main / PR run has no
      # promotable digest set yet), so this step asserts the verify CONTRACT: the exact cosign
      # invocation a deployer runs, with the identity regexes a promotion must pin. A real
      # promotion supplies IMAGE_DIGESTS (newline-separated name@sha256:… refs) as an env secret.
      # The deployed-bytes realisation of this — resolve every rendered first-party image to its
      # digest, cosign-verify THAT, and pin the manifest to it — runs in the promote job (step
      # 4c2, ADR-PC-007 §A2), so verify and deploy reference the same digest and the kubelet can
      # no longer pull a movable :latest the check never saw. This job stays the early fail-fast
      # contract gate plus the explicit-PROMOTE_IMAGE_DIGESTS override path.
      - name: Assert the cosign-verify contract (identity-pinned, by digest)
        env:
          # The OIDC identity image-build.yml signs under — pin to the repo's signing workflow.
          COSIGN_CERT_IDENTITY_REGEX: 'https://github.com/jhosm/babelstone/.github/workflows/image-build.yml@.*'
          COSIGN_CERT_OIDC_ISSUER: 'https://token.actions.githubusercontent.com'
          IMAGE_DIGESTS: ${{ secrets.PROMOTE_IMAGE_DIGESTS }}
        run: |
          set -euo pipefail
          echo "Deployers verify each promoted image by DIGEST against the signing OIDC identity:"
          echo "  cosign verify \\"
          echo "    --certificate-identity-regexp '$COSIGN_CERT_IDENTITY_REGEX' \\"
          echo "    --certificate-oidc-issuer '$COSIGN_CERT_OIDC_ISSUER' \\"
          echo "    ghcr.io/jhosm/babelstone-<service>@sha256:<digest>"
          if [ -n "${IMAGE_DIGESTS:-}" ]; then
            echo "PROMOTE_IMAGE_DIGESTS provided — verifying each promoted image by digest."
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              echo "::group::cosign verify $ref"
              cosign verify \
                --certificate-identity-regexp "$COSIGN_CERT_IDENTITY_REGEX" \
                --certificate-oidc-issuer "$COSIGN_CERT_OIDC_ISSUER" \
                "$ref"
              echo "::endgroup::"
            done <<< "$IMAGE_DIGESTS"
            echo "all promoted images verified by digest"
          else
            echo "No PROMOTE_IMAGE_DIGESTS set (gate lane) — verify CONTRACT asserted, no live digest to verify."
          fi

  # ── 2 · forward-only DB-migration gate (refuse a backward edit before promotion) ────
  migration-gate:
    name: forward-only migration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # the immutability diff compares against origin/main
      - name: Gate the three forward-only migration series (engine / orchestrator / family)
        # No DB here — this is the static promotion gate: monotonic numbering + no already-committed
        # migration rewritten vs origin/main. The live-ledger half (DB not ahead of the repo) runs at
        # apply time inside the cluster. cd-migrate.sh is the single source the demo host + the engine
        # runtime runner agree with on "applied".
        run: ./scripts/cd-migrate.sh --gate-only

  # ── 3 · render the target overlay + the OpenBao-backed deck-sync render path ─────────
  render:
    name: render overlay + deck-sync render path
    needs: [verify-images, migration-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3   # pins kustomize + kubeconform + deck from mise.toml
        with:
          version: "2026.6.6"      # same TEMP pin as ci.yml's infra job (broken mise latest release)
      - name: Render + kubeconform the promotion overlay (P.6)
        # The overlay the dispatch chose (default staging on the gate lane). Same render command +
        # --load-restrictor + pinned kubeconform + VENDORED schema-location as ci.yml's infra job,
        # so CD agrees with CI on "a valid manifest set" — schemas resolve offline from
        # infra/k8s/schemas/ (bd babelstone-6qt9), never the rate-limited raw.githubusercontent.com.
        #
        # Every overlay is validated FULLY -strict with NO -ignore-missing-schemas: every rendered
        # kind has a vendored schema. (Until bd babelstone-zla1.12.14.2 the staging leg carried
        # -ignore-missing-schemas for the openbao-csi SecretProviderClass CR, whose CRD schema is not
        # vendored; that CR is now applied out-of-band at bootstrap — never in the render — so the
        # flag is gone. See infra/k8s/components/openbao-csi/README.md.) Keep in lockstep with
        # ci.yml's infra job.
        env:
          OVERLAY: ${{ github.event.inputs.overlay || 'staging' }}
          SCHEMA_LOC: 'infra/k8s/schemas/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json'
        run: |
          set -euo pipefail
          echo "== rendering infra/k8s/overlays/$OVERLAY =="
          mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone "infra/k8s/overlays/$OVERLAY" \
            | mise exec -- kubeconform -strict -summary -kubernetes-version 1.31.0 \
                -schema-location "$SCHEMA_LOC"
      - name: Assert the digest-pin contract (hermetic — no registry, mirrors verify-images)
        # ADR-PC-007 §A2 (bd babelstone-2t16.30): the promote lane pins every first-party
        # ghcr.io/jhosm/babelstone-* image the overlay renders to its cosign-verified digest
        # before apply, so CD deploys the exact bytes it verified (closing the verify/deploy
        # TOCTOU). This is the CI-runnable HALF — it proves the resolve→verify→pin path stays
        # wired and finds a non-empty first-party set, WITHOUT a live registry, exactly as
        # verify-images asserts its cosign contract with no live digests. The real
        # resolve + cosign-verify + pin runs at apply time in the promote job (step 4c2).
        env:
          OVERLAY: ${{ github.event.inputs.overlay || 'staging' }}
        run: ./scripts/cd-pin-images.sh --contract "infra/k8s/overlays/$OVERLAY"
      - name: Secret preflight — the staging render must carry NO placeholder credential bodies
        # bd babelstone-zla1.12.4 (ADR-PC-004 §A1): staging drops the committed dev-placeholder
        # Secret (drop-dev-secrets.patch.yaml); this gate proves it stays dropped. Staging only —
        # base/ha keep the placeholder seam by design (laptop renders, never deployed).
        if: ${{ (github.event.inputs.overlay || 'staging') == 'staging' }}
        run: |
          set -euo pipefail
          mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone infra/k8s/overlays/staging \
            | ./scripts/cd-secret-preflight.sh --render
      - name: Prove the OpenBao-backed deck-sync render path (dry-run, no secrets, bd 4c81.1)
        # deck-sync.sh --dry-run synthesises throwaway PEM in-process and exercises the WHOLE
        # render: splice the real-material seams (edge + mcp client certs, internal CA bundle, IAM
        # RS256 pubkey) by entity id, flip tls_verify on (§P5 reverse half), fail-closed if any POC
        # body survived, then `deck file validate`. It proves the path a real `deck sync` takes
        # WITHOUT a live OpenBao or any committed secret — the CI-runnable half of bd 4c81.1.
        run: ./scripts/deck-sync.sh --dry-run

  # ── 4 · the real promotion: apply to the cluster + deck sync with OpenBao material ──
  promote:
    name: promote to ${{ github.event.inputs.overlay }} (apply)
    # Only on an explicit human dispatch with apply=true; the `environment:` gate is where the
    # cluster kubeconfig + OpenBao deploy token + registry creds live as protected secrets.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true' }}
    needs: [render]
    runs-on: ubuntu-latest
    environment: ${{ format('p6-{0}', github.event.inputs.overlay) }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v4.2.3
        with:
          version: "2026.6.6"
      - name: Install kubectl + cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR (read image manifests + cosign signatures)
        # crane (resolve tag→digest) and `cosign verify` both read the private GHCR
        # manifests + signatures the digest pin (step 4c2) checks; packages:read on this
        # job + the run token authorise it. Writes ~/.docker/config.json, which crane and
        # cosign both read.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 4a — forward-only migrations applied to the live DBs BEFORE the new images serve.
      #      SKIPPED for staging: staging migrates entirely IN-CLUSTER, each series against its
      #      OWN database, so a runner-side apply is both unreachable and structurally wrong there:
      #        • engine event-store → the `event-store-migrate` Job (infra/k8s/apps/), sentinel-gated
      #          so the engine initContainer waits on it (the engine does NOT self-migrate the store).
      #        • orchestrator saga-substrate → the orchestrator app self-migrates on boot, against its
      #          OWN `babelstone_orchestrator` DB (a separate DB from the engine's `babelstone`).
      #        • term_deposit read-model → the engine app self-applies it on boot.
      #      cd-migrate.sh targets a SINGLE connection/DB and the GH runner cannot reach the
      #      cluster-internal Postgres, so running it against staging would fail (unreachable) and,
      #      even tunnelled, could not span the two DBs. The static forward-only guarantee is NOT
      #      lost: the `migration-gate` job still runs cd-migrate.sh --gate-only hermetically, and a
      #      CI assertion keeps the in-cluster event-store-sql ConfigMap in lockstep with the on-disk
      #      Sql/ dir. Kept for non-staging overlays whose DB the runner reaches directly.
      #      (bd babelstone-zla1.12.16; the in-cluster machinery is bd babelstone-zla1.5.1.)
      - name: Apply forward-only migrations to the environment DBs
        if: ${{ github.event.inputs.overlay != 'staging' }}
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
        run: ./scripts/cd-migrate.sh
      # 4b — materialise the deploy kubeconfig and REFUSE a cluster-admin credential
      #      (bd babelstone-zla1.12.1). KUBECONFIG_B64 must carry the least-privilege
      #      cd-deployer ServiceAccount kubeconfig minted by scripts/cd-kubeconfig.sh
      #      (RBAC: overlays/staging/bootstrap/cd-deploy-rbac.yaml), never the
      #      hetzner-k3s cluster-admin kubeconfig. The probe is a SelfSubjectAccessReview
      #      (any authenticated identity may ask), so it fails closed on the credential
      #      itself, not on documentation.
      - name: Materialise the deploy kubeconfig (refuse cluster-admin)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_B64 }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          if kubectl auth can-i '*' '*' --all-namespaces >/dev/null 2>&1; then
            echo "::error::KUBECONFIG_B64 is a cluster-admin credential. Mint the scoped cd-deployer kubeconfig with scripts/cd-kubeconfig.sh (bootstrap/cd-deploy-rbac.yaml) and store THAT instead."
            exit 1
          fi
          echo "deploy identity is not cluster-admin: $(kubectl auth whoami -o json 2>/dev/null | head -c 300 || echo 'whoami unavailable (pre-1.28 kubectl)')"
      # 4c — fail-closed live secret preflight (bd babelstone-zla1.12.4): the staging deploy no
      #      longer renders the babelstone-dev-secrets Secret, so the REAL one must already live
      #      in the cluster (runbook §1 step 5) and must not still hold a dev placeholder value
      #      (POSTGRES_PASSWORD 'babelstone', OPENBAO_DEV_TOKEN 'root', the dev Logto KEK).
      #      Refuse the apply otherwise — a forgotten swap never reaches the public IAM.
      - name: Live secret preflight (refuse placeholder credentials)
        if: ${{ github.event.inputs.overlay == 'staging' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: ./scripts/cd-secret-preflight.sh --live -n babelstone-staging
      # 4c2 — pin first-party images to their cosign-verified digests (ADR-PC-007 §A2 + §A4,
      #       bd babelstone-2t16.30 / babelstone-2t16.31.2). For every ghcr.io/jhosm/babelstone-*
      #       image the overlay renders, cd-pin-images.sh resolves an immutable digest, cosign-verifies
      #       THAT name@sha256 against the image-build.yml signing identity, then `kustomize edit set
      #       image` the overlay to it — so 4d applies the exact bytes verify-images checks, closing the
      #       verify/deploy TOCTOU. WHICH build it pins is set by PROMOTE_GIT_REF (§A4): the PROMOTED
      #       COMMIT's own sha-<commit> build, so a promotion deploys the build of the exact commit
      #       being promoted rather than "whatever :latest is now". Because image builds are
      #       path-scoped, a commit may not have rebuilt every image, so on a miss the script walks the
      #       commit's git ancestors newest-first and pins the newest ancestor build (loudly logged) —
      #       never silently :latest; the walk needs the history this job checks out at fetch-depth:0
      #       (step top). PROMOTE_STRICT=1 would fail instead of walking. Fail-closed: an
      #       unresolvable/unverifiable image aborts the promotion. Runs for BOTH overlays (the
      #       first-party set is discovered from the render).
      - name: Pin first-party images by digest — commit-pinned resolve + cosign-verify, then pin
        env:
          OVERLAY: ${{ github.event.inputs.overlay }}
          PROMOTE_GIT_REF: ${{ github.sha }}   # §A4: pin to the build of the exact promoted commit
        run: ./scripts/cd-pin-images.sh --pin "infra/k8s/overlays/$OVERLAY"
      # 4d — apply the rendered overlay to the cluster with the scoped deploy identity.
      - name: kubectl apply the rendered overlay
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          OVERLAY: ${{ github.event.inputs.overlay }}
        run: |
          set -euo pipefail
          render="$(mktemp)"
          mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone "infra/k8s/overlays/$OVERLAY" > "$render"
          # A Job's spec.template is immutable, so re-applying a changed run-once Job (e.g. a moved
          # image digest on event-store-migrate, or a redeploy while a prior Job is still inside its
          # ttlSecondsAfterFinished window) fails the whole apply with "field is immutable". These Jobs
          # are ttl-recreated BY DESIGN and opt in via babelstone.io/recreate-on-apply=true — so delete
          # them first and let the apply below recreate them cleanly. The delete is label-scoped to the
          # render's own recreate-on-apply Jobs (nothing else is touched) and --ignore-not-found covers
          # the already-TTL'd case. Guarded so an overlay carrying no such Jobs is a no-op, not an error.
          if grep -q 'babelstone.io/recreate-on-apply' "$render"; then
            kubectl delete -f "$render" -l babelstone.io/recreate-on-apply=true --ignore-not-found
          fi
          kubectl apply -f "$render"
      # 4d2 — roll grafana-lgtm so ConfigMap-only edits actually reach the running pod (bd
      #       babelstone-zla1.10.18). Grafana's OIDC/RBAC + Prometheus-rule config rides in the
      #       stable-named grafana-rbac / grafana-lgtm-rules ConfigMaps (kustomization.yaml sets
      #       disableNameSuffixHash) and is subPath-mounted into the appliance (grafana-oidc.patch.yaml).
      #       A subPath ConfigMap mount is frozen at pod creation and NEVER live-updated by the kubelet,
      #       and the stable ConfigMap name leaves the Deployment spec byte-identical across a config
      #       edit — so the `kubectl apply` above triggers NO rollout, and the OLD config (e.g. a stale
      #       Logto client_id → oidc.invalid_client, the 2026-07-11 Grafana SSO outage) stays live until
      #       the pod is recreated. Force that recreation on every staging promote; grafana-lgtm is
      #       single-replica, so a few seconds' restart is acceptable. Only grafana-lgtm needs this —
      #       Mission Control + Backstage carry their OIDC client_id as Deployment env, so a change rolls
      #       THEM automatically. Staging-only: the grafana rbac/rules ConfigMaps are generated only in
      #       overlays/staging (base leaves the rbac config unmounted).
      #       Readiness is polled with `kubectl get`, NOT `kubectl rollout status`: the least-privilege
      #       cd-deployer (bootstrap/cd-deploy-rbac.yaml) holds get/list/patch on apps/deployments but no
      #       `watch` verb and no replicasets grant, and `rollout status` watches — so it would 403.
      #       `rollout restart` only PATCHes the pod-template annotation, which the deployer CAN do.
      - name: Roll grafana-lgtm so subPath-mounted config changes take effect (staging)
        if: ${{ github.event.inputs.overlay == 'staging' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          ns=babelstone-staging
          kubectl -n "$ns" rollout restart deployment/grafana-lgtm
          # Wait for the restarted rollout to complete with get-only polling. Ready ⇔ the controller
          # has observed the post-restart generation AND updated == available == desired replicas.
          # Read `gen`/`desired` once (they are set by the restart above); poll the status fields.
          gen=$(kubectl -n "$ns" get deployment grafana-lgtm -o jsonpath='{.metadata.generation}')
          desired=$(kubectl -n "$ns" get deployment grafana-lgtm -o jsonpath='{.spec.replicas}')
          for i in $(seq 1 60); do
            obs=$(kubectl -n "$ns" get deployment grafana-lgtm -o jsonpath='{.status.observedGeneration}')
            updated=$(kubectl -n "$ns" get deployment grafana-lgtm -o jsonpath='{.status.updatedReplicas}')
            avail=$(kubectl -n "$ns" get deployment grafana-lgtm -o jsonpath='{.status.availableReplicas}')
            if [ "${obs:-0}" = "${gen:-1}" ] && [ "${updated:-0}" = "${desired:-1}" ] && [ "${avail:-0}" = "${desired:-1}" ]; then
              echo "grafana-lgtm rolled: generation=$gen updated=${updated:-0} available=${avail:-0} (after ~$((i * 3))s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::grafana-lgtm did not become Ready within ~180s of the restart — inspect the new pod (likely a bad grafana.ini or a missing GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET)."
          kubectl -n "$ns" get deployment grafana-lgtm -o wide || true
          exit 1
      # 4e — open the kubelet tunnel to the Kong Admin API for the deck sync in 4f.
      #      Staging binds the Admin API to the pod's loopback and drops its 8001 Service
      #      port (overlays/staging/kong-admin-localhost.patch.yaml, bd babelstone-zla1.12.8),
      #      so no cluster-network address — and no secret-held URL — reaches it any more.
      #      `kubectl port-forward` tunnels through the kubelet and connects to the POD's
      #      loopback, which is exactly why the loopback bind stays deck-syncable. The scoped
      #      cd-deployer Role grants the minimal verbs this needs (pods get/list +
      #      pods/portforward create — bootstrap/cd-deploy-rbac.yaml; bd babelstone-zla1.12.12,
      #      the follow-up the patch header named). The forward runs in the background with its
      #      PID kept for the explicit 4g teardown; the readiness loop polls the Admin /status
      #      THROUGH the tunnel so 4f never races the connection, and fails loud (with the
      #      forward's own log) if the tunnel dies or never comes up.
      #      SKIPPED for staging (bd babelstone-zla1.12.18): deck sync (4f) needs REAL edge
      #      material from OpenBao, but staging runs OpenBao in -dev (in-memory, EMPTY — nothing
      #      seeds the edge material; real provisioning is deferred to M.2/puu3) and it is not
      #      runner-reachable. There is nothing to sync, so staging's edge keeps its committed
      #      kong.yml config; this tunnel exists only to feed 4f, so it is skipped in lockstep.
      - name: Port-forward the Kong Admin API (kubelet tunnel to the pod loopback)
        if: ${{ github.event.inputs.overlay != 'staging' }}
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set -euo pipefail
          kubectl port-forward deploy/kong 8001:8001 \
            > "$RUNNER_TEMP/kong-port-forward.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/kong-port-forward.pid"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8001/status >/dev/null 2>&1; then
              echo "Kong Admin API reachable through the tunnel (after ~${i}s)"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/kong-port-forward.pid")" 2>/dev/null; then
              echo "::error::kubectl port-forward exited before the Admin API became reachable:"
              cat "$RUNNER_TEMP/kong-port-forward.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::Kong Admin API not reachable through the port-forward after 30s"
          cat "$RUNNER_TEMP/kong-port-forward.log"
          exit 1
      # 4f — declarative Kong deck sync with the REAL edge mTLS + IAM key from OpenBao (bd 4c81.1).
      #      BAO_ADDR/BAO_TOKEN are environment secrets (a deploy-scoped policy, never root).
      #      The Admin address is the 4e tunnel's local end — structural, not configuration —
      #      which retires the KONG_ADMIN_ADDR environment secret (once the loopback bind
      #      landed it pointed at nothing a runner could reach).
      #      SKIPPED for staging in lockstep with 4e (bd babelstone-zla1.12.18): no real
      #      OpenBao-backed edge material exists on staging (dev-mode seam, M.2/puu3).
      - name: deck sync the edge config (real OpenBao mTLS + IAM key, ADR-IC-006 §P1/§P5/§P7)
        if: ${{ github.event.inputs.overlay != 'staging' }}
        env:
          BAO_ADDR: ${{ secrets.BAO_ADDR }}
          BAO_TOKEN: ${{ secrets.BAO_DEPLOY_TOKEN }}
        run: ./scripts/deck-sync.sh --kong-addr http://127.0.0.1:8001
      # 4g — tear the tunnel down explicitly. The runner reaps stray processes at job end
      #      anyway, but the forward holds an authenticated kubelet stream, so we kill it the
      #      moment it has served its one purpose rather than rely on teardown.
      - name: Stop the Kong Admin port-forward
        if: ${{ always() && github.event.inputs.overlay != 'staging' }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/kong-port-forward.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/kong-port-forward.pid")" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/kong-port-forward.pid"
            echo "port-forward stopped"
          else
            echo "no port-forward was started (an earlier step failed before 4e)"
          fi

  # ── 5 · hermetic contract lane for the Logto-config path (push/PR, no live Logto) ────
  #     The static mirror of the configure-logto job below — proves the reconcile path parses and
  #     stays wired on every push/PR, WITHOUT a live Logto or the p6-staging secrets, exactly as
  #     verify-images asserts its cosign contract with no digests and migration-gate is the static
  #     half of the apply-time migration. Cheap; no network, no token.
  configure-logto-contract:
    name: configure-logto contract (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert the Logto-config path parses and stays wired (no network, no token)
        run: |
          set -euo pipefail
          # 1. All five Logto-config scripts (four reconciles + the verify) must byte-compile.
          python3 -m py_compile \
            scripts/iam/register-mcp-resource.py \
            scripts/iam/register-product-api-resource.py \
            scripts/iam/enable-default-mfa.py \
            scripts/iam/register-ops-console.py \
            scripts/iam/verify-oidc-clients.py
          # 2. Each must still read its Management-API token from the environment (never a literal).
          for f in register-mcp-resource register-product-api-resource enable-default-mfa register-ops-console verify-oidc-clients; do
            grep -q 'LOGTO_MGMT_TOKEN' "scripts/iam/$f.py" \
              || { echo "::error::scripts/iam/$f.py no longer reads LOGTO_MGMT_TOKEN from the environment"; exit 1; }
          done
          # 3. The ops-console fail-loud target var must still be honoured.
          grep -q 'OPS_EXPECT_CLIENT_ID' scripts/iam/register-ops-console.py \
            || { echo "::error::register-ops-console.py dropped the OPS_EXPECT_CLIENT_ID fail-loud check"; exit 1; }
          # 3b. The verify must still honour BOTH hand-registered surfaces' fail-loud target vars
          #     (bd babelstone-zla1.10.19) — else the Grafana/Backstage registration gate goes dark.
          for v in GRAFANA_EXPECT_CLIENT_ID BACKSTAGE_EXPECT_CLIENT_ID; do
            grep -q "$v" scripts/iam/verify-oidc-clients.py \
              || { echo "::error::verify-oidc-clients.py dropped the $v fail-loud check"; exit 1; }
          done
          # 4. This workflow must still invoke all five from the live configure-logto job.
          for f in register-mcp-resource register-product-api-resource enable-default-mfa register-ops-console verify-oidc-clients; do
            grep -q "scripts/iam/$f.py" .github/workflows/cd.yml \
              || { echo "::error::cd.yml no longer invokes scripts/iam/$f.py"; exit 1; }
          done
          echo "configure-logto contract OK"

  # ── 6 · reconcile the first-party Logto Management-API config (apply, post-promote) ──
  #     The idempotent reproduce-path for Logto state that lives in Logto's own DB, NOT in any
  #     manifest or `logto db seed` Job — so a re-onboard would otherwise silently wipe the
  #     ADR-IC-021 C1/C5/C4/C7 substrate. Runs after a staging promote (configure_logto=true,
  #     the default) OR standalone (apply=false) to re-heal a hand-re-onboarded Logto without
  #     re-promoting images. Unlike the Kong deck-sync (4e/4f) it needs NO kubeconfig and NO
  #     port-forward: Logto's Management API is deliberately PUBLIC (auth.babelstone.dev via
  #     Cloudflare), and its state is not Kubernetes state. It only needs a deploy-scoped
  #     Management-API token, minted in-process from the babelstone-mgmt M2M app (never root).
  configure-logto:
    name: configure Logto (Management-API reconcile)
    needs: [render, promote]
    # Run on a staging promote (with configure_logto on), OR standalone when apply=false (promote
    # skipped). Require render green in both modes; tolerate a skipped promote (the standalone lane).
    if: >-
      ${{ !cancelled()
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.overlay == 'staging'
          && github.event.inputs.configure_logto == 'true'
          && needs.render.result == 'success'
          && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: p6-staging
    permissions:
      contents: read
    env:
      # The public default-tenant issuer host — same one Mission Control + Grafana dial. Override
      # via a repo/environment variable if the host ever changes; the scripts default to the same.
      LOGTO_BASE_URL: ${{ vars.LOGTO_BASE_URL || 'https://auth.babelstone.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3   # pins kustomize (to render the deployed OIDC_CLIENT_ID)
        with:
          version: "2026.6.6"
      # 6a — never race the logto-db-init/seed Jobs: wait until the issuer answers discovery.
      - name: Wait for the Logto OIDC issuer (discovery 200)
        run: |
          set -euo pipefail
          url="$LOGTO_BASE_URL/oidc/.well-known/openid-configuration"
          for i in $(seq 1 30); do
            # Descriptive UA is mandatory: Cloudflare managed-bot rule 1010 bans the default agent
            # in front of auth.babelstone.dev (same reason the scripts set one).
            if curl -fsS -A babelstone-iam/1.0 --max-time 5 "$url" >/dev/null 2>&1; then
              echo "Logto issuer reachable (after ~$((i * 2))s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::Logto OIDC discovery ($url) not reachable after ~60s"; exit 1
      # 6b — the fail-loud target: the OIDC_CLIENT_ID Mission Control is actually deployed with.
      #      Read from the RENDERED overlay (== what promote applied this run), so a future patch
      #      that overrides it is still caught. register-ops-console.py exits non-zero if the
      #      Logto-registered ops-console App ID does not equal this (your fail-loud choice).
      - name: Extract the deployed Mission Control OIDC_CLIENT_ID
        id: mc
        run: |
          set -euo pipefail
          rendered=$(mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone infra/k8s/overlays/staging)
          cid=$(printf '%s\n' "$rendered" \
            | grep -A1 -E '^[[:space:]]*-?[[:space:]]*name:[[:space:]]+OIDC_CLIENT_ID[[:space:]]*$' \
            | grep -E '^[[:space:]]*value:' | head -1 \
            | sed -E 's/^[[:space:]]*value:[[:space:]]*//; s/^"//; s/"$//')
          if [ -z "$cid" ]; then
            echo "::error::could not extract OIDC_CLIENT_ID from the rendered staging overlay"; exit 1
          fi
          echo "deployed Mission Control OIDC_CLIENT_ID = $cid"
          echo "client_id=$cid" >> "$GITHUB_OUTPUT"
      # 6b2 — the two OTHER Boundary-6 login surfaces' deployed client_ids (bd babelstone-zla1.10.19).
      #       Same source-of-truth as the mc step: read from the RENDERED overlay, so a patch that
      #       overrides either id is still caught. Backstage carries its id as the BACKSTAGE_OIDC_CLIENT_ID
      #       Deployment env; Grafana carries its as the `client_id =` ini assignment inside the
      #       grafana-rbac ConfigMap's custom.ini. One render, two outputs; verify-oidc-clients.py
      #       (run in 6c) fails the promote loud if either id is not a registered Logto app.
      - name: Extract the deployed Grafana + Backstage OIDC client_ids
        id: clients
        run: |
          set -euo pipefail
          rendered=$(mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone infra/k8s/overlays/staging)
          # Grafana's client_id is an ini assignment (`client_id = <id>`) inside the grafana-rbac
          # ConfigMap's custom.ini block — the `=` anchor distinguishes it from any YAML `client_id:`
          # a kong/oauth2 plugin might render.
          gcid=$(printf '%s\n' "$rendered" \
            | grep -E '^[[:space:]]*client_id[[:space:]]*=' | head -1 \
            | sed -E 's/^[[:space:]]*client_id[[:space:]]*=[[:space:]]*//; s/[[:space:]]*$//')
          bcid=$(printf '%s\n' "$rendered" \
            | grep -A1 -E '^[[:space:]]*-?[[:space:]]*name:[[:space:]]+BACKSTAGE_OIDC_CLIENT_ID[[:space:]]*$' \
            | grep -E '^[[:space:]]*value:' | head -1 \
            | sed -E 's/^[[:space:]]*value:[[:space:]]*//; s/^"//; s/"$//')
          if [ -z "$gcid" ]; then
            echo "::error::could not extract the Grafana client_id (grafana-rbac ConfigMap custom.ini) from the rendered staging overlay"; exit 1
          fi
          if [ -z "$bcid" ]; then
            echo "::error::could not extract BACKSTAGE_OIDC_CLIENT_ID from the rendered staging overlay"; exit 1
          fi
          echo "deployed Grafana client_id = $gcid ; Backstage client_id = $bcid"
          echo "grafana_client_id=$gcid"   >> "$GITHUB_OUTPUT"
          echo "backstage_client_id=$bcid" >> "$GITHUB_OUTPUT"
      # 6c — mint a Management-API token in-process and run the idempotent reconcile scripts, then the
      #      fail-loud verify.
      #      The token is a LOCAL shell var (masked, never written to $GITHUB_OUTPUT/$GITHUB_ENV),
      #      so it lives only inside this step. register-mcp-resource + register-product-api-resource +
      #      enable-default-mfa run first (pure idempotent config); register-ops-console runs last so its
      #      fail-loud mismatch check cannot skip the other reconciles.
      - name: Reconcile Logto config + verify Grafana/Backstage registration
        env:
          LOGTO_MGMT_APP_ID: ${{ secrets.LOGTO_MGMT_APP_ID }}
          LOGTO_MGMT_APP_SECRET: ${{ secrets.LOGTO_MGMT_APP_SECRET }}
          OPS_EXPECT_CLIENT_ID: ${{ steps.mc.outputs.client_id }}
          GRAFANA_EXPECT_CLIENT_ID: ${{ steps.clients.outputs.grafana_client_id }}
          BACKSTAGE_EXPECT_CLIENT_ID: ${{ steps.clients.outputs.backstage_client_id }}
        run: |
          set -euo pipefail
          if [ -z "${LOGTO_MGMT_APP_ID:-}" ] || [ -z "${LOGTO_MGMT_APP_SECRET:-}" ]; then
            echo "::error::LOGTO_MGMT_APP_ID / LOGTO_MGMT_APP_SECRET must be set as p6-staging environment secrets (the deploy-scoped babelstone-mgmt M2M app — never root)."
            exit 1
          fi
          LOGTO_MGMT_TOKEN=$(curl -fsS -A babelstone-iam/1.0 \
            -u "$LOGTO_MGMT_APP_ID:$LOGTO_MGMT_APP_SECRET" \
            -d grant_type=client_credentials \
            --data-urlencode resource=https://default.logto.app/api \
            -d scope=all "$LOGTO_BASE_URL/oidc/token" | jq -r '.access_token // empty')
          if [ -z "$LOGTO_MGMT_TOKEN" ]; then
            echo "::error::Management-API token mint returned no access_token (check the babelstone-mgmt M2M credentials + its resource grant)."
            exit 1
          fi
          echo "::add-mask::$LOGTO_MGMT_TOKEN"
          export LOGTO_MGMT_TOKEN LOGTO_BASE_URL
          echo "::group::register-mcp-resource"; python3 scripts/iam/register-mcp-resource.py; echo "::endgroup::"
          echo "::group::register-product-api-resource"; python3 scripts/iam/register-product-api-resource.py; echo "::endgroup::"
          echo "::group::enable-default-mfa";    python3 scripts/iam/enable-default-mfa.py;    echo "::endgroup::"
          echo "::group::register-ops-console";  python3 scripts/iam/register-ops-console.py;  echo "::endgroup::"
          # Fail-loud verify that the hand-registered surfaces (Grafana + Backstage) actually exist in
          # Logto with the deployed client_id + redirect URI — the net Mission Control already has via
          # register-ops-console. Reuses the in-step token; VERIFIES only (does not register — the
          # curated ADR-IC-021 §C6 posture). bd babelstone-zla1.10.19.
          echo "::group::verify-oidc-clients";   python3 scripts/iam/verify-oidc-clients.py;   echo "::endgroup::"
          echo "Logto Management-API config reconciled."

  # ── always-run aggregator (same gate pattern as ci.yml) ─────────────────────────────
  gate:
    name: CD gate
    needs: [verify-images, migration-gate, render, promote, configure-logto-contract, configure-logto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every triggered CD job to have passed (skipped is OK)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required CD job did not pass (result=$r)"; exit 1 ;;
            esac
          done
          echo "all triggered CD jobs passed"
