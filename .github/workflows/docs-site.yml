name: Docs site

# DocFX site (ADR-PC-026 §P3): the C# XML-doc API reference, published to GitHub
# Pages. The site renders the API surface PLUS one corpus landing page — the
# product-docs README is the home page (§P3 revised 2026-06-19, bd sfnt.26); the
# rest of the hand-authored corpus is NOT stitched in (it reads on GitHub natively,
# version-correct). So the trigger inputs are the API sources, the docfx/ config,
# the toolchain pins, and docs/product-docs/README.md (the home page source) — NOT
# the rest of docs/** or INSTALL.md, which do not feed this site. Build runs on
# PRs touching those inputs (a pre-merge "does the site still build" check, NOT a
# required gate — ADR-PC-019 §P1 aggregator rules don't apply); deploy runs only on
# push to main, via the artifact-based Pages flow (no gh-pages branch). This repo
# has ONE Pages slot: if a catalogue portal is ever published to Pages it composes
# into this same artifact under a subpath — it must NOT add a second deploy-pages
# workflow. (G.4/PR #110 superseded ADR-IC-008's EventCatalog static-site with
# ADR-IC-015's Backstage portal, whose host deployment is deferred — bd
# babelstone-s4ol.1 — and is a separate service, not a static site stitched here.)
# The standalone demo pages (the pitch deck + principles page) honour that
# one-slot rule: they are static files copied into the SAME artifact under /demo/
# after the DocFX build (bd babelstone-q096), not a second deploy. The interactive
# mission-control/ UI is deliberately excluded — it needs serve.py + a live backend
# and would not function as a static file.

on:
  pull_request:
    paths: &docs_site_paths
      - 'engine/**'
      - 'families/**'
      - 'docfx/**'
      - 'docs/product-docs/README.md' # the DocFX home page is rendered from this file (§P3, bd sfnt.26)
      - 'docs/demo/index.html'        # the standalone demo pages, staged into /demo/ (bd babelstone-q096)
      - 'docs/demo/principles.html'
      - '.config/dotnet-tools.json'
      - 'mise.toml'
      - '.github/workflows/docs-site.yml'
  push:
    branches: [main]
    paths: *docs_site_paths
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; don't cancel an in-flight deploy (it would leave
# the site half-published) — queue behind it instead.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the toolchain from mise.toml (the single source of truth, ADR-PC-010
      # .NET 10 LTS) — no second SDK version pin in this YAML to drift from it.
      # DocFX itself is pinned in .config/dotnet-tools.json (dotnet tool restore).
      - uses: jdx/mise-action@v4.2.3
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engine/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore solution (DocFX metadata needs restored projects)
        run: dotnet restore engine/Babelstone.slnx
      - name: Build DocFX site
        run: |
          dotnet tool restore
          dotnet docfx docfx/docfx.json
      # Compose the standalone demo pages into the SAME artifact under /demo/
      # (the one-Pages-slot rule above). Static copy only; no untrusted input.
      - name: Stage demo pages into the site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p docfx/_site/demo
          cp -f docs/demo/index.html docs/demo/principles.html docfx/_site/demo/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docfx/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # The two Pages-deploy permissions are scoped to THIS job, keeping the
    # workflow-level default at the repo convention (contents: read only).
    permissions:
      pages: write      # deploy to the Pages slot
      id-token: write   # OIDC token deploy-pages uses to verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages site itself is a ONE-TIME admin-credential creation (done
      # 2026-06-07: `gh api -X POST repos/jhosm/babelstone/pages -f build_type=workflow`).
      # GITHUB_TOKEN can never create it — that needs `administration: write`, which
      # workflow tokens cannot be granted — so configure-pages here only reads the
      # existing site's config; `pages: write` above covers the deploy itself.
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
