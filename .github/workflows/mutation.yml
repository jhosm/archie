name: Mutation testing

# Periodic mutation testing of the engine spine (A.10) — NOT per-push. Stryker.NET
# re-runs the whole test suite (including the Testcontainers integration tier) once
# per mutant, so it is far too slow for the PR gate. It runs weekly and on demand,
# guarding test *effectiveness*: a surviving mutant is a behaviour the suite does not
# actually pin. Particular interest in event-sourcing mutants — off-by-one on
# sequence_number, a dropped ORDER BY, a removed transaction boundary, a weakened
# optimistic-concurrency check. The score floor + triage process live in
# engine/docs/mutation-testing.md.

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EventStore
            project: Babelstone.EventStore.csproj
            test: tests/Babelstone.EventStore.Tests/Babelstone.EventStore.Tests.csproj
          - name: Engine
            project: Babelstone.Engine.csproj
            test: tests/Babelstone.Engine.Tests/Babelstone.Engine.Tests.csproj
    steps:
      - uses: actions/checkout@v6
      # Toolchain from mise.toml (the .NET 10 SDK pin), as in ci.yml.
      - uses: jdx/mise-action@v4
      - name: Restore tools (dotnet-stryker)
        working-directory: engine
        run: dotnet tool restore
      - name: Run Stryker on ${{ matrix.name }}
        working-directory: engine
        env:
          STRYKER_PROJECT: ${{ matrix.project }}
          STRYKER_TEST_PROJECT: ${{ matrix.test }}
        # break threshold in stryker-config.json fails the run below the score floor.
        # The integration tier needs Docker, which ubuntu-latest provides.
        run: dotnet tool run dotnet-stryker --project "$STRYKER_PROJECT" --test-project "$STRYKER_TEST_PROJECT"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report-${{ matrix.name }}
          path: engine/StrykerOutput/**/reports/mutation-report.html
          if-no-files-found: ignore
