name: Dolt data ref sync

# Completes a beads (bd) Dolt sync started from a proxied environment.
#
# Claude Code web sessions sit behind a git proxy whose write policy is
# ref-namespace-based: refs/heads/* is writable (including force-push), but
# refs/dolt/data — the ref the bd git-blobstore bridge pushes issue data to —
# is read-only. Such sessions therefore park fresh Dolt data on the ordinary
# branch `dolt-data-relay` (with `__dolt_remote_info__` already updated) and
# trigger this workflow, which runs server-side with the workflow token —
# outside any client proxy — to fast-forward the real pointer.
#
# Fast-forward only: a relay tip that does not descend from the current
# refs/dolt/data means the relay is stale (another machine pushed Dolt data
# in between); moving the pointer would orphan that machine's issue writes,
# so the run fails and the relay must be rebuilt from a `bd dolt pull`.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fast-forward refs/dolt/data from dolt-data-relay
        run: |
          set -euo pipefail
          git fetch origin refs/dolt/data:refs/dolt-sync/current refs/heads/dolt-data-relay:refs/dolt-sync/new
          current=$(git rev-parse refs/dolt-sync/current)
          new=$(git rev-parse refs/dolt-sync/new)
          if [ "$current" = "$new" ]; then
            echo "refs/dolt/data already at $new — nothing to do."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$current" "$new"; then
            echo "::error::dolt-data-relay ($new) does not descend from refs/dolt/data ($current) — refusing to move the pointer over another machine's Dolt push. Re-relay after 'bd dolt pull'."
            exit 1
          fi
          git push origin "$new:refs/dolt/data"
          echo "refs/dolt/data: $current -> $new"
