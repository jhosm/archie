name: Fuzz

# Continuous (scheduled) fuzzing of the project's byte-parsing surfaces — the places a producer, an
# attacker who can publish to a topic, a malformed HTTP caller, or a corrupt artifact can hand the
# system bytes that MUST yield a clean rejection, never a panic/crash/hang. Two engines, several targets:
#
#   1. The Go `fuzz` job — pack-validate's non-engineer-authored surfaces (C.8, bd archie-2t16.6):
#      the DISCOVERY half of the Go fuzz work. The regression half — re-running the committed seed
#      corpus (f.Add seeds + any testdata/fuzz/ crashers) as deterministic subtests — already runs on
#      every per-PR `go test ./...` in the pack-validate CI job. `go test -fuzz` runs ONE target in
#      ONE package and loops until it finds a failure or hits -fuzztime, so it must NOT sit on the
#      per-PR critical path; it runs on a schedule (and on demand) instead. A crasher the fuzzer finds
#      is written to <pkg>/testdata/fuzz/<Target>/<hash>; the job uploads it as an artifact so it can
#      be reproduced locally and committed back as a permanent seed (after which the per-PR `go test`
#      guards it forever). The generated corpus is cached so coverage is cumulative across runs.
#
#   2. The `fuzz-dotnet` MATRIX — the .NET decode/parse boundaries, each a deterministic property/corpus
#      fuzz (a normal `dotnet test` that COMPLETES, unlike `go test -fuzz`). Every one is tagged
#      `[Trait("Category","Fuzz")]`, and THIS workflow is the ONLY place they run: ci.yml and mutation.yml
#      exclude `Category=Fuzz` (the maintainer directive — fuzz tests execute only in fuzz.yml). Each leg
#      runs a DEEPER sweep driven by FUZZ_ITERATIONS / FUZZ_HTTP_ITERATIONS, with the RNG seed varied per
#      run (FUZZ_SEED, folded from the run id) so each weekly sweep explores fresh inputs. The targets:
#        - Avro value decode (AvroDecodeFuzzTests, bd babelstone-2t16.15): the event bytes a consumer
#          parses off the bus (AvroEventSerializer.Decode, ADR-IC-002/ADR-IC-004 §P3).
#        - Inbox wire-format un-framing (InboxWireFormatFuzzTests): the Confluent magic+schema_id frame
#          wrapping each bus value (InboxPump.TryUnframe) — the parse BEFORE the Avro decode; together
#          with the Avro leg they cover the full off-bus value parse chain.
#        - Command JSON envelopes (EngineApiJsonEnvelopeFuzzTests): the HTTP command bodies at the
#          engine's ADR-PC-021 §D5 boundary — a malformed body must be a 4xx, never a 5xx.
#        - Saga CloudEvents header decode (SagaInboxHeaderFuzzTests): the orchestrator's payload-blind
#          header parse off the bus (SagaConsumeLoop.TryDecodeHeaders, ADR-IC-015 / ADR-IC-018 §P5).
#        - Orchestrator EDGE command-JSON (EdgeProcessApiIntegrationTests' malformed-body leg, ADR-IC-006
#          §P4): Integration-tier — it composes the real edge host over PostgreSQL via Testcontainers, so
#          its leg (the orchestrator project, shared with the saga-header fuzz) needs the runner's Docker.
#      A trx reproducer is uploaded on any failure; the assert messages name the FUZZ_SEED to replay.
#      SharpFuzz coverage-guided fuzzing of the Avro entrypoint is a deferred STRETCH.
#
# Contract under test, the same for every target (ADR-PC-007 §169 for packs; its .NET twin for the
# decode/parse paths): malformed/garbage input yields a CLEAN rejection — a well-typed parse/decode
# failure or a 4xx — never a panic/crash/hang.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC (after the 05:00 SBOM and 04:00 CodeQL scheduled scans)
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz duration for the Go targets (Go duration, e.g. 3m, 30m)"
        required: false
        default: "5m"
      fuzz_iterations:
        description: "Iteration budget for the in-process .NET decode/parse fuzzers (e.g. 200000)"
        required: false
        default: "500000"
      fuzz_http_iterations:
        description: "Extra randomized bodies per endpoint for the .NET command-JSON HTTP fuzz (e.g. 20000)"
        required: false
        default: "20000"

permissions:
  contents: read

# A new scheduled run shouldn't pile onto an in-flight one.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Bound the run below GitHub's 6h hard cap so a genuine HANG — itself one of the failure modes
    # under test (a non-terminating input that `-fuzztime` cannot interrupt) — fails as an explicit
    # timeout rather than burning a full 6h runner, matching mutation.yml's convention. Raise this if
    # you ever workflow_dispatch a `fuzztime` longer than this leaves room for (default 5m).
    timeout-minutes: 60
    strategy:
      fail-fast: false   # one target finding a crasher must not cancel the others
      matrix:
        include:
          - target: FuzzLoad   # internal/pack — pack.Load over each required source file
            dir: internal/pack
          - target: FuzzRun    # internal/validate — full depths 1→4 pipeline over a fuzzed variant
            dir: internal/validate
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # pins Go from mise.toml (ADR-PC-006)
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"

      # Cache the Go fuzz cache so each weekly run continues exploring from the prior
      # run's generated corpus instead of restarting from the seeds. The run-id suffix
      # makes every run save a fresh entry; restore-keys pulls the most recent prior one.
      - name: Cache generated fuzz corpus (cumulative)
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        working-directory: pack-validate
        # Pass inputs via env (never interpolate ${{ }} into the shell): FUZZTIME is a
        # workflow_dispatch input and must be treated as untrusted. TARGET/DIR come from
        # the workflow-defined matrix but are quoted for consistency.
        env:
          FUZZTIME: ${{ github.event.inputs.fuzztime || '5m' }}
          TARGET: ${{ matrix.target }}
          DIR: ${{ matrix.dir }}
        # -run='^$' skips the ordinary unit tests (they run in the per-PR CI job); we only
        # want the fuzzing loop here. -fuzz matches exactly one target by anchored regex.
        run: |
          if ! printf '%s' "$FUZZTIME" | grep -Eq '^[0-9]+(\.[0-9]+)?(s|m|h)$'; then
            echo "::warning::invalid fuzztime '$FUZZTIME'; falling back to 5m"
            FUZZTIME=5m
          fi
          go test -run='^$' -fuzz="^${TARGET}$" -fuzztime="$FUZZTIME" "./$DIR"

      # On a crash, Go writes the minimised reproducer to <dir>/testdata/fuzz/<Target>/.
      # Upload it so a human can `go test -run=<Target>/<hash>` to reproduce, fix, and
      # commit it back as a permanent seed.
      - name: Upload crasher reproducer on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: pack-validate/${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: warn

  # The .NET MATRIX (see the header note): the decode/parse boundaries, selected by the
  # `[Trait("Category","Fuzz")]` tag. This is the ONLY workflow that runs them — ci.yml and mutation.yml
  # exclude `Category=Fuzz` (maintainer directive: fuzz runs only here). Each leg runs one test PROJECT's
  # Fuzz-tagged tests; `--filter "Category=Fuzz"` picks exactly those. The three engine legs are the
  # non-Integration (Docker-free) tier (no broker/DB). The orchestrator leg runs BOTH its fuzz tests:
  # the in-process saga-header fuzz AND the Postgres-backed edge-body fuzz, which spins up its own
  # PostgreSQL via Testcontainers — the ubuntu-latest runner ships Docker, so no `services:` block.
  fuzz-dotnet:
    name: fuzz ${{ matrix.name }} (.NET)
    runs-on: ubuntu-latest
    # Same hang-guard as the Go leg: bound each sweep below the 6h cap so a non-terminating decode/parse
    # (the tests' per-iteration budgets catch most, but a stuck test host would not) fails as an
    # explicit timeout. 30m clears the default budgets (incl. the orchestrator leg's Testcontainers
    # spin-up + edge fuzz) with headroom.
    timeout-minutes: 30
    strategy:
      fail-fast: false   # one target finding a crasher must not cancel the others
      matrix:
        include:
          - name: Avro decode
            slug: avro-decode
            project: engine/tests/Babelstone.OutboxPublisher.Tests/Babelstone.OutboxPublisher.Tests.csproj
          - name: inbox wire-format
            slug: inbox-wire-format
            project: engine/tests/Babelstone.InboxConsumer.Tests/Babelstone.InboxConsumer.Tests.csproj
          - name: command JSON envelope
            slug: command-json-envelope
            project: engine/tests/Babelstone.Engine.Api.Tests/Babelstone.Engine.Api.Tests.csproj
          - name: orchestrator (saga headers + edge body)
            slug: orchestrator
            project: orchestrator/tests/Babelstone.Orchestrator.Tests/Babelstone.Orchestrator.Tests.csproj
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # pins the .NET 10 SDK from mise.toml (ADR-PC-010), as in ci.yml
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engine/**/*.csproj', 'orchestrator/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Fuzz ${{ matrix.name }} (deep sweep)
        # Pass everything via env (the file's convention: never interpolate ${{ }} into the shell).
        # FUZZ_ITERATIONS / FUZZ_HTTP_ITERATIONS are workflow_dispatch inputs → untrusted, validated as
        # bare positive integers below before a test reads them (each test also falls back to its own
        # default). PROJECT comes from the workflow-defined matrix, quoted for consistency. Each test
        # reads only the budget var it needs; the other is simply ignored.
        env:
          FUZZ_ITERATIONS: ${{ github.event.inputs.fuzz_iterations || '500000' }}
          FUZZ_HTTP_ITERATIONS: ${{ github.event.inputs.fuzz_http_iterations || '20000' }}
          PROJECT: ${{ matrix.project }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if ! printf '%s' "$FUZZ_ITERATIONS" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::warning::invalid fuzz_iterations '$FUZZ_ITERATIONS'; using the test default"
            unset FUZZ_ITERATIONS
          fi
          if ! printf '%s' "$FUZZ_HTTP_ITERATIONS" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::warning::invalid fuzz_http_iterations '$FUZZ_HTTP_ITERATIONS'; using the test default"
            unset FUZZ_HTTP_ITERATIONS
          fi
          # Vary the RNG seed per run so each scheduled sweep explores FRESH inputs instead of replaying
          # the same deterministic corpus (a local run keeps each test's fixed default seed). RUN_ID is
          # trusted (not a dispatch input); fold it into int32 range so the tests' int seed parsers
          # accept it. The seed is echoed here and logged by each test, so a discovery is reproducible.
          export FUZZ_SEED=$(( RUN_ID % 2147483647 ))
          echo "Using FUZZ_SEED=$FUZZ_SEED (derived from run id $RUN_ID) for $PROJECT"
          dotnet test "$PROJECT" \
            --configuration Release --nologo \
            --filter "Category=Fuzz" \
            --logger "trx;LogFileName=fuzz.trx" \
            --results-directory TestResults

      # On a found crasher the assert message names the FUZZ_SEED (and, for the byte fuzzers, the hex
      # input), so the .trx is a self-contained reproducer. Upload it per target.
      - name: Upload fuzz reproducer on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crasher-dotnet-${{ matrix.slug }}
          path: TestResults/
          if-no-files-found: warn
