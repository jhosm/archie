name: ADR governance

# Mechanical half of ADR-PC-020 §D3 (explicit-drift gate) — the authoritative CI
# the Claude Code hooks mirror but never replace (§P1). The ADR-conformance agent
# (archie-bhq.5) is the judgement layer on top.
#
# Security note: all untrusted PR-controlled inputs (PR body, base ref) are passed
# via `env:` and consumed double-quoted ("$PR_BODY"); none are interpolated into a
# run: script, per the GitHub Actions injection guidance.

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-body-adrs:
    runs-on: ubuntu-latest
    steps:
      - name: Require an "ADRs touched/honoured" section in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot PRs bump dependencies, not ADR-governed design — their
          # bodies are auto-generated and can't carry the section. Exempt them
          # so the gate stays meaningful for human design changes (ADR-PC-020
          # Amendment 2026-05-30, A4). Scoped to these two logins, not bots
          # generically; widen deliberately if another machine author appears.
          case "$PR_AUTHOR" in
            'dependabot[bot]'|'dependabot-preview[bot]')
              echo "Dependabot PR ($PR_AUTHOR) — ADR-section gate not applicable."; exit 0 ;;
          esac
          if printf '%s' "$PR_BODY" | grep -qiE '(^#{1,6}[[:space:]].*|^[-*][[:space:]].*|^)ADRs?[[:space:]]+(touched|honou?red|implemented|amended)'; then
            echo "PR-body ADR section present."; exit 0
          fi
          echo "::error::ADR-PC-020 §D3: PR body must name the ADRs this change implements, amends, or honours."
          echo "Add e.g.:  ## ADRs touched/honoured"
          echo "  - Implements ADR-PC-020 §P1 (enforcement hooks); honours ADR-PC-000 §D5"
          exit 1

  pr-body-bd-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Require a "bd issues closed on merge" section in the PR body
        # Sibling of pr-body-adrs: a bd issue is NOT a GitHub issue, so a merge
        # closes nothing automatically. This section is the authoritative list the
        # CLAUDE.md "Cleanup / Post-Merge" step reads to know which `bd close <id>`
        # to run. The gate checks the SECTION is present — listing IDs or stating
        # "None" is the author's content, not this check's concern.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot PRs are auto-generated dependency bumps that close no bd
          # issue and whose bodies can't carry the section — exempt them with the
          # same login scoping as pr-body-adrs (widen deliberately if another
          # machine author appears).
          case "$PR_AUTHOR" in
            'dependabot[bot]'|'dependabot-preview[bot]')
              echo "Dependabot PR ($PR_AUTHOR) — bd-issues-section gate not applicable."; exit 0 ;;
          esac
          if printf '%s' "$PR_BODY" | grep -qiE '(^#{1,6}[[:space:]].*|^[-*][[:space:]].*|^)(bd|beads)[[:space:]]+issues?[[:space:]].*clos(e|ed)'; then
            echo "PR-body bd-issues section present."; exit 0
          fi
          echo "::error::PR body must carry a 'bd issues closed on merge' section naming the bd issues the merge resolves (or stating none)."
          echo "Add e.g.:  ## bd issues closed on merge"
          echo "  - Closes babelstone-1a2b.3"
          echo "or, when the change closes nothing:"
          echo "  ## bd issues closed on merge"
          echo "  - None — no bd issue is resolved by this PR."
          exit 1

  adr-immutability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Self-test the immutability gate (status classification + hook mirror)
        # Guards the gate's own logic — notably that `Accepted (gated …)` Decisions are
        # treated as immutable (ADR-PC-002/004/005), not just the canonical `Accepted`.
        run: bash .github/scripts/adr-immutability-check.test.sh
      - name: Block in-place edits to an Accepted ADR's Decision (unless amended)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/adr-immutability-check.sh
