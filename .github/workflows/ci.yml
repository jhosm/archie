  product-configs:
    needs: changes
    # Also on pack_validate/contracts changes: the variants are validated BY the
    # binary against the schemas, so a change to either must re-validate them.
    if: ${{ needs.changes.outputs.product_configs == 'true' || needs.changes.outputs.pack_validate == 'true' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # pins Go + cue from mise.toml
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Validate every variant through depths 1–4 (ADR-PC-006, 01 §3)
        # Build the validator once, then run the full depths-1→4 `validate` over
        # each committed variant against the pack it pins. v1 ships one pack
        # (pt.2026.1); when a second lands, derive --pack from the variant's
        # `pack:` field. No variants yet ⇒ a logged no-op (never a silent pass).
        run: |
          go -C pack-validate build -trimpath -o "$RUNNER_TEMP/pack-validate" .
          shopt -s nullglob
          found=0
          for v in product-configs/*.yaml; do
            found=1
            echo "== $v =="
            "$RUNNER_TEMP/pack-validate" validate "$v" --pack packs/pt.2026.1
          done
          [ "$found" -eq 1 ] || echo "no variants in product-configs/ yet — nothing to validate"

  packs:
    needs: changes
    # Also runs on contracts changes: a pack bundles the /contracts/cue family
    # schemas, so a schema change must re-validate every pack.
    if: ${{ needs.changes.outputs.packs == 'true' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    services:
      # A throwaway, plain-HTTP OCI registry so the cosign sign→verify loop below
      # can run against a REAL registry digest (cosign signs a registry ref, not the
      # offline oci-layout `pack.sh build` produces). It holds nothing past the job.
      # The ubuntu-latest runner ships Docker; the service is reachable at
      # localhost:5000 from job steps.
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # pins cue + oras + cosign + go from mise.toml
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Validate the pack's variants through depths 1–4 (ADR-PC-006 §P3)
        # Q.3: the static validator depths over the pack's own products. Build the
        # Go validator once, then run the full depths-1→4 `validate` (syntactic →
        # type → pack-compliance → regulatory) over every committed /product-configs
        # variant against this pack — the depths-1–4 half of "validate depths 1–5".
        # Depth 5 is the engine-side simulation (next step's note). A depth-N failure
        # rejects here, exactly as the per-variant product-configs job does.
        run: |
          go -C pack-validate build -trimpath -o "$RUNNER_TEMP/pack-validate" .
          shopt -s nullglob
          found=0
          for v in product-configs/*.yaml; do
            found=1
            echo "== depths 1–4: $v =="
            "$RUNNER_TEMP/pack-validate" validate "$v" --pack packs/pt.2026.1
          done
          [ "$found" -eq 1 ] || echo "no variants in product-configs/ yet — nothing to validate at depths 1–4"
      - name: Build + verify the pack by digest (ADR-PC-006, ADR-PC-007)
        # stage schemas + cue-vet manifest/data (incl. the rate-sheet-ref files the
        # manifest declares, against #RateSheetRefs), oras push to an OCI layout,
        # then pull strictly by sha256 digest and re-validate (§P2). This is the
        # offline OCI smoke: build → push-by-digest → pull-by-digest → re-validate.
        # The digest is exported for the cosign sign→verify step below.
        run: |
          DIGEST="$(mise exec -- ./packs/pack.sh build packs/pt.2026.1)"
          mise exec -- ./packs/pack.sh verify packs/pt.2026.1 --digest "$DIGEST"
          echo "PACK_DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: cosign sign + verify the signed pack by digest (Q.3, ADR-PC-007 §P2)
        # Q.3 "cosign verify" criterion: exercise the WHOLE signature-verification
        # mechanism end-to-end, not just the by-digest OCI smoke above. push the built
        # pack into the throwaway localhost:5000 registry (by digest, oras cp), cosign
        # sign that registry digest, then assert pack.sh verify-signature PASSES on the
        # signed digest and FAILS on an unsigned one — so the gate can genuinely fail
        # (no theatre).
        #
        # CI-ONLY AFFORDANCE — NOT the production path: this uses an EPHEMERAL cosign
        # key pair (generate-key-pair + COSIGN_PASSWORD) because cosign keyless OIDC
        # needs a real OIDC identity provider that a self-contained CI job cannot
        # stand up. PRODUCTION signing is cosign KEYLESS OIDC (ADR-PC-007 §P2);
        # this loop tests the verify MECHANISM, it does not replace that path.
        # --allow-insecure-registry (via COSIGN_EXTRA) + --plain-http target the
        # local plain-HTTP registry only; production signs a TLS registry by OIDC.
        env:
          COSIGN_PASSWORD: ci-ephemeral-not-a-secret
        run: |
          set -euo pipefail
          # Resolve the cosign binary path up-front (cwd-independent): `cosign
          # generate-key-pair` writes to the CURRENT dir, so we cd into a scratch
          # dir to keep the throwaway keys out of the tree — but `mise exec` resolves
          # tools from the mise.toml found upward of cwd, which a /tmp dir lacks. The
          # absolute path sidesteps that. pack.sh's own cosign/oras calls run via
          # `mise exec --` from the workspace, where resolution works normally.
          COSIGN_BIN="$(mise which cosign)"
          WORK="$(mktemp -d)"; ( cd "$WORK" && "$COSIGN_BIN" generate-key-pair )
          export COSIGN_KEY="$WORK/cosign.key"
          export COSIGN_EXTRA="--allow-insecure-registry"

          REG=localhost:5000/babelstone-packs/pt-deposit
          # Copy the BUILT oci-layout into the registry, by digest (digest preserved).
          SIGNED_REF="$(mise exec -- ./packs/pack.sh push packs/pt.2026.1 \
            --registry "$REG" --digest "$PACK_DIGEST" --plain-http)"
          echo "signed-ref: $SIGNED_REF"

          # POSITIVE: sign the digest, then verify-signature MUST pass.
          mise exec -- ./packs/pack.sh sign "$SIGNED_REF"
          echo "== positive: verify the SIGNED digest (must PASS) =="
          mise exec -- ./packs/pack.sh verify-signature "$SIGNED_REF"

          # NEGATIVE: push a SECOND, UNSIGNED copy under a different tag and assert
          # verify FAILS on it. If it unexpectedly PASSES, fail the job — a gate that
          # cannot fail is theatre (ADR-PC-007 fail-loud / ADR-PC-020 §D3).
          UNSIGNED_REG=localhost:5000/babelstone-packs/pt-deposit-unsigned
          UNSIGNED_REF="$(mise exec -- ./packs/pack.sh push packs/pt.2026.1 \
            --registry "$UNSIGNED_REG" --digest "$PACK_DIGEST" --plain-http)"
          echo "== negative: verify the UNSIGNED digest (must FAIL) =="
          if mise exec -- ./packs/pack.sh verify-signature "$UNSIGNED_REF" 2>/dev/null; then
            echo "::error::cosign verify PASSED on an unsigned digest — the signature gate is not enforcing"
            exit 1
          fi
          echo "negative check OK: verify correctly rejected the unsigned digest"
      # Depth-5 simulation (C.3, ADR-PC-006 §P4, PACK_SIM_DEPTH5_BUDGET): the engine-
      # side smoke-load+rehydrate of the pack's sealed test corpus runs as the
      # PackSimulationDepth5Tests Integration test in the `engine` job's Testcontainers
      # lane — that job already triggers on packs/** + contracts/** changes (see its
      # `if:`), so a pack or schema change re-runs depth 5 without a second container
      # here. It loads pt.2026.1, constitutes each canonical instance through the
      # hand-rolled append/replay substrate, cold-replays it, and asserts the event
      # sequence in < 30 s. The cosign sign→verify loop above exercises the §P2
      # signature-verification MECHANISM with an ephemeral key (a CI-only test of the
      # verify path); PRODUCTION pack signing is cosign keyless OIDC (ADR-PC-007 §P2),
      # whose bank-internal OIDC wiring is out of scope for this self-contained job.

  rate-sheets:
    needs: changes
    # Also runs on packs/contracts changes: a pack carries version-pinned rate-sheet
    # REFS (rate-sheet-refs/*.yaml) validated against the #RateSheetRefs CUE schema,
    # so a pack or schema change must re-check that the refs still conform.
    if: ${{ needs.changes.outputs.rate_sheets == 'true' || needs.changes.outputs.packs == 'true' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # pins cue from mise.toml
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Validate rate-sheet refs + committed sheet body shape (ADR-PC-008)
        # Q.3 rate-sheet schema validation. Two artefacts, two checks:
        #   • The pack's rate-sheet REFS (the version-pinned pointers the engine resolves at
        #     constitution) are CUE-validated against #RateSheetRefs in pack/pack.cue.
        #   • The committed rate-sheet BODY YAML under /rate-sheets (the treasury-authored source the
        #     deploy serialises 1:1 into the rate_sheets table — ADR-PC-008 §P1) is shape-validated by
        #     scripts/rate-sheet-check.sh against the deploy contract: envelope fields, well-shaped
        #     half-open bands, contiguity/exhaustiveness with exactly one open-ended top band, and the
        #     pack-declared TAN ceiling (§P2). It re-expresses the engine's own RateSheetValidator rules
        #     in a hermetic pinned-Node check, so a malformed sheet fails on the PR, not at deploy. This
        #     is the README's promised "rate-sheet schema validation" — no longer a logged no-op now
        #     that a sheet body and the deploy API (bd babelstone-alfy) exist.
        # Never a silent pass: an absent ref/sheet is reported, a present one is validated.
        run: |
          set -euo pipefail
          echo "== rate-sheet refs (pack #RateSheetRefs) =="
          # Vet against the WHOLE pack/ CUE package (contracts/cue/pack/*.cue), not a hardcoded
          # pack.cue — so this step matches the path-filter's globbed `contracts/cue/pack/**` and
          # survives a rename of pack.cue within its directory (the filter's rename-resilience claim
          # would otherwise trigger the job while a hardcoded path 404'd). The files are all
          # `package pack`, so the glob loads them as one schema unit (bd 2t16.22).
          for ref in packs/*/rate-sheet-refs/*.yaml; do
            [ -e "$ref" ] || continue
            echo "  vet $ref"
            mise exec -- cue vet -d '#RateSheetRefs' "$ref" contracts/cue/pack/*.cue
          done
          echo "== rate-sheet body shape (/rate-sheets, ADR-PC-008 §P1/§P2) =="
          # The script recurses /rate-sheets, serialises each sheet with pinned js-yaml (npx — Node is
          # preinstalled on ubuntu-latest), and asserts the deploy-contract shape. Exits 0 on an empty
          # tree (reported, not a silent pass), non-zero on any malformed sheet.
          ./scripts/rate-sheet-check.sh

  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin kustomize + kubeconform + deck from mise.toml — the same single source of
      # truth as every dev machine (no second pin in this YAML to drift from).
      - uses: jdx/mise-action@v4
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Validate Kong edge config (deck + kong config parse + ADR-IC-006 assertions, I.3)
        # The ADR-IC-006 §P1 declarative-config gate: Kong's ENTIRE edge config is the
        # one git-tracked infra/kong/kong.yml (DB-less). A malformed route, a mistyped
        # plugin config, or a silently-dropped edge policy fails HERE, not in prod. The
        # script runs `deck file validate` (pinned deck), `kong config parse` on the
        # pinned kong:3.9.1 image (Docker is available on ubuntu-latest), and the
        # edge-contract fitness assertions (routes present, SSE settings, edge policies,
        # and the engine COMMAND surface NOT publicly exposed — ADR-IC-006 §P5).
        run: ./scripts/kong-config-check.sh
      - name: Grafana observability-plane RBAC enforcement (ADR-IC-016 §7 / ADR-IC-007 §P6, M.3)
        # The observability-plane access-control gate (OBS_PLANE_RBAC / catalogue SEC-2,
        # bd babelstone-njt2.7). The trace/log store is a searchable database of every
        # financial operation, so it must not be open to all engineers and every access to
        # a financially-attributed trace must itself be logged (doc 10 Boundary 7). The
        # script stands up the pinned grafana/otel-lgtm:0.28.0 appliance (Docker is
        # available on ubuntu-latest, the same lane the engine Testcontainers + Avro-compat
        # steps use) with the infra/grafana/rbac/ overlay, and asserts END-TO-END that an
        # anonymous Tempo query is refused (401), a NOC-class token without datasources:query
        # is refused the trace read (403) while engineer/admin succeed (200), and the
        # authorised read is recorded user-attributed in Grafana's dataproxy access log —
        # plus static assertions that the provisioned config still expresses the §P6 role
        # split + Tempo lock (ADR-PC-020 §D3: no silent divergence). Same check dev runs via
        # `make grafana-rbac-check`.
        run: ./scripts/grafana-rbac-check.sh
      - name: Validate K8s manifests (kustomize build + kubeconform, P.6 / P.7)
        # The base configMapGenerator reads ../../kong/kong.yml and
        # ../../otel/collector.yaml (the single config source the Compose stack
        # also mounts), which sit above the kustomization root — hence
        # --load-restrictor=LoadRestrictionsNone. kubeconform -strict catches
        # schema drift against the pinned Kubernetes 1.31.0 API surface.
        # All renderings are validated: `base` (the single-replica, non-HA
        # backing-infra rendering — the dev-shaped seam the two overlays diverge
        # from), `ha` (the P.7 production-shaped topology — 3-node Redpanda + PG
        # warm standby), and `staging` (the always-on demo box — single-replica +
        # durable hcloud storage + the public Traefik/cert-manager TLS edge; bd
        # babelstone-zla1).
        run: |
          for target in base overlays/ha overlays/staging; do
            echo "== kubeconform: $target =="
            mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone "infra/k8s/$target" \
              | mise exec -- kubeconform -strict -summary -kubernetes-version 1.31.0
          done
      - name: Assert ADR commitments in rendered manifests (P.6)
        # Mechanical fitness checks on the rendered output — divergence from
        # these ADRs must fail CI, not land silently (ADR-PC-020 §D3).
        run: |
          set -euo pipefail
          rendered="$(mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone infra/k8s/base)"
          # ADR-IC-006: Kong runs DB-less (KONG_DATABASE=off).
          if ! echo "$rendered" | grep -A1 'name: KONG_DATABASE' | grep -q 'value: "off"'; then
            echo "::error::ADR-IC-006 violation: Kong KONG_DATABASE is not 'off'"; exit 1
          fi
          # ADR-IC-007 §P1: the grafana-lgtm Service must NOT expose OTLP
          # (4317/4318) — the OTel Collector is the single OTLP entry point.
          grafana_svc="$(echo "$rendered" | awk 'BEGIN{RS="\n---\n"} /kind: Service/ && /name: grafana-lgtm/')"
          if [ -z "$grafana_svc" ]; then
            echo "::error::assertion error: grafana-lgtm Service not found in rendered output"; exit 1
          fi
          if echo "$grafana_svc" | grep -Eq 'port: (4317|4318)'; then
            echo "::error::ADR-IC-007 §P1 violation: grafana-lgtm Service exposes OTLP (4317/4318)"; exit 1
          fi
          echo "ADR assertions passed (ADR-IC-006 Kong DB-less; ADR-IC-007 §P1 OTLP single-entry)"
      - name: Assert HA-topology commitments in the ha overlay (P.7)
        # The ha overlay is the production-shaped topology ADR-PC-005 §P1
        # mandates. These mechanical checks fail CI if the overlay stops
        # expressing the load-bearing guarantees (ADR-PC-020 §D3: no silent
        # divergence). They assert SHAPE in the rendered manifests, not runtime
        # behaviour — a real cluster, failover, and the sync-replication
        # append-latency benchmark are Q.6 / M.4 / L.3, out of scope here.
        run: |
          set -euo pipefail
          ha="$(mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone infra/k8s/overlays/ha)"
          fail() { echo "::error::$1"; exit 1; }
          # ADR-IC-001: Redpanda is a real 3-node quorum (replicas: 3), not the
          # single-node dev broker.
          rp_sts="$(echo "$ha" | awk 'BEGIN{RS="\n---\n"} /kind: StatefulSet/ && /(^|\n)  name: redpanda(\n|$)/')"
          [ -n "$rp_sts" ] || fail "redpanda StatefulSet not found in rendered ha overlay"
          echo "$rp_sts" | grep -Eq '^  replicas: 3$' \
            || fail "ADR-IC-001/P.7 violation: redpanda StatefulSet is not 3 replicas"
          # The 3-node cluster must NOT carry the single-node dev-container mode.
          echo "$rp_sts" | grep -q 'mode=dev-container' \
            && fail "P.7 violation: redpanda still uses --mode=dev-container (single-node)"
          # ADR-PC-005 §P1: SYNCHRONOUS replication on the primary — committed
          # events durable on two nodes before ack (RPO ~ 0). Assert both the
          # synchronous_commit and the NAMED standby are present on the primary.
          pg_primary="$(echo "$ha" | awk 'BEGIN{RS="\n---\n"} /kind: StatefulSet/ && /(^|\n)  name: postgres(\n|$)/')"
          [ -n "$pg_primary" ] || fail "postgres primary StatefulSet not found in rendered ha overlay"
          echo "$pg_primary" | grep -q 'synchronous_commit=on' \
            || fail "ADR-PC-005 §P1 violation: primary missing synchronous_commit=on"
          echo "$pg_primary" | grep -q 'synchronous_standby_names=standby1' \
            || fail "ADR-PC-005 §P1 violation: primary missing synchronous_standby_names (no named standby → not synchronous)"
          # ADR-PC-005 §P1: the off-site warm standby exists as its own
          # StatefulSet streaming from the primary via the named slot.
          pg_standby="$(echo "$ha" | awk 'BEGIN{RS="\n---\n"} /kind: StatefulSet/ && /(^|\n)  name: postgres-standby(\n|$)/')"
          [ -n "$pg_standby" ] || fail "ADR-PC-005 §P1 violation: postgres-standby (warm standby) StatefulSet not found"
          echo "$pg_standby" | grep -q 'primary_slot_name=standby1_slot' \
            || fail "ADR-PC-005 §P1 violation: standby missing primary_slot_name (not attached to the replication slot)"
          # Off-site intent: standby kept in a different zone from the primary.
          echo "$pg_standby" | grep -q 'topology.kubernetes.io/zone' \
            || fail "ADR-PC-005 §P1 violation: standby missing zone anti-affinity (off-site not expressed)"
          echo "HA assertions passed (ADR-IC-001 3-node Redpanda; ADR-PC-005 §P1 synchronous off-site warm standby)"
      - name: Assert resource limits in the staging overlay (bd babelstone-zla1.4)
        # The staging box is one fixed 16 vCPU / 32 GB node, and the locked
        # staging-env priority is "no OOM mid-demo". Every workload container in the
        # staging render MUST therefore declare a memory limit (a runaway pod is
        # capped, not allowed to take the node down). Each base pod is single-
        # container, so a per-document check suffices. Fails CI if a future change
        # adds an unsized container — the sizing stays an invariant, not a one-off.
        run: |
          set -euo pipefail
          staging="$(mise exec -- kustomize build --load-restrictor=LoadRestrictionsNone infra/k8s/overlays/staging)"
          missing="$(echo "$staging" | awk '
            BEGIN{RS="\n---\n"}
            /kind: (Deployment|StatefulSet)/ && (!/limits:/ || !/memory:/){
              n="?"; if (match($0,/\n  name: [a-z0-9-]+/)) n=substr($0,RSTART+9,RLENGTH-9)
              print n
            }')"
          if [ -n "$missing" ]; then
            echo "::error::staging sizing violation: workload container(s) lack a memory limit (bd babelstone-zla1.4): $missing"; exit 1
          fi
          echo "staging sizing assertion passed (every workload container declares a memory limit)"
      - name: Assert the event-store migration ConfigMap lists every Sql file (bd babelstone-zla1.5.1)
        # The apps/ migration Job applies the event-store SQL via a configMapGenerator that
        # lists each engine/src/.../Sql/0*.sql file by hand (a flat ConfigMap can't glob a
        # directory). If a new 00NN_*.sql migration lands but isn't added to that list, the
        # engine would boot against a half-migrated DB — silently. Fail CI on that drift.
        run: |
          set -euo pipefail
          sqldir="engine/src/Babelstone.EventStore.Migrations/Sql"
          kfile="infra/k8s/apps/kustomization.yaml"
          missing=""
          for f in "$sqldir"/0*.sql; do
            base="$(basename "$f")"
            grep -qF "Sql/$base" "$kfile" || missing="$missing $base"
          done
          if [ -n "$missing" ]; then
            echo "::error::event-store migration list out of date — add to $kfile:$missing"; exit 1
          fi
          echo "event-store migration list is complete (every Sql/0*.sql is referenced)"

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Relative/anchor cross-link integrity (the dominant link type per CLAUDE.md's
      # link conventions). --offline skips http(s) so the per-PR gate never flakes on
      # a slow external host; external-URL checking is left for a future nightly.
      - name: Markdown link check (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress docs/**/*.md infra/docs/**/*.md ./*.md"
          fail: true
      # Graphviz + a JRE from apt; PlantUML itself is pinned (not apt's) — the
      # apt package on ubuntu-24.04 ships a C4 bundled-stdlib too old to resolve
      # `!include <C4/C4_Component>`, so every C4 macro errors. The render-check
      # is version-tolerant by design (SVG isn't byte-stable), so we just need a
      # release new enough to carry the C4 stdlib; pin a recent one for a
      # reproducible runner (current at time of writing; bump freely).
      - name: Install Graphviz + JRE
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz default-jre-headless
      - name: Install pinned PlantUML
        env:
          PLANTUML_VERSION: 1.2026.4
        run: |
          sudo curl -fsSL -o /usr/local/lib/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/lib/plantuml.jar "$@"\n' \
            | sudo tee /usr/local/bin/plantuml >/dev/null
          sudo chmod +x /usr/local/bin/plantuml
          plantuml -version
      - name: Diagram render-check (each committed .puml renders to its SVG)
        run: bash .github/scripts/diagram-render-check.sh

  docs-verify:
    needs: changes
    # The generated reference/ tree (ADR-PC-022 §P2) is rendered from the Avro /
    # CUE / MCP / ADR sources, so it can drift WITHOUT touching docs/** — a
    # contracts/** or mcp-server/** change re-renders it. Gate on every reference
    # source (plus the generator + Makefile) so a stale commit fails here, the same
    # structural guarantee ADR-IC-008 gives the EventCatalog. Flips
    # DOCS_REFERENCE_NO_DRIFT / DOCS_REFERENCE_BANNERED Planned→Live (ADR-PC-022).
    if: ${{ needs.changes.outputs.docs_gen == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # pins Python + CUE from mise.toml (ADR-PC-006/022)
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Reference is up to date with its sources (ADR-PC-022 §P2)
        # Regenerate into memory and diff against the committed tree; a non-empty
        # diff fails. Same check dev runs via `make docs-verify`.
        run: make docs-verify
      - name: Every reference page carries the generated banner (DOCS_REFERENCE_BANNERED)
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' f; do
            if ! head -1 "$f" | grep -q 'DO NOT EDIT — generated'; then
              echo "::error file=$f::reference page is missing the generated banner (ADR-PC-022 §P2)"
              missing=1
            fi
          done < <(find docs/product-docs/reference -name '*.md' -print0)
          test "$missing" -eq 0 && echo "all reference pages are bannered"

  gate:
    # Always-run aggregator (Q.7, archie-j72w). The per-subtree jobs above are
    # path-scoped (ADR-PC-019 §P1) — they SKIP on unrelated PRs. GitHub branch
    # rulesets treat a skipped required check as unsatisfied, so requiring those jobs
    # directly would block every PR that doesn't touch their path. Instead the ruleset
    # requires this ONE always-present job, which passes iff every job that *did* run
    # succeeded. Treats `skipped` (path not touched) and `success` as OK; fails on
    # `failure` or `cancelled`. (CodeQL has its own always-run gate in codeql.yml.)
    #
    # Fitness-gate coverage (Q.7 close-out, archie-j72w): every fitness gate Q.7 set out
    # to require is ALREADY enforced through a job this aggregator `needs:`, so no new
    # required check (and no new `needs:` entry) is owed:
    #   • DETERMINISM_GATE (A.7, archie-k03q) — the HandlerPurity analyser + fixture-replay
    #     determinism test run in the `engine` job's non-Integration tier.
    #   • no-PII / emit-contract (G.6, archie-2eo0) — NoPiiTelemetryAttributeAnalyzerTests,
    #     BabelstonePiiGuardTests, ClientPseudonymTests, and EmitContractFitnessTests all
    #     live in engine/Babelstone.slnx test projects, run by the `engine` job's
    #     non-Integration tier (no separate job to wire).
    #   • code-coverage floor (Q.y, archie-2t16.13) — the fail-closed coverage-floor STEPS
    #     run inside the `engine` (.NET), `pack-validate` (Go), and `mcp-server` (Python)
    #     jobs, all already in `needs:` — by design no new required check (the Phase-1
    #     destabilisation note).
    # The acceptance gate (L.3, archie-2e6q) is the SEPARATE load-gate.yml workflow on
    # RC-tag cadence (push of a v*-rc* tag): it never runs on pull_request, so it is
    # deliberately NOT a per-PR required status check (a never-reported required check
    # would deadlock every PR — the same skipped-required-check footgun this aggregator
    # exists to avoid). Its enforcement is at the RC, per ADR-PC-011 §8.4; see
    # .github/rulesets/README.md for that disposition.
    name: CI gate
    needs:
      - changes
      - engine
      - pack-validate
      - contracts
      - orchestrator
      - acl
      - mcp-server
      - notification
      - lifecycle
      - product-configs
      - packs
      - rate-sheets
      - infra
      - docs
      - docs-verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every triggered CI job to have passed (skipped is OK)
        env:
          # Controlled enum values (success/failure/skipped/cancelled) — safe to expand.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required CI job did not pass (result=$r)"; exit 1 ;;
            esac
          done
          echo "all triggered CI jobs passed"
