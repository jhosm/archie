name: CI

# Path-scoped CI (ADR-PC-019 §P1; Consequences #1: "CI must be path-scoped from
# the start"). The `changes` job detects which top-level subtree a PR touches;
# each downstream job runs only for its path. Real build/test steps land with each
# subtree's own build task — this skeleton wires the path-scoping, which must exist
# from day one so a naïve "build everything on every push" never takes root.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter calls the list-PR-files API on pull_request events

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      pack_validate: ${{ steps.filter.outputs.pack_validate }}
      families: ${{ steps.filter.outputs.families }}
      contracts: ${{ steps.filter.outputs.contracts }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      acl: ${{ steps.filter.outputs.acl }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
      notification: ${{ steps.filter.outputs.notification }}
      lifecycle: ${{ steps.filter.outputs.lifecycle }}
      product_configs: ${{ steps.filter.outputs.product_configs }}
      packs: ${{ steps.filter.outputs.packs }}
      rate_sheets: ${{ steps.filter.outputs.rate_sheets }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
      docs_gen: ${{ steps.filter.outputs.docs_gen }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # engine also names the repo-wide inputs of the ADR-PC-040 default-deny gates, which run
            # in the engine test suite (the rate_sheets self-documenting-filter discipline):
            #   - '**/*.csproj'      FAMILY_TO_CORE_DEFAULT_DENY walks every project file, so any
            #                        added/edited project re-runs it (a new project is gated at birth)
            #   - '**/Program.cs'    COMPOSITION_ROOT_NAMES_NO_FAMILY scans every marked root's
            #                        composition file
            #   - the marked composition-root src dirs (their global-import surface is scanned too);
            #     extend this list when a new host gains <BabelstoneRole>CompositionRoot</BabelstoneRole>
            #   - 'cadence/**'       built by engine/Babelstone.slnx (the shared clock-owning poll-loop
            #                        library + cadence tests run in this lane)
            #   - 'composition/**'   built by engine/Babelstone.slnx (the shared FamilyModuleScanner —
            #                        moved out of cadence/ into its own subtree — + composition tests
            #                        run in this lane)
            #   - 'Directory.Build.targets'  the repo-root shim handing the ADR-PC-040 candidate-C
            #                        build guard (composition/msbuild/FamilyToCoreDefaultDeny.targets,
            #                        covered by 'composition/**') to every project — an edit to it
            #                        must re-run the guard's wiring test (FamilyToCoreBuildGuardTests)
            engine:
              - 'engine/**'
              - '.github/scripts/coverage-floor-cobertura.py'
              - 'cadence/**'
              - 'composition/**'
              - 'Directory.Build.targets'
              - '**/*.csproj'
              - '**/Program.cs'
              - 'orchestrator/src/Babelstone.Orchestrator/**'
              # The ContractDrift suite (bd ax0b.4) READS the committed OpenAPI specs and
              # kong.yml as its expected side, so a spec/kong-only change must re-run the
              # engine lane too (the same consumers-name-their-inputs rule as the shared
              # subtrees below) — otherwise a spec edit could land without the drift verdict.
              - 'contracts/openapi/**'
              - 'infra/kong/kong.yml'
              - 'notification/src/Babelstone.Notification.Host/**'
              - 'lifecycle-driver/src/Babelstone.Lifecycle.Host/**'
              # The FAMILY_ORIGINATED_MOVEMENTS_SETTLEMENT_WIRED gate (catalogue row XC-3,
              # Babelstone.Composition.Tests — runs in this lane via the slnx test sweep) derives its
              # EXPECTED side from the Avro catalogue (the embedded Originated Movement carrier shape)
              # and its ACTUAL side from the family Orchestration manifests/modules + the host's
              # scan-anchor reference (**/*.csproj above), so a change to either input must re-run it —
              # otherwise a new Movement-bearing event could land without the wiring verdict.
              - 'contracts/avro/**'
              - 'families/*/src/*Orchestration*/**'
            pack_validate: ['pack-validate/**']
            families: ['families/**']
            contracts: ['contracts/**', 'scripts/avro-compat-check.sh', 'scripts/asyncapi-catalog-validate.sh', 'scripts/asyncapi-catalog-reconcile.sh', 'scripts/openapi-catalog-validate.sh', 'scripts/openapi-catalog-reconcile.sh', '.spectral.yaml', 'infra/kong/kong.yml', 'scripts/gen-saga-topics.py', 'scripts/gen-saga-topics-check.sh', 'families/term-deposit/src/Babelstone.Families.TermDeposit.Orchestration/FamilyIntegrationTopics.g.cs', 'families/personal-loan/src/Babelstone.Families.PersonalLoan.Orchestration/FamilyIntegrationTopics.g.cs']
            # Shared-library consumers name the shared subtrees too: their builds compile them via
            # ProjectReference, so a shared-library-only change must re-run their lanes (previously a
            # silent gap). All three hosts compile 'composition/**' (the shared FamilyModuleScanner,
            # ADR-PC-040 §D4 — now its own subtree, no longer inside cadence/); notification and
            # lifecycle also compile 'cadence/**' (CadenceWorker + the poll-loop machinery). The
            # orchestrator references Babelstone.Composition only — it runs no Cadence poll loop.
            orchestrator: ['orchestrator/**', 'composition/**']
            acl: ['acl/**']
            mcp_server: ['mcp-server/**']
            # notification also names contracts/pact/**: the delivery tests drift-check the committed
            # notification-delivery⇄engine message pact (bd 2t16.14, ADR-IC-009), so a hand-edit of
            # the pact artefact must re-run the consumer lane that would catch it.
            notification: ['notification/**', 'cadence/**', 'composition/**', 'contracts/pact/**']
            lifecycle: ['lifecycle-driver/**', 'cadence/**', 'composition/**']
            product_configs: ['product-configs/**']
            packs: ['packs/**']
            # Every input the rate-sheets job's validation step reads (ci.yml `rate-sheets` job):
            #   - rate-sheets/**                       the rate-sheet BODY data (numerical TANs)
            #   - packs/**/rate-sheet-refs/**          the version-pinned rate-sheet REFS it cue-vets
            #   - contracts/cue/pack/pack.cue          the #RateSheetRefs schema the refs vet against
            # The refs + schema are also subsumed by the broad `packs`/`contracts` filters the job's
            # `if:` already ORs in, but naming them here makes this filter a faithful, self-documenting
            # picture of the job's input surface — so the job keeps a correct trigger even if those
            # broad filters are later narrowed (no silent false-negative). Glob, not exact path, for
            # pack.cue so a rename within that file's directory is still caught (bd 2t16.22).
            rate_sheets:
              - 'rate-sheets/**'
              - 'packs/**/rate-sheet-refs/**'
              - 'contracts/cue/pack/**'
            infra: ['infra/**', 'scripts/kong-config-check.sh', 'scripts/grafana-rbac-check.sh', 'mise.toml']
            docs: ['docs/**', 'infra/docs/**', '*.md', '.github/workflows/ci.yml', '.github/scripts/diagram-render-check.sh']
            # Every input scripts/docs-gen/generate.py reads to render docs/product-docs/reference/
            # (ADR-PC-022 §P2). Kept FAITHFUL so any source change re-runs `make docs-verify`, and in
            # sync with the .githooks/pre-commit `staged_docs_src` list that regenerates the same tree
            # locally — the rate_sheets-filter discipline above (self-documenting input surface, bd sfnt.27):
            #   events/                        <- contracts/avro/**/*.avsc               (via contracts/**)
            #   family-schemas/ + pack-format/ <- contracts/cue/**                       (via contracts/**)
            #   mcp-tools/                     <- mcp-server/src/babelstone_mcp/server.py (via mcp-server/**)
            #   adr-index/                     <- docs/**/adrs/ADR-*.md AND .../adrs/retired/ADR-*.md
            #                                     (the renderer globs retired/ too — the bare **/adrs/ADR-*.md
            #                                      glob does NOT match a retired/ subdir, so it is named)
            #   engine-primitives/             <- engine VerifiedPack.cs + DayCount.cs   (the day-count
            #                                     formula_ref set the engine implements — were MISSING; sfnt.27)
            #   glossary.md                    <- scripts/docs-gen/glossary-source.md     (via scripts/docs-gen/**)
            #   docfx/index.md                 <- docs/product-docs/README.md             (the DocFX home page, ADR-PC-026 §P3)
            # Plus docs/product-docs/reference/** and docfx/index.md themselves, so hand-tampering with a generated file is caught.
            docs_gen:
              - 'scripts/docs-gen/**'
              - 'docs/product-docs/reference/**'
              - 'docs/product-docs/README.md'
              - 'docfx/index.md'
              - 'contracts/**'
              - 'mcp-server/**'
              - 'docs/product-management/**/adrs/ADR-*.md'
              - 'docs/product-management/**/adrs/retired/ADR-*.md'
              - 'engine/src/Babelstone.Packs/VerifiedPack.cs'
              - 'engine/src/Babelstone.FinancialMath/DayCount.cs'
              - 'Makefile'

  engine:
    needs: changes
    # Also on packs/contracts changes: the engine STRICTLY parses the pack YAML (Babelstone.Packs,
    # no IgnoreUnmatchedProperties) and embeds the Avro .avsc (Babelstone.Engine.Avro). A packs/** or
    # contracts/** change can therefore break the engine WITHOUT touching engine/**, and a path-scoped
    # engine job would miss it (it merges red-on-main, surfacing only on the next engine PR — the
    # babelstone-fk7m.2 / permitted_for incident). So the engine build+tests run on these too.
    if: ${{ needs.changes.outputs.engine == 'true' || needs.changes.outputs.families == 'true' || needs.changes.outputs.packs == 'true' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the toolchain from mise.toml (the single source of truth, ADR-PC-010
      # .NET 10 LTS) so CI builds against the same SDK as every dev machine — no
      # second version pin in this YAML to drift from it.
      - uses: jdx/mise-action@v4
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engine/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore local .NET tools (dotnet-coverage for the coverage merge)
        # engine/.config/dotnet-tools.json pins dotnet-coverage (and stryker); restore it
        # so the merge step below resolves the tool deterministically (Q.y, babelstone-2t16.13).
        working-directory: engine
        run: dotnet tool restore
      - name: Build + unit/analyser tests (ADR-PC-010, ADR-IC-009 unit tier)
        # restore + build (warnings-as-errors via Directory.Build.props) + all test
        # projects, incl. the Roslyn Money analysers. Needs no infrastructure, so it
        # excludes the Testcontainers-backed Integration tier (real PostgreSQL).
        # The Docker-free observability fitness tests land here too (K.1): ResourceAttributeTests
        # (OBS_RESOURCE_ATTRS / OBS-1) and TelemetrySpanTests (OBS_SPAN_PRODUCT_SEMANTICS / OBS-2)
        # in Babelstone.Engine.Tests run in this step — no new CI job. OBS-4 (traceparent over the
        # bus) is the deferred Integration tier (E.6 lane), per the commitment catalogue.
        #
        # Q.y (babelstone-2t16.13): line/branch coverage via the XPlat VSTest data collector
        # (coverlet.collector, pinned centrally). The collector route is deliberate — the
        # CLR-profiler "dotnet-coverage collect" route silently emits an empty line-rate=1
        # cobertura on .NET 10. engine/coverlet.runsettings excludes the two pure-kernel
        # modules from instrumentation so it does not break the ADR-PC-010 §P5 determinism
        # gate (KernelPurityTests reads the on-disk kernel bytes). Per-project cobertura
        # files land under coverage/unit/.
        # `&Category!=Fuzz` keeps the fuzz suites OUT of the per-PR lane — they run only in fuzz.yml
        # (maintainer directive). The Category=Fuzz trait tags AvroDecodeFuzzTests, InboxWireFormatFuzzTests,
        # and EngineApiJsonEnvelopeFuzzTests (all unit-tier) so this filter excludes them here.
        #
        # The ADR-IC-009 Pact PRODUCER-verification lane (bd babelstone-2t16.14) also runs in this
        # step: NotificationDuePactProviderTests (Babelstone.OutboxPublisher.Tests, NOTIFY_EMIT_PACT)
        # verifies the committed contracts/pact/notification-delivery-engine.json against a payload
        # round-tripped through the engine-embedded governed schema + the real Avro codec — hermetic
        # (file-sourced pact, no broker), Docker-free, so it needs no extra job or step.
        run: dotnet test engine/Babelstone.slnx --configuration Release --nologo --filter "Category!=Integration&Category!=Fuzz" --collect:"XPlat Code Coverage" --settings engine/coverlet.runsettings --results-directory coverage/unit
      - name: Integration tests (Testcontainers tier — E.6, ADR-IC-009)
        # The complementary `--filter "Category=Integration"` lane the unit step
        # above excludes: real PostgreSQL + Redpanda + OpenBao. Testcontainers
        # self-manages those (random host ports, no `services:` block), and the
        # ubuntu-latest runner ships Docker — so the EventStore append+outbox suite
        # (from A.1 on), the Redpanda outbox round-trip (E.4), and the
        # constitute→mature API E2E all run here without `make up`. Wiring this lane
        # is what lets ES_ATOMIC_APPEND_OUTBOX flip Planned→Live in the commitment
        # catalogue (archie-2jum / E.6). Coverage from this tier lifts the baseline
        # the unit tier alone cannot reach (e.g. Engine.Api, EventStore.Migrations).
        # `&Category!=Fuzz` excludes any Fuzz-tagged integration test (none today on the engine side,
        # but keeps the lane consistent with the directive: fuzz runs only in fuzz.yml).
        run: dotnet test engine/Babelstone.slnx --configuration Release --nologo --filter "Category=Integration&Category!=Fuzz" --collect:"XPlat Code Coverage" --settings engine/coverlet.runsettings --results-directory coverage/integration
      - name: Merge per-project cobertura into one report (Q.y)
        # dotnet-coverage merge stitches every per-project coverage.cobertura.xml (both
        # tiers) into one repo-wide cobertura. The tool expands the ** glob itself
        # (cross-platform), so no shell globstar dependency. The merged report is what
        # the artifact + summary below consume and what the fail-closed floor gate
        # (Phase 2, "Coverage floor gate — .NET" below) reads.
        if: ${{ always() }}
        working-directory: engine
        run: |
          if compgen -G "../coverage/*/*/coverage.cobertura.xml" > /dev/null; then
            dotnet tool run dotnet-coverage merge "../coverage/**/coverage.cobertura.xml" \
              -f cobertura -o ../coverage/merged.cobertura.xml
          else
            echo "::warning::no per-project cobertura reports found — coverage merge skipped"
          fi
      - name: Coverage summary (ReportGenerator → step summary)
        # The human-readable per-assembly breakdown rendered into the job's GitHub step
        # summary. always() so the numbers are visible even on a red run — including the
        # case where the fail-closed floor gate below trips, so a reviewer sees exactly
        # which assemblies pulled the total under the floor.
        if: ${{ always() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.7 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:coverage/merged.cobertura.xml \
            -targetdir:coverage/report \
            -reporttypes:"MarkdownSummaryGithub;Cobertura" || echo "reportgenerator summary skipped"
          if [ -f coverage/report/SummaryGithub.md ]; then
            cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: "Coverage floor gate — .NET (Q.y Phase 2: line ≥ 85%, branch ≥ 75%)"
        # Fail-closed floor on the MERGED cobertura. This step lives INSIDE the
        # path-scoped `engine` job, which already feeds the always-run `CI gate`
        # aggregator (ADR-PC-019 §P1) — so a breach fails this job → fails the gate →
        # blocks the PR, with NO new required check added to main-protect.json (the
        # destabilisation risk the Phase-1 PR flagged for a fresh required gate). The
        # script reads the de-duplicated root counts and fails CLOSED on an empty/absent
        # report (never a silent pass). No explicit `if:` → default success(): the floor
        # is enforced only on an otherwise-green run, so a red test run is not buried
        # under a second, confusing coverage error. The live full-suite (unit+Integration,
        # kernel-excluded per engine/coverlet.runsettings) merged number measured from
        # this branch's CI run 27474645928 is 94.51% line (2446/2588) / 81.89% branch
        # (529/646) — so 85/75 leave ~9.5pt / ~6.9pt of headroom.
        run: python3 .github/scripts/coverage-floor-cobertura.py coverage/merged.cobertura.xml 0.85 0.75
      - name: Publish merged coverage artifact (Q.y)
        # The merged cobertura (and the ReportGenerator HTML/markdown) as a downloadable
        # CI artifact — the deliverable for Phase 1 (emit + publish). always() so a red
        # test run still publishes the coverage measured up to the failure.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dotnet
          path: |
            coverage/merged.cobertura.xml
            coverage/report/
          if-no-files-found: warn

  pack-validate:
    needs: changes
    # Also runs on contracts/packs changes: the validator's accept/reject tests
    # resolve against the live /contracts/cue schemas and packs/pt.2026.1, so a
    # schema or pack change must re-prove the validator still classifies them.
    if: ${{ needs.changes.outputs.pack_validate == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.packs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4 # pins Go + cue from mise.toml (ADR-PC-006)
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: Build + test the Go validator (ADR-PC-006)
        # Reproducible build from the pinned go.mod (Open Action #2); the test
        # suite carries the PACK_VALIDATE_DEPTH_BUDGETS fitness function and the
        # versioned JSON-contract test. Run from the module dir so fixture paths
        # resolve to /contracts/cue and /packs.
        #
        # Q.y (babelstone-2t16.13): statement coverage via `go test -coverprofile`
        # (Go has no native branch coverage — statement coverage only). The
        # `go tool cover -func` total is echoed into the GitHub step summary, and the
        # fail-closed floor gate below enforces a minimum on that same total; the
        # profile is published as an artifact too. -coverpkg=./... so the profile
        # attributes coverage to every package in the module, not just the one under test.
        working-directory: pack-validate
        run: |
          go build -trimpath -ldflags "-X main.Version=${GITHUB_SHA::12}" ./...
          go test -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...
          echo "### Go coverage (pack-validate)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: "Coverage floor gate — Go (Q.y Phase 2: statements ≥ 78%)"
        # Fail-closed statement-coverage floor (Go has no native branch coverage). Runs
        # inside the path-scoped `pack-validate` job → already part of the always-run
        # `CI gate` aggregator (ADR-PC-019 §P1), so a breach blocks the PR with no new
        # required check. Default success(): only enforced when the test step above was
        # green (a failed `go test` already fails the job). Floor 78% sits below the
        # 2026-06-10 baseline (81.6% statements) for headroom.
        working-directory: pack-validate
        run: |
          floor=78.0
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}' | tr -d '%')"
          echo "Go statement coverage: ${total}%  (floor ${floor}%)"
          if [ -z "$total" ]; then
            echo "::error::could not read Go coverage total from coverage.out — failing closed"
            exit 1
          fi
          awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t + 0 >= f + 0) }' \
            || { echo "::error::Go statement coverage ${total}% < floor ${floor}%"; exit 1; }
          echo "OK: Go coverage floor satisfied"
      - name: Publish Go coverage artifact (Q.y)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go
          path: pack-validate/coverage.out
          if-no-files-found: warn
      - name: Go vulnerability scan (govulncheck — Go-native SCA gate, ADR-IC-014 Q.7c)
        # The Go twin of .NET's NuGetAudit (which gates the engine build). Reachability-based:
        # fails only on advisories actually called from this module's code, so it is low-noise
        # (the baseline was triaged to clean first — go 1.26.4 + golang.org/x/net v0.55.0 fixed
        # the three reachable findings). Pinned and run via `go run` to avoid GOBIN/PATH
        # variance; the vuln DB is fetched from vuln.go.dev at runtime. This blocks via the
        # pack-validate job (→ `CI gate`); a newly-published advisory on unchanged code is
        # backstopped by Dependabot's weekly gomod alerts.
        working-directory: pack-validate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  contracts:
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin CUE (and the rest) from mise.toml — same single source of truth as
      # every dev machine (CUE 0.16.1, ADR-PC-006), no second pin to drift from.
      - uses: jdx/mise-action@v4
        with:
          # TEMP pin: mise v2026.6.7 shipped with NO linux-x64 asset (jdx/mise broken release),
          # so mise-action fetching "latest" 404s on any cache-miss. Pin to the last good release.
          # Remove once upstream restores a working latest (this is the mise CLI itself, which
          # mise.toml cannot pin -- not a tool version, so the no-YAML-pin convention does not apply).
          version: "2026.6.6"
      - name: CUE family-schema soundness (ADR-PC-006)
        # fmt + compile + accept-valid / reject-invalid fixtures, incl. the
        # closed-struct "no DSL escape hatch" guarantee. Same script dev runs
        # via `make contracts-check`.
        run: ./contracts/cue/check.sh
      - name: Fetch origin/main (the Avro compat baseline)
        # actions/checkout@v7 leaves only the PR ref; the §P3 gate compares each
        # .avsc against its previously-published version (origin/main), so make
        # that ref resolvable. --depth=1 is enough — the gate reads files at a
        # single ref (git show origin/main:<path>), not history.
        run: git fetch --depth=1 origin main
      - name: Avro schema compatibility (ADR-IC-002 §P1/§P2/§P3)
        # The residual SR compatibility gate (G.3, bd babelstone-c3bq): §P1 path
        # mirrors namespace+name, §P2 null-first unions (static), and §P3 each
        # schema is BACKWARD-compatible with its origin/main version — checked by
        # registering the baseline into a throwaway Redpanda built-in SR (the
        # ADR-IC-002 POC registry) and asking its /compatibility endpoint. An
        # incompatible evolution introduced in a PR fails here, not in prod.
        # Same script dev runs via `make avro-compat-check`. The ubuntu-latest
        # runner ships Docker (the engine job's Testcontainers tier relies on it).
        run: ./scripts/avro-compat-check.sh
      - name: AsyncAPI catalogue gate (ADR-IC-015 §P1–§P6, validate-only PR lane)
        # G.4 (bd babelstone-ymav): the FAST, HERMETIC gate. ADR-IC-015 supersedes
        # ADR-IC-008 (EventCatalog → Backstage); the AsyncAPI governance format and
        # the §P1–§P6 checks carry forward unchanged. Validates the
        # contracts/catalog/events/*.asyncapi.yaml set with the Apache-2.0 AsyncAPI
        # CLI — NO live Schema Registry, NO running portal (ADR-IC-015 + the
        # CI-fragility residual risk). It enforces §P1 (validity + required
        # governance fields), §P2 (orphan check), §P3 (tombstone contract on compacted
        # topics), §P4 (breaking-change diff vs the origin/main baseline fetched
        # above), §P5 (deprecation notice ≥180d), §P6 (subject reconstructs from the
        # .avsc) and §9 (the Backstage catalog-info.yaml descriptor is well-formed
        # YAML). The §P6 *live* registry reconciliation is the main-lane `--reconcile`
        # step below, deliberately split out so this PR step never touches the
        # registry. The .avsc payload $refs resolve on disk, so no network. Same
        # script dev runs via `make asyncapi-catalog-validate`. npx pulls the pinned
        # @asyncapi/cli; the ubuntu-latest runner ships Node.
        run: ./scripts/asyncapi-catalog-validate.sh
      - name: OpenAPI catalogue gate (ADR-IC-020 — Spectral + oasdiff + Kong reconcile, PR lane)
        # bd babelstone-ax0b.2: the FAST, HERMETIC OpenAPI gate — the REST mirror of the
        # AsyncAPI catalogue gate above. For every contracts/openapi/specs/*.openapi.yaml it
        # runs (1) Spectral lint (the built-in `oas` ruleset + the FROZEN .spectral.yaml
        # governance-field rules: info.x-owner / x-owner-contact / x-status enum /
        # x-gdpr-legal-basis / x-authorized-consumers — the mirror of the AsyncAPI §P1 set),
        # (2) an oasdiff `breaking` diff vs the origin/main baseline fetched above (a breaking
        # change fails unless info.x-breaking-change-approved:true, the §P4 mirror), and
        # (3) Kong-route <-> spec reconciliation against infra/kong/kong.yml (FORWARD: every
        # public route has a spec; REVERSE: every spec is a public route; NEGATIVE: POST
        # /v1/deposits and the mTLS-only command channels never appear as public specs — the
        # mcp-server routes are excluded, ADR-IC-010). Spectral runs via npx (pinned) and
        # oasdiff via a pinned Docker image (the runner ships both, as avro-compat-check relies
        # on). NO live gateway. Same script dev runs via `make openapi-catalog-validate`.
        run: ./scripts/openapi-catalog-validate.sh
      - name: OpenAPI catalogue gate self-test (negative fixtures MUST fail, ADR-IC-020)
        # The executable proof the gate actually rejects a missing governance field, a spec path
        # that is not a public Kong route, a public route with no spec, and a spec describing the
        # internal POST /v1/deposits command surface. Builds a throwaway spec set from the good
        # baseline + each negative fixture under contracts/openapi/_selftest/ and asserts the gate
        # fails on each. Same check dev runs via `make openapi-catalog-selftest`.
        run: ./scripts/openapi-catalog-validate.sh --self-test
      - name: Saga integration-topic manifest matches the catalogue (ADR-IC-003, bd babelstone-9w2k.4)
        # The catalogue-derived saga-subscription gate. The orchestrator's sagas subscribe to the
        # engine's family-integration topic, which == the AsyncAPI catalogue channel (topic ==
        # aggregate_type, OutboxDrainer). The subscription is derived from the catalogue into a
        # checked-in generated manifest (FamilyIntegrationTopics.g.cs); this re-derives it from the
        # working-tree catalogue and FAILS the build if the committed manifest drifts — a missed
        # channel would be a saga that silently never advances, so it is caught here at build time,
        # not as a runtime stall (the exhaustive-and-correct-at-startup constraint, ADR-IC-003).
        # Hermetic + stdlib-only (no broker, no registry, no PyYAML); python3 is on PATH via the
        # mise-action toolchain above. Same check dev runs via `make gen-saga-topics-check`.
        run: ./scripts/gen-saga-topics-check.sh
      - name: AsyncAPI catalogue ↔ Schema Registry reconciliation (ADR-IC-015 §8, main only)
        # The LIVE reconciliation, main lane only (never on PRs — keeps the gate above
        # hermetic). Registers the working-tree .avsc set into a throwaway Redpanda
        # built-in SR (the same POC registry the Avro gate uses) and asserts every
        # x-schema-registry-subject the catalog references resolves there — so the
        # catalog can never document an event whose subject is absent from the
        # registry. Runs on push to main, not pull_request.
        if: ${{ github.event_name == 'push' }}
        run: ./scripts/asyncapi-catalog-reconcile.sh
      - name: OpenAPI catalogue live reconciliation (ADR-IC-020 main lane, main only)
        # The LIVE reconciliation, main lane only (never on PRs — keeps the gate above
        # hermetic). Loads infra/kong/kong.yml into a throwaway DB-less Kong (the pinned
        # kong:3.9.1 image kong-config-check uses) and confirms Kong actually MATERIALISES the
        # public routes — so a config that parses on disk but fails to load its routes into a
        # running gateway can never pass silently — then delegates the full spec<->route
        # reconciliation to the hermetic validate script. Runs on push to main, not pull_request.
        if: ${{ github.event_name == 'push' }}
        run: ./scripts/openapi-catalog-reconcile.sh

