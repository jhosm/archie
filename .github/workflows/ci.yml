    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link + diagram checks
        run: echo "TODO - markdown link check plus PlantUML render check; lands with the docs-CI task"

  conformance:
