name: CI

# Path-scoped CI (ADR-PC-019 §P1; Consequences #1: "CI must be path-scoped from
# the start"). The `changes` job detects which top-level subtree a PR touches;
# each downstream job runs only for its path. Real build/test steps land with each
# subtree's own build task — this skeleton wires the path-scoping, which must exist
# from day one so a naïve "build everything on every push" never takes root.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter calls the list-PR-files API on pull_request events

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      pack_validate: ${{ steps.filter.outputs.pack_validate }}
      families: ${{ steps.filter.outputs.families }}
      contracts: ${{ steps.filter.outputs.contracts }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      acl: ${{ steps.filter.outputs.acl }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
      notification: ${{ steps.filter.outputs.notification }}
      product_configs: ${{ steps.filter.outputs.product_configs }}
      packs: ${{ steps.filter.outputs.packs }}
      rate_sheets: ${{ steps.filter.outputs.rate_sheets }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine: ['engine/**']
            pack_validate: ['pack-validate/**']
            families: ['families/**']
            contracts: ['contracts/**']
            orchestrator: ['orchestrator/**']
            acl: ['acl/**']
            mcp_server: ['mcp-server/**']
            notification: ['notification/**']
            product_configs: ['product-configs/**']
            packs: ['packs/**']
            rate_sheets: ['rate-sheets/**']
            infra: ['infra/**']
            docs: ['docs/**']

  engine:
    needs: changes
    if: ${{ needs.changes.outputs.engine == 'true' || needs.changes.outputs.families == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin the toolchain from mise.toml (the single source of truth, ADR-PC-010
      # .NET 10 LTS) so CI builds against the same SDK as every dev machine — no
      # second version pin in this YAML to drift from it.
      - uses: jdx/mise-action@v4
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engine/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build + unit/analyser tests (ADR-PC-010, ADR-IC-009 unit tier)
        # restore + build (warnings-as-errors via Directory.Build.props) + all test
        # projects, incl. the Roslyn Money analysers. Needs no infrastructure, so it
        # excludes the Testcontainers-backed Integration tier (real PostgreSQL).
        run: dotnet test engine/Babelstone.slnx --configuration Release --nologo --filter "Category!=Integration"
      # TODO - Testcontainers integration tier (PostgreSQL + Redpanda, ADR-IC-009)
      # lands with E.6 (archie-2jum); it needs the dev stack, unlike the tier above.
      # That lane runs the complementary `--filter "Category=Integration"` (the
      # EventStore migration/append-and-outbox suites tagged from A.1 onward).

  pack-validate:
    needs: changes
    if: ${{ needs.changes.outputs.pack_validate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + test the Go validator (ADR-PC-006)
        run: echo "TODO - go build and go test; lands with the pack-validate build task"

  contracts:
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Schema compatibility + EventCatalog build (ADR-IC-002, ADR-IC-008)
        run: echo "TODO - Avro/CUE compatibility checks plus EventCatalog build; lands with the contracts task"

  orchestrator:
    needs: changes
    if: ${{ needs.changes.outputs.orchestrator == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + contract tests (ADR-IC-003, ADR-IC-013)
        run: echo "TODO - dotnet build plus contract tests; lands with the orchestrator build task"

  acl:
    needs: changes
    if: ${{ needs.changes.outputs.acl == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + contract tests (ADR-IC-012, ADR-IC-013)
        run: echo "TODO - dotnet build plus contract tests; lands with the ACL build task"

  mcp-server:
    needs: changes
    if: ${{ needs.changes.outputs.mcp_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + contract tests (ADR-IC-010, ADR-IC-013)
        run: echo "TODO - Python build plus contract tests; lands with the MCP server build task"

  notification:
    needs: changes
    if: ${{ needs.changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + contract tests (ADR-IC-011, ADR-IC-013)
        run: echo "TODO - dotnet build plus contract tests; lands with the notification build task"

  product-configs:
    needs: changes
    if: ${{ needs.changes.outputs.product_configs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate variant structure (01 §3)
        run: echo "TODO - pack-validate variant structure against family schema plus active pack; lands with pack-validate"

  packs:
    needs: changes
    if: ${{ needs.changes.outputs.packs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate + verify + smoke-load the pack (ADR-PC-006, ADR-PC-007)
        run: echo "TODO - pack-validate plus cosign verify plus pack-load smoke test; lands with pack tooling"

  rate-sheets:
    needs: changes
    if: ${{ needs.changes.outputs.rate_sheets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate rate-sheet schema (ADR-PC-008)
        run: echo "TODO - rate-sheet schema validation; lands with rate-sheet tooling"

  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint infra manifests (01 §6)
        run: echo "TODO - infra manifest lint/validate; lands with the infra task"

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Relative/anchor cross-link integrity (the dominant link type per CLAUDE.md's
      # link conventions). --offline skips http(s) so the per-PR gate never flakes on
      # a slow external host; external-URL checking is left for a future nightly.
      - name: Markdown link check (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress docs/**/*.md ./*.md"
          fail: true
      - name: Install PlantUML + Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends plantuml graphviz
      - name: Diagram render-check (each committed .puml renders to its SVG)
        run: bash .github/scripts/diagram-render-check.sh
