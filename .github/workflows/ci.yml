name: CI

# Path-scoped CI (ADR-PC-019 §P1; Consequences #1: "CI must be path-scoped from
# the start"). The `changes` job detects which top-level subtree a PR touches;
# each downstream job runs only for its path. Real build/test steps land with each
# subtree's own build task — this skeleton wires the path-scoping, which must exist
# from day one so a naïve "build everything on every push" never takes root.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter calls the list-PR-files API on pull_request events

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      pack_validate: ${{ steps.filter.outputs.pack_validate }}
      families: ${{ steps.filter.outputs.families }}
      contracts: ${{ steps.filter.outputs.contracts }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      acl: ${{ steps.filter.outputs.acl }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
      notification: ${{ steps.filter.outputs.notification }}
      product_configs: ${{ steps.filter.outputs.product_configs }}
      packs: ${{ steps.filter.outputs.packs }}
      rate_sheets: ${{ steps.filter.outputs.rate_sheets }}
      infra: ${{ steps.filter.outputs.infra }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine: ['engine/**']
            pack_validate: ['pack-validate/**']
            families: ['families/**']
            contracts: ['contracts/**']
            orchestrator: ['orchestrator/**']
            acl: ['acl/**']
            mcp_server: ['mcp-server/**']
            notification: ['notification/**']
            product_configs: ['product-configs/**']
            packs: ['packs/**']
            rate_sheets: ['rate-sheets/**']
            infra: ['infra/**']
            docs: ['docs/**', '*.md', '.github/workflows/ci.yml', '.github/scripts/diagram-render-check.sh']

  engine:
    needs: changes
    # Also on packs/contracts changes: the engine STRICTLY parses the pack YAML (Babelstone.Packs,
    # no IgnoreUnmatchedProperties) and embeds the Avro .avsc (Babelstone.Engine.Avro). A packs/** or
    # contracts/** change can therefore break the engine WITHOUT touching engine/**, and a path-scoped
    # engine job would miss it (it merges red-on-main, surfacing only on the next engine PR — the
    # babelstone-fk7m.2 / permitted_for incident). So the engine build+tests run on these too.
    if: ${{ needs.changes.outputs.engine == 'true' || needs.changes.outputs.families == 'true' || needs.changes.outputs.packs == 'true' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin the toolchain from mise.toml (the single source of truth, ADR-PC-010
      # .NET 10 LTS) so CI builds against the same SDK as every dev machine — no
      # second version pin in this YAML to drift from it.
      - uses: jdx/mise-action@v4
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engine/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build + unit/analyser tests (ADR-PC-010, ADR-IC-009 unit tier)
        # restore + build (warnings-as-errors via Directory.Build.props) + all test
        # projects, incl. the Roslyn Money analysers. Needs no infrastructure, so it
        # excludes the Testcontainers-backed Integration tier (real PostgreSQL).
        run: dotnet test engine/Babelstone.slnx --configuration Release --nologo --filter "Category!=Integration"
      - name: Integration tests (Testcontainers tier — E.6, ADR-IC-009)
        # The complementary `--filter "Category=Integration"` lane the unit step
        # above excludes: real PostgreSQL + Redpanda + OpenBao. Testcontainers
        # self-manages those (random host ports, no `services:` block), and the
        # ubuntu-latest runner ships Docker — so the EventStore append+outbox suite
        # (from A.1 on), the Redpanda outbox round-trip (E.4), and the
        # constitute→mature API E2E all run here without `make up`. Wiring this lane
        # is what lets ES_ATOMIC_APPEND_OUTBOX flip Planned→Live in the commitment
        # catalogue (archie-2jum / E.6).
        run: dotnet test engine/Babelstone.slnx --configuration Release --nologo --filter "Category=Integration"

  pack-validate:
    needs: changes
    # Also runs on contracts/packs changes: the validator's accept/reject tests
    # resolve against the live /contracts/cue schemas and packs/pt.2026.1, so a
    # schema or pack change must re-prove the validator still classifies them.
    if: ${{ needs.changes.outputs.pack_validate == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.packs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4 # pins Go + cue from mise.toml (ADR-PC-006)
      - name: Build + test the Go validator (ADR-PC-006)
        # Reproducible build from the pinned go.mod (Open Action #2); the test
        # suite carries the PACK_VALIDATE_DEPTH_BUDGETS fitness function and the
        # versioned JSON-contract test. Run from the module dir so fixture paths
        # resolve to /contracts/cue and /packs.
        working-directory: pack-validate
        run: |
          go build -trimpath -ldflags "-X main.Version=${GITHUB_SHA::12}" ./...
          go test ./...

  contracts:
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin CUE (and the rest) from mise.toml — same single source of truth as
      # every dev machine (CUE 0.16.1, ADR-PC-006), no second pin to drift from.
      - uses: jdx/mise-action@v4
      - name: CUE family-schema soundness (ADR-PC-006)
        # fmt + compile + accept-valid / reject-invalid fixtures, incl. the
        # closed-struct "no DSL escape hatch" guarantee. Same script dev runs
        # via `make contracts-check`.
        run: ./contracts/cue/check.sh
      # TODO - Avro payload-compatibility checks + EventCatalog build
      # (ADR-IC-002, ADR-IC-008) land with the contracts/Avro task.

  orchestrator:
    needs: changes
    if: ${{ needs.changes.outputs.orchestrator == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + contract tests (ADR-IC-003, ADR-IC-013)
        run: echo "TODO - dotnet build plus contract tests; lands with the orchestrator build task"

  acl:
    needs: changes
    if: ${{ needs.changes.outputs.acl == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + contract tests (ADR-IC-012, ADR-IC-013)
        run: echo "TODO - dotnet build plus contract tests; lands with the ACL build task"

  mcp-server:
    needs: changes
    if: ${{ needs.changes.outputs.mcp_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4 # pins Python from mise.toml (3.14, ADR-IC-010)
      - name: Build + contract tests (ADR-IC-010, ADR-IC-013)
        working-directory: mcp-server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pytest -q

  notification:
    needs: changes
    if: ${{ needs.changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build + contract tests (ADR-IC-011, ADR-IC-013)
        run: echo "TODO - dotnet build plus contract tests; lands with the notification build task"

  product-configs:
    needs: changes
    # Also on pack_validate/contracts changes: the variants are validated BY the
    # binary against the schemas, so a change to either must re-validate them.
    if: ${{ needs.changes.outputs.product_configs == 'true' || needs.changes.outputs.pack_validate == 'true' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4 # pins Go + cue from mise.toml
      - name: Validate every variant through depths 1–4 (ADR-PC-006, 01 §3)
        # Build the validator once, then run the full depths-1→4 `validate` over
        # each committed variant against the pack it pins. v1 ships one pack
        # (pt.2026.1); when a second lands, derive --pack from the variant's
        # `pack:` field. No variants yet ⇒ a logged no-op (never a silent pass).
        run: |
          go -C pack-validate build -trimpath -o "$RUNNER_TEMP/pack-validate" .
          shopt -s nullglob
          found=0
          for v in product-configs/*.yaml; do
            found=1
            echo "== $v =="
            "$RUNNER_TEMP/pack-validate" validate "$v" --pack packs/pt.2026.1
          done
          [ "$found" -eq 1 ] || echo "no variants in product-configs/ yet — nothing to validate"

  packs:
    needs: changes
    # Also runs on contracts changes: a pack bundles the /contracts/cue family
    # schemas, so a schema change must re-validate every pack.
    if: ${{ needs.changes.outputs.packs == 'true' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4 # pins cue + oras from mise.toml
      - name: Build + verify the pack by digest (ADR-PC-006, ADR-PC-007)
        # stage schemas + cue-vet manifest/data, oras push to an OCI layout,
        # then pull strictly by sha256 digest and re-validate (§P2).
        run: |
          DIGEST="$(./packs/pack.sh build packs/pt.2026.1)"
          ./packs/pack.sh verify packs/pt.2026.1 --digest "$DIGEST"
      # TODO - cosign keyless verify (OIDC) lands with Q.5; pack-load smoke
      # test (engine pulls + verifies + caches) lands with C.5.

  rate-sheets:
    needs: changes
    if: ${{ needs.changes.outputs.rate_sheets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate rate-sheet schema (ADR-PC-008)
        run: echo "TODO - rate-sheet schema validation; lands with rate-sheet tooling"

  infra:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint infra manifests (01 §6)
        run: echo "TODO - infra manifest lint/validate; lands with the infra task"

  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Relative/anchor cross-link integrity (the dominant link type per CLAUDE.md's
      # link conventions). --offline skips http(s) so the per-PR gate never flakes on
      # a slow external host; external-URL checking is left for a future nightly.
      - name: Markdown link check (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress docs/**/*.md ./*.md"
          fail: true
      # Graphviz + a JRE from apt; PlantUML itself is pinned (not apt's) — the
      # apt package on ubuntu-24.04 ships a C4 bundled-stdlib too old to resolve
      # `!include <C4/C4_Component>`, so every C4 macro errors. The render-check
      # is version-tolerant by design (SVG isn't byte-stable), so we just need a
      # release new enough to carry the C4 stdlib; pin a recent one for a
      # reproducible runner (current at time of writing; bump freely).
      - name: Install Graphviz + JRE
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz default-jre-headless
      - name: Install pinned PlantUML
        env:
          PLANTUML_VERSION: 1.2026.4
        run: |
          sudo curl -fsSL -o /usr/local/lib/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          printf '#!/usr/bin/env bash\nexec java -jar /usr/local/lib/plantuml.jar "$@"\n' \
            | sudo tee /usr/local/bin/plantuml >/dev/null
          sudo chmod +x /usr/local/bin/plantuml
          plantuml -version
      - name: Diagram render-check (each committed .puml renders to its SVG)
        run: bash .github/scripts/diagram-render-check.sh

  gate:
    # Always-run aggregator (Q.7, archie-j72w). The per-subtree jobs above are
    # path-scoped (ADR-PC-019 §P1) — they SKIP on unrelated PRs. GitHub branch
    # rulesets treat a skipped required check as unsatisfied, so requiring those jobs
    # directly would block every PR that doesn't touch their path. Instead the ruleset
    # requires this ONE always-present job, which passes iff every job that *did* run
    # succeeded. Treats `skipped` (path not touched) and `success` as OK; fails on
    # `failure` or `cancelled`. The pending fitness gates — DETERMINISM_GATE (A.7,
    # archie-k03q), acceptance gates (L.3), no-PII/emit-contract (G.6) — join `needs`
    # as they land, so coverage grows without re-touching the ruleset.
    name: CI gate
    needs:
      - changes
      - engine
      - pack-validate
      - contracts
      - orchestrator
      - acl
      - mcp-server
      - notification
      - product-configs
      - packs
      - rate-sheets
      - infra
      - docs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every triggered CI job to have passed (skipped is OK)
        env:
          # Controlled enum values (success/failure/skipped/cancelled) — safe to expand.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required CI job did not pass (result=$r)"; exit 1 ;;
            esac
          done
          echo "all triggered CI jobs passed"
