name: Image build + publish

# Per-service container image build → push → SBOM + vulnerability scan (bd babelstone-qsf7;
# ADR-IC-014 supply-chain posture, ADR-IC-013 service placement). This is the *image* half of
# the supply-chain story whose *source-dependency* half lives in sbom.yml: sbom.yml inventories
# the resolved NuGet graph of engine/Babelstone.slnx; THIS workflow inventories the runtime
# image layers (base OS + framework + app) of every deployable, exactly the split sbom.yml's
# header calls out ("the container image SBOM + scan ... lands with the image build/push task").
#
# Six deployables, one matrix (ADR-IC-013): engine (ADR-PC-010), acl (ADR-IC-012), orchestrator
# (ADR-IC-003), notification (ADR-IC-011), mcp-server (ADR-IC-010), pack-validate (ADR-PC-006).
# Images publish to GHCR at ghcr.io/jhosm/babelstone-<service>.
#
# Build-only on pull_request (verify every Dockerfile still builds — NO push, NO registry
# credentials needed on a fork PR); build AND push on push to main. Each pushed image is then
# SBOM'd (syft / anchore-sbom-action, mirroring sbom.yml's tool choice) and scanned (grype /
# anchore-scan-action, severity-cutoff high) for the single published platform (linux/amd64 —
# staging is a Hetzner CPX42 x86 node, bd babelstone-zla1.13; the arm64 leg was dropped with it),
# with findings uploaded to the Security tab (ADR-IC-014 §S2) — the same report-only posture
# sbom.yml uses for the source graph (the PR-blocking SCA gates are the per-ecosystem layer, not
# these defense-in-depth scans).
#
# Each matrix leg emits its pushed image DIGEST as a job output (the `digest` step + the
# `digests` job that fans them back in) AND cosign-signs that digest keyless (Sigstore OIDC,
# bd Q.5, ADR-PC-007 §P2): sign by immutable digest, never by tag, with id-token:write minting
# the Fulcio cert — no long-lived signing key. Verify with `cosign verify` + the workflow's
# OIDC identity (see the sign step for the exact identity regexes a deployer pins).
#
# Path-scoped trigger style follows ci.yml / sbom.yml (ADR-PC-019 §P1): a docs-only change
# never rebuilds images. The Dockerfiles, this workflow, and the central package-version file
# (Directory.Packages.props — the .NET images restore against it) are in the path set so a
# change to any of them re-exercises the build.

on:
  push:
    branches: [main]
    paths: &image_paths
      - 'engine/**'
      - 'acl/**'
      - 'orchestrator/**'
      - 'notification/**'
      - 'mcp-server/**'
      - 'pack-validate/**'
      - 'backstage/**'             # the Backstage catalogue-portal image (zla1.6.3/.6.4)
      - 'contracts/catalog/**'     # the governed catalogue descriptor tree baked into the backstage image
      - 'contracts/openapi/specs/**'   # OpenAPI specs the descriptor $text-references (baked into the image)
      - 'contracts/openapi/internal/**' # internal OpenAPI specs the descriptor $text-references (baked in)
      - 'infra/backstage/**'       # the governed app-config the backstage image bakes as production
      - 'docs/demo/mission-control/**'  # the Mission Control UI image (zla1.5.4)
      - 'families/**'              # the engine image's publish pulls in the family projects
      - 'Directory.Packages.props' # central package versions the .NET image restores against
      - 'infra/k8s/apps/engine/**' # the pack-baked engine-staging derived image (zla1.5.1)
      - 'infra/k8s/apps/notification/**' # the pack-baked notification-staging derived image (zla1.5.10)
      - 'infra/k8s/apps/rate-sheet-deploy/**' # the pack + sheet-baked rate-sheet-deploy image (zla1.21)
      - 'packs/**'                 # engine-staging + notification-staging + rate-sheet-deploy bake pt.2026.1 — a pack change rebuilds them
      - 'rate-sheets/**'           # the rate-sheet-deploy image bakes the committed term_deposit sheet (zla1.21)
      - '.github/workflows/image-build.yml'
  pull_request:
    paths: *image_paths

# A new push to a ref supersedes an in-flight build of the same ref; never cancel a
# push-to-main run mid-publish (it could leave a tag pointing at a half-pushed manifest),
# so cancel-in-progress is gated to non-main refs only.
concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege at the top; the build job widens to packages:write only when it pushes.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push the image to GHCR (push-to-main legs only)
      security-events: write # upload the grype SARIF to the Security tab (ADR-IC-014 §S2)
      id-token: write        # mint the OIDC token cosign exchanges with Fulcio for a
                             # short-lived signing cert — keyless signing (bd Q.5, ADR-PC-007 §P2)
    strategy:
      fail-fast: false       # one service's Dockerfile breaking shouldn't mask the others
      matrix:
        # Build context differs by service stack — it is NOT uniformly the repo root:
        #  - .NET legs (engine, orchestrator, notification) build with the REPO ROOT as context: they restore
        #    against the central Directory.Packages.props at the root
        #    (ManagePackageVersionsCentrally=true), so a service-dir context can't resolve package
        #    versions. Each names its project explicitly in its Dockerfile (orchestrator/Dockerfile
        #    documents this; engine/Dockerfile now matches).
        #  - self-contained legs (mcp-server = Python, pack-validate = Go) build with their OWN dir
        #    as context: their pyproject.toml / go.mod live there, so a repo-root `COPY . .` would
        #    leave no installable package/module at the build WORKDIR (pip install . / go build .
        #    would fail). Their dir is the context; the Dockerfile path stays repo-root-relative.
        # notification JOINED the matrix when its .NET source landed (bd babelstone-60n8.1): it is a
        # .NET worker, so it builds with the REPO ROOT as context and names its project explicitly in
        # its Dockerfile, exactly like engine/orchestrator. acl is STILL excluded — it remains a
        # Dockerfile+README stub with no source (ADR-IC-012/013 reserve-don't-pre-build) and cannot
        # produce an image; it joins the matrix when its own .NET source lands (the acl build task,
        # DEF-1 / bd ub9s).
        include:
          - service: engine
            dockerfile: engine/Dockerfile
            context: .
          - service: orchestrator
            dockerfile: orchestrator/Dockerfile
            context: .
          - service: notification
            dockerfile: notification/Dockerfile
            context: .
          - service: mcp-server
            dockerfile: mcp-server/Dockerfile
            context: mcp-server
          - service: pack-validate
            dockerfile: pack-validate/Dockerfile
            context: pack-validate
          # Mission Control demo UI (bd babelstone-zla1.5.4): a self-contained Python proxy +
          # static UI (stdlib-only but for one pip dependency — psycopg, for the optional read-only
          # /pg/* Inspector lenses, bd babelstone-f0ic.15.1), so — like mcp-server / pack-validate —
          # it builds with its OWN dir as context (requirements.txt + serve.py + index.html live
          # there). Publishes ghcr.io/jhosm/babelstone-mission-control, amd64 + cosign-signed.
          - service: mission-control
            dockerfile: docs/demo/mission-control/Dockerfile
            context: docs/demo/mission-control
          # Backstage catalogue portal (bd babelstone-zla1.6.3/.6.4; ADR-IC-015): the scaffolded
          # Node app under backstage/, built multi-stage IN docker, that bakes the governed
          # catalogue tree (contracts/catalog + the contracts/openapi specs it $text-references)
          # and the governed app-config (infra/backstage/app-config.yaml). Like the .NET legs it
          # builds with the REPO ROOT as context — it COPYs from outside backstage/ — so context
          # is `.` and the Dockerfile path is repo-root-relative. Publishes
          # ghcr.io/jhosm/babelstone-backstage, amd64 + SBOM + grype + cosign-by-digest via the
          # shared matrix steps below.
          - service: backstage
            dockerfile: backstage/Dockerfile
            context: .
          # RateSheets.Api deploy host (bd babelstone-zla1.21): a .NET web host (normally POST
          # /v1/rate-sheets; in the staging Job it runs one-shot deploy-and-exit). Like the other .NET
          # legs it builds with the REPO ROOT as context (restore/publish reach the whole solution).
          # Publishes ghcr.io/jhosm/babelstone-ratesheets-api; the rate-sheet-deploy derived image
          # (build-rate-sheet-deploy below) bakes the pack + committed sheet onto it.
          - service: ratesheets-api
            dockerfile: engine/src/Babelstone.RateSheets.Api/Dockerfile
            context: .
    # Surface this leg's pushed digest to the fan-in `digests` job (and, downstream, to the
    # Q.5 cosign step). Empty on a PR run (build-only, nothing pushed).
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # amd64-only builds run natively on the amd64 runner, so no QEMU/binfmt emulation is
      # needed (the arm64 leg was dropped once staging landed on a Hetzner CPX42 x86 node,
      # bd babelstone-zla1.13).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only authenticate when we will actually push (push-to-main). Fork PRs have no
      # GHCR credentials and must never need them — the build leg below pushes: false there.
      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag/label derivation (OCI-standard labels + a stable image ref). `latest` only moves on
      # the default branch; every push also gets an immutable sha-<commit> tag so a signature or
      # deployment can pin a specific build even before digest pinning.
      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jhosm/babelstone-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Build (PR) / Build + push (main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # amd64-only: staging is a Hetzner CPX42 x86 node (bd babelstone-zla1.13), so a single
          # linux/amd64 manifest is all that ever runs. The emulated arm64 leg — the slowest CI
          # step — was dropped with the ARM staging plan (bd babelstone-zla1.8). Re-adding arm64
          # is a small, well-understood revert if staging ever moves back onto a CAX ARM box.
          platforms: linux/amd64
          # pull_request → build only (verify the Dockerfile still builds); push to main → push to GHCR.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false   # No buildkit SLSA-attestation index: keep the pushed artifact a plain
                              # single-arch manifest, so steps.build.outputs.digest is the image
                              # digest cosign signs by digest in Q.5 — it is exactly the digest
                              # cd.yml pins in PROMOTE_IMAGE_DIGESTS (flipping this to true would
                              # repoint the digest at an attestation index and desync that contract).
          cache-from: type=gha,scope=image-${{ matrix.service }}
          # ignore-error: a failed GitHub Actions Cache EXPORT must never fail the build. The image
          # is already built + pushed before this exporter runs; a `type=gha` export that errors
          # "not_found" (the GHA cache-service migration flake) otherwise fails the whole `build` job
          # and SILENTLY SKIPS every `needs: build` derived image — exactly how rate-sheet-deploy went
          # unpublished and red-listed cd.yml's pin-by-digest gate (bd babelstone-zla1.21.1).
          cache-to: type=gha,scope=image-${{ matrix.service }},mode=max,ignore-error=true

      # The remaining steps are the supply-chain leg over the PUSHED image: they need a pushed
      # digest, so they run on push-to-main only (a PR build produces no registry artifact to
      # scan). The image reference is pinned by digest — the exact bytes that were pushed.
      - name: Resolve pushed image reference (by digest)
        id: imgref
        if: ${{ github.event_name == 'push' && steps.build.outputs.digest != '' }}
        env:
          IMAGE: ghcr.io/jhosm/babelstone-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # --- Keyless cosign signing (bd Q.5, ADR-PC-007 §P2) -----------------------------
      # Sign the PUSHED image by its immutable digest so a deployer can verify exactly the
      # bytes that were built — never by a tag, which can be re-pointed. Signing is keyless
      # Sigstore OIDC: cosign exchanges the workflow's `id-token` for a short-lived Fulcio
      # cert (no long-lived private key / secret to rotate — the engine-team identity in v1
      # is the workflow's OIDC subject; bank-internal OIDC in production, ADR-PC-007 §P2 /
      # Residual Risk "cosign keyless depends on Sigstore"). The signature is stored back in
      # GHCR as an OCI artefact alongside the image and logged in the public Rekor
      # transparency log. This mirrors the established pack-signing approach (the pack-author
      # skill cosign-signs pack artefacts by digest); the pack-publish signing leg in CI is a
      # follow-up (ci.yml `packs` job still carries the "cosign keyless verify lands with Q.5"
      # TODO — there is no durable pack publish in CI yet to attach a signature to).
      - name: Install cosign
        if: ${{ steps.imgref.outputs.ref != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed image (keyless OIDC, by digest)
        id: sign
        if: ${{ steps.imgref.outputs.ref != '' }}
        env:
          # The digest-pinned reference resolved above — the exact bytes pushed to GHCR.
          # `cosign sign` rejects a tag-only reference under COSIGN_YES; we always pass a
          # `name@sha256:…` ref so the signature binds to the digest, not a movable tag.
          IMAGE_REF: ${{ steps.imgref.outputs.ref }}
          # Non-interactive: take the keyless-signing consent (transparency-log upload)
          # without a TTY prompt. Equivalent to `--yes`.
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE_REF"

      # --- Container-image SBOM + scan (bd babelstone-qsf7) -----------------------------
      # The pushed artifact is now a single-arch (linux/amd64) manifest — staging is a Hetzner
      # CPX42 x86 node (bd babelstone-zla1.13), so amd64 is the only platform that runs. We
      # therefore SBOM + scan that one platform: syft is pinned with `--platform linux/amd64`
      # (the anchore/sbom-action `platform` input) so the inventory always describes the amd64
      # child even if the pushed artifact is later re-wrapped as an index. The posture is
      # report-only (fail-build: false), DORA supply-chain evidence + defense-in-depth, NOT a
      # gate — the PR-blocking SCA layer is source/graph-based and arch-independent
      # (ADR-IC-014 §A1/§A2). When the arm64 leg existed we ran this once per platform
      # (bd babelstone-oq9z); dropping arm64 collapses it back to a single scan.
      # CycloneDX JSON, uploaded as a per-service artifact for audit / DORA evidence.
      - name: Generate container image SBOM (CycloneDX)
        id: sbom
        if: ${{ steps.imgref.outputs.ref != '' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.imgref.outputs.ref }}
          platform: linux/amd64
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/babelstone-${{ matrix.service }}.image.cdx.json
          artifact-name: babelstone-${{ matrix.service }}-image-sbom.cdx.json
          upload-artifact: true

      # grype over the SBOM, severity-cutoff high (covers high AND critical), report-only
      # (fail-build: false) — mirrors sbom.yml's source scan. Scans the SBOM just produced so the
      # inventory and the findings describe the same bytes.
      - name: Scan image for vulnerabilities (report-only — DORA evidence, not a gate)
        id: scan
        if: ${{ steps.sbom.outcome == 'success' }}
        uses: anchore/scan-action@v7
        with:
          sbom: ${{ runner.temp }}/babelstone-${{ matrix.service }}.image.cdx.json
          severity-cutoff: high
          fail-build: false
          output-format: sarif

      # Per-service category keeps each image's findings distinguishable in the Security tab
      # (ADR-IC-014 §S2). `if: always()` so results upload even if a scan errored.
      - name: Upload image vulnerability findings to the Security tab
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-grype-${{ matrix.service }}

  build-engine-staging:
    # The pack-baked engine image for the staging cluster (bd babelstone-zla1.5.1): FROM the
    # base engine image the matrix above just pushed, + COPY pt.2026.1 → /app/packs so the
    # engine boots in disk pack-mode on the box. It must run AFTER `build` (it FROMs the base
    # engine image), hence a dependent job — a sibling matrix leg would FROM a not-yet-pushed
    # image. PUSH-TO-MAIN ONLY: the FROM pulls ghcr.io/jhosm/babelstone-engine, which exists
    # only after a push publishes it; a fork PR has no GHCR creds to pull it. The derived
    # Dockerfile is a trivial FROM+COPY, and the manifest that references this image is
    # static-validated by ci.yml (kustomize+kubeconform) on every PR.
    name: build engine-staging (pack-baked)
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (so cd.yml can verify this image by digest)
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jhosm/babelstone-engine-staging
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
      - name: Build + push (amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/k8s/apps/engine/Dockerfile
          # Same amd64-only + plain-manifest posture as the matrix legs (staging is a CPX42 x86
          # node, bd babelstone-zla1.13; provenance:false keeps steps.build.outputs.digest the
          # image digest cosign signs / cd.yml pins — see the matrix build step).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/jhosm/babelstone-engine:latest
          cache-from: type=gha,scope=image-engine-staging
          cache-to: type=gha,scope=image-engine-staging,mode=max,ignore-error=true
      - name: Resolve pushed image reference (by digest)
        id: imgref
        env:
          IMAGE: ghcr.io/jhosm/babelstone-engine-staging
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the pushed image (keyless OIDC, by digest)
        # SBOM/scan are intentionally omitted here: this is a thin FROM+COPY over the base
        # engine image, which the `build` matrix already SBOM'd + scanned + signed; the only
        # added bytes are the static pt.2026.1 YAML pack (no new package layers). Signing IS
        # required so cd.yml's cosign-verify-by-digest can promote this image.
        env:
          IMAGE_REF: ${{ steps.imgref.outputs.ref }}
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE_REF"

  build-notification-staging:
    # The pack-baked notification image for the staging cluster (bd babelstone-zla1.5.10): FROM
    # the base notification image the matrix above just pushed, + COPY pt.2026.1 → /app/packs so
    # the host's LoadPinnedPack disk walk (ADR-PC-007 §P4) finds its instance-pinned pack on the
    # box. It must run AFTER `build` (it FROMs the base notification image), hence a dependent job —
    # a sibling matrix leg would FROM a not-yet-pushed image. PUSH-TO-MAIN ONLY: the FROM pulls
    # ghcr.io/jhosm/babelstone-notification, which exists only after a push publishes it; a fork PR
    # has no GHCR creds to pull it. The derived Dockerfile is a trivial FROM+COPY, and the manifest
    # that references this image is static-validated by ci.yml (kustomize+kubeconform) on every PR.
    # The exact twin of build-engine-staging (zla1.5.1) — the two derived images share the pattern.
    name: build notification-staging (pack-baked)
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (so cd.yml can verify this image by digest)
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jhosm/babelstone-notification-staging
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
      - name: Build + push (amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/k8s/apps/notification/Dockerfile
          # Same amd64-only + plain-manifest posture as the matrix legs: staging is a CPX42 x86
          # node (bd babelstone-zla1.13), so amd64 is the only platform that runs; provenance:false
          # keeps steps.build.outputs.digest the image digest cosign signs / cd.yml pins — see the
          # matrix build step.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/jhosm/babelstone-notification:latest
          cache-from: type=gha,scope=image-notification-staging
          cache-to: type=gha,scope=image-notification-staging,mode=max,ignore-error=true
      - name: Resolve pushed image reference (by digest)
        id: imgref
        env:
          IMAGE: ghcr.io/jhosm/babelstone-notification-staging
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the pushed image (keyless OIDC, by digest)
        # SBOM/scan are intentionally omitted here: this is a thin FROM+COPY over the base
        # notification image, which the `build` matrix already SBOM'd + scanned + signed; the only
        # added bytes are the static pt.2026.1 YAML pack (no new package layers). Signing IS
        # required so cd.yml's cosign-verify-by-digest can promote this image.
        env:
          IMAGE_REF: ${{ steps.imgref.outputs.ref }}
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE_REF"

  build-rate-sheet-deploy:
    # The pack + sheet-baked rate-sheet-deploy image for the staging cluster (bd babelstone-zla1.21):
    # a serialise stage turns the committed rate-sheet YAML into JSON 1:1, then FROM the base
    # ratesheets-api image the matrix above just pushed + COPY pt.2026.1 and the JSON, so the staging
    # rate-sheet-deploy Job's one-shot deploy validates the sheet against the pack bounds and stores
    # it. Runs AFTER `build` (it FROMs babelstone-ratesheets-api); PUSH-TO-MAIN ONLY (the FROM needs
    # the pushed base — a fork PR has no GHCR creds). The twin of build-engine-staging /
    # build-notification-staging; the manifest that references it is kustomize+kubeconform-gated on PR.
    name: build rate-sheet-deploy (pack + sheet-baked)
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (so cd.yml can verify this image by digest)
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jhosm/babelstone-rate-sheet-deploy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
      - name: Build + push (amd64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/k8s/apps/rate-sheet-deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/jhosm/babelstone-ratesheets-api:latest
          cache-from: type=gha,scope=image-rate-sheet-deploy
          cache-to: type=gha,scope=image-rate-sheet-deploy,mode=max,ignore-error=true
      - name: Resolve pushed image reference (by digest)
        id: imgref
        env:
          IMAGE: ghcr.io/jhosm/babelstone-rate-sheet-deploy
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the pushed image (keyless OIDC, by digest)
        # SBOM/scan omitted: a thin serialise + FROM+COPY over the base ratesheets-api image the
        # `build` matrix already SBOM'd + scanned + signed; the only added bytes are the static
        # pt.2026.1 pack + the js-yaml-serialised sheet JSON. Signing IS required so cd.yml's
        # cosign-verify-by-digest can promote this image.
        env:
          IMAGE_REF: ${{ steps.imgref.outputs.ref }}
          COSIGN_YES: "true"
        run: cosign sign "$IMAGE_REF"

  digests:
    # Fan the per-service pushed digests back into one place. The cosign keyless-OIDC signing
    # (bd Q.5) now lands INSIDE the build matrix leg — each leg holds its own service name +
    # pushed digest in scope, so it signs ghcr.io/jhosm/babelstone-<service>@<digest> by
    # immutable digest right after the push, with id-token:write on the build job. (A fan-in
    # signing job here would only see the collapsed last-leg digest, with no per-service map.)
    # This job stays a digest-record convenience for the job summary.
    name: collect pushed digests
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record digest of the build matrix
        env:
          # Single matrix output today (matrix outputs collapse to the last leg's value); the
          # per-service digests also live on each build leg's job summary + the pushed manifest.
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "Build matrix completed; representative pushed digest: ${DIGEST:-<none>}"
          echo "Per-service images: ghcr.io/jhosm/babelstone-{engine,acl,orchestrator,notification,mcp-server,pack-validate,mission-control,backstage}"
          echo "Each pushed image is cosign-signed by digest (keyless OIDC) in its build leg (bd Q.5)."
