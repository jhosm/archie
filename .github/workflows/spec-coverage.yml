name: Spec coverage

# ADR-PC-020 §P6 (ADR <-> catalogue <-> code/test coverage checker — per-push,
# authoritative) + §P3 (periodic auditor sweep for the backfill backlog and, once
# engine source lands, decided-but-unbuilt / governed-code-without-test findings).
# The Claude PostToolUse hook (plugins/babelstone-engine/hooks/scripts/surface-spec-coverage.sh,
# bundled in the babelstone-engine plugin) is the fast mirror; this workflow is the
# authority the hook mirrors (§P1).
#
# Security: the only ${{ }} expansions are github.event_name comparisons in job
# `if:` conditions (trusted, not interpolated into any run: shell). No untrusted
# PR-controlled input is referenced, per the GitHub Actions injection guidance.

on:
  # CI temporarily disabled repo-wide (manual dispatch only)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Authoritative per-push gate. Runs on PRs and on manual dispatch.
    # Named for a clean required-check label in the main-protect ruleset (Q.7, archie-j72w).
    name: spec-coverage
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run spec-coverage-check.sh unit tests (hermetic fixture repos)
        # Self-test first (the adr-governance.yml pattern): proves the checker's
        # scripts/*.sh Live-resolution branch demands actual ci.yml wiring — an
        # orphaned gate naming a Test ID must NOT resolve a Live row (ADR-PC-020's
        # "and runs in CI") — before trusting its verdict.
        run: bash .github/scripts/spec-coverage-check.test.sh
      - name: ADR <-> catalogue <-> code/test coverage (ADR-PC-020 §P6)
        run: bash .github/scripts/spec-coverage-check.sh

  audit:
    # Periodic finding sweep — report-only (visibility, not a build break).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decided-but-unbuilt / no-commitment-ADR sweep (ADR-PC-020 §P3)
        run: bash .github/scripts/spec-coverage-audit.sh
