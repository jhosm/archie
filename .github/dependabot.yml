# Dependency audit / SCA (ADR-IC-014; bd Q.8 archie-lrzc). Weekly update PRs plus
# vulnerability alerts across every package ecosystem in the monorepo, AND the GitHub
# Actions the workflows pin — closing the unpinned/compromised-action supply-chain gap
# that nothing else in the pipeline watched. Report-only posture: Dependabot opens PRs
# and raises alerts; whether they block merge is the maintainer's call (required-check
# wiring is Q.7, archie-j72w). Alerts surface in the repo's Security tab alongside the
# native secret-scanning and CodeQL code-scanning findings (all free on a public repo —
# ADR-IC-014 §F1).
version: 2
updates:
  # C# — the engine solution and its project tree (recursive .csproj discovery under the
  # directory). Add the in-house estate-service roots (orchestrator/acl/notification) here
  # as their .csproj trees land (ADR-IC-013).
  - package-ecosystem: nuget
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      engine-nuget:
        patterns: ["*"]
    ignore:
      # PactNet is deliberately held on the 4.5 line (see the pin comment in
      # Directory.Packages.props): PactNet 5.0.x ships a libpact_ffi regression that breaks
      # message-pact PRODUCER verification (pact-foundation/pact-net#530). Comments don't
      # constrain Dependabot, so block the 4.x→5.x major here until #530 is resolved and the
      # engine-side producer verification is re-validated against 5.x. Minor/patch bumps within
      # the 4.x line still flow. (Was PR #465, which broke the notify-emit Pact CDC harness.)
      - dependency-name: "PactNet"
        update-types: ["version-update:semver-major"]

  # Go — the pack-validate validator module (ADR-PC-006).
  - package-ecosystem: gomod
    directory: /pack-validate
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pack-validate-gomod:
        patterns: ["*"]

  # The workflows' own pinned GitHub Actions — supply-chain hygiene for the CI itself.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Docker base images — the FROM tags in every service Dockerfile (ADR-IC-013). This is the
  # automated lever that delivers base-image security rebumps over time: the image-build.yml
  # grype scan (ADR-IC-014 §S2) reports base-OS package CVEs, but most clear only when the base
  # tag advances (a newer mcr .NET chiseled build, a newer python:3.14-slim) — and without this
  # ecosystem the floating tags never get proposed for a bump. Dependabot's docker updater PRs a
  # newer version tag when one publishes; pinning a base by digest (not done here) would also
  # catch same-tag rebuilds. Covers the six per-service Dockerfiles, including the acl/notification
  # stubs so their bases stay current before their source lands.
  - package-ecosystem: docker
    directories:
      - /engine
      - /orchestrator
      - /acl
      - /notification
      - /mcp-server
      - /pack-validate
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns: ["*"]

  # Python (mcp-server) lands when it gains a pyproject/requirements file — a visible,
  # intended Planned hole until then (ADR-IC-014):
  # - package-ecosystem: pip
  #   directory: /mcp-server
  #   schedule:
  #     interval: weekly
