# dpz_pt_12m_juros_mensal — 12-month PT term deposit, periodic MONTHLY coupons.
#
# F.7 variant. Exercises the PERIODIC interest shape (02 §2.1) at the monthly
# cadence (payment_period_months: 1 — the schema permits only 1 | 3 in v1).
# Interest is paid out each month rather than capitalised; withholding is applied
# flow-by-flow to each coupon as it accrues (02 §2.2; financial_concepts §5.3,
# §5.4 — net return computed per-flow, never by scaling the rate). The engine
# folds the cadence from DepositConstituted.PaymentPeriodMonths and emits one
# InterestPaid leg per coupon (families/term-deposit InterestVariant=PERIODIC).
#
# The numeric TAN is NEVER inline: a single flat rate-sheet reference resolves at
# constitution to a concrete tan_basis_points + rate_sheet_version_id and is
# stamped on DepositConstituted (surface §2.3; ADR-PC-008). TANB/TANL/TAE are
# engine-computed derived figures, not pack fields.
#
# Validate (depths 1–4) against the pinned pack with:
#   make validate-variant VARIANT=product-configs/dpz_pt_12m_juros_mensal.yaml
variant_id: dpz_pt_12m_juros_mensal
schema: term_deposit@2026.1
pack: pt.2026.1

# 12 months, Act/360 (02 §2.2: PT retail deposits; depth-4 rejects any other
# day-count for a `pt` pack). `pt.act_360` is a pack-bound primitive resolved
# against the pinned pack's day-count map.
term_days: 365
day_count: pt.act_360
currency: EUR

# Interest credited monthly — the periodic cadence (02 §2.1). v1 permits only
# monthly (1) or quarterly (3); a wider cadence is a fine-drift extension.
interest_variant: PERIODIC
payment_period_months: 1

# Flat rate: one rate-sheet reference, no inline number (surface §2.3). `live`
# is the active sheet binding; `deposit_origin` is the standard pricing role.
rate:
  flat:
    rate_ref: { sheet: live, role_selector: deposit_origin }

# Early termination forfeits accrued (not-yet-paid) interest, principal
# untouched — the conventional PT flat policy (02 §2.5). A flat policy is a
# degenerate one-band schedule with the open (null) tail covering the term.
early_termination:
  flat:
    up_to_days: null
    penalty_basis_points: 10000   # 100% of accrued interest
    basis: ACCRUED_INTEREST

# Single fixed term, no roll-over.
auto_renewal_policy: NONE

# Risk corridor: €1,000 minimum; the canonical instance (€25,000) sits inside it.
principal_bounds:
  min_cents: 100000
