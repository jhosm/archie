# dpz_pt_18m_resgate_escalonado — 18-month PT term deposit, BANDED early-termination.
#
# F.7 variant. Exercises the banded early-termination schedule (02 §2.5): a
# graduated penalty that softens as the deposit ages, instead of the all-or-
# nothing flat forfeit. The engine evaluates the bands first-match against
# elapsed term (families/term-deposit EarlyTerminationPolicy). The schedule must
# satisfy the depth-4 regulatory invariants the validator enforces (pack-validate
# depth4Regulatory): up_to_days strictly ascending, exactly one open (null) tail,
# and that tail last.
#
# Interest is paid once at maturity (the AT_MATURITY shape, 02 §2.1) — the banded
# schedule is orthogonal to the interest cadence. Flat rate by reference only;
# the numeric TAN resolves at constitution (surface §2.3; ADR-PC-008). No inline
# rate; no derived TANB/TANL/TAE.
#
# Validate (depths 1–4) against the pinned pack with:
#   make validate-variant VARIANT=product-configs/dpz_pt_18m_resgate_escalonado.yaml
variant_id: dpz_pt_18m_resgate_escalonado
schema: term_deposit@2026.1
pack: pt.2026.1

# 18 months, Act/360 (02 §2.2). `pt.act_360` is the only day-count depth-4
# permits for a `pt` term deposit.
term_days: 545
day_count: pt.act_360
currency: EUR

# Interest credited once, at maturity — no intra-term cadence (02 §2.1).
interest_variant: AT_MATURITY

# Flat rate: one rate-sheet reference, no inline number (surface §2.3).
rate:
  flat:
    rate_ref: { sheet: live, role_selector: deposit_origin }

# Banded early-termination (02 §2.5): a graduated forfeit of ACCRUED_INTEREST
# that decreases as the deposit matures. First-match on elapsed days; bands
# ascend by up_to_days; the open (null) tail is last (depth-4 invariants).
#   ≤ 90d   : lose 100% of accrued interest
#   ≤ 180d  : lose 75%
#   ≤ 365d  : lose 50%
#   > 365d  : lose 25% (open tail to maturity)
# Principal is always untouched — penalty basis is accrued interest only.
early_termination:
  banded:
    - { up_to_days: 90,   penalty_basis_points: 10000, basis: ACCRUED_INTEREST }
    - { up_to_days: 180,  penalty_basis_points: 7500,  basis: ACCRUED_INTEREST }
    - { up_to_days: 365,  penalty_basis_points: 5000,  basis: ACCRUED_INTEREST }
    - { up_to_days: null, penalty_basis_points: 2500,  basis: ACCRUED_INTEREST }
  # The depositor's net at termination never falls below principal (the floor
  # covers no interest, so 0 — principal is conserved independently).
  floor_cents: 0

# Single fixed term, no roll-over.
auto_renewal_policy: NONE

# Risk corridor: €1,000 minimum, €500,000 maximum; the canonical instance
# (€40,000) sits inside it.
principal_bounds:
  min_cents: 100000
  max_cents: 50000000
