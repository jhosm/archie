# Local dev stack — the minimum to run the engine's walking skeleton on a laptop.
# Scope: backing infrastructure only (P.1 / archie-lcvb). No application images —
# the service subtrees (engine/, mcp-server/, …) are still skeletons.
#
#   PostgreSQL                — event store              (ADR-PC-001)
#   Redpanda                  — Kafka-compatible bus     (ADR-IC-001)
#     └─ built-in Schema Registry (Confluent SR API)     (ADR-IC-002)
#   Redpanda Console          — web UI for topics + SR   (dev convenience)
#
# Front door is the repo-root Makefile: `make up`, `make verify`, `make reset`.
# All credentials below are LOCAL-DEV ONLY — not secrets. Override via env if needed.

name: babelstone-dev

services:
  postgres:
    # Latest stable PostgreSQL major (PG 18, September 2025), the ADR-PC-001 event store.
    image: postgres:18-alpine
    container_name: babelstone-postgres
    # The POSTGRES_* env vars ARE the bootstrap: the official image creates this
    # database + login role on first start (idempotent). Engine event/outbox TABLES
    # are owned by Epic A.1 migrations, not by this stack — we hand over an empty,
    # ready database. Drop *.sql / *.sh into ./postgres/initdb.d for future seed.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babelstone}
      POSTGRES_USER: ${POSTGRES_USER:-babelstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babelstone}
      # PG 18+ moved the default data dir under /var/lib/postgresql; the entrypoint
      # refuses to init when the volume is mounted at the bare .../data path ("unused
      # mount/volume"). Nest PGDATA in a subdirectory of the mount so PG 18 initialises
      # cleanly on a fresh volume (docker-library/postgres#1259).
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-babelstone} -d ${POSTGRES_DB:-babelstone}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    container_name: babelstone-redpanda
    command:
      - redpanda
      - start
      - --mode dev-container          # single-node dev defaults; auto-creates topics
      - --smp 1
      - --default-log-level=info
      # Two listeners: `internal` for containers on this network (advertise as
      # `redpanda`), `external` for tools on the host (advertise as `localhost`).
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "${REDPANDA_KAFKA_PORT:-19092}:19092"   # Kafka API (from host)
      - "${REDPANDA_SR_PORT:-18081}:18081"      # Schema Registry (from host)
      - "9644:9644"                             # Admin API (rpk / health)
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.0
    container_name: babelstone-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "${CONSOLE_PORT:-8080}:8080"
    environment:
      # Reach Redpanda over the internal listener on the compose network.
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081

  kong:
    image: kong:3.9.1
    container_name: babelstone-kong
    # Kong Gateway CE in DB-less declarative mode (ADR-IC-006): no gateway database,
    # no Admin API to protect at runtime, no migrations. Config is kong/kong.yml.
    depends_on:
      # Don't let the gateway start serving before its only live upstream's TLS listener is ready,
      # so a /mcp request right after `make up` can't race the upstream and 502 (bd babelstone-5ot0
      # review). In the dev stack mcp-server is the sole real Kong upstream — orchestrator/engine are
      # not yet compose services — so gating Kong on it is the operationally-correct dev-stack guard
      # (the bd babelstone-5ot0 runtime harness gates Kong on mcp-server the same way).
      mcp-server:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      # Keep the Lua sandbox ON (security) but allowlist the two stdlib/ngx modules the
      # kong.yml pre-functions require — cjson.safe (SCA + body decode) and resty.http (SoR
      # resolution). kong:3.9.1 defaults untrusted_lua=sandbox with an EMPTY requires-allowlist,
      # which BLOCKS both require()s, so without this every constitute / SoR / SCA request 500s
      # (bd babelstone-39jl). The static kong-config-check can't catch it (it loads no Lua
      # module); the bd babelstone-abig / babelstone-1z0r runtime contract harness is the guard.
      KONG_UNTRUSTED_LUA: "sandbox"
      KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES: "cjson.safe,resty.http"
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"   # edge proxy — external surfaces route through here
      - "${KONG_ADMIN_PORT:-8001}:8001"   # admin API (local dev only; not exposed in prod)
    volumes:
      - ./kong:/kong:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: from the committed throwaway POC CA (infra/kong/mcp-poc-ca.{crt,key}) generate the
  # mcp-server's TLS server cert (CN=mcp-server) and copy the CA cert into the shared volume. The
  # mcp-server presents that server cert and verifies Kong's client cert against the CA — the
  # upstream half of the Kong→MCP mutual TLS (ADR-IC-006 §P5 Boundary 2 / ADR-IC-010 §P5, 29ic).
  # ⚠️  POC material: at deploy time replace with the internal-CA-signed cert (a mounted secret).
  mcp-certgen:
    image: alpine/openssl:3.3.2
    volumes:
      - mcp-certs:/certs
      - ./kong/mcp-poc-ca.crt:/poc-ca/ca.crt:ro
      - ./kong/mcp-poc-ca.key:/poc-ca/ca.key:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cp /poc-ca/ca.crt /certs/ca.crt
        if [ ! -f /certs/mcp-server.key ]; then
          openssl req -newkey rsa:2048 -nodes \
            -keyout /certs/mcp-server.key -out /certs/mcp-server.csr \
            -subj "/CN=mcp-server"
          openssl x509 -req -in /certs/mcp-server.csr \
            -CA /poc-ca/ca.crt -CAkey /poc-ca/ca.key -CAcreateserial \
            -out /certs/mcp-server.crt -days 7 \
            -extfile /dev/stdin <<EOF
        subjectAltName=DNS:mcp-server,DNS:localhost
        EOF
        fi
        chmod 644 /certs/*.crt /certs/*.key
        echo "mcp-certgen: mcp-server TLS cert (signed by the committed POC CA) ready"

  mcp-server:
    # The MCP agent channel (ADR-IC-010 — Epic J / bd babelstone-e50n). The Python MCP
    # server (FastMCP, Streamable HTTP) exposing the four term-deposit tools, fronted by
    # Kong with OAuth (the mcp-server / mcp-well-known routes in kong/kong.yml). Built from
    # the mcp-server/ subtree's Dockerfile. NO host port: agents reach it ONLY through Kong's
    # edge proxy (8000) — never directly — so the audience check + scope enforcement always
    # apply. On the default Compose network its hostname is `mcp-server`, matching the
    # https://mcp-server:8080 upstream Kong dials.
    build:
      context: ../mcp-server
    container_name: babelstone-mcp-server
    depends_on:
      mcp-certgen:
        condition: service_completed_successfully
    volumes:
      # The generated TLS material (server cert/key + the trusted CA), read-only.
      - mcp-certs:/certs:ro
    environment:
      # The engine command/query boundary the tools call (forward reference — the engine
      # service lands with its subtree; hostname `engine` on this network, like kong's upstreams).
      BABELSTONE_ENGINE_URL: http://engine:8080
      # This server's canonical URI — tokens MUST carry it as `aud` (RFC 8707 / ADR-IC-010 §P3).
      # Kept in sync with the MCP_SERVER_URI literal in the kong/kong.yml /mcp aud pre-function.
      BABELSTONE_MCP_SERVER_URI: http://localhost:8000/mcp
      # The IAM authorization server advertised in the RFC 9728 metadata (ADR-IC-010 §P2),
      # matching the iam-issuer consumer key (`iss`) registered in kong/kong.yml.
      BABELSTONE_IAM_URL: https://iam.babelstone.example/
      # Bind all interfaces on :8080 so Kong reaches the upstream (the default is 0.0.0.0:8080,
      # set explicitly for clarity — matches the https://mcp-server:8080 Kong upstream).
      MCP_BIND_HOST: 0.0.0.0
      MCP_BIND_PORT: "8080"
      # ── Upstream mutual TLS (ADR-IC-006 §P5 / ADR-IC-010 §P5, bd babelstone-29ic) ──────
      # Kong dials https://mcp-server:8080 with tls_verify:true and presents a client cert.
      # uvicorn serves TLS (server cert) and REQUIRES a client cert (MCP_TLS_CERT_REQS=2 →
      # ssl.CERT_REQUIRED), verifying it against the CA — so a Kong-bypassing actor with no
      # client cert is rejected at the handshake. Without these vars uvicorn would serve plain
      # HTTP and Kong's TLS dial would 502 (the bug bd babelstone-5ot0's harness catches).
      MCP_TLS_CERTFILE: /certs/mcp-server.crt
      MCP_TLS_KEYFILE: /certs/mcp-server.key
      MCP_TLS_CA_CERTS: /certs/ca.crt
      MCP_TLS_CERT_REQS: "2"
    healthcheck:
      # `make up --wait` must not report ready until uvicorn's TLS listener is actually serving:
      # Kong is gated on this (below), and a /mcp request right after `make up` would otherwise hit
      # the gateway before the upstream is up and 502 (bd babelstone-5ot0 review). A plain probe
      # won't do — uvicorn now REQUIRES a client cert (CERT_REQUIRED) — so the probe presents the
      # mcp-server cert as the client cert (signed by the same POC CA, so CERT_REQUIRED accepts it)
      # and verifies the server cert against that CA. The public well-known path is unauthenticated
      # at the app layer, so a 200 means TLS is up. (check_hostname off: the cert CN is mcp-server.)
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import ssl, urllib.request
          ctx = ssl.create_default_context(cafile="/certs/ca.crt")
          ctx.check_hostname = False
          ctx.load_cert_chain("/certs/mcp-server.crt", "/certs/mcp-server.key")
          urllib.request.urlopen("https://localhost:8080/.well-known/oauth-protected-resource", context=ctx, timeout=2)
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  core-acl-stub:
    image: wiremock/wiremock:3.9.1
    container_name: babelstone-core-acl-stub
    # The v1 Core-ACL SETTLEMENT stub (ADR-PC-016 / ADR-PC-029 slot 2; bd babelstone-t7o3.4). The
    # constitution saga's gated money legs — ReserveAccountBalance → ConfirmDebit (and the
    # ReleaseBalanceReservation / ReverseCoreDebit compensations) — are delivered HERE by the saga
    # command dispatcher (bd babelstone-t7o3.3) over idempotent HTTP, now that the engine's constitution
    # append is DE-SETTLED (no eager in-engine debit). This replaces the eager LoggingSettlementPort on
    # the constitution path with a real, refusable HTTP target. The REAL ACL is DEF-1 (bd babelstone-ub9s);
    # this stub stands in until then. Point the dispatcher at it with Settlement:BaseUrl (the orchestrator
    # Program.cs default is http://localhost:8089 from the host; on this network it is http://core-acl-stub:8080).
    # Static mappings (./wiremock/mappings) carry a success path per endpoint AND an InsufficientBalance
    # refusal (a request body containing "insufficient" → 422) so the saga's fail-closed compensation is
    # exercisable in the dev stack, mirroring the in-process WireMock.Net integration test.
    command: ["--verbose", "--disable-banner"]
    ports:
      - "${CORE_ACL_STUB_PORT:-8089}:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao:
    image: openbao/openbao:2.5.4
    container_name: babelstone-openbao
    # DEV MODE ONLY — in-memory, auto-unsealed, fixed root token. This is the local
    # crypto boundary (ADR-PC-004: per-subject transit keys for crypto-shredding).
    # The transit engine + per-subject keys are enabled by the engine (Epic A.5),
    # not here. Production needs real storage + unseal + HA/DR (ADR-PC-005) — that
    # is P.6/P.7, never this dev stack.
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_TOKEN:-root}
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "${OPENBAO_PORT:-8200}:8200"   # API + UI (http://localhost:8200/ui)
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  grafana-lgtm:
    image: grafana/otel-lgtm:0.28.0
    container_name: babelstone-grafana-lgtm
    # All-in-one Grafana LGTM appliance — Grafana UI + Tempo (traces) + Loki (logs)
    # + Prometheus (metrics), datasources and cross-signal correlation pre-wired
    # (ADR-IC-007). It receives OTLP forwarded by the collector below; its own
    # OTLP ingest is NOT exposed to the host — the collector is the single entry.
    ports:
      - "${GRAFANA_PORT:-3000}:3000"   # Grafana UI
      - "${TEMPO_PORT:-3200}:3200"     # Tempo query API (GET /api/traces/{id}) — Mission Control
                                       # Telemetry tab reads real spans by trace id (bd babelstone-f0ic.9)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: babelstone-otel-collector
    # The mandatory pipeline boundary (ADR-IC-007 §P1). Services export OTLP here;
    # config is otel/collector.yaml (the owned single export-config point).
    command: ["--config=/etc/otel/collector.yaml"]
    depends_on:
      grafana-lgtm:
        condition: service_healthy
    volumes:
      - ./otel:/etc/otel:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"          # OTLP/gRPC — services export here
      - "${OTLP_HTTP_PORT:-4318}:4318"          # OTLP/HTTP — services export here
      - "${COLLECTOR_HEALTH_PORT:-13133}:13133" # health_check extension

  registry:
    image: registry:3.1.1
    container_name: babelstone-registry
    # Local OCI registry for regulatory-pack distribution (ADR-PC-007): packs are
    # oras-pushed as OCI artefacts and pulled by digest, cosign-signed. The pack
    # CONTENT + signing pipeline land with Epic C.4/C.5; this is just the host.
    # Host port 5001 (5000 collides with macOS AirPlay Receiver).
    ports:
      - "${REGISTRY_PORT:-5001}:5000"
    volumes:
      - registrydata:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Backstage catalogue portal host (ADR-IC-015) — supersedes the retired EventCatalog
  # nginx placeholder (ADR-IC-008, retired after its AsyncAPI generator plugin moved to
  # AGPL-3.0/commercial). Backstage (Apache-2.0, CNCF-graduated) RENDERS the governed
  # AsyncAPI catalogue; it restates no schema — its only catalogue source is the registered
  # contracts/catalog/catalog-info.yaml descriptor (the no-drift invariant, ADR-IC-015 Decision §1–§2).
  #
  # HUMAN-HANDOFF TAIL: Backstage ships no turnkey image — an app must be scaffolded
  # (`npx @backstage/create-app`), the AsyncAPI catalog provider plugins added, and an image
  # built + pushed; then point `image:` below at it. Until that image exists this service will
  # not become healthy — intentional; the estate stays Git-native (AsyncAPI files + CI gate,
  # ADR-IC-015 §9) until the host is genuinely stood up. The whole contracts/catalog/ tree is
  # mounted at /catalog so catalog-info.yaml's relative $text AsyncAPI refs resolve.
  backstage-db:
    image: postgres:16-alpine
    container_name: babelstone-backstage-db
    environment:
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage   # dev-only placeholder; a real deploy uses a secret
      POSTGRES_DB: backstage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backstage"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  backstage:
    # PLACEHOLDER — replace with the pushed babelstone Backstage app image (see the handoff
    # note above). There is no turnkey upstream image to pin here.
    image: ghcr.io/jhosm/babelstone-backstage:placeholder
    container_name: babelstone-backstage
    depends_on:
      backstage-db:
        condition: service_healthy
    environment:
      BACKSTAGE_BASE_URL: "http://localhost:${BACKSTAGE_PORT:-7007}"
      BACKSTAGE_PG_HOST: backstage-db
      BACKSTAGE_PG_PORT: "5432"
      BACKSTAGE_PG_USER: backstage
      BACKSTAGE_PG_PASSWORD: backstage
    ports:
      - "${BACKSTAGE_PORT:-7007}:7007"
    volumes:
      # The app-config and the catalogue descriptor tree (read-only). The descriptor tree is
      # the ONLY catalogue source — no schema is restated in Backstage config (no-drift).
      - ./backstage/app-config.yaml:/app/app-config.production.yaml:ro
      - ../contracts/catalog:/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7007/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  rpdata:
  registrydata:
  # Ephemeral mTLS material for the MCP agent channel — populated at-up by mcp-certgen from the
  # committed POC CA (ADR-IC-006 §P5 / ADR-IC-010 §P5). Not a secret; regenerated on `make reset`.
  mcp-certs:
