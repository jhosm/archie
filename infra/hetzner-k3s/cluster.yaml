---
# hetzner-k3s cluster config — the always-on staging / demo box (Phase 1).
#
# One CAX41 ARM node running single-node k3s in Hetzner Helsinki (hel1), on babelstone.dev.
# Consumed via ./provision.sh (the fail-closed preflight + render wrapper — bd
# babelstone-zla1.12.6), which substitutes the SSH allow-list sentinel below and runs
# `hetzner-k3s create --config cluster.rendered.yaml` to CREATE the cluster that the
# Kustomize overlay (infra/k8s/overlays/staging) then deploys INTO. Targets hetzner-k3s v2.6.0+.
# See ./README.md for the provision walk-through.
#
# THE HETZNER API TOKEN IS NOT IN THIS FILE — ON PURPOSE.
# hetzner-k3s reads it from the HCLOUD_TOKEN environment variable, which takes precedence over
# any in-file `hetzner_token:` key. That is the upstream-documented way to keep the config
# safely committable to a repo. Export it locally before provisioning, never commit it:
#     export HCLOUD_TOKEN=<your read/write Hetzner Cloud API token>
# Same secret-by-reference discipline as the rest of the estate: the committed file is the seam;
# the credential arrives at runtime.

config_format_version: 1            # required by hetzner-k3s v2.6.0+

cluster_name: babelstone-staging    # prefixes every Hetzner resource name; lowercase + hyphen only
kubeconfig_path: "./kubeconfig"     # cluster-admin credential — GITIGNORED, never commit; OPERATOR-ONLY
                                    # (cd.yml's KUBECONFIG_B64 is the scoped cd-deployer SA kubeconfig
                                    # minted by scripts/cd-kubeconfig.sh, never this file — zla1.12.1)

# VERIFY before `create`: run `hetzner-k3s releases` and pin a currently-supported k3s release
# (the latest patch of the minor you want). A hard-coded version goes stale.
k3s_version: v1.35.6+k3s1

networking:
  ssh:
    port: 22
    use_agent: false
    use_private_ip: false
    public_key_path: "~/.ssh/babelstone-staging.pub"
    private_key_path: "~/.ssh/babelstone-staging"
  allowed_networks:
    # hetzner-k3s synthesises the Hetzner Cloud Firewall from these CIDR lists.
    # NOTE: only ssh + api can be expressed here — there is NO knob for the public web
    # ports. Inbound TCP 80/443 (the Traefik edge) is provisioned OUT-OF-BAND by
    # ./firewall-web.sh (Cloudflare-scoped; bd babelstone-zla1.14), not from this file.
    ssh:
      # LOAD-BEARING SENTINEL — do NOT hand-edit (bd babelstone-zla1.12.6). Provision via
      # ./provision.sh, which substitutes this line with the validated $SSH_ALLOWED_CIDR
      # (a REQUIRED env var, explicit /32s only) into the gitignored cluster.rendered.yaml
      # and REFUSES to create when the value is unset, still REPLACE_ME, 0.0.0.0/0, or not
      # a /32. Running `hetzner-k3s create` directly against THIS file fails on purpose:
      # the sentinel is not a valid CIDR, and the fix is provision.sh — never 0.0.0.0/0.
      - REPLACE_ME/32
    api:
      # k8s API(6443) open to the world: the GitHub-hosted cd.yml runner has no stable egress IP,
      # so a network allow-list can't admit it. Auth is the cluster's mutual-TLS client cert (the
      # kubeconfig), not the firewall. Deliberate staging trade-off — tighten for a real tier.
      # (Recorded ADR-PC-020 §D3 drift; Document 10 posture — everything outside the
      # gateway is untrusted, so a world-open 6443 is a documented exception, not a norm.)
      - 0.0.0.0/0
      # ── CHEAP PARTIAL MITIGATION — documented option (bd babelstone-zla1.12.8 (b)) ──
      # Replace the 0.0.0.0/0 above with (1) your operator /32 and (2) the GitHub Actions
      # egress ranges, so the GitHub-hosted cd.yml runner still reaches 6443:
      #     curl -s https://api.github.com/meta | jq -r '.actions[]'
      # Know what you are buying before flipping it:
      #   • the list is LARGE (thousands of CIDRs — verify it fits Hetzner Cloud Firewall
      #     rule limits before committing to this path; aggregate if needed);
      #   • it ROTATES — a stale list silently breaks cd.yml deploys, so re-render it at
      #     every provision;
      #   • it admits ANY GitHub Actions tenant, not just this repo's workflows — this is
      #     defence in depth on TOP of the kubeconfig's mutual-TLS client cert, never a
      #     substitute for it.
      # The full fix stays a self-hosted runner / WireGuard-tailscale tunnel / bastion
      # (see README "Posture notes"). Example shape (values ILLUSTRATIVE — render the
      # real .actions[] list at provision time):
      #   - <your-operator-ip>/32
      #   - 4.148.0.0/16          # ← one of the many api.github.com/meta .actions[] ranges
  public_network:
    ipv4: true
    ipv6: true
  private_network:
    enabled: true
    subnet: 10.0.0.0/16

datastore:
  # k3s control-plane store: embedded etcd. On a single node it is a single-member (NON-HA) control
  # plane — a property of the 1-node box, NOT the event store. (The ADR-PC-005-relevant degradation
  # is the box-level one: a single-replica Postgres event store with no warm standby, versus the HA
  # overlays/ha topology — recorded in the PR body as an ADR-PC-020 §D3 explicit-drift.)
  mode: etcd

# Single node has no workers, so the one master MUST run workloads — without this, k3s taints the
# master NoSchedule and nothing can be placed. Defaults false, so it is easy to omit and get a
# running-but-unschedulable cluster.
schedule_workloads_on_masters: true

masters_pool:
  instance_type: cpx42    # x86 AMD (8 vCPU / 16 GB) — CAX41 ARM was out of stock in all 3 CAX
                          # locations at provision (2026-07-07); images are multi-arch so x86 runs fine
  instance_count: 1
  locations:
    - hel1                 # Helsinki (FI) — CPX x86 had stock here when ARM did not (2026-07-07)

# No worker_node_pools and no autoscaling on a single-node cluster.

addons:
  # The Hetzner CSI driver (default-on) is load-bearing: the staging overlay pins
  # storageClassName: hcloud-volumes on its stateful claims, which only binds once this is up.
  # (The Hetzner Cloud Controller Manager is always installed by hetzner-k3s regardless.)
  csi_driver:
    enabled: true
  cluster_autoscaler:
    enabled: false         # no autoscaled pools on a single node (defaults true)

# ── Control-plane & secrets-at-rest hardening (bd babelstone-zla1.12.9; CIS) ─────────────────
# Both settings below take effect at the NEXT `hetzner-k3s create` (they do not retro-fit the
# running box — k3s is only installed at provision time). Nothing here carries a secret: the
# audit policy is public config, and k3s generates + manages the encryption key itself.
#
# (1) kube-apiserver AUDIT LOGGING (CIS apiserver section): a tamper-evident record of who did
#     what through the admin API — without it, a compromise via the admin cert is invisible.
#     The policy file is written onto the node by the pre-k3s command below BEFORE k3s starts,
#     so the apiserver arg never points at a missing file. The log lands ON THE NODE at
#     /var/lib/rancher/k3s/server/logs/audit.log — shipping it OFF-BOX to the LGTM/Loki plane
#     is the maintainer's follow-up (an on-box log dies with the box; see README
#     "Control-plane hardening").
kube_api_server_args:
  - audit-log-path=/var/lib/rancher/k3s/server/logs/audit.log
  - audit-policy-file=/etc/rancher/k3s/audit-policy.yaml
  - audit-log-maxage=30      # days of rotated files to retain on-box
  - audit-log-maxbackup=10   # rotated files to retain
  - audit-log-maxsize=100    # MB per file before rotation

additional_pre_k3s_commands:
  # The audit POLICY: Metadata as the floor for everything, Request-level bodies for
  # mutations (who changed WHAT), and — deliberately — NEVER request/response bodies for
  # secret-bearing resources (a Request-level rule on secrets would copy secret material
  # into the audit log; the secrets rule is FIRST so the mutation rule can't capture it).
  # High-volume read noise (node/kube-proxy reads, health probes, leases, events) is
  # dropped so 30 days fits on-box.
  - mkdir -p /etc/rancher/k3s /var/lib/rancher/k3s/server/logs
  - |
    cat > /etc/rancher/k3s/audit-policy.yaml <<'AUDIT_POLICY'
    apiVersion: audit.k8s.io/v1
    kind: Policy
    omitStages:
      - RequestReceived
    rules:
      # Secret-bearing resources: METADATA ONLY — never log their bodies.
      - level: Metadata
        resources:
          - group: ""
            resources: ["secrets", "configmaps"]
          - group: "authentication.k8s.io"
            resources: ["tokenreviews"]
      # High-volume, low-signal noise: drop entirely.
      - level: None
        users: ["system:kube-proxy"]
        verbs: ["watch"]
      - level: None
        userGroups: ["system:nodes"]
        verbs: ["get", "list", "watch"]
      - level: None
        nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version", "/metrics"]
      - level: None
        resources:
          - group: "coordination.k8s.io"
            resources: ["leases"]
          - group: ""
            resources: ["events"]
      # Every mutation: Request level (verb + object + request body).
      - level: Request
        verbs: ["create", "update", "patch", "delete", "deletecollection"]
      # Everything else (reads): Metadata.
      - level: Metadata
    AUDIT_POLICY
  # (2) etcd SECRETS-AT-REST ENCRYPTION (CIS secrets section): k3s defaults to storing
  #     Secrets base64-only in etcd, so anyone with disk/snapshot access (Hetzner rescue
  #     boot, a stolen image, a CSI snapshot) reads the Hetzner token, kubeconfigs, the
  #     OpenBao token and backup keys in clear. `secrets-encryption: true` makes k3s
  #     generate an AES key and AES-CBC-encrypt Secrets at rest. Written as a k3s config
  #     DROP-IN (config.yaml.d) rather than /etc/rancher/k3s/config.yaml so nothing
  #     hetzner-k3s itself renders is clobbered. Verify after provision:
  #     `k3s secrets-encrypt status`; rotate periodically: `k3s secrets-encrypt rotate-keys`
  #     (see README "Control-plane hardening").
  - |
    mkdir -p /etc/rancher/k3s/config.yaml.d
    cat > /etc/rancher/k3s/config.yaml.d/50-secrets-encryption.yaml <<'K3S_CFG'
    secrets-encryption: true
    K3S_CFG

protect_against_deletion: true   # guards against an accidental `hetzner-k3s delete`
