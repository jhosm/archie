# Backstage app-config for the babelstone catalogue portal (ADR-IC-015).
#
# Backstage is the chosen catalogue portal (Apache-2.0, CNCF-graduated) that renders the
# governed AsyncAPI integration-event catalogue. ADR-IC-015 supersedes ADR-IC-008
# (EventCatalog, retired after its AsyncAPI generator plugin moved to AGPL-3.0/commercial).
#
# THE NO-DRIFT INVARIANT (ADR-IC-015 Decision §1–§2): this config restates NO schema. The only
# catalogue content is the single registered Location below — contracts/catalog/catalog-info.yaml,
# the descriptor that points at the AsyncAPI source files. Backstage is *only* the rendering
# layer; the AsyncAPI files + the CI gate remain the governance source of truth. Adding an event
# means adding its .asyncapi.yaml + a catalog-info.yaml entry, never editing Backstage config.
#
# HUMAN-HANDOFF TAIL (this file is the config; a running portal needs more — see infra/README.md
# and infra/k8s/README.md): Backstage ships no turnkey image — an app must be scaffolded
# (`npx @backstage/create-app`) and built into an image, with @backstage/plugin-catalog-backend-module-*
# providers for AsyncAPI rendering. The Deployment/Service manifests + this config are the
# infrastructure half; building+pushing that image and pointing the manifest at it is platform work.
#
# RECONCILIATION-WIDGET HANDOFF (bd babelstone-ax0b.6 — read with the deploy issue babelstone-1taq).
# In plain English: the catalogue already carries three `spec.type: reconciliation` API entities
# (reconciliation-engine-projection-runtime, reconciliation-acl, reconciliation-notification in
# contracts/catalog/catalog-info.yaml). But @backstage/plugin-api-docs only NATIVELY renders
# `openapi` / `asyncapi` / `graphql` (its `defaultDefinitionWidgets()` set), so a reconciliation
# entity's API-definition tab shows the YAML as UNSTYLED PLAIN TEXT. The fix is a custom api-docs
# widget — but widget registration is a *frontend* concern (`apiDocsConfigRef`, a utility-API ref),
# NOT an app-config schema key: there is no `apiDocs:` block Backstage reads here. So the wiring is
# recorded as a handoff the scaffolded app's image must carry, exactly like the catalog-provider
# plugins above. No catalogue source-of-truth file changes (the ADR-IC-015 §1–§2 no-drift invariant
# holds; the reconciliation contracts stay as authored).
#
# The sensibly-chosen widget: render the reconciliation contract as syntax-highlighted YAML (via the
# plugin's own PlainApiDefinitionWidget with `language: 'yaml'`) instead of raw text. When the app is
# scaffolded (babelstone-1taq), add this factory to `packages/app/src/apis.tsx` — copy verbatim:
#
#   import { ApiEntity } from '@backstage/catalog-model';
#   import {
#     ApiDefinitionWidget,
#     apiDocsConfigRef,
#     defaultDefinitionWidgets,
#     PlainApiDefinitionWidget,
#   } from '@backstage/plugin-api-docs';
#
#   export const apis: AnyApiFactory[] = [
#     // ...existing factories...
#     createApiFactory({
#       api: apiDocsConfigRef,
#       deps: {},
#       factory: () => {
#         const definitionWidgets = defaultDefinitionWidgets();
#         return {
#           getApiDefinitionWidget: (apiEntity: ApiEntity) => {
#             // babelstone: spec.type: reconciliation -> syntax-highlighted YAML, not plain text.
#             if (apiEntity.spec.type === 'reconciliation') {
#               return {
#                 type: 'reconciliation',
#                 title: 'Reconciliation contract',
#                 rawLanguage: 'yaml',
#                 component: definition => (
#                   <PlainApiDefinitionWidget definition={definition} language="yaml" />
#                 ),
#               } as ApiDefinitionWidget;
#             }
#             // every other type (asyncapi / openapi / graphql) keeps its native widget.
#             return definitionWidgets.find(d => d.type === apiEntity.spec.type);
#           },
#         };
#       },
#     }),
#   ];

app:
  title: babelstone catalogue
  baseUrl: ${BACKSTAGE_BASE_URL:-http://localhost:7007}

organization:
  name: babelstone

backend:
  baseUrl: ${BACKSTAGE_BASE_URL:-http://localhost:7007}
  listen:
    port: 7007
    host: 0.0.0.0
  database:
    # SQLite (better-sqlite3), in-memory — NO Postgres (bd babelstone-zla1.6.6; the maintainer's
    # topology call on zla1.6.1, NO ADR governs it). Backstage here is a read-only catalogue
    # portal whose entire state rebuilds from the /catalog descriptor BAKED into the image on
    # every boot (the ADR-IC-015 no-drift invariant — the catalogue is the source of truth, not
    # this DB), so there is nothing to persist: it re-ingests in seconds. This means zero DB
    # memory on the box and zero coupling. It also matches the stock create-app dev default
    # (backstage/app-config.yaml, loaded first by the image CMD), so it is the tested config.
    client: better-sqlite3
    connection: ':memory:'

# Sign-in (ADR-IC-021 — Logto is the estate's single OAuth/OIDC issuer; Backstage is a Boundary-6
# developer/ops surface, gated exactly like Grafana and Mission Control). This block is baked into
# the IMAGE only (never `yarn dev`, which loads just backstage/app-config.yaml and stays guest-only).
#
#   * environment — `production` on the deployed box (set via BACKSTAGE_AUTH_ENVIRONMENT in
#     infra/k8s/overlays/staging/backstage-oidc.patch.yaml); defaults to `development` so a bare
#     `docker run` of the image (no OIDC env) falls back to the guest provider defined in the base
#     app-config. Only the sub-block matching the active environment is initialised, so the
#     `oidc.production` config below is dormant (never validated) under `development`.
#   * oidc — the generic OIDC provider pointed at Logto's discovery document. clientSecret has NO
#     default: on a `production` deploy a missing secret fails the pod CLOSED (correct posture) —
#     it must be seeded first (runbook infra/runbooks/backstage-oidc-registration.md). Sign-in
#     itself is resolved GATE-ONLY by packages/backend/src/oidcGateProvider.ts (no `signIn.resolvers`
#     here): a successful Logto login mints a Backstage token from the OIDC `sub` with NO catalog
#     User entity — so no personal identity data enters Backstage and the deferred GDPR item
#     (bd babelstone-zla1.6.8 / ADR-IC-015 Residual Risk) stays deferred.
auth:
  environment: ${BACKSTAGE_AUTH_ENVIRONMENT:-development}
  # The generic OIDC (openid-client) provider stores the auth-code flow's state/nonce in an
  # express-session, so it needs a signing secret — Backstage's OWN cookie key, not a Logto value
  # (generate `openssl rand -base64 32`; seed as BACKSTAGE_AUTH_SESSION_SECRET). Unset in local dev
  # (guest needs no session); required on the deployed box, where the OIDC gate is registered.
  session:
    secret: ${BACKSTAGE_AUTH_SESSION_SECRET}
  providers:
    # guest stays defined in the base backstage/app-config.yaml — local-dev only (Backstage
    # blocks it in production), so it never competes with the OIDC gate on the deployed box.
    oidc:
      production:
        metadataUrl: ${BACKSTAGE_OIDC_METADATA_URL:-https://auth.babelstone.dev/oidc/.well-known/openid-configuration}
        clientId: ${BACKSTAGE_OIDC_CLIENT_ID:-mdkl6ahqqjy3gc8o6lpn2}
        clientSecret: ${BACKSTAGE_OIDC_CLIENT_SECRET}
        prompt: auto

# The ONLY catalogue source: the in-repo Backstage descriptor. It is BAKED into the image at
# /catalog/catalog-info.yaml (backstage/Dockerfile). All event + reconciliation + OpenAPI API
# entities, and the definitions they $text-reference, flow from it. No second registration, no
# inline entity, no schema copy — the no-drift invariant.
#
# WHY `type: url` + a `file://` URL (not `type: file` + a bare path): Backstage resolves each
# relative `$text` ref (`./events/…`, `../openapi/…`) by `new URL(value, base)`, where the base is
# this location's target. A bare filesystem path (`/catalog/catalog-info.yaml`) has no URL scheme,
# so `new URL` throws `Invalid URL` and every definition renders blank (bd zla1.6.10). A `file://`
# URL is a valid base, so the refs resolve to `file:///catalog/events/…` and `file:///openapi/…`.
# The stock backend ships no reader for the `file:` scheme, so a read-only one is registered in the
# image (backstage/packages/backend/src/fileUrlReader.ts) — restricted to the baked /catalog +
# /openapi roots. This keeps the schema NEVER inlined (ADR-IC-015 Decision §2) and reads the tree
# from the image (no network, no drift), unlike a GitHub `type: url` target.
catalog:
  rules:
    - allow: [Location, API]
  locations:
    - type: url
      target: file:///catalog/catalog-info.yaml
