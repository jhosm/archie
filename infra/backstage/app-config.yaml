# Backstage app-config for the babelstone catalogue portal (ADR-IC-015).
#
# Backstage is the chosen catalogue portal (Apache-2.0, CNCF-graduated) that renders the
# governed AsyncAPI integration-event catalogue. ADR-IC-015 supersedes ADR-IC-008
# (EventCatalog, retired after its AsyncAPI generator plugin moved to AGPL-3.0/commercial).
#
# THE NO-DRIFT INVARIANT (ADR-IC-015 Decision §1–§2): this config restates NO schema. The only
# catalogue content is the single registered Location below — contracts/catalog/catalog-info.yaml,
# the descriptor that points at the AsyncAPI source files. Backstage is *only* the rendering
# layer; the AsyncAPI files + the CI gate remain the governance source of truth. Adding an event
# means adding its .asyncapi.yaml + a catalog-info.yaml entry, never editing Backstage config.
#
# HUMAN-HANDOFF TAIL (this file is the config; a running portal needs more — see infra/README.md
# and infra/k8s/README.md): Backstage ships no turnkey image — an app must be scaffolded
# (`npx @backstage/create-app`) and built into an image, with @backstage/plugin-catalog-backend-module-*
# providers for AsyncAPI rendering. The Deployment/Service manifests + this config are the
# infrastructure half; building+pushing that image and pointing the manifest at it is platform work.
#
# RECONCILIATION-WIDGET HANDOFF (bd babelstone-ax0b.6 — read with the deploy issue babelstone-1taq).
# In plain English: the catalogue already carries three `spec.type: reconciliation` API entities
# (reconciliation-engine-projection-runtime, reconciliation-acl, reconciliation-notification in
# contracts/catalog/catalog-info.yaml). But @backstage/plugin-api-docs only NATIVELY renders
# `openapi` / `asyncapi` / `graphql` (its `defaultDefinitionWidgets()` set), so a reconciliation
# entity's API-definition tab shows the YAML as UNSTYLED PLAIN TEXT. The fix is a custom api-docs
# widget — but widget registration is a *frontend* concern (`apiDocsConfigRef`, a utility-API ref),
# NOT an app-config schema key: there is no `apiDocs:` block Backstage reads here. So the wiring is
# recorded as a handoff the scaffolded app's image must carry, exactly like the catalog-provider
# plugins above. No catalogue source-of-truth file changes (the ADR-IC-015 §1–§2 no-drift invariant
# holds; the reconciliation contracts stay as authored).
#
# The sensibly-chosen widget: render the reconciliation contract as syntax-highlighted YAML (via the
# plugin's own PlainApiDefinitionWidget with `language: 'yaml'`) instead of raw text. When the app is
# scaffolded (babelstone-1taq), add this factory to `packages/app/src/apis.tsx` — copy verbatim:
#
#   import { ApiEntity } from '@backstage/catalog-model';
#   import {
#     ApiDefinitionWidget,
#     apiDocsConfigRef,
#     defaultDefinitionWidgets,
#     PlainApiDefinitionWidget,
#   } from '@backstage/plugin-api-docs';
#
#   export const apis: AnyApiFactory[] = [
#     // ...existing factories...
#     createApiFactory({
#       api: apiDocsConfigRef,
#       deps: {},
#       factory: () => {
#         const definitionWidgets = defaultDefinitionWidgets();
#         return {
#           getApiDefinitionWidget: (apiEntity: ApiEntity) => {
#             // babelstone: spec.type: reconciliation -> syntax-highlighted YAML, not plain text.
#             if (apiEntity.spec.type === 'reconciliation') {
#               return {
#                 type: 'reconciliation',
#                 title: 'Reconciliation contract',
#                 rawLanguage: 'yaml',
#                 component: definition => (
#                   <PlainApiDefinitionWidget definition={definition} language="yaml" />
#                 ),
#               } as ApiDefinitionWidget;
#             }
#             // every other type (asyncapi / openapi / graphql) keeps its native widget.
#             return definitionWidgets.find(d => d.type === apiEntity.spec.type);
#           },
#         };
#       },
#     }),
#   ];

app:
  title: babelstone catalogue
  baseUrl: ${BACKSTAGE_BASE_URL:-http://localhost:7007}

organization:
  name: babelstone

backend:
  baseUrl: ${BACKSTAGE_BASE_URL:-http://localhost:7007}
  listen:
    port: 7007
    host: 0.0.0.0
  database:
    client: pg
    connection:
      host: ${BACKSTAGE_PG_HOST:-backstage-db}
      port: ${BACKSTAGE_PG_PORT:-5432}
      user: ${BACKSTAGE_PG_USER:-backstage}
      password: ${BACKSTAGE_PG_PASSWORD:-backstage}

# The ONLY catalogue source: the in-repo Backstage descriptor. It is mounted into the
# container at /catalog/catalog-info.yaml (see the Deployment / compose volume). All event +
# reconciliation API entities, and the AsyncAPI definitions they $text-reference, flow from it.
# No second registration, no inline entity, no schema copy — the no-drift invariant.
catalog:
  rules:
    - allow: [Location, API]
  locations:
    - type: file
      target: /catalog/catalog-info.yaml
