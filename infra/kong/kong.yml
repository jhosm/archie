# Kong CE declarative configuration — DB-less mode (ADR-IC-006).
# Kong is the single shared edge gateway; this file is its ENTIRE config surface.
# Every edge policy — JWT validation, rate limiting, request validation, PSD2 SCA
# pre-conditions, gateway-attested caller identity (X-Client-Id from the JWT sub,
# §P4), OTel context propagation, SSE saga-stream routes, and the MCP server route
# (ADR-IC-010) — is a change to THIS file, deployed by reloading Kong
# (a PR on the config, never a database mutation; ADR-IC-006 §P1).
#
# Validated in CI by scripts/kong-config-check.sh (make kong-config-check):
#   1. `deck file validate` (the ADR-IC-006 §P1 deck gate), and
#   2. `kong config parse` (KONG_DATABASE=off) on the pinned kong:3.9.1 image, and
#   3. edge-contract fitness assertions (routes present, SSE settings, edge policies,
#      and the engine COMMAND surface NOT publicly exposed).
#
# ── The client-facing edge surface (ADR-IC-006 §Decision / Document 05) ──────────
#
#   I.1 edge-over-saga front door  → orchestrator upstream (the saga's own Kestrel
#   surface, feat/edge-process-api):
#     • POST /api/v1/deposits/constitute      202 + process_id + stream_url; STARTS the saga
#     • GET  /api/v1/processes/{id}/stream     SSE saga-progress stream (long-lived)
#
#   CQRS query reads               → engine upstream (ADR-IC-005 / ADR-PC-027):
#     • GET  /v1/deposits/{id} (and ?as_of_sequence=N)   one canonical read resource
#     • GET  /v1/deposits/maturities                     the maturities range scan
#
#   The engine COMMAND surface (POST /v1/deposits) is DELIBERATELY ABSENT here. In the
#   intended model the client starts the SAGA at the edge (constitute, above); the
#   engine command is the ORCHESTRATOR's internal, mTLS-only saga target (the saga
#   command dispatcher → POST /v1/deposits), NOT the public client write path
#   (ADR-IC-006 §P5 Boundary 2 / Document 05). Exposing it publicly would let a client
#   append to the engine bypassing the saga's money legs (reserve → debit) and the
#   edge preconditions — so it is not a Kong route. The engine SERVICE below carries
#   ONLY the two read routes.
#
# Upstream service names (orchestrator:8080, engine:8080) are the compose/k8s service
# names those application images take when they land (the infra stack is backing
# services only today; the app subtrees connect to it — infra/k8s/base/kustomization.yaml).

_format_version: "3.0"

