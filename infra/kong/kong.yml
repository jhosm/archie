# ── JWT signing keys (ADR-IC-006 §1 / §P7) ──────────────────────────────────────
# The `jwt` plugin validates a bearer token's signature against a key pre-registered
# on the issuing CONSUMER. Kong CE's jwt plugin requires the IAM's public key to be
# PRE-REGISTERED (ADR-IC-006 Consequences: "jwt plugin requires public key
# pre-registration"; §P7: key rotation is a deliberate `deck sync`).
#
# RESIDUAL (ADR-IC-006 §P7): automatic JWKS rotation is NOT native to Kong CE's jwt
# plugin — a key rotation is a deliberate three-step `deck sync` (add new, retain old
# until tokens expire, remove old). If multi-issuer or frequent rotation becomes
# burdensome, APISIX's openid-connect with JWKS polling is the documented upgrade path.
consumers:
  - username: iam-issuer
    # The `key` is the JWT `iss` claim the IAM stamps; `algorithm` pins RS256
    # (asymmetric, per ADR-IC-006 §1: "signature (RS256/ES256)"). `rsa_public_key` is
    # a POC placeholder — replaced by the real IAM signing public key at deploy time.
    jwt_secrets:
      - key: https://iam.babelstone.example/
        algorithm: RS256
        # For RS256 the signature is verified against rsa_public_key; `secret` is
        # unused for asymmetric algorithms but the schema requires the field present.
        secret: unused-for-rs256
        # POC THROWAWAY public key paired with the cert above — replaced by the real IAM
        # signing public key at deploy time (a key rotation is a deliberate `deck sync`,
        # ADR-IC-006 §P7). Present so the jwt entity validates and the gate runs.
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAm28DnOOCLqSixANucnRv
          HYo3ID/liJXVP8xQJMXLBnG5rT8Oz1WV6SpbSVdVAiw19txFcrO93NzH0t5iN3NS
          FgeCyaRYKN9HuTg5ZVpZF2aHkT0Qo3nr+QhyzUBHE9Y4p6j7s5evQZ3/ZlA4Hglv
          dMHGXZYrb/EXj9cCpZrKHl23Aqb8na4/PRLI7+zwBz4FTXebWM2JVyEAxFxaRYId
          NaBjMBJVvCuKWlyx81vK68AUsmSPQEOU5LB96XLRcAoKyj6+hpnQE4uuRyd3rlTf
          7UdjRw2h8KCO8lWEQGaHIwfyogRtZGyPLQGR+0H7a5kPT64I3dpzPck8DQjvKuWe
          EwIDAQAB
          -----END PUBLIC KEY-----

services:
  # ── The I.1 constitute front door (orchestrator upstream, default timeouts) ────
  - name: orchestrator-edge
    url: https://orchestrator:8080
    # mTLS to the orchestrator (ADR-IC-006 §P5): Kong presents the client cert above.
    client_certificate: 7e9b6f1a-2c4d-4e8a-9b1f-0a2c4d6e8f10
    # Trust the internal CA for the upstream TLS handshake (POC: skip verify until the
    # internal CA bundle is mounted; flip to true with the CA at deploy time).
    tls_verify: false
    routes:
      # POST /api/v1/deposits/constitute — STARTS the saga, returns 202 + stream_url.
      # A financial operation: rate-limited tightly (ADR-IC-006 §P3), PSD2-SCA-enforced
      # (§P2, bd babelstone-6imx / I.4 — the access-phase SCA pre-function below builds on
      # the global jwt plugin and runs FIRST, before structural body validation), and
      # payload-validated (§4).
      #
      # ── SoR-routing intent: SoR: engine (new-constitution rule) (ADR-PC-018 §1, I.5) ──
      # A NEW term-deposit constitution has NO instance yet, so there is no instance_id to
      # look up. Routing is by product_family + the coexistence §3.1 cutover-date rule:
      # EVERY term deposit constituted on/after cutover is engine-SoR. So this route is
      # engine-SoR UNCONDITIONALLY — it always dispatches to the orchestrator/engine front
      # door above, with NO sor lookup and NO projection-lag exposure (ADR-PC-018 §3: the
      # product_family fallback cannot misroute a v1 deposit). This is the v1 load-bearing
      # case; the existing-instance sor lookup is scaffolded on the sor-routing service
      # below. `sor` is set to `engine` at constitution and never changes (ADR-PC-018 §2);
      # the gateway READS the rule here, it never DECIDES the sor.
      - name: deposits-constitute
        methods: ["POST"]
        paths: ["/api/v1/deposits/constitute"]
        strip_path: false
        plugins:
          # ADR-IC-006 §P3: 5 req/min per consumer — prevents accidental duplicate
          # constitution attempts. `local` policy is fine at single-node POC scale
          # (in-memory counters; Valkey-backed distributed counters are the §P3
          # upgrade, a config-only change).
          - name: rate-limiting
            config:
              minute: 5
              policy: local
              limit_by: consumer
              fault_tolerant: true
          # ADR-IC-006 §4: reject structurally invalid requests at the edge; the
          # application never receives them. The validated shape mirrors the
          # orchestrator's ConstituteRequest DTO (product_code, amount cents, opaque
          # account refs — NO raw PII, ADR-PC-004 §P2: the body carries already-tokenised
          # references).
          #
          # IMPLEMENTATION NOTE (ADR-IC-006 §4 + §S2 honoured on Kong CE): the ADR names
          # the `request-validator` plugin for JSON-schema body validation, but that
          # plugin ships ONLY in Kong ENTERPRISE — it is NOT in the Kong Gateway CE
          # bundled-plugins set the ADR Decision actually selects (Apache-2.0 CE). The
          # CE-native equivalent is a `pre-function` Lua snippet in the access phase —
          # the SAME bundled mechanism the ADR mandates for SCA enforcement (§P2) and
          # cites as the CE workaround pattern throughout (§F2, §P7). It validates the
          # request body and returns 400 on a structurally invalid request, satisfying
          # the §4 obligation ("reject structurally invalid requests at the edge") on the
          # selected edition. Honoured, not diverged: the obligation is met by the
          # edition-appropriate mechanism. The richer declarative JSON-schema form returns
          # if/when the estate moves to Kong Enterprise or APISIX (the §S4 upgrade path).
          - name: pre-function
            config:
              access:
                # ── PSD2 SCA enforcement (ADR-IC-006 §P2 / bd babelstone-6imx, I.4) ──────────
                # FIRST access-phase entry, so auth (SCA) precedes structural body validation.
                #
                # ORDERING — why reading the token here is sound (READ THIS; the X-Client-Id
                # attestation below relies on the same property). On Kong CE plugin execution is
                # STATIC priority order and there is no dynamic ordering (the `ordering:` field is
                # Enterprise-only — `kong config parse` rejects it on CE). The `pre-function`
                # priority (1000000) is HIGHER than `jwt` (1450), so this snippet actually runs
                # BEFORE jwt validates the signature. That is still safe because `jwt` is a GLOBAL
                # access-phase plugin (top-level `plugins:` below, no `anonymous` bypass — both
                # asserted by kong-config-check): it terminates the request with 401 BEFORE Kong
                # proxies upstream unless the token is validly signed. So a request only REACHES
                # the orchestrator if jwt validated THIS SAME token; a forged or tampered token
                # (changing any claim breaks the signature) is 401'd before upstream, and the
                # claims this snippet read never take effect. We re-decode the payload only to read
                # claims jwt does not surface on the CE credential context — the security rests on
                # jwt gating the proxy, NOT on plugin order. The ADR-IC-006 §P2 request-level CI
                # contract test (bd babelstone-abig) is the end-to-end lock on this property.
                #
                # Kong CE has no native SCA plugin (§F2), so §P2 mandates exactly this CE-bundled
                # pre-function access check: the gateway enforces SCA at the boundary; the
                # orchestrator trusts the gateway assertion and does NOT re-check (Boundary 2,
                # Document 10).
                #
                # Claim contract (Document 10 §"PSD2 SCA at Enrolment"/§"Step-Up"): the OIDC
                # `acr` claim is the structural SCA-completion signal (a non-empty value =>
                # SCA was completed), and `auth_time` (RFC-bound seconds-since-epoch) records
                # WHEN SCA happened. A constitution debits a payment account — a PIS-equivalent
                # money-mover — so SCA must be FRESH, not merely present: `auth_time` may be no
                # older than SCA_MAX_AGE seconds. (Doc 10: an `acr` too weak, or an `auth_time`
                # too far in the past, fails the precondition.) AML/KYC is OUT of scope here
                # (00 §4: "fraud / AML, KYC are out-of-scope products"); the edge enforces SCA
                # ONLY, code SCA_REQUIRED — there is no AML edge precondition (ADR-PC-013, the
                # AML/KYC-upstream-precondition ADR, is Withdrawn 2026-06-03, adrs/retired/).
                #
                # FAIL-CLOSED: a missing Authorization header, a malformed token, an undecodable
                # payload, an absent/empty `acr`, a missing/non-numeric/stale `auth_time` — every
                # uncertainty exits 403 SCA_REQUIRED. Decoding is defensive (cjson.safe + a pure
                # base64url decoder): a bad token can NEVER raise a 500. No PII in the body or
                # logs (ADR-PC-004 §P2) — the 403 carries only a stable code + a generic message.
                - |
                  local cjson = require("cjson.safe")

                  -- SCA-completion freshness window for a money-moving operation (seconds).
                  -- A constitution is PIS-equivalent (Doc 10); SCA must be recent, not just
                  -- ever-completed. 300s (5 min) is the POC default — tighten via IAM policy.
                  local SCA_MAX_AGE = 300

                  -- Single fail-closed exit: identical 403 + stable code for every SCA failure,
                  -- so no decode/parse branch can leak a distinguishing signal or PII.
                  local function deny()
                    return kong.response.exit(403, {
                      code = "SCA_REQUIRED",
                      message = "Strong Customer Authentication (PSD2 SCA) is required for this operation.",
                    })
                  end

                  -- Pure base64url decoder (no padding assumptions): JWT segments are base64url
                  -- and unpadded. ngx.decode_base64 is standard base64, so translate -_ -> +/
                  -- and re-pad before decoding. Any failure returns nil => deny().
                  local function b64url_decode(seg)
                    if type(seg) ~= "string" or seg == "" then return nil end
                    local s = seg:gsub("-", "+"):gsub("_", "/")
                    local pad = #s % 4
                    if pad == 2 then s = s .. "=="
                    elseif pad == 3 then s = s .. "="
                    elseif pad == 1 then return nil end -- not a valid base64 length
                    return ngx.decode_base64(s)
                  end

                  -- Read the bearer token from the Authorization header. We re-read the raw token
                  -- to inspect the SCA claims (Kong CE's jwt plugin does not surface arbitrary
                  -- claims on the credential context); per the ORDERING note above, jwt gates the
                  -- proxy, so only a validly-signed token's claims take effect end-to-end.
                  local auth = kong.request.get_header("authorization")
                  if type(auth) ~= "string" then return deny() end
                  -- RFC 7235 auth-scheme is case-INSENSITIVE: accept Bearer/bearer/BEARER alike,
                  -- so a fully-compliant client emitting a non-canonical scheme case is not
                  -- spuriously 403'd. Still fail-closed: a non-Bearer scheme yields no token.
                  local scheme, token = auth:match("^(%a+)%s+(.+)$")
                  if not token or scheme:lower() ~= "bearer" then return deny() end

                  -- A compact JWS is header.payload.signature — exactly three dot-segments.
                  local h, payload_seg, sig = token:match("^([^%.]+)%.([^%.]+)%.([^%.]+)$")
                  if not payload_seg then return deny() end

                  local payload_json = b64url_decode(payload_seg)
                  if not payload_json then return deny() end

                  local claims = cjson.decode(payload_json)
                  if type(claims) ~= "table" then return deny() end

                  -- acr: the structural SCA-completion signal — must be a non-empty string.
                  if type(claims.acr) ~= "string" or claims.acr == "" then return deny() end

                  -- auth_time: when SCA was performed — must be a finite integer (seconds since
                  -- epoch) and FRESH (no older than SCA_MAX_AGE; not in the future).
                  local at = claims.auth_time
                  if type(at) ~= "number" or at % 1 ~= 0 then return deny() end
                  local now = ngx.time()
                  if at > now or (now - at) > SCA_MAX_AGE then return deny() end

                  -- Attest the caller identity to the upstream (bd babelstone-bkqo, ADR-IC-006 §P4):
                  -- the orchestrator trusts X-Client-Id as the gateway-attested client_id and enforces
                  -- per-process OWNERSHIP on it (EdgeAuth) — it does NOT read the token. Derive that
                  -- header from the token's `sub` (jwt gates the proxy — see the ORDERING note above
                  -- — so a request reaches the orchestrator only if jwt SUBSEQUENTLY validates this
                  -- same token's signature, making the sub authentic) and OVERWRITE it with set_header,
                  -- so a client-supplied
                  -- X-Client-Id can never reach the orchestrator and assert someone else's identity
                  -- (IDOR). A token with no usable `sub` cannot establish ownership => fail closed.
                  if type(claims.sub) ~= "string" or claims.sub == "" then return deny() end
                  kong.service.request.set_header("X-Client-Id", claims.sub)
                  -- SCA fresh + identity attested: fall through to structural body validation below.
                - |
                  local cjson = require("cjson.safe")
                  -- Read the (already buffered) request body; reject a non-JSON or empty body.
                  local raw = kong.request.get_raw_body()
                  if not raw or raw == "" then
                    return kong.response.exit(400, { message = "A constitution request body is required." })
                  end
                  local body = cjson.decode(raw)
                  if type(body) ~= "table" then
                    return kong.response.exit(400, { message = "Request body must be a JSON object." })
                  end
                  -- product_code: non-empty string (a catalogue reference, not PII).
                  if type(body.product_code) ~= "string" or body.product_code == "" then
                    return kong.response.exit(400, { message = "product_code is required and must be a non-empty string." })
                  end
                  -- amount: positive integer cents (the engine's money discipline).
                  if type(body.amount) ~= "number" or body.amount % 1 ~= 0 or body.amount < 1 then
                    return kong.response.exit(400, { message = "amount is required and must be a positive integer (cents)." })
                  end
                  -- source_account_ref: non-empty OPAQUE token, NOT a raw IBAN (ADR-PC-004 §P2).
                  if type(body.source_account_ref) ~= "string" or body.source_account_ref == "" then
                    return kong.response.exit(400, { message = "source_account_ref is required and must be a non-empty token." })
                  end
                  -- interest_account_ref: optional, but a string when present.
                  if body.interest_account_ref ~= nil and type(body.interest_account_ref) ~= "string" then
                    return kong.response.exit(400, { message = "interest_account_ref must be a string when present." })
                  end

  # ── The I.1 SSE saga-progress stream (orchestrator upstream, LONG timeouts) ────
  # A SEPARATE service so the SSE-aware timeouts (ADR-IC-006 §P4) apply to THIS
  # upstream ONLY and not to the constitute POST — Kong's read/write timeouts are a
  # SERVICE property, and the ADR scopes them to "the Kong upstream definition for
  # this path". Same orchestrator URL + the same mTLS client cert (§P5).
  - name: orchestrator-sse
    url: https://orchestrator:8080
    client_certificate: 7e9b6f1a-2c4d-4e8a-9b1f-0a2c4d6e8f10
    tls_verify: false
    # SSE: no hard read/write timeout at the gateway for this long-lived stream —
    # 1800000 ms (30 min) spans an approval-gated saga (ADR-IC-006 §P4). This overrides
    # Kong's default 60s read timeout for this upstream only.
    read_timeout: 1800000
    write_timeout: 1800000
    routes:
      # GET /api/v1/processes/{id}/stream — the SSE saga-progress stream.
      # Buffering OFF at the route (ADR-IC-006 §P4) so each event: frame flushes
      # immediately. The upstream also sends X-Accel-Buffering: no
      # (ProcessApiEndpoints.StreamAsync), which disables nginx/Kong buffering for the
      # connection — the two together keep the long-lived stream flowing without a
      # gateway timeout.
      - name: processes-stream
        methods: ["GET"]
        # The {id} segment matched by a single-segment wildcard regex (Kong route
        # regex): /api/v1/processes/<one-segment>/stream.
        paths: ["~/api/v1/processes/[^/]+/stream$"]
        strip_path: false
        request_buffering: false
        response_buffering: false
        plugins:
          # Attest the caller identity to the orchestrator (bd babelstone-bkqo, ADR-IC-006 §P4). The
          # SSE stream enforces per-process OWNERSHIP — only the client that started a process may watch
          # it — and the orchestrator keys that on the gateway-attested X-Client-Id (EdgeAuth), never on
          # a value the client could set. Like the constitute route, derive X-Client-Id from the
          # token `sub` and OVERWRITE any client-supplied value, so the stream cannot be hijacked by
          # asserting another client's id (IDOR). The sub is authentic because the global `jwt` plugin
          # gates the proxy (see the ORDERING note on the constitute route): a request reaches the
          # orchestrator only if jwt validated this same token, regardless of plugin order. No SCA
          # here: a progress read is not a money-mover (only the global jwt plugin gates it).
          # Fail-closed: any missing/malformed token or absent `sub` exits 403, never falls open.
          - name: pre-function
            config:
              access:
                - |
                  local cjson = require("cjson.safe")
                  local function deny()
                    return kong.response.exit(403, {
                      code = "FORBIDDEN",
                      message = "A valid authenticated identity is required for this operation.",
                    })
                  end
                  local function b64url_decode(seg)
                    if type(seg) ~= "string" or seg == "" then return nil end
                    local s = seg:gsub("-", "+"):gsub("_", "/")
                    local pad = #s % 4
                    if pad == 2 then s = s .. "=="
                    elseif pad == 3 then s = s .. "="
                    elseif pad == 1 then return nil end
                    return ngx.decode_base64(s)
                  end
                  local auth = kong.request.get_header("authorization")
                  if type(auth) ~= "string" then return deny() end
                  local scheme, token = auth:match("^(%a+)%s+(.+)$")
                  if not token or scheme:lower() ~= "bearer" then return deny() end
                  local _, payload_seg = token:match("^([^%.]+)%.([^%.]+)%.([^%.]+)$")
                  if not payload_seg then return deny() end
                  local payload_json = b64url_decode(payload_seg)
                  if not payload_json then return deny() end
                  local claims = cjson.decode(payload_json)
                  if type(claims) ~= "table" then return deny() end
                  if type(claims.sub) ~= "string" or claims.sub == "" then return deny() end
                  kong.service.request.set_header("X-Client-Id", claims.sub)

  # ── CQRS query reads (engine upstream) ────────────────────────────────────────
  # ONLY the read surface (ADR-IC-005 / ADR-PC-027). The engine COMMAND POST
  # /v1/deposits is ABSENT by design (see the header note / ADR-IC-006 §P5).
  - name: engine-query
    url: https://engine:8080
    client_certificate: 7e9b6f1a-2c4d-4e8a-9b1f-0a2c4d6e8f10
    tls_verify: false
    routes:
      # GET /v1/deposits/maturities — the maturities range scan. Registered BEFORE the
      # point-read so the literal "/maturities" is not swallowed by the {id} regex.
      - name: deposits-maturities
        methods: ["GET"]
        paths: ["/v1/deposits/maturities"]
        strip_path: false
        plugins:
          # General authenticated read budget (ADR-IC-006 §P3: 200 req/min per consumer).
          - name: rate-limiting
            config:
              minute: 200
              policy: local
              limit_by: consumer
              fault_tolerant: true

      # GET /v1/deposits/{id} (and ?as_of_sequence=N) — the one canonical read resource.
      # The {id} segment is a single path segment that is NOT the literal "maturities";
      # a GUID-shaped segment (the engine's :guid constraint) excludes the word anyway.
      - name: deposits-read
        methods: ["GET"]
        paths: ["~/v1/deposits/[^/]+$"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              policy: local
              limit_by: consumer
              fault_tolerant: true

  # ── SoR routing for EXISTING-instance state-changing ops (ADR-PC-018 — I.5) ───────
  # During coexistence a state-changing operation against an EXISTING instance (terminate
  # early, withdraw partially, change auto-renewal) must land on the system that holds the
  # system-of-record for THAT instance. The GATEWAY resolves: instance_id -> sor -> backend
  # (ADR-PC-018 §1) — engine-SoR ops to the engine, legacy/unresolved -> fail closed.
  # Routing to the wrong backend is the split-brain failure the whole design prevents.
  #
  # WHY ONE ROUTE, NOT A PATH-PER-SoR SCHEME (the split-brain-proofing — review must-fix).
  # An earlier scaffold keyed the backend off a CLIENT-SUPPLIED `sor` path segment (an
  # engine-vs-legacy class word in the URL). That inverts ADR-PC-018 §2: the router would
  # then let the CALLER DECIDE `sor`, so a client could submit a legacy-SoR instance's op to
  # the engine class and Kong would proxy a command to the system that does NOT hold the SoR
  # — split-brain (§5). The fail-closed arm was real but trivially bypassable: a client that
  # always names the engine class never hits it. So there is now ONE client-facing route,
  # /api/v1/sor/instances/{id}/operations, with NO `sor` class word in the path. The gateway
  # READS `sor` off the engine read surface (below) and DECIDES the backend itself; the path
  # segment can no longer pick it (ADR-PC-018 §1/§2 followed literally — "the router reads
  # `sor`; it never decides `sor`", and the path cannot decide it either).
  #
  # PLACEMENT (ADR-PC-018 §Decision option b / binding authority): the routing LOGIC lives
  # on THIS edge gateway, reusing the ADR-IC-006 tier, NOT in the engine and NOT duplicated
  # per-channel. The engine owns the routing DATA (it exposes `sor` on the read surface,
  # engine-query above) but refuses to host the routing LOGIC in its own command/read
  # surfaces (ADR-PC-018 §6, the engine's negative commitment — honoured here: no command
  # endpoint is added to the engine read surface; the engine COMMAND POST /v1/deposits stays
  # absent — /sor/instances/{id}/operations is a GATEWAY routing key, not an engine route).
  # The BINDING placement is the operating bank's channel tier; this is the engine/gateway-
  # side SCAFFOLD, a position not a hard requirement on the bank.
  #
  # HOW THE GATEWAY RESOLVES `sor` (ADR-PC-018 §1/§2/§3/§4). The access-phase pre-function:
  #   1. reads `instance_id` from the path (server-derived, not a client-trusted routing key);
  #   2. resolves `sor` by GET-ing the engine read surface (GET /v1/deposits/{id}, which
  #      carries the `sor` column — ADR-PC-027 / coexistence §6.2). This is the gateway
  #      READING `sor`, never DECIDING it (§2); it is a pure, stateless, idempotent per-
  #      request lookup holding no state of its own (§3/§4);
  #   3. `sor == engine`  -> fall through and proxy to the engine upstream (this service);
  #      `sor == legacy`  -> FAIL CLOSED 503 SOR_UNRESOLVED (legacy core not built in v1;
  #                          guessing a backend = split-brain, §5);
  #      unresolvable      -> FAIL CLOSED 503 SOR_UNRESOLVED (instance unknown to the read
  #                          model / projection lag / read surface unreachable — refuse,
  #                          never guess, §5: gated, not post-flagged).
  # The fail-closed default is structural: the function returns engine ONLY on an explicit
  # `sor == engine` read; every other outcome (legacy, 404, non-200, malformed body, missing
  # column, network error) routes to deny(). A mis-route therefore requires the read surface
  # to actively assert `engine`, not merely a client's path choice.
  - name: engine-sor-ops
    url: https://engine:8080
    client_certificate: 7e9b6f1a-2c4d-4e8a-9b1f-0a2c4d6e8f10
    tls_verify: false
    routes:
      # The single SoR-routed existing-instance op surface. No `sor` in the path — the
      # gateway resolves it (above). A request reaches the engine upstream ONLY if the
      # pre-function below read `sor == engine` off the read surface for THIS instance_id.
      - name: sor-engine-ops
        methods: ["POST"]
        paths: ["~/api/v1/sor/instances/(?<instance_id>[^/]+)/operations$"]
        strip_path: false
        plugins:
          # ADR-IC-006 §P3: 5 req/min per consumer — same tight budget as the constitute
          # money-mover; an existing-instance op (early terminate, partial withdraw) moves
          # money too.
          - name: rate-limiting
            config:
              minute: 5
              policy: local
              limit_by: consumer
              fault_tolerant: true
          - name: pre-function
            config:
              access:
                # ── PSD2 SCA enforcement + identity attestation (ADR-IC-006 §P2/§P4) ──────
                # An existing-instance state-changing op (terminate early, withdraw partially)
                # is a PIS-equivalent money-mover, the SAME class as constitute — so it carries
                # the SAME SCA freshness gate (§P2: 403 SCA_REQUIRED on absent/stale SCA) and
                # the SAME X-Client-Id attestation from the JWT `sub` (§P4: the upstream enforces
                # per-instance OWNERSHIP on the gateway-attested id, never a client-set header —
                # an IDOR guard, since this op targets a SPECIFIC instance). This is the SCA
                # parity the review requires: a new money-mover route must not be less guarded
                # than constitute. Logic mirrors the constitute route's first access snippet;
                # see its ORDERING note (jwt gates the proxy, so the claims read here are
                # authentic regardless of CE static plugin order). Fail-closed throughout.
                - |
                  local cjson = require("cjson.safe")

                  local SCA_MAX_AGE = 300

                  local function deny_sca()
                    return kong.response.exit(403, {
                      code = "SCA_REQUIRED",
                      message = "Strong Customer Authentication (PSD2 SCA) is required for this operation.",
                    })
                  end

                  local function b64url_decode(seg)
                    if type(seg) ~= "string" or seg == "" then return nil end
                    local s = seg:gsub("-", "+"):gsub("_", "/")
                    local pad = #s % 4
                    if pad == 2 then s = s .. "=="
                    elseif pad == 3 then s = s .. "="
                    elseif pad == 1 then return nil end
                    return ngx.decode_base64(s)
                  end

                  local auth = kong.request.get_header("authorization")
                  if type(auth) ~= "string" then return deny_sca() end
                  local scheme, token = auth:match("^(%a+)%s+(.+)$")
                  if not token or scheme:lower() ~= "bearer" then return deny_sca() end

                  local _, payload_seg = token:match("^([^%.]+)%.([^%.]+)%.([^%.]+)$")
                  if not payload_seg then return deny_sca() end

                  local payload_json = b64url_decode(payload_seg)
                  if not payload_json then return deny_sca() end

                  local claims = cjson.decode(payload_json)
                  if type(claims) ~= "table" then return deny_sca() end

                  if type(claims.acr) ~= "string" or claims.acr == "" then return deny_sca() end

                  local at = claims.auth_time
                  if type(at) ~= "number" or at % 1 ~= 0 then return deny_sca() end
                  local now = ngx.time()
                  if at > now or (now - at) > SCA_MAX_AGE then return deny_sca() end

                  -- Attest the caller identity (ADR-IC-006 §P4): OVERWRITE any client-supplied
                  -- X-Client-Id with the token `sub` so the upstream's per-instance ownership
                  -- check cannot be spoofed (IDOR). No usable `sub` => fail closed.
                  if type(claims.sub) ~= "string" or claims.sub == "" then return deny_sca() end
                  kong.service.request.set_header("X-Client-Id", claims.sub)
                # ── SoR resolution: instance_id -> sor -> backend (ADR-PC-018 §1/§2/§5) ───
                # The GATEWAY resolves `sor`; the client cannot. Reads the `sor` column off the
                # engine read surface for THIS instance_id and proxies to the engine ONLY on an
                # explicit `sor == engine`. Legacy / unknown / any read failure => fail closed
                # 503 SOR_UNRESOLVED (never guess a backend — guessing is split-brain, §5).
                # No PII in the refusal body or logs (ADR-PC-004 §P2): a stable code + generic
                # message only. The lookup is read-only and idempotent (§3/§4); the router holds
                # no state of its own.
                - |
                  local cjson = require("cjson.safe")

                  -- Single fail-closed exit for every non-engine / unresolvable outcome.
                  local function deny_sor()
                    return kong.response.exit(503, {
                      code = "SOR_UNRESOLVED",
                      message = "Instance state unavailable: the system-of-record for this instance cannot be resolved to an available backend, so the operation is refused rather than routed.",
                    })
                  end

                  -- instance_id is SERVER-derived from the matched path (the named capture in the
                  -- route regex), never a client-trusted routing key. Absent/empty => refuse.
                  local instance_id = kong.request.get_uri_captures().named["instance_id"]
                  if type(instance_id) ~= "string" or instance_id == "" then return deny_sor() end
                  -- URL-encode the segment before interpolating it into the read-surface URL: the
                  -- route regex [^/]+ excludes '/' but still admits '?', '#', '%', space, etc., which
                  -- could otherwise inject a query/fragment into the GET (a crafted instance_id cannot
                  -- mis-route — the gateway only gates engine-vs-fail-closed — but encoding keeps the
                  -- lookup unambiguous and the read a clean point-read). A normal GUID is unchanged.
                  local instance_seg = ngx.escape_uri(instance_id)

                  -- Resolve `sor` off the engine read surface (GET /v1/deposits/{id}, ADR-PC-027 /
                  -- coexistence §6.2). The gateway READS `sor`; it never DECIDES it (§2). Done over
                  -- the in-cluster engine address with the gateway's mTLS client cert; verify is the
                  -- POC posture of the engine-query service (flip on with the CA bundle at deploy).
                  local httpc = require("resty.http").new()
                  httpc:set_timeout(2000)
                  local res, err = httpc:request_uri(
                    "https://engine:8080/v1/deposits/" .. instance_seg,
                    {
                      method = "GET",
                      ssl_verify = false,
                      headers = {
                        ["Authorization"] = kong.request.get_header("authorization"),
                        ["Accept"] = "application/json",
                      },
                    }
                  )
                  -- Any transport error, a non-200 (404 unknown instance / projection lag, 5xx),
                  -- a non-table body, or a `sor` that is not exactly "engine" => fail closed.
                  if not res or res.status ~= 200 then return deny_sor() end
                  local body = cjson.decode(res.body)
                  if type(body) ~= "table" then return deny_sor() end
                  if body.sor ~= "engine" then return deny_sor() end

                  -- sor == engine: fall through and proxy to the engine upstream (this service).

  # ── The MCP agent channel (ADR-IC-010 — Epic J / bd babelstone-e50n) ──────────────
  # The bank's MCP server is ONE more route on this shared edge gateway (ADR-IC-010
  # §Decision: "behind Kong", §P5). LLM agents reach the four term-deposit tools
  # (constitute_deposit / get_deposit / mature_deposit / pay_interest) over Streamable
  # HTTP. The route inherits the SAME edge tier as the orchestrator routes — the global
  # jwt plugin validates the token signature, opentelemetry propagates the trace, mTLS
  # (the shared client_certificate) secures the upstream — PLUS two MCP-specific
  # obligations the spec imposes:
  #
  #   1. RFC 8707 audience binding (ADR-IC-010 §P3). The token's `aud` MUST equal this
  #      MCP server's canonical URI; a token minted for another resource MUST be rejected
  #      (the structural defence against token replay across MCP servers, Document 10
  #      Boundary 9 / Document 11 §"token replay"). Kong CE's jwt plugin does NOT check
  #      audience against a per-route value, and the Enterprise OIDC plugin (which would)
  #      is not in CE — so §P3's aud check is a CE-bundled `pre-function` access snippet
  #      here (exactly the SCA workaround pattern the constitute route uses), 401'ing on a
  #      mismatch with a WWW-Authenticate header carrying resource_metadata. The Python app
  #      layer re-checks `aud` AUTHORITATIVELY too (defense-in-depth, ADR-IC-010 §P3 — the
  #      app, not the gateway, is the spec's authoritative resource server).
  #
  #   2. sub -> X-Client-Id attestation + scope passthrough (ADR-IC-010 §P3/§P4). As on
  #      the orchestrator routes, the caller identity is the OAuth `sub`, attested to the
  #      upstream as X-Client-Id and NEVER taken from a tool argument (Document 11
  #      §"hallucinated parameters"). The granted OAuth scopes pass through as X-OAuth-Scope
  #      so the app enforces scope-per-tool (§P4: deposits:read for the read tool,
  #      deposits:write for the writes — one tool maps to exactly one scope, no god scope).
  #
  # The well-known discovery document (RFC 9728 Protected Resource Metadata, §P2) is a
  # SEPARATE route with jwt route-disabled, so an agent with no token yet can discover the
  # authorization server. POST /mcp itself STAYS jwt-covered by the global plugin.
  - name: mcp-server
    url: https://mcp-server:8080
    # MUTUAL TLS to the MCP server (ADR-IC-006 §P5 Boundary 2, ADR-IC-010 §P5 — bd babelstone-29ic).
    # Unlike the orchestrator/engine services (still tls_verify:false POC posture), the MCP agent
    # channel runs FULL mutual TLS:
    #   - client_certificate: the MCP-scoped POC client cert (a1b2c3d4-…) Kong PRESENTS to uvicorn,
    #     which requires it (ssl_cert_reqs=CERT_REQUIRED). A Kong-bypassing actor on the upstream
    #     network has no client cert and is rejected at the TLS handshake — closing the trust gap the
    #     app.py docstring used to flag (a forged token + spoofed X-Client-Id can no longer reach the
    #     upstream by sitting on the network).
    #   - tls_verify: true + ca_certificate: Kong VERIFIES the mcp-server's TLS server cert against the
    #     POC CA (f0e1d2c3-…). The committed POC CA (infra/kong/mcp-poc-ca.crt) signs the harness
    #     mcp-server cert, so the live-Kong runtime contract test (scripts/mcp-contract-test/) passes
    #     against the SAME CA the config carries — no kong.yml templating (bd babelstone-5ot0).
    # SCOPED to this service only: the shared 7e9b6f1a-… cert + tls_verify:false on the other upstreams
    # is unchanged. At deploy time both this client cert AND the ca_certificates bundle are swapped for
    # the real internal-CA material (two secrets — see the certificate comments above).
    client_certificate: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    tls_verify: true
    tls_verify_depth: 1
    ca_certificates:
      - f0e1d2c3-b4a5-6789-cdef-012345678901
    # Streamable HTTP's GET-with-SSE notification stream is long-lived (ADR-IC-010 §P5 /
    # ADR-IC-006 §P4): the same 1800000 ms (30-min) read/write timeout as the saga SSE
    # route, so a server-initiated notification stream is not cut by the gateway's default
    # 60s read timeout.
    read_timeout: 1800000
    write_timeout: 1800000
    routes:
      # ── The MCP Streamable-HTTP transport: one route, both POST and GET (ADR-IC-010 §P5) ──
      # POST carries JSON-RPC (tools/call, tools/list, initialize, …); GET opens the SSE
      # notification stream. Buffering OFF (request + response) so the SSE frames flush
      # immediately, mirroring the saga-stream route. strip_path false: the upstream app
      # serves on /mcp (FastMCP streamable_http_path), so the path is preserved verbatim.
      # NOTE: no request body validator here — a JSON-RPC body is method-polymorphic, so a
      # structural schema gate would break legitimate calls (the app validates per-tool
      # inputSchema instead). This is DELIBERATELY unlike the constitute route's body check.
      - name: mcp-streamable-http
        methods: ["POST", "GET"]
        paths: ["/mcp"]
        strip_path: false
        request_buffering: false
        response_buffering: false
        plugins:
          # ADR-IC-010 §P5 / ADR-IC-006 §P3: per-consumer rate limit on the agent channel.
          # 5 req/min per consumer — the same tight budget as the constitute money-mover;
          # the write tools move money, and an agent looping is the failure mode this caps.
          - name: rate-limiting
            config:
              minute: 5
              policy: local
              limit_by: consumer
              fault_tolerant: true
          # ADR-IC-010 §P5 / ADR-IC-006 §P6: propagate the W3C traceparent into the MCP
          # server so the agent tool call → engine span tree is one continuous trace.
          - name: opentelemetry
            config:
              traces_endpoint: http://otel-collector:4318/v1/traces
              propagation:
                extract: ["w3c"]
                inject: ["w3c"]
                default_format: w3c
              resource_attributes:
                service.name: kong-edge
          - name: pre-function
            config:
              access:
                # ── (a) RFC 8707 audience check (ADR-IC-010 §P3) ─────────────────────────
                # FIRST access-phase snippet. The token's `aud` MUST equal this MCP server's
                # canonical URI (MCP_SERVER_URI below). A token issued for another resource is
                # 401'd with a WWW-Authenticate header carrying resource_metadata (the RFC 9728
                # well-known URL) and a stable body code AUDIENCE_MISMATCH — the spec's
                # token-replay defence (Document 10 Boundary 9 / Document 11).
                #
                # ORDERING (read the constitute route's ORDERING note — the SAME property holds):
                # on Kong CE, pre-function (priority 1000000) runs BEFORE jwt (1450), but the
                # GLOBAL jwt plugin still gates the proxy — it 401s an unsigned/tampered token
                # before upstream, with NO anonymous fallback (asserted by kong-config-check). So
                # a request only REACHES the MCP server if jwt validated THIS SAME token; the
                # claims this snippet reads are authentic end-to-end. We decode the payload only
                # to read `aud` (jwt does not check audience against a per-route value on CE).
                #
                # `aud` may be a STRING or an ARRAY (RFC 7519 §4.1.3) — both handled. FAIL-CLOSED:
                # a missing/malformed Authorization header, an undecodable payload, an absent
                # `aud`, or a non-matching `aud` all exit 401 AUDIENCE_MISMATCH. No PII in the body
                # or header (ADR-PC-004 §P2): a stable code + a generic message only. Decoding is
                # defensive (cjson.safe + a pure base64url decoder), so a bad token can never 500.
                - |
                  local cjson = require("cjson.safe")

                  -- This MCP server's canonical URI — the value tokens MUST carry as `aud`
                  -- (RFC 8707 / ADR-IC-010 §P3). POC default; in deploy this is the public
                  -- MCP server URL the IAM registers as a resource. Kept in sync with the app's
                  -- BABELSTONE_MCP_SERVER_URI env (infra/compose.yaml).
                  local MCP_SERVER_URI = "http://localhost:8000/mcp"
                  -- The RFC 9728 Protected Resource Metadata URL, advertised in WWW-Authenticate
                  -- so a 401'd client can discover the authorization server (ADR-IC-010 §P2/§P3).
                  local RESOURCE_METADATA = "http://localhost:8000/.well-known/oauth-protected-resource"

                  -- Single fail-closed exit: identical 401 + stable code for every audience
                  -- failure, so no decode/parse branch leaks a distinguishing signal or PII.
                  local function deny_aud()
                    return kong.response.exit(401, {
                      code = "AUDIENCE_MISMATCH",
                      message = "The bearer token's audience does not match this MCP server (RFC 8707 / ADR-IC-010 §P3).",
                    }, {
                      ["WWW-Authenticate"] = 'Bearer error="invalid_token", error_description="audience mismatch", resource_metadata="' .. RESOURCE_METADATA .. '"',
                    })
                  end

                  -- Pure base64url decoder (no padding assumptions) — same helper the SCA
                  -- pre-functions use: JWT segments are unpadded base64url; translate -_ -> +/
                  -- and re-pad before ngx.decode_base64. Any failure returns nil => deny.
                  local function b64url_decode(seg)
                    if type(seg) ~= "string" or seg == "" then return nil end
                    local s = seg:gsub("-", "+"):gsub("_", "/")
                    local pad = #s % 4
                    if pad == 2 then s = s .. "=="
                    elseif pad == 3 then s = s .. "="
                    elseif pad == 1 then return nil end
                    return ngx.decode_base64(s)
                  end

                  local auth = kong.request.get_header("authorization")
                  if type(auth) ~= "string" then return deny_aud() end
                  -- RFC 7235 auth-scheme is case-insensitive: accept Bearer/bearer/BEARER.
                  local scheme, token = auth:match("^(%a+)%s+(.+)$")
                  if not token or scheme:lower() ~= "bearer" then return deny_aud() end

                  local _, payload_seg = token:match("^([^%.]+)%.([^%.]+)%.([^%.]+)$")
                  if not payload_seg then return deny_aud() end

                  local payload_json = b64url_decode(payload_seg)
                  if not payload_json then return deny_aud() end

                  local claims = cjson.decode(payload_json)
                  if type(claims) ~= "table" then return deny_aud() end

                  -- `aud` may be a string OR an array (RFC 7519 §4.1.3). Match either form.
                  local aud = claims.aud
                  local ok = false
                  if type(aud) == "string" then
                    ok = (aud == MCP_SERVER_URI)
                  elseif type(aud) == "table" then
                    for _, v in ipairs(aud) do
                      if v == MCP_SERVER_URI then ok = true break end
                    end
                  end
                  if not ok then return deny_aud() end
                  -- aud matches: fall through to the identity attestation below.
                # ── (b) sub -> X-Client-Id attestation (ADR-IC-010 §P3 / Document 11) ────
                # The caller identity is the OAuth `sub`, attested to the MCP server as
                # X-Client-Id and OVERWRITTEN so a client-supplied header can never assert
                # someone else's identity (IDOR). The MCP tools read X-Client-Id as the
                # gateway-attested actor and NEVER accept a client_id tool argument (Document 11
                # §"hallucinated parameters"). A token with no usable `sub` cannot establish
                # identity => fail closed. Mirrors the orchestrator routes' attestation.
                - |
                  local cjson = require("cjson.safe")
                  local function deny_id()
                    return kong.response.exit(401, {
                      code = "AUDIENCE_MISMATCH",
                      message = "The bearer token does not carry a usable subject for caller attestation (ADR-IC-010 §P3).",
                    })
                  end
                  local function b64url_decode(seg)
                    if type(seg) ~= "string" or seg == "" then return nil end
                    local s = seg:gsub("-", "+"):gsub("_", "/")
                    local pad = #s % 4
                    if pad == 2 then s = s .. "=="
                    elseif pad == 3 then s = s .. "="
                    elseif pad == 1 then return nil end
                    return ngx.decode_base64(s)
                  end
                  local auth = kong.request.get_header("authorization")
                  if type(auth) ~= "string" then return deny_id() end
                  local scheme, token = auth:match("^(%a+)%s+(.+)$")
                  if not token or scheme:lower() ~= "bearer" then return deny_id() end
                  local _, payload_seg = token:match("^([^%.]+)%.([^%.]+)%.([^%.]+)$")
                  if not payload_seg then return deny_id() end
                  local payload_json = b64url_decode(payload_seg)
                  if not payload_json then return deny_id() end
                  local claims = cjson.decode(payload_json)
                  if type(claims) ~= "table" then return deny_id() end
                  -- OVERWRITE any client-supplied X-Client-Id with the token `sub` (IDOR guard).
                  if type(claims.sub) ~= "string" or claims.sub == "" then return deny_id() end
                  kong.service.request.set_header("X-Client-Id", claims.sub)
                  -- ── (c) scope -> X-OAuth-Scope passthrough (ADR-IC-010 §P4) ────────────
                  -- Attest the granted OAuth scopes to the MCP server so it enforces
                  -- scope-per-tool (deposits:read for the read tool, deposits:write for the
                  -- writes — §P4). The `scope` claim is a space-delimited string (OAuth
                  -- convention); pass it verbatim and OVERWRITE any client value. Absent =>
                  -- empty scope (the app then rejects every tool — fail closed at the app).
                  local scope = claims.scope
                  if type(scope) == "string" and scope ~= "" then
                    kong.service.request.set_header("X-OAuth-Scope", scope)
                  else
                    kong.service.request.set_header("X-OAuth-Scope", "")
                  end

      # ── RFC 9728 Protected Resource Metadata — public discovery (ADR-IC-010 §P2) ──
      # GET /.well-known/oauth-protected-resource returns the metadata pointing at the
      # IAM as the authorization server. It MUST be reachable WITHOUT a token (a client
      # discovers the auth server BEFORE it has one), so the global jwt plugin is
      # route-DISABLED here (plugins: [{name: jwt, enabled: false}]) — the ONLY route that
      # disables jwt. POST /mcp above STAYS jwt-covered by the global plugin. NO anonymous
      # consumer fallback is added anywhere (that would break the pre-function ordering-safety
      # property on the OTHER routes — kong-config-check asserts none exists); disabling the
      # plugin on THIS read-only public metadata route is the surgical, ordering-safe way to
      # expose it.
      - name: mcp-well-known
        methods: ["GET"]
        paths: ["/.well-known/oauth-protected-resource"]
        strip_path: false
        plugins:
          - name: jwt
            enabled: false

# ── Edge policies attached GLOBALLY (apply to every route above) ─────────────────
plugins:
  # ADR-IC-006 §1 / §P7: validate the OAuth 2.0 bearer token's signature (RS256/ES256),
  # expiry, and issuer against the pre-registered consumer key. Kong maps the validated
  # token to the issuing consumer; the JWT `sub` claim is the client identity that the
  # per-consumer rate limits key on (ADR-IC-006 §P3) and that the orchestrator reads as
  # its gateway-attested caller. (The orchestrator's per-process OWNERSHIP check is the
  # second layer, ADR-IC-006 §P4 — Kong validates the token, the app enforces ownership.)
  - name: jwt
    config:
      # Standard bearer location: Authorization: Bearer <jwt> (and the `jwt` query/uri
      # params disabled — header only). claims_to_verify enforces token expiry.
      claims_to_verify: ["exp"]
      key_claim_name: iss
      maximum_expiration: 0
      header_names: ["authorization"]

  # ADR-IC-006 §P6: the opentelemetry plugin propagates the W3C `traceparent` header to
  # every upstream request, so a distributed trace begins at the edge and continues
  # through the orchestrator, the saga, and the engine — the same OTel-native signal as
  # every other service (ADR-IC-007). It exports to the OTel Collector (the single OTLP
  # entry point, ADR-IC-007 §P1) at its OTLP/HTTP traces endpoint.
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-collector:4318/v1/traces
      # W3C trace-context in and out (the propagation format the whole stack uses): the
      # plugin extracts an incoming `traceparent` and injects it on the upstream request.
      propagation:
        extract: ["w3c"]
        inject: ["w3c"]
        default_format: w3c
      resource_attributes:
        service.name: kong-edge

  # ADR-IC-006 §P3 IP-level fallback: a coarse per-IP DDoS-mitigation limit that applies
  # to ALL traffic (including any pre-auth path), layered under the per-consumer limits
  # on the financial/read routes above. 30 req/min per IP (the §P3 unauthenticated-path
  # budget), `local` policy at POC scale.
  - name: rate-limiting
    config:
      minute: 30
      policy: local
      limit_by: ip
      fault_tolerant: true
