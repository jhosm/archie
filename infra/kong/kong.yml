# ── JWT signing keys (ADR-IC-006 §1 / §P7) ──────────────────────────────────────
# The `jwt` plugin validates a bearer token's signature against a key pre-registered
# on the issuing CONSUMER. Kong CE's jwt plugin requires the IAM's public key to be
# PRE-REGISTERED (ADR-IC-006 Consequences: "jwt plugin requires public key
# pre-registration"; §P7: key rotation is a deliberate `deck sync`).
#
# RESIDUAL (ADR-IC-006 §P7): automatic JWKS rotation is NOT native to Kong CE's jwt
# plugin — a key rotation is a deliberate three-step `deck sync` (add new, retain old
# until tokens expire, remove old). If multi-issuer or frequent rotation becomes
# burdensome, APISIX's openid-connect with JWKS polling is the documented upgrade path.
consumers:
  - username: iam-issuer
    # The `key` is the JWT `iss` claim the IAM stamps; `algorithm` pins RS256
    # (asymmetric, per ADR-IC-006 §1: "signature (RS256/ES256)"). `rsa_public_key` is
    # a POC placeholder — replaced by the real IAM signing public key at deploy time.
    jwt_secrets:
      - key: https://iam.babelstone.example/
        algorithm: RS256
        # For RS256 the signature is verified against rsa_public_key; `secret` is
        # unused for asymmetric algorithms but the schema requires the field present.
        secret: unused-for-rs256
        # POC THROWAWAY public key paired with the cert above — replaced by the real IAM
        # signing public key at deploy time (a key rotation is a deliberate `deck sync`,
        # ADR-IC-006 §P7). Present so the jwt entity validates and the gate runs.
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAm28DnOOCLqSixANucnRv
          HYo3ID/liJXVP8xQJMXLBnG5rT8Oz1WV6SpbSVdVAiw19txFcrO93NzH0t5iN3NS
          FgeCyaRYKN9HuTg5ZVpZF2aHkT0Qo3nr+QhyzUBHE9Y4p6j7s5evQZ3/ZlA4Hglv
          dMHGXZYrb/EXj9cCpZrKHl23Aqb8na4/PRLI7+zwBz4FTXebWM2JVyEAxFxaRYId
          NaBjMBJVvCuKWlyx81vK68AUsmSPQEOU5LB96XLRcAoKyj6+hpnQE4uuRyd3rlTf
          7UdjRw2h8KCO8lWEQGaHIwfyogRtZGyPLQGR+0H7a5kPT64I3dpzPck8DQjvKuWe
          EwIDAQAB
