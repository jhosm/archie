# Critical SLI alert rules (K.3 — bd babelstone-gbgw).
#
# Prometheus alerting-rules file (the native `groups:` shape Prometheus' rule
# loader and `promtool check rules` accept). The metrics these rules read are
# ALREADY EMITTED by the engine over OTLP (ADR-IC-007 §P1) and land in the
# Grafana LGTM appliance's bundled Prometheus; this file materialises the ALERT
# RULES the §P4 / §S2 commitments call for — not the metrics, which exist.
#
# Wiring: the appliance's Prometheus is pointed at this file via `rule_files:`
# (see infra/grafana/README.md). On a deploy that fronts a standalone
# Prometheus, drop this file into its `rule_files` glob unchanged.
#
# Metric-name note (OTLP → Prometheus): the engine emits these on the
# `Babelstone.Engine` meter as snake_case-with-unit-suffix names
# (BabelstoneAttributes.*Metric), so the OTLP-to-Prometheus translation is a
# no-op on the names — `outbox_publish_lag_seconds` is read by exactly that
# string (ADR-IC-004 §P4 contract). OTLP delta counters are exposed cumulative
# with the `_total` suffix already present in the emitted name.
#
# Thresholds are deployment-time decisions (ADR-IC-004 §P4: "Alert threshold is
# a deployment-time decision"); the values below are the ADR-named POC defaults.
# Severity label convention: `severity: warning` | `severity: critical` — the
# Alertmanager/Grafana contact-point routing keys off it.

groups:
  # ---------------------------------------------------------------------------
  # Outbox publish lag — the canonical first-class SLI (ADR-IC-004 §P4).
  # Metric: outbox_publish_lag_seconds (observable gauge, age in seconds of the
  # OLDEST PENDING outbox row). Keeps climbing during an outage, so the Critical
  # rule fires when the publisher is not running or Redpanda is unavailable —
  # the exact failure mode the SLI exists to catch.
  # ---------------------------------------------------------------------------
  - name: outbox-publish-lag
    rules:
      - alert: OutboxPublishLagWarning
        # >30s sustained: normal operations are degraded but within a typical
        # Redpanda recovery window (ADR-IC-004 §P4 Warning).
        expr: outbox_publish_lag_seconds > 30
        for: 1m
        labels:
          severity: warning
          sli: outbox_publish_lag
          adr: ADR-IC-004
        annotations:
          summary: "Outbox publish lag >30s (oldest PENDING row)"
          description: >-
            outbox_publish_lag_seconds has exceeded 30s for 1m. The relay is
            falling behind; events are accumulating as PENDING rows in the
            outbox (the durability buffer). Investigate publisher throughput
            and Redpanda health before this escalates to critical.
          runbook: ../../runbooks/dr-recovery-drill.md
      - alert: OutboxPublishLagCritical
        # >5min: the publisher is not running or Redpanda is unavailable
        # (ADR-IC-004 §P4 Critical). The buffer is approaching sizes that stress
        # PostgreSQL write throughput / degrade the polling query.
        expr: outbox_publish_lag_seconds > 300
        for: 1m
        labels:
          severity: critical
          sli: outbox_publish_lag
          adr: ADR-IC-004
        annotations:
          summary: "Outbox publish lag >5min — publisher down or Redpanda unavailable"
          description: >-
            outbox_publish_lag_seconds has exceeded 300s for 1m. Per ADR-IC-004
            §P4 this means the publisher is not running or Redpanda is
            unavailable. The outbox buffer is growing unbounded; published
            delivery has stalled. Page on-call.

  # ---------------------------------------------------------------------------
  # Outbox publish LATENCY — the per-row end-to-end delivery histogram (a G.1
  # addition, NOT the §P4 backlog gauge). Metric: outbox_publish_latency_seconds
  # (OTLP histogram → *_bucket/_count/_sum in Prometheus). A high p99 here means
  # rows that DO publish take long; it complements the lag gauge (which captures
  # the rows that are NOT publishing at all). This is the §S2 "sync-projection
  # p99"-style latency SLI for the delivery path, on a metric that already
  # exists.
  # ---------------------------------------------------------------------------
  - name: outbox-publish-latency
    rules:
      - alert: OutboxPublishLatencyP99High
        # p99 publish latency >5s over 5m: delivery is slow even for rows that
        # complete (distinct from the lag gauge, which catches stalled rows).
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(outbox_publish_latency_seconds_bucket[5m]))
          ) > 5
        for: 5m
        labels:
          severity: warning
          sli: outbox_publish_latency_p99
          adr: ADR-IC-004
        annotations:
          summary: "Outbox publish p99 latency >5s"
          description: >-
            The 99th-percentile end-to-end publish latency
            (outbox_publish_latency_seconds) has exceeded 5s over 5m. Rows are
            publishing but slowly; check Redpanda produce latency and publisher
            polling cadence.

  # ---------------------------------------------------------------------------
  # Inbox poison rate — consumer-side delivery health (G.2). Metric:
  # inbox_poison_total (counter). A non-zero rate is a contract/registration
  # gap (un-decodable Avro, unknown event type, bad framing) — distinct from
  # inbox_tombstone_total (routine crypto-shred erasure traffic), which is
  # deliberately NOT alerted.
  # ---------------------------------------------------------------------------
  - name: inbox-poison
    rules:
      - alert: InboxPoisonRecordsAppearing
        # Any poison record in a 5m window warrants investigation — a healthy
        # contract surface produces none.
        expr: increase(inbox_poison_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          sli: inbox_poison
          adr: ADR-IC-004
        annotations:
          summary: "Inbox poison records appearing"
          description: >-
            inbox_poison_total increased over the last 5m: one or more records
            could not be processed (un-decodable Avro, unknown event type, bad
            wire framing, or missing ce_id) and were stepped past. This signals
            a contract or schema-registration gap. NOTE: tombstones
            (inbox_tombstone_total, GDPR erasure) are counted separately and do
            NOT fire this alert.

  # ---------------------------------------------------------------------------
  # §S2 Critical SLIs whose underlying metric is NOT YET EMITTED. Per the lane
  # brief these rules are present but GUARDED — they are commented out, each
  # carrying a TODO naming the emit that is pending and the bd/epic that owns it.
  # Uncommenting is the one-line change once the metric lands; the threshold and
  # severity are already decided here so the alert ships WITH the metric.
  #
  # These reference ADR-PC-005 §S2 (saga states, compensation rate, replication
  # lag) and the document 06 "saga in HUMAN_INTERVENTION_REQUIRED" alert.
  # ---------------------------------------------------------------------------
  - name: saga-and-replication-pending-emit
    rules: []
    # TODO(emit-pending) — SAGA STATE: a saga sitting in a terminal-stuck state.
    # Pending metric: a saga-state gauge/counter labelled by state, e.g.
    # saga_state{state="HUMAN_INTERVENTION_REQUIRED"} (ADR-IC-003 saga
    # orchestrator; document 06 names this exact alert). Owner: Epic E (saga
    # runtime). Uncomment when emitted:
    #
    #   - alert: SagaHumanInterventionRequired
    #     expr: saga_state{state="HUMAN_INTERVENTION_REQUIRED"} > 0
    #     for: 0m
    #     labels: { severity: critical, sli: saga_state, adr: ADR-PC-005 }
    #     annotations:
    #       summary: "Saga in HUMAN_INTERVENTION_REQUIRED"
    #       description: >-
    #         A saga has entered HUMAN_INTERVENTION_REQUIRED and cannot proceed
    #         automatically (e.g. a constitution stuck after a debit). Operator
    #         action required (document 06; ADR-PC-005 §S2).
    #
    # TODO(emit-pending) — COMPENSATION RATE: sustained compensation/rollback
    # rate. Pending metric: a compensation counter, e.g.
    # saga_compensation_total (tagged by process). Owner: Epic E. Uncomment when
    # emitted:
    #
    #   - alert: SagaCompensationRateHigh
    #     expr: sum(rate(saga_compensation_total[5m])) > 0.1
    #     for: 10m
    #     labels: { severity: warning, sli: compensation_rate, adr: ADR-PC-005 }
    #     annotations:
    #       summary: "Saga compensation rate elevated"
    #       description: >-
    #         Sustained compensation/rollback rate over 10m — an upstream failure
    #         is driving sagas into compensation (ADR-PC-005 §S2).
    #
    # TODO(emit-pending) — POSTGRES REPLICATION LAG: the warm-standby falling
    # behind (ADR-PC-005 §P1 RPO≈0 depends on the standby staying caught up).
    # Pending metric: postgres replication-lag bytes/seconds. With synchronous
    # replication the standby must stay current or commits BLOCK, so a rising
    # lag is an early DR-degradation signal. Emit is a postgres_exporter /
    # pg_stat_replication scrape (NOT engine code) — owner: M.4 follow-up /
    # observability. Uncomment when the exporter is wired:
    #
    #   - alert: PostgresReplicationLagHigh
    #     expr: pg_replication_lag_seconds > 10
    #     for: 1m
    #     labels: { severity: critical, sli: replication_lag, adr: ADR-PC-005 }
    #     annotations:
    #       summary: "Postgres standby replication lag >10s"
    #       description: >-
    #         The synchronous warm standby is falling behind (>10s). RPO≈0
    #         (ADR-PC-005 §P1) is at risk; with synchronous_commit on, primary
    #         commits may be blocking. Investigate the standby/network before a
    #         site loss costs acknowledged events.
    #
    # TODO(emit-pending) — SYNC-PROJECTION p99: synchronous read-projection
    # apply p99 (ADR-PC-005 §S2 / ADR-IC-005 read model). Pending metric: a
    # projection-apply latency histogram, e.g. projection_apply_seconds. Owner:
    # Epic F (projections runtime). The histogram_quantile shape mirrors the
    # outbox-publish-latency rule above; ship with the metric.

  # ---------------------------------------------------------------------------
  # SNAPSHOT OPERATIONS (L.6 — bd babelstone-0uau.2; ADR-PC-003 §P6). The two
  # snapshotter operational signals §P6 calls for. The snapshot store
  # (PostgresSnapshotStore) is wired into the live runtime (bd e6fr.11/12), and as
  # of bd babelstone-sk7e the engine now EMITS both signals, so this group is LIVE
  # (the guarded TODO posture it shipped with is retired). The thresholds +
  # severities decided when the rules shipped guarded are preserved verbatim. The
  # runbook (infra/runbooks/snapshot-operations.md) documents the operator response.
  #
  #   (1) SNAPSHOT LAG — the count of un-snapshotted events on a stream exceeding
  #       a threshold ⇒ the snapshotter is unhealthy (§P6 (1)). Emitted as the
  #       observable gauge snapshot_lag_events (the largest un-snapshotted depth
  #       observed across streams, raised in AggregateRuntime's post-commit
  #       snapshot path). Snapshots are a rebuildable cache, so this is a WARNING (a
  #       deep un-snapshotted stream makes the next cold replay slower, never
  #       wrong), not a critical.
  #   (2) HASH-MISMATCH ON READ — a snapshot whose stored hash did not verify on
  #       read (SnapshotStore.Verify throws). Emitted as the counter
  #       snapshot_hash_mismatch_total, incremented in that verify guard. The
  #       recovery is automatic-able (discard the snapshot, cold-rebuild the
  #       stream); a RECURRING mismatch is a snapshot-infrastructure bug to page on
  #       (§P6 (2)).
  # ---------------------------------------------------------------------------
  - name: snapshot-operations
    rules:
      # SNAPSHOT LAG (§P6 (1)): the §8.1 per-N trigger default is 100, so >500
      # un-snapshotted events means the snapshotter is ~5 thresholds behind —
      # clearly unhealthy. A WARNING: snapshots accelerate replay but never gate
      # correctness, so the worst outcome is a slower cold rebuild, never a wrong one.
      - alert: SnapshotLagHigh
        expr: snapshot_lag_events > 500
        for: 5m
        labels: { severity: warning, sli: snapshot_lag, adr: ADR-PC-003 }
        annotations:
          summary: "Snapshot lag >500 un-snapshotted events"
          description: >-
            A stream has accumulated >500 events since its last snapshot — the
            snapshotter is unhealthy (ADR-PC-003 §P6). Snapshots accelerate
            replay but never gate correctness, so this is a WARNING: the next
            cold rebuild is slower, not wrong. Investigate the post-commit
            snapshot-write path (the fail-soft onSnapshotError log) and the
            per-N policy config. Runbook: snapshot-operations.md.
          runbook: ../../runbooks/snapshot-operations.md

      # SNAPSHOT HASH-MISMATCH ON READ (§P6 (2) / §8.3): ANY mismatch warrants the
      # discard-and-rebuild recovery; a RECURRING one is a snapshot-infrastructure
      # bug to page on — hence critical, firing on a single occurrence in the window.
      - alert: SnapshotHashMismatch
        expr: increase(snapshot_hash_mismatch_total[1h]) > 0
        for: 0m
        labels: { severity: critical, sli: snapshot_hash, adr: ADR-PC-003 }
        annotations:
          summary: "Snapshot hash-mismatch on read (ADR-PC-003 §8.3)"
          description: >-
            A snapshot failed (state ‖ last_event_id) hash verification on read —
            the worst event-sourcing failure mode (a wrong snapshot trusted as
            truth) caught by the §8.3 guard. Recovery: discard the snapshot and
            cold-rebuild the stream (the read already fell back to a cold fold).
            A recurring mismatch is a snapshot-infrastructure bug — page on-call.
            Runbook: snapshot-operations.md.
          runbook: ../../runbooks/snapshot-operations.md

  # ---------------------------------------------------------------------------
  # PROJECTION RECONCILIATION (M.5 — bd babelstone-irfl). The three event-store
  # §7.1 reconciliation patterns the ProjectionReconciler computes
  # (engine/src/Babelstone.Engine/ProjectionReconciler.cs) — the operational
  # signals that make "the event log is the source of truth" provable:
  #   (a) per-instance state CHECKSUM mismatch (ChecksumReconciliation.Match=false)
  #       — the projection's materialised belief drifted from an independent cold
  #       fold of the log;
  #   (b) event-count SKIP (EventCountStatus.Skip) — the consumer advanced its
  #       sequence past events it never folded (a benign Gap is NOT alerted — it is
  #       acceptable async lag, §7.1);
  #   (c) full-rebuild-DRILL failure (RebuildReconciliation.Identical=false) — the
  #       monthly §7.2 cold rebuild did not reproduce the running state (the slow-
  #       drift bug class the drill exists to surface).
  #
  # EMIT STATUS (bd babelstone-k4ny, M.5): the reconciler now EMITS these on the
  # `Babelstone.Engine` meter (BabelstoneAttributes.Reconciliation*Metric;
  # engine/src/Babelstone.Engine/ProjectionReconciler.cs → ReconciliationMetrics),
  # so the rules below are LIVE — the §P5 deliberate-visible-hole is closed. The
  # reconciler increments reconciliation_checksum_mismatch_total when
  # ChecksumReconciliation.Match is false, reconciliation_event_count_drift_total
  # on an EventCountStatus.Skip (a benign Gap is NOT counted), and
  # reconciliation_rebuild_drill_divergence_total when RebuildReconciliation.Identical
  # is false — each tagged by `consumer` (the ReconciliationContract.Consumer
  # reference — never PII) and/or `projection_kind`. The names are snake_case-with-
  # unit-suffix (the OTLP→Prometheus no-op convention this file already uses); OTLP
  # exposes the delta counters cumulative with the `_total` suffix already in the
  # emitted name.
  #
  # The DRILL-FRESHNESS rule (d) is the exception: it does NOT depend on engine
  # code. The monthly projection-rebuild drill
  # (scripts/projection-rebuild-drill.sh / the projection-rebuild-drill.yml
  # workflow, bd babelstone-j67l) can push a `reconciliation_drill_last_success_timestamp_seconds`
  # gauge to a Prometheus Pushgateway / write a node_exporter textfile on each
  # green run; the rule then fires when no successful drill landed within the
  # §7.2 monthly cadence (a missed drill is a process incident — the same posture
  # the DR runbook takes). It is shipped LIVE-but-DEFENSIVE: `absent()` covers the
  # not-yet-wired case so an un-pushed metric reads as "no recent drill", which is
  # the safe interpretation.
  # ---------------------------------------------------------------------------
  - name: projection-reconciliation
    rules:
      - alert: ProjectionRebuildDrillStale
        # No successful monthly rebuild drill in >35 days (the §7.2 monthly cadence
        # plus a few days' grace). `absent(...)` makes a never-pushed metric fire
        # too — an un-run drill and a long-stale drill are the same finding: the
        # source-of-truth invariant is unproven. Wire the metric by having the
        # drill script push it on success (see the runbook); until then this alert
        # correctly reports the drill as un-evidenced.
        expr: |
          (time() - reconciliation_drill_last_success_timestamp_seconds > 35 * 24 * 3600)
          or absent(reconciliation_drill_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
          sli: projection_rebuild_drill_freshness
          adr: ADR-PC-005
        annotations:
          summary: "Projection-rebuild drill stale (>35d) or never recorded"
          description: >-
            No successful monthly projection-rebuild drill
            (FullRebuildDrillAsync, event-store §7.2) has been recorded in the
            last 35 days — or the freshness metric was never pushed. The
            source-of-truth invariant (a cold re-fold from the log reproduces the
            running projections byte-for-byte) is currently UNPROVEN. A missed
            drill is a process incident (ADR-PC-005 §P5). Run
            `make projection-rebuild-drill` (or trigger the
            projection-rebuild-drill workflow) and investigate any divergence.
          runbook: ../../runbooks/projection-rebuild-drill.md

      # CHECKSUM MISMATCH (§7.1 pattern (a), bd babelstone-k4ny): a projection
      # whose materialised belief drifted from a cold fold of the log. The
      # reconciler increments reconciliation_checksum_mismatch_total{consumer,
      # projection_kind} when ChecksumReconciliation.Match is false (emitted from
      # ProjectionReconciler.ReconcileAsync, the contract-driven boundary).
      - alert: ReconciliationChecksumMismatch
        expr: increase(reconciliation_checksum_mismatch_total[1d]) > 0
        for: 0m
        labels:
          severity: critical
          sli: reconciliation_checksum
          adr: ADR-PC-002
        annotations:
          summary: "Projection checksum mismatch (consumer drift, §7.1)"
          description: >-
            A daily per-instance state checksum (event-store §7.1 pattern (a))
            found a projection belief that disagrees byte-for-byte with an
            independent cold fold of the event log — consumer drift since the
            last reconciliation. Run the §7.2 rebuild drill on the affected kind
            to repair, then root-cause the handler drift. Page on-call: a
            regulator/auditor must never see a drifted projection first.
          runbook: ../../runbooks/reconciliation-alerts.md

      # EVENT-COUNT DRIFT / SKIP (§7.1 pattern (b), bd babelstone-k4ny): a
      # consumer that advanced its sequence past events it never folded
      # (lost/dropped events). The reconciler increments
      # reconciliation_event_count_drift_total{consumer,projection_kind} when
      # EventCountStatus is Skip — NOT for a benign Gap (acceptable async lag).
      - alert: ReconciliationEventCountSkip
        expr: increase(reconciliation_event_count_drift_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          sli: reconciliation_event_count
          adr: ADR-PC-002
        annotations:
          summary: "Projection event-count SKIP (events lost, §7.1)"
          description: >-
            Event-count reconciliation (event-store §7.1 pattern (b)) found a
            consumer whose belief reflects FEWER folded events than truly exist
            at/below its claimed sequence — it advanced past events it never
            applied. Distinct from a benign Gap (acceptable async lag, not
            alerted). This is a plumbing failure (lost/dropped events); the
            projection is incorrect until rebuilt. Page on-call.
          runbook: ../../runbooks/reconciliation-alerts.md

      # REBUILD-DRILL DIVERGENCE (§7.2 pattern (c), bd babelstone-k4ny): the
      # cold rebuild did not reproduce the running state. The reconciler
      # increments reconciliation_rebuild_drill_divergence_total{projection_kind}
      # when RebuildReconciliation.Identical is false (emitted from
      # FullRebuildDrillAsync). This is the in-process companion to the
      # ProjectionRebuildDrillStale freshness alert above: freshness catches a
      # drill that did not RUN; divergence catches a drill that RAN and FAILED.
      - alert: ReconciliationRebuildDivergence
        expr: increase(reconciliation_rebuild_drill_divergence_total[35d]) > 0
        for: 0m
        labels:
          severity: critical
          sli: reconciliation_rebuild
          adr: ADR-PC-002
        annotations:
          summary: "Projection rebuild drill DIVERGED (§7.2)"
          description: >-
            A full-rebuild drill (event-store §7.2) cold-re-folded the log and
            did NOT reproduce the running projection byte-for-byte — the
            slow-drift bug class (accumulated rounding, state-dependent
            conditional logic) the cheap daily checksum misses. Investigate the
            divergent kind before the next settlement cycle. Page on-call.
          runbook: ../../runbooks/reconciliation-alerts.md

  # ---------------------------------------------------------------------------
  # LIFECYCLE DRIVER (bd babelstone-1nkm.4; ADR-PC-036 / ADR-PC-038). The always-on
  # clock-owning money-mover: its worst failures are SILENT by construction — a
  # wedged tick loop just stops firing due maturities/installments, and a parked
  # settlement quietly stalls a recurring schedule with no arrears state anywhere
  # to make the miss visible. These rules read the LifecycleDriverMetrics surface
  # (the shared Babelstone.Engine meter): the tick-liveness heartbeat gauge is the
  # host's health signal (freshness + absent(), the same posture as the
  # EngineMetricsAbsent staging-liveness rule — the driver is a worker host with
  # no HTTP surface, so the heartbeat IS the probe), the failure counter catches a
  # driver that ticks but cannot land its POSTs, and the lag histogram catches one
  # that lands them ever later. Runbook: infra/runbooks/lifecycle-driver-ops.md.
  # Thresholds assume the default 1h poll interval (Lifecycle:PollIntervalSeconds)
  # — retune alongside it (thresholds are deployment-time decisions).
  # ---------------------------------------------------------------------------
  - name: lifecycle-driver
    rules:
      - alert: LifecycleDriverTickStale
        # No COMPLETED schedule pass for >2.5 poll intervals: the loop is wedged,
        # crash-looping, or stuck in max backoff against a dead dependency (engine
        # or Postgres down). Due money movement is NOT happening. 2.5x leaves room
        # for one full exponential-backoff recovery (ceiling 5m) before paging.
        expr: time() - lifecycle_pass_last_success_timestamp_seconds > 9000
        for: 5m
        labels:
          severity: critical
          sli: lifecycle_tick_liveness
          adr: ADR-PC-038
        annotations:
          summary: "Lifecycle driver has not completed a schedule pass in >2.5h"
          description: >-
            lifecycle_pass_last_success_timestamp_seconds is stale: no lifecycle
            schedule pass has run to completion for more than 2.5 poll intervals.
            Due maturities/installments are not being dispatched. Check the driver
            host's logs (Cadence backoff warnings), its engine command-surface
            target, and the dispatch-ledger Postgres. Missed occurrences backfill
            automatically once the loop recovers (the calendar re-derives them;
            command_dedup keeps retries effectively-once).
          runbook: ../../runbooks/lifecycle-driver-ops.md
      - alert: LifecycleDriverMetricsAbsent
        # The heartbeat gauge emits only after the FIRST completed pass, so an
        # absent series on a deployed driver means it is down, crash-looping
        # before its first tick, or its telemetry path is broken — the worker-host
        # analogue of EngineMetricsAbsent. On a stack that deliberately runs no
        # lifecycle driver, silence this rule at the Alertmanager route.
        expr: absent(lifecycle_pass_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          sli: lifecycle_tick_liveness
          adr: ADR-PC-038
        annotations:
          summary: "Lifecycle driver is not reporting its tick heartbeat"
          description: >-
            The lifecycle driver's tick-liveness gauge has been ABSENT for 30m —
            the host is down, has never completed a pass since deploy, or its
            telemetry is not reaching the collector. The engine keeps recording
            facts correctly; what is missing is the actor that fires due
            lifecycle commands.
          runbook: ../../runbooks/lifecycle-driver-ops.md
      - alert: LifecycleDispatchFailuresSustained
        # One failed POST is routine backpressure (the pass releases the claim and
        # retries next tick); failures ACROSS ticks for an hour mean the driver
        # persistently cannot land money-mover commands (engine 5xx, auth/SCA
        # principal misconfiguration, unroutable target).
        expr: sum(increase(lifecycle_dispatch_failure_total[1h])) > 2
        for: 10m
        labels:
          severity: critical
          sli: lifecycle_dispatch_failures
          adr: ADR-PC-038
        annotations:
          summary: "Lifecycle driver POSTs are failing repeatedly"
          description: >-
            lifecycle_dispatch_failure_total is rising across ticks: claimed due
            occurrences keep failing their engine POST and being released for
            retry. No occurrence is lost (claim->POST->record + command_dedup),
            but due money movement is stalled. Inspect the driver's dispatch
            warnings (status codes) and the engine command surface.
          runbook: ../../runbooks/lifecycle-driver-ops.md
      - alert: LifecycleDispatchLagP99High
        # Dispatching more than a day after the business due date: an extended
        # outage backfill or a persistently failing subset. The engine still
        # stamps the correct business valid_time (the command carries its own due
        # date), so this is an operations signal, not a correctness one.
        expr: histogram_quantile(0.99, sum by (le) (rate(lifecycle_dispatch_lag_seconds_bucket[6h]))) > 86400
        for: 30m
        labels:
          severity: warning
          sli: lifecycle_dispatch_lag
          adr: ADR-PC-038
        annotations:
          summary: "Lifecycle dispatch lag p99 >1 day"
          description: >-
            The p99 of lifecycle_dispatch_lag_seconds exceeds one day: due
            occurrences are being fired long after their business due date
            (post-outage backfill, or a subset repeatedly failing and retrying).
            Verify the tick cadence and the failure counter; business dates stay
            correct (bitemporal valid_time rides the command).
          runbook: ../../runbooks/lifecycle-driver-ops.md
      - alert: LifecycleScheduleHeld
        # The parked-settlement stall (ADR-PC-036 §Decision 4 / §Residual-risks
        # "must be alerted, not invisible"; LCD-2): a recurring rule HELD
        # occurrence N+1 because occurrence N's cash leg is parked in
        # HUMAN_INTERVENTION_REQUIRED. There is NO arrears state for the miss to
        # land in — this page is the only thing that makes the stall visible.
        # The emit hook (LifecycleDriverMetrics.RecordScheduleHeld) ships with the
        # monitoring surface; the settlement-health gate that CALLS it is the
        # LCD-2 build (bd babelstone-6cpq.10) — until it lands this series is
        # absent and the rule is dormant by construction (an absent series never
        # matches > 0), so the alert ships ready rather than commented out.
        expr: sum by (command_kind) (increase(lifecycle_schedule_held_total[24h])) > 0
        for: 0m
        labels:
          severity: critical
          sli: lifecycle_schedule_held
          adr: ADR-PC-036
        annotations:
          summary: "A lifecycle schedule is stalled behind a parked settlement"
          description: >-
            The settlement-health gate held a recurring occurrence because the
            prior occurrence's cash leg is parked in HUMAN_INTERVENTION_REQUIRED
            (LCD-2). The schedule will NOT advance until an operator resolves the
            parked settlement — there is no arrears state to catch the miss.
            Follow the parked-settlement procedure in the runbook.
          runbook: ../../runbooks/lifecycle-driver-ops.md

  # ---------------------------------------------------------------------------
  # BACKUP HEALTH (bd babelstone-zla1.12.5; ADR-PC-005 §P2 — off-site backups,
  # restore not assumed). A backup you cannot see failing is a backup you do
  # not have: the one copy of the data that survives losing the whole box is
  # the nightly logical dump → Hetzner Object Storage
  # (infra/k8s/overlays/staging/backup-cronjobs.yaml), and until now NOTHING
  # alerted when it failed or silently stopped running. Two complementary
  # rules:
  #   (1) FAILURE — the Job/CronJob visibly failed. Reads kube-state-metrics'
  #       kube_job_status_failed. The LGTM appliance's bundled Prometheus does
  #       not scrape kube-state-metrics YET, so this ships LIVE-but-DORMANT by
  #       construction (an absent series never matches > 0 — the exact
  #       LifecycleScheduleHeld posture): it arms itself the moment the
  #       maintainer wires kube-state-metrics, with threshold + severity
  #       already decided here.
  #   (2) FRESHNESS — no successful backup RECORDED in >26h (the ~daily 01:30
  #       cadence plus grace). Reads the backup_last_success_timestamp_seconds
  #       heartbeat the CronJob pushes AFTER asserting both objects were
  #       actually written off-box (PUSHGATEWAY_URL seam). `absent()` makes a
  #       never-pushed heartbeat fire too — an unwired heartbeat and a stale
  #       backup are the same finding: the off-box copy is UNPROVEN. This is
  #       the ProjectionRebuildDrillStale live-but-defensive posture.
  # ---------------------------------------------------------------------------
  - name: backup-health
    rules:
      - alert: BackupJobFailed
        # Any failed backup-family Job in a day is a page: db-logical-backup
        # (the off-box dump) and volume-snapshot (the CSI snapshot leg) share
        # the babelstone.io/dr-role backup posture; job_name carries the
        # CronJob-stamped prefix.
        expr: increase(kube_job_status_failed{job_name=~"(db-logical-backup|volume-snapshot).*"}[24h]) > 0
        for: 0m
        labels:
          severity: critical
          sli: backup_job
          adr: ADR-PC-005
        annotations:
          summary: "A backup Job failed (logical dump or volume snapshot)"
          description: >-
            kube_job_status_failed reports a failed db-logical-backup /
            volume-snapshot Job in the last 24h. The off-box copy of the data
            did not advance; the box is one disk loss away from exceeding the
            recovery point. Inspect the Job's pod logs (the fail-closed
            upload_and_assert step names the object that did not land) and
            re-run the CronJob once fixed. NOTE: dormant until the bundled
            Prometheus scrapes kube-state-metrics (maintainer wiring).
          runbook: ../../runbooks/staging-ops.md
      - alert: BackupFreshnessStale
        # >26h without a RECORDED successful backup (daily 01:30 UTC cadence
        # + grace), or the heartbeat was never pushed at all — either way the
        # off-box backup is currently unproven, which for DR purposes is the
        # same as absent (ADR-PC-005 §P2: restore is never assumed).
        expr: |
          (time() - backup_last_success_timestamp_seconds > 26 * 3600)
          or absent(backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
          sli: backup_freshness
          adr: ADR-PC-005
        annotations:
          summary: "Off-box backup stale (>26h) or never recorded"
          description: >-
            No successful nightly logical backup has been recorded in the last
            26 hours — or the backup_last_success_timestamp_seconds heartbeat
            has never been pushed (PUSHGATEWAY_URL unwired). The last provable
            off-box copy is aging; a box loss now means losing everything since
            it. Check the db-logical-backup CronJob's last runs and the
            Hetzner Object Storage bucket listing; wire the heartbeat seam
            (backup-cronjobs.yaml PUSHGATEWAY_URL) so freshness becomes
            provable rather than assumed.
          runbook: ../../runbooks/staging-ops.md

  # ---------------------------------------------------------------------------
  # STAGING LIVENESS (bd babelstone-zla1.7). The cheapest IN-CLUSTER "is the app
  # up" signal: the engine continuously emits outbox_publish_lag_seconds, so its
  # ABSENCE means the engine isn't reporting (down, crash-looping, or telemetry
  # broken). Complements the EXTERNAL ingress pinger — the end-to-end uptime check
  # documented in infra/runbooks/staging-ops.md. These rules load into the k8s
  # grafana-lgtm appliance via `rule_files:` — the staging overlay generates a
  # grafana-lgtm-rules ConfigMap from this file + prometheus.yaml and subPath-mounts
  # both into the appliance (bd babelstone-zla1.9). The Compose stack mounts the same
  # two files directly (infra/grafana/README.md).
  # ---------------------------------------------------------------------------
  - name: staging-liveness
    rules:
      - alert: EngineMetricsAbsent
        expr: absent(outbox_publish_lag_seconds)
        for: 5m
        labels:
          severity: critical
          sli: liveness
        annotations:
          summary: "Engine is not reporting metrics (staging may be down)"
          description: >-
            The engine's first-class SLI metric (outbox_publish_lag_seconds) has
            been ABSENT for 5m — the engine is down, crash-looping, or telemetry
            has stopped reaching the collector. Pair with the external ingress
            pinger on https://app.babelstone.dev/ for end-to-end uptime.
          runbook: ../../runbooks/staging-ops.md
