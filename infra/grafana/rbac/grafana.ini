# Grafana RBAC + access-logging config overlay — the observability-plane access control
# (ADR-IC-016 plane iii §7 / ADR-IC-007 §P6, bd babelstone-njt2.4).
#
# In plain English: this is the config that gives Grafana real roles (NOC / compliance /
# developer) and turns ON a log of who accessed what — so the trace store, which is a
# searchable database of every financial operation, is not open to all engineers, and every
# access to a financially-attributed trace leaves an audit trail (doc 10 Boundary 7).
#
# It is mounted into the grafana/otel-lgtm appliance as a config OVERLAY (the same additive
# posture as infra/grafana/prometheus/, see this subtree's README) — the dev compose does NOT
# mount it by default to keep `make up` boot simple; a deployment mounts it BEFORE the first
# financial span attribute is visible (ADR-IC-007 §P6: "must be in place before the first
# service emits spans carrying financial attributes").
#
# Mount (compose) — the otel-lgtm appliance reads Grafana's override config at conf/custom.ini
# (its run dir is the config homepath), so this rides there, NOT conf/grafana.ini; pair it with
# GF_AUTH_ANONYMOUS_ENABLED=false since the appliance force-defaults anonymous-Admin ON via an env
# var that wins over this file (see infra/grafana/rbac/README.md "How to apply"):
#   - ./grafana/rbac/grafana.ini:/otel-lgtm/grafana/conf/custom.ini:ro
#   - ./grafana/rbac/provisioning:/otel-lgtm/grafana/conf/provisioning/access-control:ro

[server]
# Public URL of the Grafana UI (bd zla1.10.1/zla1.10.6). Grafana derives the OIDC
# redirect_uri from root_url (<root_url>/login/generic_oauth), so this MUST match the
# public host the browser reaches AND the redirect URI registered on the Logto app.
# Staging fronts Grafana at grafana.babelstone.dev (ingress.yaml); dev `make up` overrides
# this via GF_SERVER_ROOT_URL if needed. Kept minimal — Grafana still binds its default
# 3000 inside the appliance; Traefik terminates TLS at the edge.
root_url = https://grafana.babelstone.dev

[users]
# New users get the lowest privilege by default (NOC-equivalent read-only); roles are then
# granted explicitly via the team/role provisioning. No silent Editor/Admin on signup.
auto_assign_org = true
auto_assign_org_role = Viewer

[auth]
# Disable anonymous access entirely — the observability plane is a regulated data store
# (ADR-IC-007 §P4 / doc 10 Principle 4), never world-readable.
disable_login_form = false

[auth.anonymous]
enabled = false

# ── Operator SSO via Logto OIDC (Boundary 6, ADR-IC-021 step 3 / ADR-IC-007 §P6, bd zla1.10.1) ──
# Grafana authenticates operators against Logto — the single OAuth 2.1 / OIDC Authorization Server
# (ADR-IC-021) — using its NATIVE generic_oauth, so the observability plane needs no separate auth
# product. Logto enforces the operator SSO + step-up MFA (TOTP/WebAuthn) at login; Grafana just
# trusts the resulting OIDC identity and maps the Logto role claim to a Grafana org role here
# (role_attribute_path). This is the OSS-enforceable org-role bridge; binding the four §P6 custom
# roles (engineer/noc/compliance/admin in provisioning/) to teams is the Enterprise team-sync /
# upstream-gateway path the README documents. The client_secret is NOT here — it is injected at
# deploy from the OpenBao-seeded Secret as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (never committed).
[auth.generic_oauth]
enabled = true
name = Logto
allow_sign_up = true
# Keep the login form available too (admin break-glass); operators click "Sign in with Logto".
auto_login = false
# The Logto application's client_id. Logto OSS AUTO-GENERATES the app id (there is no
# custom-id option in POST /api/applications), so this is Logto's generated id for the
# "babelstone-grafana" Traditional app (bd zla1.10.1) — the display name is babelstone-grafana,
# but the OIDC client_id is this value. The client_id is a PUBLIC identifier (not a secret);
# the secret rides in GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from the OpenBao-seeded Secret.
# CD enforcement (bd babelstone-zla1.10.19): the configure-logto job fail-loud verifies this exact id
# is a registered Logto app (scripts/iam/verify-oidc-clients.py), so a stale id after a re-onboard
# blocks the promote instead of silently breaking operator login with oidc.invalid_client. And the
# promote now rolls grafana-lgtm (bd babelstone-zla1.10.18) so an edit to this file actually reaches
# the running pod — this config is subPath-mounted from a stable-named ConfigMap, which `kubectl
# apply` alone never restarts.
client_id = 781jo540q0z3pz3mavex6
scopes = openid profile email roles
# Logto staging endpoints (auth.babelstone.dev/oidc). use_pkce so the code flow is PKCE-protected.
auth_url = https://auth.babelstone.dev/oidc/auth
token_url = https://auth.babelstone.dev/oidc/token
api_url = https://auth.babelstone.dev/oidc/me
use_pkce = true
# Map the Logto `roles` claim → a Grafana org role (NOC/compliance → Viewer, engineer → Editor,
# admin → Admin). A first-match JMESPath; the trailing 'Viewer' default means an authenticated
# operator with no mapped role still lands read-only (the auto_assign Viewer posture above), so
# role_attribute_strict can stay on without locking out a valid login.
role_attribute_path = contains(roles[*], 'babelstone:admin') && 'Admin' || contains(roles[*], 'babelstone:engineer') && 'Editor' || (contains(roles[*], 'babelstone:compliance') || contains(roles[*], 'babelstone:noc')) && 'Viewer' || 'Viewer'
role_attribute_strict = true
# Allow Logto to promote a babelstone:admin operator to Grafana server admin when the org-role
# JMESPath is extended to emit 'GrafanaAdmin'; harmless while the map tops out at org 'Admin'.
allow_assign_grafana_admin = true

[rbac]
# Turn on Grafana's role-based access control (OSS baseline: Viewer/Editor/Admin org roles +
# team-scoped folder & datasource permissions — ADR-IC-007 §P6 baseline 2026-05-17). The
# fine-grained per-folder roles below the org tier are an Enterprise feature; where OSS cannot
# enforce a split natively, the README documents the upstream-gateway fallback the ADR names.
enabled = true

[log]
# Access logging (doc 10 Boundary 7 / Principle 4: "access to traces carrying financial
# attributes is itself logged"). Grafana's request logger records every datasource query —
# including Tempo (trace) reads — with the acting user, so who-queried-what is auditable. The
# router_logging flag is what promotes per-request access lines into the log stream; the OTel
# Collector ships them to Loki where they are queryable + retained (ADR-IC-007).
mode = console file
level = info
# Emit a structured access line per HTTP request (datasource queries included) so a Tempo
# trace read is an auditable event. JSON so the access log is machine-queryable in Loki.
[log.console]
format = json

[log.frontend]
enabled = true

[dataproxy]
# Log every outbound datasource request (the Tempo/Loki/Prometheus query proxy). This is the
# load-bearing line for "financially-attributed trace access is logged": a trace query to Tempo
# goes through the dataproxy, so logging it captures WHO read trace data and WHEN.
logging = true
