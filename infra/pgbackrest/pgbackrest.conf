# pgBackRest configuration — PITR for the event store (M.4, bd babelstone-f0ui).
#
# ADR-PC-005 §P2: "Continuous WAL archiving plus scheduled base backups
# (pgBackRest or Barman) to off-site, retention-locked storage give
# point-in-time recovery if both primary and standby are lost. Backups are
# immutable within their retention window."
#
# This is the POC-default config (the off-site warm standby — ADR-PC-005 §P1 —
# is the RPO≈0 first line; PITR here is the §P2 second line for the
# both-nodes-lost case, bounding the base-backup floor to ≤ 60 s of WAL).
#
# CHOICE: pgBackRest over Barman. ADR-PC-005 §Decision names either; pgBackRest
# is chosen for its first-class incremental + block-level backups, parallel
# compression, and native immutable-retention support on object stores — the
# "retention-locked, immutable within the window" §P2 requirement. The choice is
# a tool pick WITHIN the ADR-named candidate set, not an ADR reversal.
#
# INI format (pgBackRest's native config; NOT YAML — mounted at
# /etc/pgbackrest/pgbackrest.conf). Mounted on BOTH the primary (archive-push,
# backup) and any restore host (restore).

[global]
# Repository 1: off-site object storage (S3-compatible). The POC points at a
# placeholder bucket; a real deployment swaps the endpoint/bucket/credentials.
# Object storage gives the "off-site" + "immutable within retention" §P2
# guarantees without a second filesystem to manage.
repo1-type=s3
repo1-s3-endpoint=s3.placeholder.local
repo1-s3-bucket=babelstone-pgbackrest
repo1-s3-region=eu-west-1
repo1-path=/event-store
# Immutable / retention-locked: keep a 14-day window of full+diff backups and
# the WAL needed to PITR anywhere inside it. The retention window is also the
# crypto-shred horizon bound (ADR-PC-005 §P4 / ADR-PC-004 §P5) — see the runbook.
repo1-retention-full=14
repo1-retention-full-type=time
# Encrypt the repo at rest (defence in depth; ciphertext PII may live in WAL).
# The cipher pass is injected from a Secret, never committed (see the manifest).
repo1-cipher-type=aes-256-cbc

# Archive async + parallelism so archive-push never blocks the primary's commit
# path (the §P2 WAL stream must not throttle the §P1 synchronous-commit path).
archive-async=y
archive-push-queue-max=1GiB
compress-type=zst
compress-level=3
process-max=4

# Tamper-evidence: every backup + WAL segment is checksummed; the manifest is
# verified on restore (ADR-PC-005 §P2 "backup restore is drilled, not assumed
# correct" — the drill in the runbook exercises this).
repo1-bundle=y
start-fast=y

# Log to stderr/stdout so the container's logs carry archive + backup outcomes
# (these feed the §S2 SLI surface once a pgbackrest exporter is wired — see the
# alert-rules TODO for replication/backup metrics).
log-level-console=info
log-level-file=detail

[event-store]
# The stanza = the primary's PGDATA. The path matches the StatefulSet's
# PGDATA subdir (ADR-PC-001 event store on postgres:18-alpine).
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-user=postgres
