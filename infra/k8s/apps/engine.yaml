# Engine — event-sourced product kernel (ADR-PC-010), the first application service on
# the staging cluster (bd babelstone-zla1.5.1).
#
# Runs the pack-baked derived image (ghcr.io/jhosm/babelstone-engine-staging — the base
# engine image + pt.2026.1 on disk; see infra/k8s/apps/engine/Dockerfile). An initContainer
# waits for the event-store migration sentinel before the engine starts, so the engine
# never boots against an unmigrated event store. Single replica (single-node staging box).
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: engine
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
    spec:
      # Gate the engine on the event-store migration: poll for the sentinel table the
      # migration Job writes when it finishes. Decoupled from any hardcoded migration
      # ceiling, needs no kube RBAC, and is race-free (only the Job applies; this only
      # waits). The engine's own family read-model migration self-applies after this.
      initContainers:
        - name: wait-for-event-store-migration
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until psql -tAc "SELECT 1 FROM _event_store_apply_complete LIMIT 1" 2>/dev/null | grep -q 1; do
                echo "waiting for event-store migration to complete ..."
                sleep 3
              done
              echo "event-store migration complete; starting engine."
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: engine
          image: ghcr.io/jhosm/babelstone-engine-staging:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # Password first, so the $(POSTGRES_PASSWORD) interpolation below resolves.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: POSTGRES_PASSWORD
            # With OpenBao__Enabled=true (below) the engine resolves the "Engine"
            # connection string FROM OpenBao KV (secret/data/Engine), so this env var is
            # the fallback the ConfigurationSecretProvider would use only if OpenBao were
            # off — kept because the wait-for-event-store-migration initContainer still
            # needs POSTGRES_PASSWORD to poll Postgres directly (it does not talk to
            # OpenBao). Not dead: the DB password is a legitimate initContainer input.
            - name: ConnectionStrings__Engine
              value: Host=postgres;Port=5432;Database=babelstone;Username=babelstone;Password=$(POSTGRES_PASSWORD)
            # Event bus — INTERNAL Redpanda listener (9092), not the 19092 host listener.
            - name: Kafka__BootstrapServers
              value: redpanda:9092
            - name: Bus__SchemaRegistryUrl
              value: http://redpanda:8081
            # Publish cataloged events to the bus as Avro + a registered Schema-Registry schema_id
            # (ADR-IC-004 / ADR-IC-008), not store-JSON. The codec is built lazily against
            # Bus__SchemaRegistryUrl above; Bus:RegisterSchemas defaults true so schemas self-register
            # on first publish. Uncataloged events stay store-only JSON (catalog-gated relay).
            - name: Bus__Encoding
              value: avro
            # Telemetry to the Collector only (ADR-IC-007 §P1), never direct-to-backend.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            # The engine boots-fails without an environment.
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            # OpenBao ON — exercise the REAL per-subject PII transit boundary
            # (ADR-PC-004) now that OpenBao is persistent (bd babelstone-zla1.12.13).
            # Flipping this from "false" changes the engine's composition root
            # (engine/src/Babelstone.Engine.Api/Program.cs): the ISecretProvider
            # becomes OpenBaoKvSecretProvider (AppRole login → reads the "Engine"
            # connection string from secret/data/Engine) and the IPiiKeyStore becomes
            # the real OpenBaoTransitClient. Both need an OpenBao-auth ANCHOR, which the
            # Secrets Store CSI SecretProviderClass (components/openbao-csi) syncs into
            # the babelstone-app-secrets Secret and this pod mounts (see the CSI volume
            # below). The engine talks to OpenBao directly over its own HttpClient; the
            # engine→openbao hop is walled by the allow-openbao-ingress NetworkPolicy.
            #
            # LIVE PREREQ (account-gated, NOT run from CI — see the PR Live-apply
            # checklist): the CSI driver + vault provider installed, OpenBao
            # initialised/unsealed, its k8s auth method + babelstone-app role + policy
            # provisioned, and secret/data/Engine (+ the engine-approle / engine-transit
            # anchors) populated. Until then the engine pod stays NotReady — fail-closed,
            # never a silent fallback to the placeholder Secret.
            - name: OpenBao__Enabled
              value: "true"
            # In-cluster OpenBao API. The KV secret provider AND the transit key store
            # share this address (Program.cs OpenBao:Address).
            - name: OpenBao__Address
              value: http://openbao:8200
            # AppRole anchor for the KV secret provider (role-id + secret-id → login →
            # client token). Sourced from the CSI-synced Secret, NOT committed. MountPath
            # defaults to "secret" (the KV v2 mount) in Program.cs.
            - name: OpenBao__RoleId
              valueFrom:
                secretKeyRef:
                  name: babelstone-app-secrets
                  key: OPENBAO_APPROLE_ROLE_ID
            - name: OpenBao__SecretId
              valueFrom:
                secretKeyRef:
                  name: babelstone-app-secrets
                  key: OPENBAO_APPROLE_SECRET_ID
            # Token for the transit key store (the per-subject crypto-shred boundary).
            # TransitMount defaults to "transit" in Program.cs. Also CSI-synced.
            - name: OpenBao__Token
              valueFrom:
                secretKeyRef:
                  name: babelstone-app-secrets
                  key: OPENBAO_TRANSIT_TOKEN
            # Regulatory pack — disk mode loads pt.2026.1 baked into this image at /app/packs.
            - name: Engine__PackRegistry
              value: disk
            - name: Engine__PacksDir
              value: /app/packs
            - name: Engine__PackVersion
              value: pt.2026.1
            # Per-variant product-config YAMLs baked into this image at /app/product-configs
            # (see the derived Dockerfile). Without this the term_deposit family's
            # YamlProductConfigStore can't find the tree and every POST /v1/deposits 500s.
            - name: Engine__ProductConfigsDir
              value: /app/product-configs
          # The engine returns 404 (not 2xx) for the demo's probe path, which a k8s httpGet
          # would treat as a failure, and has no /healthz — so probe the TCP socket: a bound
          # 8080 means Kestrel + the API host are up.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Mount the Secrets Store CSI volume. The MOUNT is what makes the driver
          # fetch the OpenBao KV secrets and (via the SecretProviderClass
          # secretObjects) sync them into the babelstone-app-secrets Secret the env
          # secretKeyRef above reads. readOnly is mandatory for a CSI inline volume.
          # The files also land under /mnt/secrets-store, though the engine reads its
          # anchor from env (the synced Secret), not the files.
          volumeMounts:
            - name: openbao-app-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        # Secrets Store CSI inline volume bound to the babelstone-app-secrets
        # SecretProviderClass (infra/k8s/components/openbao-csi). Sources the
        # app-tier + OpenBao-anchor secrets FROM OpenBao (k8s auth) rather than a
        # committed k8s Secret — the ADR-PC-004 §A1 boundary. The
        # SecretProviderClass is applied OUT-OF-BAND at bootstrap (the least-privilege
        # cd-deployer holds no secretproviderclasses grant, bd babelstone-zla1.12.14.2);
        # the CSI driver + vault provider install is likewise the out-of-band bootstrap
        # residual. This CSI volume only references it by name.
        - name: openbao-app-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: babelstone-app-secrets
