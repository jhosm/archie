# Notification — per-service outbox/reminder worker (ADR-IC-011), bd babelstone-zla1.5.2.
#
# A headless .NET BackgroundService (NOT an HTTP API): it polls the engine's read surface and
# decides reminders are due. So it has NO inbound port — no Service, no Ingress, no probes that
# connect to a port (there's nothing listening). replicas:1 is required: the v1 dedupe ledger is
# in-memory and per-pod, so two replicas would each independently decide the same reminder is due.
# It talks only to the engine API and the OTLP collector; no DB, Kafka, Kong, or OpenBao. No PII.
#
# Runs the pack-baked derived image (ghcr.io/jhosm/babelstone-notification-staging — the base
# notification image + pt.2026.1 under /app/packs, bd zla1.5.10), because the host resolves its
# instance-pinned regulatory pack off disk at startup (ADR-PC-007 §P4). The pack is a directory
# tree a flat ConfigMap can't carry, so it is baked into the image exactly as engine-staging does
# (zla1.5.1); Engine__PacksDir below points the host's disk walk at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
    spec:
      containers:
        - name: notification
          image: ghcr.io/jhosm/babelstone-notification-staging:latest
          env:
            # The only hard-required runtime config (the host throws if the engine URL is unset).
            # Internal mTLS on the engine-read hop — see the InternalMtls__* keys below.
            - name: Engine__BaseUrl
              value: https://engine:8080
            # Regulatory pack — the host loads pt.2026.1 off disk at startup (ADR-PC-007 §P4),
            # baked into this derived image at /app/packs (see the header + infra/k8s/apps/notification/Dockerfile).
            - name: Engine__PacksDir
              value: /app/packs
            - name: Engine__PackVersion
              value: pt.2026.1
            # ── Caller-side internal mTLS on the engine-read hop (bd babelstone-zla1.12.10; ADR-IC-006
            # §P5 Boundary 2 / ADR-IC-016 plane (i)) ──────────────────────────────────────────────
            # The worker READS deposit facts from https://engine:8080 presenting THIS client cert
            # (signed by the shared internal CA, mcp-mtls-ca) and pinning the engine's server cert to
            # that same CA (InternalMtls.cs). Client material is the babelstone-notification-client-tls
            # Secret cert-manager issues (overlays/staging/bootstrap/internal-mtls.yaml), mounted at
            # /certs below. On STAGING these env keys are set unconditionally, so once this manifest is
            # applied the worker reads over https and presents a client cert — if the engine server is
            # still plain HTTP, that read hop breaks. So the callers, the internal-mtls.patch.yaml server
            # flip, and the deck-sync must land TOGETHER in one maintenance window (that patch's ROLLOUT
            # ORDER steps 3–4). (These keys are only truly inert on the CA-env-UNSET hosts — the demo,
            # the local stack, tests — where InternalMtls.cs leaves the HttpClient handler at its
            # plain-HTTP default.)
            - name: InternalMtls__CaCertPath
              value: /certs/ca.crt
            - name: InternalMtls__ClientCertPath
              value: /certs/tls.crt
            - name: InternalMtls__ClientKeyPath
              value: /certs/tls.key
            # Fail-fast without a deployment environment (ADR-IC-007 §P1 non-blank requirement).
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
          volumeMounts:
            # The notification worker's CLIENT cert for the engine-read hop (tls.crt/tls.key) + the
            # internal CA (ca.crt) it pins the engine's server cert to (babelstone-notification-client-tls).
            - name: notification-client-tls
              mountPath: /certs
              readOnly: true
          # No port → no httpGet/tcpSocket probe is meaningful; rely on the restart policy. On a
          # transient engine-read failure the worker backs off (exponential, 5-min ceiling) and
          # keeps running rather than crashing, so a liveness probe would only cause false restarts.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        # The notification worker's internal-mTLS CLIENT cert (bd babelstone-zla1.12.10). Standard
        # cert-manager keys (tls.crt/tls.key/ca.crt) the InternalMtls__*Path env point at directly.
        - name: notification-client-tls
          secret:
            secretName: babelstone-notification-client-tls
