# SecretProviderClass — source app-tier secrets from OpenBao via the Secrets
# Store CSI driver (bd babelstone-zla1.12.13).
#
# Plain English: this tells the Secrets Store CSI driver WHICH secrets to pull
# out of OpenBao and how to expose them to app pods. Instead of the Postgres
# password / Logto KEK living in a plain Kubernetes Secret in
# etcd, a pod mounts a CSI volume and the driver fetches those values straight
# from OpenBao (authenticating as the pod's ServiceAccount via OpenBao's
# Kubernetes auth method). With `secretObjects` the driver ALSO mirrors them into
# a k8s Secret (`babelstone-app-secrets`) so existing `secretKeyRef`/`env` wiring
# keeps working unchanged — the difference is the values now ORIGINATE in OpenBao,
# not from a committed placeholder.
#
# Provider: `vault`. OpenBao is Vault-API-compatible, so the upstream HashiCorp
# vault-csi-provider talks to it unchanged (vaultAddress points at the in-cluster
# openbao Service). The provider plugin is a separate cluster-scoped install —
# see README.md "Apply order" (out-of-band, like the base driver).
#
# AUTH: OpenBao's Kubernetes auth method verifies the mounting pod's projected SA
# token and maps it to the `babelstone-app` OpenBao ROLE (created by the operator
# init step, README.md), which is bound to a read-only policy over
# secret/data/babelstone/*. This is the k8s-auth path the acceptance criterion
# requires — no long-lived token in a manifest.
#
# NB: this is the SecretProviderClass INSTANCE (a custom resource), namespaced to the
# babelstone-staging app namespace. It is applied OUT-OF-BAND at bootstrap with the operator's
# cluster-admin kubeconfig — `kubectl apply -n babelstone-staging -f <this file>` (see
# bootstrap/README.md; bd babelstone-zla1.12.14.2) — NOT rendered into `kustomize build
# overlays/staging`, because the least-privilege cd-deployer holds no secretproviderclasses grant
# (like the openbao SA/CRB in bootstrap/openbao-auth.yaml). The SecretProviderClass CRD + the
# driver DaemonSet live in ./upstream (vendored, kube-system). Since this instance is never in any
# strict overlay render, no kubeconform -ignore-missing-schemas is needed for it — the routine
# renders (base/ha/staging) stay fully -strict.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: babelstone-app-secrets
  labels:
    app.kubernetes.io/name: openbao-csi
    app.kubernetes.io/part-of: babelstone
spec:
  provider: vault
  # Mirror the fetched values into a k8s Secret so the engine / Logto manifests'
  # existing secretKeyRef wiring resolves unchanged — the values now come FROM
  # OpenBao. A pod must MOUNT the CSI volume for this sync to happen (the driver
  # syncs on mount); the consuming Deployment carries the volume + volumeMount
  # (engine.yaml does, for the OpenBao AppRole/token it needs at boot).
  secretObjects:
    - secretName: babelstone-app-secrets
      type: Opaque
      labels:
        app.kubernetes.io/part-of: babelstone
      data:
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
        - objectName: secret-vault-kek
          key: SECRET_VAULT_KEK
        - objectName: openbao-approle-role-id
          key: OPENBAO_APPROLE_ROLE_ID
        - objectName: openbao-approle-secret-id
          key: OPENBAO_APPROLE_SECRET_ID
        - objectName: openbao-transit-token
          key: OPENBAO_TRANSIT_TOKEN
  parameters:
    # The OpenBao Kubernetes-auth role the mounting pod's SA maps to (operator
    # init step, README.md). audience matches the auth-method config.
    roleName: "babelstone-app"
    audience: "openbao"
    # In-cluster OpenBao API address (plain HTTP inside the pod network; the hop
    # is walled by the allow-openbao-ingress NetworkPolicy, staging overlay). MUST be
    # the FQDN, NOT the short name `openbao`: the vault-csi-provider that dials this runs
    # in kube-system (pod IP), so a short name resolves in ITS namespace — where no
    # openbao Service exists — and fails "lookup openbao … no such host". The openbao
    # Service lives in the babelstone-staging app namespace (bd babelstone-zla1.12.31; this
    # component is staging-only). When listener TLS lands (paired with internal mTLS), add
    # vaultCACertPath here.
    vaultAddress: "http://openbao.babelstone-staging.svc.cluster.local:8200"
    # KV v2 paths under secret/data/babelstone/*. objectName is the file the driver
    # writes into the mounted volume AND the source key for the secretObjects sync
    # above; secretKey is the field within the KV v2 secret at secretPath.
    #
    # The app-tier secrets the acceptance criterion names (DB password, Logto KEK)
    # PLUS the engine's own OpenBao-auth anchor (the AppRole
    # role-id/secret-id it uses for the KV secret provider, and the transit token
    # for the per-subject PII key store — see engine.yaml). These OpenBao paths are
    # populated by the operator once at init (README.md); the values NEVER live in
    # a committed manifest.
    objects: |
      - objectName: "postgres-password"
        secretPath: "secret/data/babelstone/postgres"
        secretKey: "password"
      - objectName: "secret-vault-kek"
        secretPath: "secret/data/babelstone/logto"
        secretKey: "secret_vault_kek"
      - objectName: "openbao-approle-role-id"
        secretPath: "secret/data/babelstone/engine-approle"
        secretKey: "role_id"
      - objectName: "openbao-approle-secret-id"
        secretPath: "secret/data/babelstone/engine-approle"
        secretKey: "secret_id"
      - objectName: "openbao-transit-token"
        secretPath: "secret/data/babelstone/engine-transit"
        secretKey: "token"
