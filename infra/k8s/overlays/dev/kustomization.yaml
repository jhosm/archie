# dev / staging-shaped overlay (the single environment).
#
# Single-replica everywhere — NO HA. The HA topology (3-node Redpanda, Postgres
# HA, warm standby) is P.7 (babelstone-ixkp) and will live in a separate
# overlay; this base/dev split is the seam it diverges from. The CD/promotion
# pipeline is Q.6 (babelstone-4c81).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: babelstone-dev

resources:
  - ../../base

# Replicas pinned to 1 explicitly. The base already ships single-replica; these
# patches make the dev intent the documented seam a future HA overlay overrides.
replicas:
  - name: postgres
    count: 1
  - name: redpanda
    count: 1
  - name: redpanda-console
    count: 1
  - name: kong
    count: 1
  - name: openbao
    count: 1
  - name: grafana-lgtm
    count: 1
  - name: otel-collector
    count: 1
  - name: registry
    count: 1
  - name: eventcatalog
    count: 1
