# Durable backing store for the Backstage catalogue Postgres. The base ships
# backstage-db PVC-less (ephemeral) — fine for the throwaway dev stack, but on the
# always-on staging box the portal DB must survive a pod restart / node rebuild,
# so it gets its own Hetzner CSI block volume (snapshot-able for the Phase-6
# backups, bd babelstone-zla1.7). Mounted by backstage-db-storage.patch.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backstage-db-data
  labels:
    app.kubernetes.io/name: backstage-db
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: hcloud-volumes
  resources:
    requests:
      storage: 2Gi
