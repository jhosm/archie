# Remove the committed DEV-ONLY placeholder Secret from the STAGING render
# (bd babelstone-zla1.12.4; ADR-PC-004 §A1 — never inline literal credentials).
#
# Plain English: base/secrets.example.yaml ships trivial, world-readable example
# credentials (POSTGRES_PASSWORD=babelstone, OPENBAO_DEV_TOKEN=root, placeholder
# Logto keys) so a laptop `kustomize build` resolves the secretKeyRef wiring.
# Rendering that Secret into the always-on public box meant every redeploy
# silently OVERWROTE the operator-provisioned real credentials with the known
# placeholders. This strategic-merge `$patch: delete` drops the Secret from the
# staging output entirely: the deploy never carries credential bodies, and a
# redeploy can no longer clobber the real `babelstone-dev-secrets` the operator
# creates once (runbook §1 step 5). scripts/cd-secret-preflight.sh is the
# fail-closed half — the promote lane refuses to apply if the live Secret is
# missing or still holds a placeholder value.
apiVersion: v1
kind: Secret
metadata:
  name: babelstone-dev-secrets
$patch: delete
