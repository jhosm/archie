# Logto — OAuth 2.1 / OIDC Authorization Server (ADR-IC-021), the staging box's IAM
# (bd babelstone-zla1.10.2).
#
# Plain English: this is the service that logs users in and hands out the tokens for the public
# staging box — the login screen, the strong-customer-authentication (SCA) step, and the
# authority third-party AI agents talk to over MCP. Kong already CHECKS tokens at the edge and
# the MCP server already VALIDATES them; Logto is the missing ISSUER that ADR-IC-021 selected.
# It runs as a single Node container reusing the existing Postgres (its own `logto` database)
# and sits behind the public `auth.babelstone.dev` Traefik Ingress (ingress.yaml) — the 4th
# public host on the box.
#
# Secret boundary (ADR-PC-004 §A1 / ADR-IC-021 §staging-rollout): the secret-vault KEK and the
# OIDC token-signing key are sourced from the OpenBao-seeded Secret via secretKeyRef — NEVER an
# inline literal, never on the bus. Logto persists the signing key in its DB config
# (`oidc.privateKeys`): the init/seed Job (logto-jobs.yaml) installs it from this same OpenBao
# material, and the annual rotate CronJob rolls a fresh key in-DB with a grace period. It is
# referenced on the Pod here too so the signing-key dependency is explicit and the material is
# pod-injected, not baked into the image.
#
# Lives in the staging overlay (not the apps/ product-service layer): like Mission Control it is
# a staging-specific, public-facing concern. Upstream image (the OFFICIAL ghcr.io/logto-io/logto,
# pinned to an explicit version tag + digest — bd babelstone-zla1.12.34) runs on the CPX42 x86
# staging node (bd babelstone-zla1.13). CI VALIDATES ONLY (kustomize build +
# kubeconform); the live apply / DNS / cert issuance is account-gated (Phase 0-2).
apiVersion: v1
kind: Service
metadata:
  name: logto
  labels:
    app.kubernetes.io/name: logto
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: logto
  ports:
    # Core service (3001): the sign-in experience, the OAuth/OIDC endpoints + RFC 8414 discovery,
    # the APIs — AND, under ADMIN_DISABLE_LOCALHOST=true, the admin console + Management API too,
    # which Logto serves on this SAME listener routed to the admin tenant by the ADMIN_ENDPOINT Host
    # (auth-admin.babelstone.dev). Both public Ingresses (auth + auth-admin, ingress.yaml) front
    # this one port. There is deliberately NO separate 3002 port: with localhost disabled Logto
    # never opens the admin listener (see ADMIN_DISABLE_LOCALHOST below), so a 3002 Service port
    # would be a dead backend — the bd zla1.10.10 502 was exactly an Ingress still aimed at it.
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
  labels:
    app.kubernetes.io/name: logto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logto
    spec:
      # Gate Logto on its DB being seeded: poll for the `logto_configs` table the init Job
      # (logto-jobs.yaml) writes, so the server never boots against an un-seeded schema.
      # Race-free (only the Job seeds; this only waits) — mirrors the engine's
      # wait-for-event-store-migration init.
      initContainers:
        - name: wait-for-logto-db
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until psql -tAc "SELECT 1 FROM logto_configs LIMIT 1" 2>/dev/null | grep -q 1; do
                echo "waiting for the logto database to be seeded ..."
                sleep 3
              done
              echo "logto database seeded; starting Logto."
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: logto
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: logto
          image: ghcr.io/logto-io/logto:1.41.0
          ports:
            # Only the core listener (3001) is bound: ADMIN_DISABLE_LOCALHOST=true (below) tells
            # Logto NOT to open the separate admin listener, so there is no 3002 containerPort.
            - name: http
              containerPort: 3001
          env:
            # Password first, so the $(LOGTO_DB_PASSWORD) interpolation in DB_URL resolves.
            - name: LOGTO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: POSTGRES_PASSWORD
            # Logto reuses the existing Postgres (ADR-IC-021 §soft-criteria) in its own `logto`
            # database (created by the init Job). Same hardcoded-user / interpolated-password
            # seam the engine + orchestrator use.
            - name: DB_URL
              value: postgres://babelstone:$(LOGTO_DB_PASSWORD)@postgres:5432/logto
            # Public base URL — the auth subdomain fronted by Traefik (ingress.yaml). Behind a
            # reverse proxy, so trust the forwarded headers.
            - name: ENDPOINT
              value: https://auth.babelstone.dev
            # Admin console base URL (bd zla1.10). Sets the ADMIN-tenant OIDC issuer + the console
            # redirect URIs. MUST be the real HTTPS host the console is reached at (the logto-admin
            # Ingress), because the DEFAULT tenant's Management API only accepts operator tokens
            # whose iss = {ADMIN_ENDPOINT}/oidc. Unset, Logto defaults it to http://localhost:3002,
            # and a port-forward then mints an issuer the Management API rejects (401 on every
            # write). Logto OSS v1.41 reads the admin signing keys from the DB (PR #8869), so this
            # host does not need to be self-reachable from the pod — only the issuer must match.
            - name: ADMIN_ENDPOINT
              value: https://auth-admin.babelstone.dev
            # Defense-in-depth for the now-public admin console (bd zla1.10.6): this does NOT merely
            # tighten CORS — it CLOSES the separate admin listener entirely. Logto guards
            # `adminServer.listen(adminUrlSet.port)` on `!adminUrlSet.isLocalhostDisabled`
            # (packages/core/src/app/init.ts), so port 3002 is never bound. The admin console is
            # served instead by the CORE listener (3001), which routes to the admin tenant by
            # matching the request Host against ADMIN_ENDPOINT (TRUST_PROXY_HEADER=true trusts
            # Traefik's forwarded Host). Consequence: the console is reachable ONLY via the real
            # ADMIN_ENDPOINT host (behind Traefik + Cloudflare Access), never a bare localhost:3002
            # port-forward — AND the `logto-admin` Ingress MUST front 3001, not 3002, or every
            # post-Access request 502s on the closed port (the bd zla1.10.10 regression). The network
            # gate (Cloudflare Access) is the load-bearing control.
            - name: ADMIN_DISABLE_LOCALHOST
              value: "true"
            - name: TRUST_PROXY_HEADER
              value: "true"
            - name: PORT
              value: "3001"
            # Inert while ADMIN_DISABLE_LOCALHOST=true (the admin listener is never opened); kept as
            # the documented default so flipping localhost back on needs no re-derivation.
            - name: ADMIN_PORT
              value: "3002"
            # Secret-vault KEK — encrypts connector secrets at rest. Sourced from the
            # OpenBao-seeded Secret (ADR-PC-004 §A1); NEVER an inline literal, never on the bus.
            - name: SECRET_VAULT_KEK
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: SECRET_VAULT_KEK
            # OIDC token-signing key, same OpenBao-held material. Logto PERSISTS it in the DB
            # (`oidc.privateKeys`), seeded by logto-jobs.yaml and annually rotated; referenced
            # here so the signing-key dependency is explicit and the material is pod-injected,
            # not image-baked.
            - name: OIDC_PRIVATE_KEYS
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: OIDC_PRIVATE_KEYS
          # Logto's main endpoint has no guaranteed 2xx liveness route; probe the TCP socket (a
          # bound 3001 = the Node server is up) — the same convention as engine/orchestrator.
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          # The CPU/memory request + limit is centralised in resources.patch.yaml (the staging
          # "no OOM mid-demo" sizing invariant), alongside the other staging workloads.
