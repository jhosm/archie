# staging overlay — the always-on demo/staging environment (bd babelstone-zla1).
#
# Plain English: this is the single, public, always-on box. It takes the same
# `base` backing-infra stack the `dev` overlay does, runs ONE copy of everything
# (a single 32GB ARM node — HA would not fit), pins DURABLE Hetzner CSI block
# storage so data survives a node rebuild and is snapshot-able, and puts a public
# HTTPS front door (Traefik Ingress + cert-manager/Let's Encrypt TLS) in front of
# the Kong edge and the Backstage portal.
#
# Diverges from the SAME base/dev seam the `overlays/ha` overlay does, in the
# staging direction:
#   1. namespace      babelstone-dev → babelstone-staging
#   2. storage        unset (k3s local-path) → hcloud-volumes (durable, snapshot-able)
#   3. backstage-db   ephemeral → a durable PVC (base ships it PVC-less)
#   4. public edge    ClusterIP-only → a Traefik Ingress + cert-manager TLS
#                     fronting Kong (the ADR-IC-006 authz edge stays in force,
#                     now BEHIND Traefik) and the Backstage subdomain
#
# GOVERNANCE (ADR-PC-020 §D3 explicit-drift): adding a public Ingress extends the
# documented "ingress beyond Kong out of scope" posture. It is acknowledged in the
# SAME change — see infra/k8s/README.md (amended scope note + this overlay's
# section) and the introducing PR body. Kong stays the ADR-IC-006 edge; OTLP
# 4317/4318 is never exposed (ADR-IC-007 §P1); no PII crosses the bus (ADR-PC-004).
#
# CI VALIDATES ONLY (kustomize build + kubeconform, the same gate as dev/ha).
# Provisioning the node, installing the Hetzner CSI driver + cert-manager + the
# Let's Encrypt ClusterIssuer (bootstrap/), pointing DNS at the node, and applying
# this overlay are the account-gated Phase 0–2 steps (cd.yml promotes it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: babelstone-staging

resources:
  - ../../base
  # The application services layer (engine + later orchestrator/notification/mcp-server,
  # plus the event-store migration Job) — bd babelstone-zla1.5. Kept out of base/ (which
  # stays backing-infra-only); dev/ha don't reference it, so only staging runs the apps.
  - ../../apps
  # The public edge (built-in networking.k8s.io/v1 Ingress — kubeconform-clean).
  # The cert-manager ClusterIssuer it references is a CRD applied at cluster
  # bootstrap (bootstrap/), deliberately OUTSIDE this kustomization so the strict
  # kubeconform gate (which carries no CRD schemas) stays green.
  - ingress.yaml
  # Durable backing store for the Backstage Postgres (base ships it PVC-less, so
  # its catalogue DB would not survive a pod restart on the always-on box).
  - backstage-db-pvc.yaml
  # The Mission Control demo UI (Deployment + Service) — demo-specific, so it lives here
  # rather than in the apps/ product-service layer (bd babelstone-zla1.5.5). Its public
  # Ingress (app.babelstone.dev) is in ingress.yaml above.
  - mission-control.yaml
  # Logto — the OAuth 2.1 / OIDC Authorization Server (ADR-IC-021, bd babelstone-zla1.10.2):
  # the staging box's token issuer (login + SCA + the MCP-agent authority). Staging-specific,
  # public-facing (auth.babelstone.dev, the 4th host in ingress.yaml above), so it lives in the
  # overlay rather than the apps/ layer — exactly like Mission Control. logto-jobs.yaml carries
  # its DB lifecycle (init/seed, the per-release alteration upgrade, the annual key rotation).
  - logto.yaml
  - logto-jobs.yaml
  # Ops baseline (bd babelstone-zla1.7): scheduled logical DB backups → Hetzner Object
  # Storage, and CSI VolumeSnapshots of the data PVCs. (k3s auto-upgrade + the
  # VolumeSnapshotClass are cluster CRDs in bootstrap/; the runbook is infra/runbooks/.)
  - backup-cronjobs.yaml
  - volume-snapshot-cronjob.yaml

# Single-replica everywhere — a single node; the HA topology (overlays/ha) would
# not schedule here. Pinned explicitly for the same reason the dev overlay does:
# make the intent the documented seam, not an inherited default. (core-acl-stub
# carries no pin here, matching the dev overlay.)
replicas:
  - name: postgres
    count: 1
  - name: redpanda
    count: 1
  - name: redpanda-console
    count: 1
  - name: kong
    count: 1
  - name: openbao
    count: 1
  - name: grafana-lgtm
    count: 1
  - name: otel-collector
    count: 1
  - name: registry
    count: 1
  - name: backstage
    count: 1
  - name: backstage-db
    count: 1

patches:
  # Pin durable Hetzner CSI block storage (hcloud-volumes) on every stateful
  # volume. JSON6902 add-ops — volumeClaimTemplates has no strategic-merge key, so
  # a merge patch would REPLACE the whole VCT list (dropping the base 5Gi request);
  # one shared ops file, three targets (each StatefulSet has a single VCT at index
  # 0). At apply time these bind to the CSI driver Phase-1 hetzner-k3s installs; at
  # build/kubeconform time storageClassName is just an opaque string.
  - path: storageclass.patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
  - path: storageclass.patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: redpanda
  - path: storageclass.patch.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: registry
  # Mount the durable PVC into the Backstage DB + set a PGDATA subdir (a freshly
  # provisioned CSI volume mounts with lost+found, and Postgres refuses to initdb
  # into a non-empty data root, so the data must live one level down).
  - path: backstage-db-storage.patch.yaml
  # Per-service CPU/memory requests + limits sized for the single 16 vCPU / 32 GB
  # node (bd babelstone-zla1.4). A multi-document strategic-merge patch — one doc
  # per workload container, each adding only its `resources:` block. The locked
  # priority is no OOM mid-demo: every container carries a memory limit, with the
  # sum of limits kept under node-allocatable. See resources.patch.yaml for the
  # full budget table.
  - path: resources.patch.yaml
  # Expose Grafana Tempo's query API (3200) on the grafana-lgtm Service so Mission Control's
  # Telemetry tab fetches real traces (bd babelstone-zla1.5.5). Adds 3200 alongside 3000; OTLP
  # 4317/4318 stay unexposed (ADR-IC-007 §P1).
  - path: grafana-tempo-svc.patch.yaml
  # Mount the Critical-SLI Prometheus rules into the grafana-lgtm appliance so its
  # bundled Prometheus loads alert-rules.yaml via rule_files (bd babelstone-zla1.9;
  # ADR-IC-004 §P4 / ADR-PC-005 §S2). Deployment-only patch — subPath-mounts the
  # prometheus.yaml + alert-rules.yaml from the grafana-lgtm-rules ConfigMap
  # generated below; the Service (hence the OTLP boundary, ADR-IC-007 §P1) is
  # untouched. See grafana-lgtm-rules.patch.yaml for the /otel-lgtm path rationale.
  - path: grafana-lgtm-rules.patch.yaml
  # Mount the Grafana RBAC + Logto-OIDC overlay into grafana-lgtm (Boundary 6, ADR-IC-021 step 3 /
  # ADR-IC-007 §P6, bd babelstone-zla1.10.1). Staging is the public box where operators log in, so
  # it turns ON operator SSO via Logto's generic_oauth + the §P6 RBAC roles/Tempo lock + anonymous
  # OFF — the rbac overlay dev keeps unmounted. Deployment-only patch (env + subPath volumeMounts),
  # so the grafana-lgtm Service (the OTLP §P1 boundary) is untouched. Files ride in via the
  # grafana-rbac ConfigMap generated below from the same infra/grafana/rbac/ source the
  # grafana-rbac-check gate uses (single config source).
  - path: grafana-oidc.patch.yaml

# The Critical-SLI rule files for the bundled Prometheus, carried in as a ConfigMap
# generated FROM the SAME infra/grafana/prometheus/ source the Compose stack mounts
# (single config source — the base's otel-collector-config / kong-config pattern).
# Those files sit above the kustomization root, so the build needs
# --load-restrictor=LoadRestrictionsNone (CI already passes it for every overlay).
configMapGenerator:
  - name: grafana-lgtm-rules
    files:
      - prometheus.yaml=../../../grafana/prometheus/prometheus.yaml
      - alert-rules.yaml=../../../grafana/prometheus/alert-rules.yaml
  # The Grafana RBAC + Logto-OIDC overlay (Boundary 6, bd babelstone-zla1.10.1), generated from the
  # SAME infra/grafana/rbac/ source the Compose stack + the grafana-rbac-check CI gate consume.
  # grafana-oidc.patch.yaml subPath-mounts these into the appliance: custom.ini is Grafana's config
  # override (RBAC + access logging + Logto generic_oauth), the three provisioning yamls are the §P6
  # access-control (roles, the Tempo datasource lock, teams). disableNameSuffixHash (above) keeps the
  # name 'grafana-rbac' stable for the patch's volume reference.
  - name: grafana-rbac
    files:
      - custom.ini=../../../grafana/rbac/grafana.ini
      - roles.yaml=../../../grafana/rbac/provisioning/roles.yaml
      - datasource-permissions.yaml=../../../grafana/rbac/provisioning/datasource-permissions.yaml
      - teams.yaml=../../../grafana/rbac/provisioning/teams.yaml

generatorOptions:
  # Stable name (no content-hash suffix) so the grafana-lgtm-rules.patch.yaml
  # volume reference stays valid — matches the base's generatorOptions posture.
  disableNameSuffixHash: true
