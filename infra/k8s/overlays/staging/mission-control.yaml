# Mission Control demo UI (bd babelstone-zla1.5.5) — the public face of the staging box.
#
# Lives in the staging overlay (not the apps/ product-service layer): it's a demo/presentation
# concern, and its image + public Ingress are staging-specific. It serves the static UI and
# same-origin-proxies the backends (no CORS): /v1/* → engine, /api/v1/* → orchestrator (it
# injects the gateway-attested X-Client-Id), /tempo/* → Grafana Tempo, /agent/* → the agent
# host. The browser hits ONLY Mission Control (app.babelstone.dev, see ingress.yaml); the
# engine/orchestrator Services stay cluster-internal. Image is the amd64-only
# ghcr.io/jhosm/babelstone-mission-control built in zla1.5.4 (binds 0.0.0.0 in-container;
# amd64 matches the CPX42 x86 staging node, bd babelstone-zla1.13).
#
# GATED-BY-DEFAULT (bd babelstone-zla1.10.8.3): staging is the PUBLIC box, so the demo UI is no
# longer an open surface — MC_AUTH_MODE=oidc turns on serve.py's Boundary-1 owned-channel login
# gate (ADR-IC-021 rollout step 2), an auth-code + PKCE(S256) flow against Logto. This DEPLOY-wires
# the gate PR #490 added to serve.py; it MUST run on an image that carries that gate code, because
# serve.py's fail-safe REFUSES to boot on a public bind (MC_BIND=0.0.0.0) without a gate configured.
apiVersion: v1
kind: Service
metadata:
  name: mission-control
  labels:
    app.kubernetes.io/name: mission-control
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mission-control
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  labels:
    app.kubernetes.io/name: mission-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mission-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mission-control
    spec:
      containers:
        - name: mission-control
          image: ghcr.io/jhosm/babelstone-mission-control:latest
          ports:
            - name: http
              containerPort: 9000
          env:
            # Proxy upstreams — the image defaults are localhost, so they MUST be set to the
            # in-cluster Service DNS or the live tabs proxy to nothing. (MC_BIND=0.0.0.0 +
            # MC_PORT=9000 already come from the image ENV.)
            - name: MC_PORT
              value: "9000"
            # https on both internal hops (internal mTLS — see the MC_INTERNAL_* keys below).
            - name: ENGINE_URL
              value: https://engine:8080
            - name: ORCHESTRATOR_URL
              value: https://orchestrator:8080
            # ── Caller-side internal mTLS on the engine + orchestrator proxy hops (bd
            # babelstone-zla1.12.10; ADR-IC-006 §P5 Boundary 2 / ADR-IC-016 plane (i)) ────────────
            # serve.py's /v1/* and /api/v1/* arms present THIS client cert (signed by the shared
            # internal CA, mcp-mtls-ca) and pin the engine/orchestrator server cert to that same CA on
            # the two internal hops only (_build_internal_mtls_context in serve.py); every other proxy
            # arm keeps stock TLS. Client material is the babelstone-mission-control-client-tls Secret
            # cert-manager issues (overlays/staging/bootstrap/internal-mtls.yaml), mounted at /certs
            # below. On STAGING these env keys are set unconditionally, so once this manifest is applied
            # serve.py's two internal proxy arms dial https and present a client cert — if the
            # engine/orchestrator servers are still plain HTTP, those two hops break. So the callers, the
            # internal-mtls.patch.yaml server flip, and the deck-sync must land TOGETHER in one maintenance
            # window (that patch's ROLLOUT ORDER steps 3–4). (These keys are only truly inert on the
            # CA-env-UNSET hosts — the demo, the local stack, tests — where serve.py leaves the two arms
            # at their plain-HTTP default.)
            - name: MC_INTERNAL_CA_CERTS
              value: /certs/ca.crt
            - name: MC_INTERNAL_CLIENT_CERT
              value: /certs/tls.crt
            - name: MC_INTERNAL_CLIENT_KEY
              value: /certs/tls.key
            # Grafana Tempo's query API (Telemetry tab). Needs the 3200 port on the grafana-lgtm
            # Service (added by grafana-tempo-svc.patch.yaml); degrades to an illustrative
            # waterfall if Tempo isn't reachable.
            - name: TEMPO_URL
              value: http://grafana-lgtm:3200
            # Topic·Avro lens (bd zla1.17): the REAL records off the Redpanda topic. serve.py's
            # /pandaproxy/* arm drives the Kafka-REST consumer dance against the HTTP Proxy, and
            # /sr/* resolves the Avro schema badge. Both are in-cluster listeners on the redpanda
            # Service (pandaproxy 8082 + schema-reg 8081); the mission-control→redpanda allow is
            # a least-privilege rule in network-policies.yaml (8082/8081 only, never 9092).
            - name: PANDAPROXY_URL
              value: http://redpanda:8082
            - name: SCHEMA_REGISTRY_URL
              value: http://redpanda:8081
            # Metrics + Logs lenses (bd zla1.17.2): serve.py's /prom and /loki arms read the
            # appliance's Prometheus + Loki query APIs. Needs 9090/3100 on the grafana-lgtm Service
            # (grafana-query-svc.patch.yaml) + the mission-control→grafana-lgtm allow (9090/3100).
            # Read-only query APIs; the lenses degrade gracefully if a backend isn't reachable.
            - name: PROM_URL
              value: http://grafana-lgtm:9090
            - name: LOKI_URL
              value: http://grafana-lgtm:3100
            # Outbox·Inbox lens (bd zla1.17.3): the REAL engine + orchestrator outbox/inbox/dedup
            # tails through serve.py's read-only /pg window. It connects as the dedicated
            # `babelstone_readonly` role (SELECT-only; provisioned by the mission-control-db-readonly
            # Job), NOT the app role. MC_PG_ENABLE turns the routes on in the pod; MC_PG_ALLOW_HOSTS
            # is the explicit opt-in that lets the DSN reach the in-cluster `postgres` host (the
            # laptop default stays 127.0.0.1-only). Reads are read-only + PII-column-firewalled; the
            # mission-control→postgres:5432 allow is a least-privilege rule in network-policies.yaml.
            - name: MC_PG_ENABLE
              value: "1"
            - name: MC_PG_ALLOW_HOSTS
              value: postgres
            # Defined BEFORE the DSNs so k8s resolves the $(MC_READONLY_DB_PASSWORD) interpolation
            # (same pattern as the engine's POSTGRES_PASSWORD → ConnectionStrings).
            - name: MC_READONLY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: MC_READONLY_DB_PASSWORD
            # libpq KEYWORD form, NOT a postgresql:// URL — deliberately. serve.py's _dsn_host parses
            # the DSN authority to enforce MC_PG_ALLOW_HOSTS; in URL form a URL-reserved char in the
            # interpolated password breaks that parse — a '/' (which `openssl rand -base64` emits ~40%
            # of the time) truncates the authority, so the host mis-reads as the role
            # 'babelstone_readonly' and the /pg lens 403s ("non-local DSN refused"). Keyword form has
            # no authority to truncate, so ANY password char is safe. Do NOT rewrite these as URLs.
            - name: MC_ENGINE_DSN
              value: "host=postgres port=5432 dbname=babelstone user=babelstone_readonly password=$(MC_READONLY_DB_PASSWORD)"
            - name: MC_ORCH_DSN
              value: "host=postgres port=5432 dbname=babelstone_orchestrator user=babelstone_readonly password=$(MC_READONLY_DB_PASSWORD)"
            # The agent host is DEFERRED (zla1.5.6); until it exists /agent/* returns 502 and
            # Operator=CLAUDE degrades to illustrative narration — every other mode still works.
            - name: AGENT_URL
              value: http://agent-host:8091
            # Opaque caller reference injected on /api/v1/* (stands in for the Kong-attested
            # client id); never PII.
            - name: DEMO_CLIENT_ID
              value: CLI-DEMO-0001
            # ── Boundary-1 owned-channel login gate (ADR-IC-021 rollout step 2, bd zla1.10.8.3) ──
            # oidc mode makes serve.py DISCOVER Logto's endpoints from
            # {OIDC_ISSUER}/.well-known/openid-configuration and run the auth-code + PKCE(S256)
            # flow; on a public bind this is what satisfies serve.py's no-open-surface fail-safe.
            - name: MC_AUTH_MODE
              value: oidc
            # Logto's PUBLIC issuer — the SAME host Grafana's generic_oauth dials
            # (auth.babelstone.dev). serve.py runs BOTH discovery and the code→token exchange
            # against these PUBLIC endpoints (Logto advertises its public ENDPOINT in the discovery
            # doc), so the backchannel HAIRPINS out through Traefik, NOT to the internal logto:3001
            # Service — hence NO mission-control→logto egress rule is needed (network-policies.yaml
            # policy 15, egress is unrestricted).
            - name: OIDC_ISSUER
              value: https://auth.babelstone.dev/oidc
            # The Logto application HAND-registered in the Console (DCR is the accepted ADR-IC-021
            # §C6 gap) — see infra/runbooks/mission-control-oidc-registration.md. Logto GENERATES the
            # App ID (= the OAuth client_id) and it is immutable, so this is that generated value, not
            # a chosen name (a client_id is public, so it is fine in git). bd babelstone-zla1.10.12.
            - name: OIDC_CLIENT_ID
              value: 237fljdnwu8hx5t634uv7
            # Public origin serve.py derives the redirect_uri from ({base}/callback →
            # https://app.babelstone.dev/callback) — must equal the redirect URI on the Logto app.
            - name: MC_PUBLIC_BASE_URL
              value: https://app.babelstone.dev
            # The confidential-client secret + the session-cookie HMAC key — injected from the
            # OpenBao-seeded Secret, NEVER in git (mirrors grafana-oidc.patch.yaml's secretKeyRef).
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: LOGTO_MISSION_CONTROL_CLIENT_SECRET
            - name: MC_SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: MC_SESSION_SIGNING_KEY
          # Probe /healthz, NOT / — with the OIDC gate on, serve.py answers an unauthenticated
          # NON-navigation request (exactly a kubelet probe: no session cookie, Accept ≠ text/html)
          # with 401, which would fail the probe and the pod would never go Ready. serve.py exposes
          # /healthz as the gate-EXEMPT liveness endpoint (returns 200 {"status":"ok"}) for precisely
          # this. (In dev mode / is a 200 too, but staging always runs MC_AUTH_MODE=oidc.)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # Mission Control's CLIENT cert for the engine/orchestrator proxy hops (tls.crt/tls.key) +
            # the internal CA (ca.crt) it pins their server certs to (babelstone-mission-control-client-tls,
            # bd babelstone-zla1.12.10).
            - name: mission-control-client-tls
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        # Mission Control's internal-mTLS CLIENT cert (bd babelstone-zla1.12.10). Standard cert-manager
        # keys (tls.crt/tls.key/ca.crt) the MC_INTERNAL_* env point at directly.
        - name: mission-control-client-tls
          secret:
            secretName: babelstone-mission-control-client-tls
