# Scheduled CSI volume snapshots for the staging box (bd babelstone-zla1.7).
#
# NOTE on mechanism: the rescope said "hcloud-CLI snapshot CronJob", but the hcloud CLI snapshots
# SERVERS (images), which do NOT capture the detached hcloud-volumes CSI block devices our stateful
# data lives on. The correct mechanism for CSI volumes is the k8s VolumeSnapshot API, which the
# Hetzner CSI driver implements — so this CronJob creates timestamped VolumeSnapshots of the data
# PVCs via kubectl. Block-level, complementary to the off-box logical backups (backup-cronjobs.yaml).
#
# The VolumeSnapshot objects are created at RUNTIME (not committed), so they never enter the
# kustomize build; only built-in kinds (ServiceAccount/Role/RoleBinding/CronJob) are rendered. The
# VolumeSnapshotClass (a CRD) + the snapshot controller are cluster add-ons — see
# overlays/staging/bootstrap/volume-snapshot-class.yaml and bootstrap/README.md (account-gated).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-snapshotter
  labels:
    app.kubernetes.io/name: volume-snapshotter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volume-snapshotter
  labels:
    app.kubernetes.io/name: volume-snapshotter
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volume-snapshotter
  labels:
    app.kubernetes.io/name: volume-snapshotter
subjects:
  - kind: ServiceAccount
    name: volume-snapshotter
roleRef:
  kind: Role
  name: volume-snapshotter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volume-snapshot
  labels:
    app.kubernetes.io/name: volume-snapshot
    babelstone.io/dr-role: volume-snapshot
spec:
  # Daily 02:30 UTC (after the logical backup at 01:30).
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: volume-snapshot
            babelstone.io/dr-role: volume-snapshot
        spec:
          restartPolicy: Never
          serviceAccountName: volume-snapshotter
          containers:
            - name: snapshot
              image: bitnami/kubectl:1.31
              # printf (not a heredoc) builds each VolumeSnapshot on one logical line, so there's
              # no block-scalar-indentation fragility. The data PVCs: the StatefulSet VCTs
              # (postgres/redpanda) name PVCs <vct>-<sts>-<ordinal>. Backstage keeps NO durable
              # state (in-memory SQLite, rebuilt from the baked /catalog on boot — bd
              # babelstone-zla1.6.6), so it has no PVC to snapshot. Retention/pruning is manual
              # for v1 — see the runbook.
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  for pvc in postgres-data-postgres-0 redpanda-data-redpanda-0; do
                    echo "snapshotting ${pvc} ..."
                    printf 'apiVersion: snapshot.storage.k8s.io/v1\nkind: VolumeSnapshot\nmetadata:\n  name: %s-%s\n  labels:\n    babelstone.io/dr-role: volume-snapshot\nspec:\n  volumeSnapshotClassName: hcloud-volumes\n  source:\n    persistentVolumeClaimName: %s\n' "${pvc}" "${TS}" "${pvc}" | kubectl apply -f -
                  done
                  echo "volume snapshots requested (${TS})."
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
