# Public HTTPS edge for the staging box — the ADR-PC-020 §D3 drift acknowledged in
# infra/k8s/README.md (this is the one place the deployed estate exposes anything
# publicly). The IngressClass `traefik` these Ingresses reference is provided by the
# Traefik controller installed at bootstrap/helm/traefik-values.yaml — hetzner-k3s ships
# k3s with the bundled Traefik + servicelb DISABLED, so on this single node Traefik is
# installed back and binds the node's :80/:443 directly via hostPort (there is no LB).
# cert-manager (also installed at bootstrap/) issues Let's Encrypt certs via the DNS-01 solver (Cloudflare API),
# triggered by the cert-manager.io/cluster-issuer annotation. DNS-01 is what lets the
# A records stay behind the Cloudflare proxy (an HTTP-01 challenge cannot reach a
# proxied origin). cert-manager's ingress-shim
# auto-creates the Certificate from the `tls:` block — none is authored here, which
# also keeps the strict kubeconform gate green (no cert-manager CRD enters the
# kustomize build).
#
# Kong stays the ADR-IC-006 authz edge: Traefik terminates TLS and forwards to the
# Kong PROXY (8000), which still applies every declarative route + edge policy.
# Traefik does NOT bypass Kong for the product API. Backstage (the catalogue
# portal — not part of the ADR-IC-006 product surface) gets its own subdomain
# straight through Traefik. Logto (the ADR-IC-021 OAuth/OIDC Authorization Server —
# the token ISSUER, not a product route) likewise gets its own auth subdomain
# straight through Traefik, so Kong's product routes stay the ADR-IC-006 edge.
# Grafana is intentionally NOT exposed (no public unauthenticated dashboard); OTLP
# 4317/4318 stays unexposed per ADR-IC-007 §P1.
#
# Hosts are babelstone.dev subdomains (the locked domain): api → Kong, backstage →
# Backstage, app → Mission Control, auth → Logto (the 4th public host). DNS → node IP
# is the account-gated Phase-0/2 step; at build time these are inert strings.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-edge
  labels:
    app.kubernetes.io/name: kong
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.babelstone.dev
      secretName: kong-edge-tls
  rules:
    - host: api.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - backstage.babelstone.dev
      secretName: backstage-tls
  rules:
    - host: backstage.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
---
# Mission Control demo UI (bd babelstone-zla1.5.5) — the public demo landing. The browser hits
# only this host; Mission Control same-origin-proxies the engine/orchestrator/tempo/agent
# Services internally (so the product Services need no public Ingress of their own).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mission-control
  labels:
    app.kubernetes.io/name: mission-control
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.babelstone.dev
      secretName: mission-control-tls
  rules:
    - host: app.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mission-control
                port:
                  number: 9000
---
# Logto — the OAuth 2.1 / OIDC Authorization Server (ADR-IC-021, bd babelstone-zla1.10.2): the
# staging box's token ISSUER (login + SCA + the MCP-agent authority). The 4th public host. It is
# NOT a product route — it sits beside Backstage/Mission Control straight through Traefik, so
# Kong stays the ADR-IC-006 edge for the product API (auth subdomain, reverse-proxied per the
# ADR-IC-021 staging rollout). Only the main app port (3001 — sign-in + OIDC discovery + JWKS)
# is fronted; the admin console (3002) stays cluster-internal (operator port-forward).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logto
  labels:
    app.kubernetes.io/name: logto
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.babelstone.dev
      secretName: logto-tls
  rules:
    - host: auth.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logto
                port:
                  number: 3001
