# Public HTTPS edge for the staging box — the ADR-PC-020 §D3 drift acknowledged in
# infra/k8s/README.md (this is the one place the deployed estate exposes anything
# publicly). The IngressClass `traefik` these Ingresses reference is provided by the
# Traefik controller installed at bootstrap/helm/traefik-values.yaml — hetzner-k3s ships
# k3s with the bundled Traefik + servicelb DISABLED, so on this single node Traefik is
# installed back and binds the node's :80/:443 directly via hostPort (there is no LB).
# cert-manager (also installed at bootstrap/) issues Let's Encrypt certs via the DNS-01 solver (Cloudflare API),
# triggered by the cert-manager.io/cluster-issuer annotation. DNS-01 is what lets the
# A records stay behind the Cloudflare proxy (an HTTP-01 challenge cannot reach a
# proxied origin). cert-manager's ingress-shim
# auto-creates the Certificate from the `tls:` block — none is authored here, which
# also keeps the strict kubeconform gate green (no cert-manager CRD enters the
# kustomize build).
#
# Kong stays the ADR-IC-006 authz edge: Traefik terminates TLS and forwards to the
# Kong PROXY (8000), which still applies every declarative route + edge policy.
# Traefik does NOT bypass Kong for the product API. Backstage (the catalogue
# portal — not part of the ADR-IC-006 product surface) gets its own subdomain
# straight through Traefik. Logto (the ADR-IC-021 OAuth/OIDC Authorization Server —
# the token ISSUER, not a product route) likewise gets its own auth subdomain
# straight through Traefik, so Kong's product routes stay the ADR-IC-006 edge.
# Grafana is intentionally NOT exposed (no public unauthenticated dashboard); OTLP
# 4317/4318 stays unexposed per ADR-IC-007 §P1.
#
# Hosts are babelstone.dev subdomains (the locked domain): api → Kong, backstage →
# Backstage, app → Mission Control, auth → Logto (the 4th public host). DNS → node IP
# is the account-gated Phase-0/2 step; at build time these are inert strings.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-edge
  labels:
    app.kubernetes.io/name: kong
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.babelstone.dev
      secretName: kong-edge-tls
  rules:
    - host: api.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - backstage.babelstone.dev
      secretName: backstage-tls
  rules:
    - host: backstage.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
---
# Mission Control demo UI (bd babelstone-zla1.5.5) — the public demo landing. The browser hits
# only this host; Mission Control same-origin-proxies the engine/orchestrator/tempo/agent
# Services internally (so the product Services need no public Ingress of their own).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mission-control
  labels:
    app.kubernetes.io/name: mission-control
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.babelstone.dev
      secretName: mission-control-tls
  rules:
    - host: app.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mission-control
                port:
                  number: 9000
---
# Logto — the OAuth 2.1 / OIDC Authorization Server (ADR-IC-021, bd babelstone-zla1.10.2): the
# staging box's token ISSUER (login + SCA + the MCP-agent authority). The 4th public host. It is
# NOT a product route — it sits beside Backstage/Mission Control straight through Traefik, so
# Kong stays the ADR-IC-006 edge for the product API (auth subdomain, reverse-proxied per the
# ADR-IC-021 staging rollout). The main app port (3001 — sign-in + OIDC discovery + JWKS) is
# fronted at auth.babelstone.dev; the admin console (3002) is fronted separately at
# auth-admin.babelstone.dev (the `logto-admin` Ingress below, bd zla1.10) — see that block for
# why the OSS console needs its own real HTTPS host rather than a localhost port-forward.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logto
  labels:
    app.kubernetes.io/name: logto
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.babelstone.dev
      secretName: logto-tls
  rules:
    - host: auth.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logto
                port:
                  number: 3001
---
# Logto Admin Console + Management API (bd zla1.10). The OSS admin console (port 3002) mints the
# admin-tenant tokens the operator uses to call the DEFAULT tenant's Management API (create apps,
# roles, users). Logto stamps those tokens with iss = {ADMIN_ENDPOINT}/oidc; the default tenant
# accepts them ONLY if that issuer is a stable HTTPS URL that matches how the console is actually
# reached (Logto OSS v1.41, PR #8869). A `kubectl port-forward` at http://localhost:3002 makes
# the console mint iss=http://localhost:3002/oidc, which the Management API rejects with
# JWTClaimValidationFailed('iss') → every write 401s. So the console gets its OWN real host here,
# and logto.yaml sets ADMIN_ENDPOINT=https://auth-admin.babelstone.dev to match. Same DNS-01 TLS.
# It is auth-gated by the Logto admin login; network-hardening (Cloudflare Access / IP allowlist /
# ADMIN_DISABLE_LOCALHOST) is the follow-up so the IAM console isn't world-reachable by default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logto-admin
  labels:
    app.kubernetes.io/name: logto
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth-admin.babelstone.dev
      secretName: logto-admin-tls
  rules:
    - host: auth-admin.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: logto
                port:
                  number: 3002
---
# Grafana observability UI (bd zla1.10.1 / zla1.10.6). Fronts the grafana-lgtm appliance's
# Grafana UI (port 3000) at grafana.babelstone.dev so operators reach it without a port-forward
# and the OIDC redirect_uri is a stable public URL (grafana.ini [server] root_url matches). The
# observability plane is a regulated data store (ADR-IC-007 §P4): access is gated by Grafana's
# own login (anonymous OFF) + Logto SSO + §P6 RBAC, and — like the auth-admin console — the host
# is meant to sit behind a Cloudflare Access identity gate (bd zla1.10.6). Only the UI port (3000)
# is fronted; the appliance's OTLP ports (4317/4318) stay unexposed (ADR-IC-007 §P1, CI-asserted).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana-lgtm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-babelstone
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.babelstone.dev
      secretName: grafana-tls
  rules:
    - host: grafana.babelstone.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-lgtm
                port:
                  number: 3000
