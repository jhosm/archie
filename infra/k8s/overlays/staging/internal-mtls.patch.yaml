# ENABLED — internal mTLS on the engine + orchestrator hops (bd
# babelstone-zla1.12.8 sub-gap (c); ADR-IC-006 §P5 Boundary 2 / ADR-IC-016
# plane (i)). Applied via the (now uncommented) patch reference in
# kustomization.yaml. It takes effect only WITH the out-of-band bootstrap certs
# and the deck-sync tls_verify flip — the ROLLOUT ORDER below + staging-ops.md §9.
#
# Plain English: this flips the two Kestrel hosts from plain HTTP to HTTPS with
# a REQUIRED client certificate, using the server certs that
# bootstrap/internal-mtls.yaml issues from the SAME internal CA as the
# Kong→mcp-server hop. The committed kong.yml already dials
# https://engine:8080 / https://orchestrator:8080 and presents the shared
# client cert (entity 7e9b6f1a-…), and scripts/deck-sync.sh already flips
# tls_verify:true at deploy time — so the gateway side is ready; this patch is
# the missing server side.
#
# The TLS LISTENER is config: the Kestrel__Endpoints__Https__* env below binds
# HTTPS from the mounted server cert (WebApplication.CreateBuilder wires the
# Kestrel configuration loader by default). The client-cert REQUIRE + VALIDATE
# policy is CODE, not config — see the KNOWN-REMAINDER resolution below. The
# tcpSocket probes keep passing (they test the bind, not the handshake).
#
# ROLLOUT ORDER (all steps, same maintenance window):
#   1. kubectl apply -f overlays/staging/bootstrap/internal-mtls.yaml
#      (needs mcp-mtls.yaml's mcp-mtls-ca Issuer; wait for the two Secrets).
#   2. Deploy the engine + orchestrator IMAGES carrying the server-side trust
#      code (bd babelstone-zla1.12.25 — landed; see below), so RequireCertificate
#      VALIDATES internal-CA client certs instead of rejecting them.
#   3. Uncomment this patch in kustomization.yaml, deploy, re-run deck-sync.
#   4. The engine/orchestrator CALLERS already dial https + present a client cert
#      UNCONDITIONALLY on staging — the orchestrator dispatcher (Engine__BaseUrl),
#      notification (Engine__BaseUrl), mcp-server (BABELSTONE_ENGINE_URL/
#      _ORCHESTRATOR_URL), Mission Control's proxy (bd babelstone-zla1.12.10).
#      Enabling the server flip is what makes those hops SUCCEED rather than 502.
#
# KNOWN REMAINDER — RESOLVED (bd babelstone-zla1.12.25): .NET's default client-
# cert validation builds the chain against the CONTAINER'S system trust store,
# which does not contain the cluster-generated internal CA. Fixed CODE-SIDE
# (option (b)): each host's InternalMtls installs — gated on the
# InternalMtls__CaCertPath env set in each stanza below — a Kestrel
# ClientCertificateValidation callback that pins /certs/ca.crt via X509Chain
# CustomRootTrust, the exact server-side mirror of the caller-side
# InternalMtls.ValidateAgainstInternalCa (bd babelstone-zla1.12.10). So enabling
# this patch no longer rejects valid internal-CA client certs. (The image-side
# alternative — update-ca-certificates — was declined: the CA is cluster-
# generated, absent at image build, and system-store trust is broader than the
# scoped pin.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
spec:
  template:
    spec:
      containers:
        - name: engine
          env:
            # Explicit Kestrel endpoint config replaces the plain-HTTP port env
            # (env lists strategic-merge by name; $patch: delete removes it).
            - name: ASPNETCORE_HTTP_PORTS
              $patch: delete
            - name: Kestrel__Endpoints__Https__Url
              value: https://0.0.0.0:8080
            - name: Kestrel__Endpoints__Https__Certificate__Path
              value: /certs/tls.crt
            - name: Kestrel__Endpoints__Https__Certificate__KeyPath
              value: /certs/tls.key
            # Server-side client-cert REQUIRE + CA-pin VALIDATE is CODE (ADR-IC-006
            # §P5; InternalMtls, bd babelstone-zla1.12.25): the presence of this CA
            # path is the ONLY switch — the engine host reads it and installs
            # ClientCertificateMode=RequireCertificate + a pinned-CA validation
            # callback, so a Kong-bypassing caller with no internal-CA client cert
            # is rejected at the handshake. The transport (URL + server cert above)
            # stays config-driven; /certs/ca.crt is the mounted secret's CA PEM.
            - name: InternalMtls__CaCertPath
              value: /certs/ca.crt
          volumeMounts:
            - name: engine-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: engine-tls
          secret:
            secretName: babelstone-engine-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  template:
    spec:
      containers:
        - name: orchestrator
          env:
            - name: ASPNETCORE_URLS
              $patch: delete
            - name: Kestrel__Endpoints__Https__Url
              value: https://0.0.0.0:8080
            - name: Kestrel__Endpoints__Https__Certificate__Path
              value: /certs/tls.crt
            - name: Kestrel__Endpoints__Https__Certificate__KeyPath
              value: /certs/tls.key
            # Server-side client-cert REQUIRE + CA-pin VALIDATE is CODE (ADR-IC-006
            # §P5; InternalMtls, bd babelstone-zla1.12.25) — the same switch as the
            # engine stanza above: its presence installs RequireCertificate + the
            # pinned-CA validation callback on the orchestrator's saga edge.
            - name: InternalMtls__CaCertPath
              value: /certs/ca.crt
          volumeMounts:
            - name: orchestrator-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: orchestrator-tls
          secret:
            secretName: babelstone-orchestrator-tls
