# Per-service CPU/memory requests + limits for the single staging node
# (bd babelstone-zla1.4 residual). Sized for one Hetzner CAX41 — 16 vCPU / 32 GB
# RAM (ARM). The locked staging-env priority is "an OOM mid-demo is the failure to
# avoid", so every workload container carries a memory LIMIT (a runaway pod is
# capped, not allowed to take the node down), while requests stay modest so the
# whole stack schedules comfortably on one node.
#
# Budget (≈28 GB / ≈14 vCPU allocatable after the k3s system reserve):
#   service            cpu req / lim    mem req / lim     note
#   grafana-lgtm       500m / 2000m     1Gi / 6Gi         LGTM all-in-one (Loki+Tempo+Mimir+Grafana) — heaviest
#   redpanda           1000m / 2000m    1Gi / 3Gi         broker (--smp=1; memory-hungry)
#   postgres           250m / 1000m     512Mi / 2Gi       event store (ADR-PC-001)
#   backstage          250m / 1000m     768Mi / 2Gi       Node app (~1GB steady / ~2GB peak)
#   kong               250m / 1000m     256Mi / 1Gi       edge gateway
#   core-acl-stub      250m / 1000m     256Mi / 1Gi       WireMock (JVM)
#   logto              100m / 1000m     256Mi / 768Mi     OAuth/OIDC AS (ADR-IC-021) — Node app
#   backstage-db       100m / 500m      256Mi / 1Gi       Backstage Postgres
#   otel-collector     100m / 500m      192Mi / 768Mi     telemetry fan-out
#   openbao            100m / 500m      128Mi / 512Mi     dev mode (in-memory)
#   redpanda-console   50m / 250m       128Mi / 512Mi     read-only UI
#   registry           50m / 250m       128Mi / 512Mi     OCI pack registry
#   ─────────────────────────────────────────────────────────────────────────
#   Σ requests        ≈ 3.0 vCPU / ≈4.85 Gi  (schedules trivially on one node)
#   Σ limits          ≈ 11 vCPU / ≈19 Gi     (comfortably under node-allocatable
#                                             → no node-level memory overcommit)
#
# Logto is a staging-overlay service (like Mission Control), not a base backing-infra one;
# it is sized here, alongside the backing infra, rather than inline (Mission Control sizes
# inline as the demo-UI exception). The Logto DB-lifecycle Jobs/CronJob (logto-jobs.yaml)
# carry their own inline resources — they are short-lived and exempt from the workload sizing
# table, the same as the event-store migration Job.
#
# Strategic-merge: each document targets one container by name, so adding a
# `resources:` block is purely additive (the containers list merges by `name`).
# These apply only in the staging overlay; the base/ha renderings are unsized (base is
# a laptop stack; ha is multi-node and would size differently).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-lgtm
spec:
  template:
    spec:
      containers:
        - name: grafana-lgtm
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 6Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  template:
    spec:
      containers:
        - name: redpanda
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
spec:
