# Per-service CPU/memory requests + limits for the single staging node
# (bd babelstone-zla1.4 residual; re-tuned for the 16 GB node — bd babelstone-zla1.5.7).
# Sized for one Hetzner CPX42 — 8 vCPU / 16 GB RAM (x86). The originally-planned CAX41
# ARM box (16 vCPU / 32 GB) was out of stock at provision, so staging runs on this smaller
# x86 box (bd babelstone-zla1.2) and the memory LIMITS below were trimmed to match. The
# locked staging-env priority is "an OOM mid-demo is the failure to avoid", so every
# workload container carries a memory LIMIT (a runaway pod is capped, not allowed to take
# the node down), while requests stay modest so the whole stack schedules on one node.
#
# NOTE the scheduler sums only REQUESTS (never limits) against node-allocatable, so requests
# are what must fit; limits are per-pod runtime OOM caps and may overcommit. The trim's goal
# is that no single limit is a large fraction of the 16 GB node (grafana-lgtm was 6Gi ≈ ⅜ node).
#
# Budget (16 GB node → ≈15.6 Gi / 8 vCPU allocatable after the k3s system reserve):
#   service            cpu req / lim    mem req / lim     note
#   grafana-lgtm       500m / 2000m     1Gi / 3Gi         LGTM all-in-one (Loki+Tempo+Mimir+Grafana) — heaviest; capped 6Gi→3Gi
#   redpanda           1000m / 2000m    1Gi / 2Gi         broker (--smp=1; memory-hungry); 3Gi→2Gi
#   postgres           250m / 1000m     512Mi / 1536Mi    event store (ADR-PC-001); 2Gi→1.5Gi
#   backstage          250m / 1000m     768Mi / 1536Mi    Node app (~1GB steady); 2Gi→1.5Gi
#   kong               250m / 1000m     256Mi / 1Gi       edge gateway
#   core-acl-stub      250m / 1000m     256Mi / 1Gi       WireMock (JVM)
#   logto              100m / 1000m     256Mi / 768Mi     OAuth/OIDC AS (ADR-IC-021) — Node app
#   backstage-db       100m / 500m      256Mi / 1Gi       Backstage Postgres
#   otel-collector     100m / 500m      192Mi / 768Mi     telemetry fan-out
#   openbao            100m / 500m      128Mi / 512Mi     dev mode (in-memory)
#   redpanda-console   50m / 250m       128Mi / 512Mi     read-only UI
#   registry           50m / 250m       128Mi / 512Mi     OCI pack registry
#   (app services — engine/orchestrator/mcp-server/notification/mission-control — are sized
#    inline in their own base manifests; together ≈1.15 Gi req / ≈3.2 Gi lim.)
#   ─────────────────────────────────────────────────────────────────────────
#   Σ requests (WHOLE stack) ≈ 5.9 Gi / ≈4 vCPU  (fits 15.6 Gi → schedules, no Pending)
#   Σ limits   (WHOLE stack) ≈ 17 Gi  (mild overcommit vs 15.6 Gi; realistic concurrent
#                                      usage ≈7 Gi, and no single limit now exceeds 3 Gi so a
#                                      lone runaway can't OOM the node). CPU limits overcommit
#                                      too, but CPU is compressible — throttled, not killed.
#
# Logto is a staging-overlay service (like Mission Control), not a base backing-infra one;
# it is sized here, alongside the backing infra, rather than inline (Mission Control sizes
# inline as the demo-UI exception). The Logto DB-lifecycle Jobs/CronJob (logto-jobs.yaml)
# carry their own inline resources — they are short-lived and exempt from the workload sizing
# table, the same as the event-store migration Job.
#
# Strategic-merge: each document targets one container by name, so adding a
# `resources:` block is purely additive (the containers list merges by `name`).
# These apply only in the staging overlay; the base/ha renderings are unsized (base is
# a laptop stack; ha is multi-node and would size differently).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-lgtm
spec:
  template:
    spec:
      containers:
        - name: grafana-lgtm
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  template:
    spec:
      containers:
        - name: redpanda
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
spec:
  template:
    spec:
      containers:
        - name: backstage
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: apps/v1
