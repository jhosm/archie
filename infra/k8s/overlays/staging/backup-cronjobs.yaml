# Logical database backups for the staging box (bd babelstone-zla1.7) — copies the HA overlay's
# scheduled-backup CronJob shape (postgres-pitr-resources.yaml), but LOGICAL (pg_dump) instead of
# pgBackRest physical PITR (which is the multi-node HA leg, too heavy for one node). Dumps every
# database to Hetzner Object Storage (S3-compatible) so the data survives the box entirely.
#
# One instance is dumped: the main `postgres` (pg_dumpall → the engine `babelstone` DB + the
# orchestrator `babelstone_orchestrator` DB). Backstage is NOT backed up — it uses in-memory
# SQLite (no Postgres) and keeps no durable state, rebuilding its catalogue from the baked
# /catalog tree on every boot (bd babelstone-zla1.6.6), so there is nothing to dump.
#
# CI validates SHAPE only (kustomize build + kubeconform); the restore drill is the runbook
# (infra/runbooks/staging-ops.md). Real S3 + a real bucket are account-gated (the Secret below is
# a placeholder seam, same contract as base/secrets.example.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-logical-backup
  labels:
    app.kubernetes.io/name: db-logical-backup
    babelstone.io/dr-role: logical-backup
spec:
  # Daily 01:30 UTC. concurrencyPolicy Forbid so a slow dump never overlaps the next run.
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-logical-backup
            babelstone.io/dr-role: logical-backup
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:18-alpine
              command:
                - /bin/sh
                - -c
                # FAIL-CLOSED backup (bd babelstone-zla1.12.5; ADR-PC-005 §P2): the job may
                # only exit 0 after ASSERTING each object really landed off-box. Two guards:
                #   • `set -o pipefail` — before this, a failed pg_dumpall piping into a
                #     SUCCESSFUL empty upload exited 0: the exact "backup you cannot see
                #     failing" failure mode. Now any stage failing fails the run.
                #   • upload_and_assert — after each streamed upload, HEAD the object and
                #     require a plausible size (an empty/truncated dump reads as FAILURE).
                # On success it optionally pushes a freshness heartbeat
                # (backup_last_success_timestamp_seconds) that the BackupFreshnessStale
                # alert (infra/grafana/prometheus/alert-rules.yaml) watches; while
                # PUSHGATEWAY_URL is unwired the alert deliberately reads absent-as-stale.
                - |
                  set -eu
                  set -o pipefail
                  # aws-cli (Alpine community) for the S3 upload + assert; curl for the
                  # optional heartbeat push; busybox already has gzip/date.
                  apk add --no-cache aws-cli curl >/dev/null
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  # A real gzipped dump is never this small (an empty-DB pg_dumpall gzips
                  # to a few KB); below the floor we treat the object as NOT WRITTEN.
                  MIN_BYTES=1024
                  upload_and_assert() {
                    KEY="$1"
                    aws --endpoint-url "${S3_ENDPOINT}" s3 cp - "s3://${S3_BUCKET}/${KEY}"
                    SIZE="$(aws --endpoint-url "${S3_ENDPOINT}" s3api head-object \
                      --bucket "${S3_BUCKET}" --key "${KEY}" \
                      --query ContentLength --output text)" || SIZE=""
                    if [ -z "${SIZE}" ] || [ "${SIZE}" -lt "${MIN_BYTES}" ]; then
                      echo "BACKUP ASSERT FAILED: s3://${S3_BUCKET}/${KEY} absent or too small (${SIZE:-no object} < ${MIN_BYTES} bytes)" >&2
                      exit 1
                    fi
                    echo "asserted s3://${S3_BUCKET}/${KEY} (${SIZE} bytes)"
                  }
                  echo "dumping main cluster (babelstone + babelstone_orchestrator) ..."
                  PGPASSWORD="${PG_PASSWORD}" pg_dumpall -h postgres -U "${PG_USER}" \
                    | gzip | upload_and_assert "postgres/all-${TS}.sql.gz"
                  # Freshness heartbeat — only after the dump object is asserted written.
                  if [ -n "${PUSHGATEWAY_URL:-}" ]; then
                    printf '# TYPE backup_last_success_timestamp_seconds gauge\nbackup_last_success_timestamp_seconds %s\n' "$(date +%s)" \
                      | curl -fsS --data-binary @- "${PUSHGATEWAY_URL%/}/metrics/job/db-logical-backup"
                    echo "pushed backup_last_success_timestamp_seconds"
                  else
                    echo "PUSHGATEWAY_URL unset — no freshness heartbeat; BackupFreshnessStale correctly reads absent-as-stale."
                  fi
                  echo "logical backup complete (${TS})."
              env:
                - name: PG_USER
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_USER
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: babelstone-dev-secrets
                      key: POSTGRES_PASSWORD
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: babelstone-backup-secret
                      key: S3_ENDPOINT
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: babelstone-backup-secret
                      key: S3_BUCKET
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: babelstone-backup-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: babelstone-backup-secret
                      key: AWS_SECRET_ACCESS_KEY
                # OPTIONAL freshness-heartbeat sink (bd babelstone-zla1.12.5): point this at
                # a Prometheus Pushgateway scraped by the LGTM appliance (maintainer wiring —
                # none is deployed today; the same seam the projection-rebuild drill uses).
                # Empty = skip the push; the BackupFreshnessStale alert then reads
                # absent-as-stale, which is the safe interpretation, not a gap.
                - name: PUSHGATEWAY_URL
                  value: ""
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
---
# Backup credential seam — the babelstone-backup-secret Secret is NOT committed (it used to be a
# DEV-ONLY placeholder doc here, which the cd-secret-preflight render gate now rightly refuses:
# bd babelstone-zla1.12.4, ADR-PC-004 §A1). The operator provisions the real Hetzner Object
# Storage bucket + keys once (runbook staging-ops.md §1 step 5); the CronJobs below secretKeyRef
# it by name, exactly the babelstone-dev-secrets contract. NEVER commit real credentials.
