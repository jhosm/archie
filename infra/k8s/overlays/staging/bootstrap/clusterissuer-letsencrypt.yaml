# Let's Encrypt ClusterIssuer for the staging box — cluster-scoped, applied ONCE
# at cluster bootstrap (Phase 2, bd babelstone-zla1.3), NOT part of the kustomize
# overlay.
#
# Why it lives here and not in the overlay: it is a cert-manager CRD, and the CI
# gate runs `kubeconform -strict` with no CRD schemas — a ClusterIssuer inside the
# kustomize build would hard-fail it. The overlay's Ingress (../ingress.yaml)
# references this issuer by name (cert-manager.io/cluster-issuer:
# letsencrypt-babelstone); cert-manager's ingress-shim does the rest.
#
# CHALLENGE: DNS-01 via Cloudflare (2026-07-07). We validate by having cert-manager
# create a temporary TXT record through the Cloudflare API rather than serving a
# file on :80 (HTTP-01). This is what lets the four A records stay behind the
# Cloudflare PROXY (orange-cloud) — an HTTP-01 challenge cannot reach the origin
# through the proxy, DNS-01 does not need to. It also unlocks wildcard certs.
# (Deviation from the originally-shipped http01 solver; recorded so the origin IP
# is never exposed via grey-cloud DNS.)
#
# Bootstrap apply order (account-gated — needs the live cluster + DNS + token):
#   1. helm install cert-manager (with its CRDs)
#   2. create the Cloudflare API-token Secret in the cert-manager namespace:
#        kubectl -n cert-manager create secret generic cloudflare-api-token \
#          --from-literal=api-token="$(cat ~/.cloudflare-dns-token)"
#      (a scoped Zone.DNS:Edit token for babelstone.dev — never committed)
#   3. kubectl apply -f infra/k8s/overlays/staging/bootstrap/   # this issuer
#   4. kubectl apply -k infra/k8s/overlays/staging              # the overlay
#
# Prereqs: the node exists, the four A records (app/api/backstage/auth.babelstone.dev)
# resolve (proxied is fine), and the cloudflare-api-token Secret exists in the
# cert-manager namespace. Set the Cloudflare SSL/TLS mode to "Full (strict)" so the
# proxy re-encrypts to the origin's Let's Encrypt cert.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-babelstone
spec:
  acme:
    # Production Let's Encrypt. For a dry-run that won't burn the prod rate limit,
    # swap to the staging endpoint
    # (https://acme-staging-v02.api.letsencrypt.org/directory) — but note .dev is
    # HSTS-preloaded, so a browser rejects staging's untrusted cert; use it only to
    # prove the issuance wiring, then switch back.
    server: https://acme-v02.api.letsencrypt.org/directory
    # Role mailbox on the owned domain (swap for the real ops contact). Not PII.
    email: admin@babelstone.dev
    privateKeySecretRef:
      name: letsencrypt-babelstone-account-key
    solvers:
      # DNS-01 via Cloudflare: cert-manager writes the _acme-challenge TXT record
      # through the Cloudflare API using a scoped Zone.DNS:Edit token. TXT records
      # are never proxied, so this works regardless of the A records' orange/grey
      # state — the whole point of choosing DNS-01 for a proxied origin.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
