# HA / production-shaped overlay (P.7, babelstone-ixkp).
#
# Diverges from `base` in the HA
# direction: a 3-node Redpanda quorum and a Postgres primary + SYNCHRONOUS
# off-site warm standby. This is the topology ADR-PC-005 §P1 mandates for the
# source of truth (`events`, `outbox`, `saga_state`) — RPO ≈ 0, a committed
# event durable on two nodes before acknowledgement.
#
# CI VALIDATES ONLY (kustomize build + kubeconform). No real cluster, no deploy
# (that is Q.6), no DR drill / PITR (that is M.4), no sync-replication
# append-latency benchmark (that is L.3 / the Q-AK load test named in
# ADR-PC-005 §P1). This overlay is the wiring those lanes ride on.
#
# DESIGN DECISION — hand-rolled PG primary+standby, NOT an operator
# (CloudNativePG / Zalando). Standing preference: fully-controlled native
# primitives over frameworks that own their own tables/state. PostgreSQL
# streaming replication is exactly the PG-native posture ADR-PC-005 chose
# (candidate A); a fixed primary + one warm standby needs no CRD-driven failover
# controller. Rationale recorded in the introducing PR body (ADR-PC-020 §D3).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: babelstone-dev

resources:
  - ../../base
  # HA-only additions (the base ships none of these).
  - redpanda-headless-svc.yaml
  # Per-pod DNS for the primary (postgres-0.postgres-headless) — the standby's
  # pg_basebackup/primary_conninfo host. The base ClusterIP `postgres` Service
  # publishes no per-pod records, so this headless governing Service is required.
  - postgres-headless-svc.yaml
  - postgres-standby-ha.yaml
  - ha-secrets.example.yaml
  # M.4 (babelstone-f0ui) — DR/PITR additions, disjoint from the §P1 topology
  # above. PITR base-backup CronJob + cipher Secret (the primary archive patch
  # is in `patches:`), and the OpenBao key-store DR snapshot seam (ADR-PC-005
  # §P2/§P4).
  - postgres-pitr-resources.yaml
  - openbao-dr-ha.yaml
  # Telemetry hop (bd babelstone-zla1.18; ADR-IC-007 §P1 amendment 2026-07-09): the
  # collector-only in-cluster wall for the OTLP fan-out to grafana-lgtm. The
  # grafana-otlp-svc.patch below republishes 4317/4318 on the grafana-lgtm Service; this
  # NetworkPolicy admits them from the otel-collector pod ONLY, so the Collector stays the single
  # OTLP entry point (§P1). WITHOUT the pair the Collector's fan-out hop is black-holed and every
  # trace/log/metric is dropped — the same latent defect the staging overlay fixed in
  # bd babelstone-zla1.16. Scoped to just the telemetry edge (the ha overlay renders backing-infra
  # only, no apps/) — see network-policies.yaml's scope note.
  - network-policies.yaml

# Third-party image digest pins for the images THIS overlay adds on top of base (bd
# babelstone-2t16.31.1; ADR-PC-007 §A3). A base `images:` transformer reaches only base's own
# resources, so postgres (the warm-standby StatefulSet in postgres-standby-ha.yaml) and openbao
# (the DR snapshot resources in openbao-dr-ha.yaml) are re-pinned here to the SAME digests base
# uses (each entry also idempotently re-pins base's copy in the ha render). Reproducibility /
# supply-chain, NOT cosign-verified (ADR-PC-007 §A2 covers the signed first-party images). Bumped
# deliberately by the scheduled cd-thirdparty-digest-audit workflow (which discovers these entries
# and re-resolves each `name:newTag` with crane — so the pin name must be the REAL, resolvable repo,
# not a kustomize `newName` alias). woblerr/pgbackrest (postgres-pitr-*.yaml) replaces the absent
# pgbackrest/pgbackrest:2.54.2 repo — the pgBackRest project ships no official image, so this is the
# popular community image (single-maintainer, NOT vendor-official; a small supply-chain trade-off
# recorded in bd babelstone-2t16.31.4). Digests resolved 2026-07-10 (postgres/openbao 2026-07-09).
images:
  - name: postgres
    newTag: 18-alpine
    digest: sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
  - name: openbao/openbao
    newTag: 2.5.4
    digest: sha256:436eaf9778cad75507ff70ea26ace30dcbe15606e619ac3823495663d7f7c115
  - name: woblerr/pgbackrest
    newTag: 2.58.0
    digest: sha256:b77c5e0026f190bcba6861f5c02f2bd03d38c319162cc84b52fb2063fb79b636

# Replicas: Redpanda 1 -> 3 (a real Raft quorum). Postgres stays at 1 here —
# the warm standby is a SEPARATE StatefulSet (postgres-standby), not a second
# replica of the primary, because a synchronous standby needs distinct
# bootstrap (pg_basebackup) and runtime (standby.signal) config, not just a
# scaled-up pod count. The other single-instance backing services are unchanged
# from the base (HA for them is out of scope — see infra/k8s/README.md).
replicas:
  - name: redpanda
    count: 3
  - name: postgres
    count: 1

patches:
  # Turn the base single-node Redpanda into a 3-node seed-discovered cluster.
  - path: redpanda-ha.yaml
  # Turn the base single Postgres into the synchronous-replication PRIMARY.
  - path: postgres-primary-ha.yaml
  # Narrow the base `postgres` (write) Service to the primary — in the HA overlay
  # both pods carry app=postgres, so the unpatched selector would route writes to
  # the read-only standby.
  - path: postgres-write-svc-ha.yaml
  # M.4 (babelstone-f0ui) — enable WAL archiving (archive_mode/archive_command)
  # on the primary + mount the pgBackRest sidecar (ADR-PC-005 §P2 PITR). A
  # JSON6902 patch (APPENDS to the args/volumes lists — strategic-merge would
  # REPLACE the scalar args list and drop the §P1 synchronous-commit args), so it
  # is strictly additive and does not touch postgres-primary-ha.yaml. Needs an
  # explicit target (JSON6902 patches carry no apiVersion/kind/name header).
  - path: postgres-pitr-pgbackrest.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgres
  # Publish the appliance's OTLP intake (4317/4318) on the grafana-lgtm Service so the OTel
  # Collector's fan-out hop lands — without it every trace/log/metric is dropped in k8s
  # (bd babelstone-zla1.18). §P1 is preserved at the network layer: allow-grafana-lgtm-ingress
  # (network-policies.yaml above) admits 4317/4318 from the otel-collector ONLY. Mirrors the
  # staging overlay's grafana-otlp-svc.patch (bd babelstone-zla1.16); see the ADR-IC-007 §P1
  # amendment 2026-07-09.
  - path: grafana-otlp-svc.patch.yaml

configMapGenerator:
  # Primary first-boot replication setup (replicator role + physical slot),
  # mounted into /docker-entrypoint-initdb.d on the primary.
  - name: postgres-ha-init
    files:
      - 10-replication-setup.sh=files/10-replication-setup.sh
  # Primary pg_hba.conf opening the replicator role for the standby.
  - name: postgres-ha-config
    files:
      - pg_hba.conf=files/pg_hba.conf
  # M.4 (babelstone-f0ui) — pgBackRest config (ADR-PC-005 §P2), generated from
  # the single source infra/pgbackrest/pgbackrest.conf and mounted into the
  # primary + sidecar + backup CronJob at /etc/pgbackrest. Same single-source
  # discipline the base uses for kong.yml / collector.yaml (read above the
  # kustomization root — relies on --load-restrictor=LoadRestrictionsNone).
  - name: postgres-pgbackrest-config
    files:
      - pgbackrest.conf=../../../pgbackrest/pgbackrest.conf

generatorOptions:
  # Stable names so the volume references in postgres-primary-ha.yaml stay valid
  # (no content-hash suffix) — same choice the base makes for its ConfigMaps.
  disableNameSuffixHash: true
