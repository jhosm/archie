# DEV-ONLY placeholder Secret for the HA overlay — the streaming-replication
# credential (separate from the app POSTGRES_PASSWORD in the base Secret).
#
# Same seam contract as base/secrets.example.yaml: the value is intentionally
# trivial and exists only so `kustomize build` resolves the secretKeyRef wiring
# (primary's replicator role, standby's pg_basebackup + primary_conninfo).
#
# NEVER commit real credentials. In any real deployment swap this for an
# UNCOMMITTED Secret (or a platform-injected one). M.2 (babelstone-puu3)
# replaces this seam with real OpenBao-backed provisioning.
apiVersion: v1
kind: Secret
metadata:
  name: babelstone-ha-secrets
  annotations:
    babelstone.io/secret-boundary: "dev-mode-placeholder — real provisioning is M.2/puu3"
type: Opaque
stringData:
  POSTGRES_REPLICATION_PASSWORD: "replicator"
