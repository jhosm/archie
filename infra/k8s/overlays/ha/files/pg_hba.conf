# Postgres PRIMARY pg_hba.conf — HA overlay (ADR-PC-005 §P1).
#
# Mounted at /etc/postgres-ha/pg_hba.conf and selected by the primary's
# `-c hba_file=` runtime arg. Re-states the postgres:18-alpine defaults (the
# mounted file fully REPLACES the generated one) and ADDS the replication
# entries the warm standby needs.
#
# scram-sha-256 everywhere (the image default for password auth). The
# replication rule is scoped to the `replicator` role over the in-cluster pod
# network; the dev-mode broad CIDR is acceptable here for the same reason the
# placeholder Secret is — this is the seam, not a hardened deployment
# (hardening / real CIDRs land with the same M.2/Q.6 work the README defers).

# TYPE  DATABASE        USER          ADDRESS          METHOD
local   all             all                            trust
host    all             all           127.0.0.1/32     scram-sha-256
host    all             all           ::1/128          scram-sha-256

# Application traffic from in-cluster pods (engine, projections).
host    all             all           0.0.0.0/0        scram-sha-256

# Physical streaming replication — the warm standby connects as `replicator`
# to bootstrap (pg_basebackup) and stream WAL. `replication` is the special
# pseudo-database for the replication protocol.
host    replication     replicator    0.0.0.0/0        scram-sha-256
