# Catalogue portal host — nginx serves whatever static portal is built into the
# mounted dir. G.4 (PR #110) superseded ADR-IC-008 (EventCatalog) with ADR-IC-015
# (Backstage) and DEFERRED the portal-host deployment to platform work
# (bd babelstone-s4ol.1); until then the estate operates Git-native (the AsyncAPI
# source + the CI gate, ADR-IC-015 §9). The `eventcatalog` name is kept for path
# stability. Host only — no portal is built today.
apiVersion: v1
kind: Service
metadata:
  name: eventcatalog
  labels:
    app.kubernetes.io/name: eventcatalog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventcatalog
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventcatalog
  labels:
    app.kubernetes.io/name: eventcatalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventcatalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventcatalog
    spec:
      containers:
        - name: eventcatalog
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
