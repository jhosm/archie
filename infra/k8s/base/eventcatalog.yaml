# EventCatalog host — nginx serves the built static catalog (ADR-IC-008).
apiVersion: v1
kind: Service
metadata:
  name: eventcatalog
  labels:
    app.kubernetes.io/name: eventcatalog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eventcatalog
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventcatalog
  labels:
    app.kubernetes.io/name: eventcatalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eventcatalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventcatalog
    spec:
      containers:
        - name: eventcatalog
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
