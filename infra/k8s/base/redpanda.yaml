# Redpanda — Kafka-compatible event bus + built-in Schema Registry (ADR-IC-001,
# ADR-IC-002). Single-node dev-container, mirroring infra/compose.yaml. The
# 3-node HA topology (P.7, babelstone-ixkp) is the `overlays/ha` overlay's
# override of this base, not a change here.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: kafka-ext
      port: 19092
      targetPort: 19092
    - name: schema-reg
      port: 8081
      targetPort: 8081
    - name: schema-ext
      port: 18081
      targetPort: 18081
    - name: admin
      port: 9644
      targetPort: 9644
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      # fsGroup chowns the mounted data PVC to the redpanda gid so the non-root process
      # (runAsUser 101 below) can write its log dir. Pairs with the container runAsUser —
      # #420 set runAsNonRoot without either, which the kubelet cannot verify.
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). readOnlyRootFilesystem
          # is omitted: redpanda generates /etc/redpanda/redpanda.yaml and writes runtime
          # state outside the data PVC at startup, so a read-only root would break boot.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101           # 'redpanda' user in the redpanda image; numeric UID lets the kubelet verify non-root
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          # Mirrors the compose command (single source of truth for the dev
          # broker shape): internal listener advertised as `redpanda`, external
          # as `localhost` (only the internal one matters in-cluster).
          command:
            # `--mode dev-container` is an rpk flag, not a flag of the raw `redpanda`
            # binary (which errors "unrecognised option") — invoke via rpk, the documented
            # single-node dev entrypoint. Surfaced on the first real-cluster apply.
            - rpk
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --default-log-level=info
            - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
            - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
            # LISTEN on all local interfaces (a pod cannot bind the Service ClusterIP that
            # `redpanda` resolves to → "Cannot assign requested address"); ADVERTISE the
            # service name so peers/clients reach it. Surfaced on the first real-cluster apply.
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=redpanda:33145
          ports:
            - name: kafka
              containerPort: 9092
            - name: kafka-ext
              containerPort: 19092
            - name: schema-reg
              containerPort: 8081
            - name: schema-ext
              containerPort: 18081
            - name: admin
              containerPort: 9644
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "rpk cluster health | grep -E 'Healthy:.+true'"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: redpanda-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
