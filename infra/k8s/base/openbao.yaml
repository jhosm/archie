# OpenBao — per-subject key store for crypto-shredding (ADR-PC-004).
#
# DEV-ONLY: `-dev` mode is in-memory and auto-unsealed with a fixed root token.
# This is a SEAM, not real provisioning. Production OpenBao (real storage,
# auto-unseal, policy/auth setup, HA/DR per ADR-PC-005) is M.2 (babelstone-puu3).
apiVersion: v1
kind: Service
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: openbao
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openbao
  ports:
    - name: api
      port: 8200
      targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  labels:
    app.kubernetes.io/name: openbao
  annotations:
    babelstone.io/secret-boundary: "dev-mode-placeholder — real provisioning is M.2/puu3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
      annotations:
        babelstone.io/secret-boundary: "dev-mode-placeholder — real provisioning is M.2/puu3"
    spec:
      containers:
        - name: openbao
          image: openbao/openbao:2.5.4
          # Dev server: in-memory store, single unsealed node. NOT for prod.
          # ARGS, not command: the image ENTRYPOINT is `docker-entrypoint.sh` (it runs
          # `bao "$@"`), so these are arguments to it. Using `command:` would REPLACE the
          # entrypoint and try to exec a binary literally named `server` — which does not
          # exist, so the container fails with RunContainerError. Verified: the default
          # entrypoint + these args boots OpenBao unsealed as uid 100 with drop:[ALL].
          args:
            - server
            - -dev
            - -dev-listen-address
            - 0.0.0.0:8200
          ports:
            - name: api
              containerPort: 8200
          env:
            - name: BAO_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: OPENBAO_DEV_TOKEN
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). Run as the
          # image's non-root `openbao` user (uid 100 / gid 1000) and drop ALL
          # Linux capabilities. runAsUser is REQUIRED: the image defaults to root,
          # so runAsNonRoot alone would be refused by the kubelet ("image will run
          # as root"). We add NO capabilities — PSA `baseline` REJECTS IPC_LOCK
          # (it is not on baseline's capability allow-list), and the `-dev` server
          # is in-memory so it never mlock()s (verified: it boots unsealed with
          # drop:[ALL] and no IPC_LOCK). When real provisioning lands (M.2/puu3),
          # disable mlock via `disable_mlock` in config, not by re-adding the cap.
          # readOnlyRootFilesystem is omitted: even in -dev mode OpenBao writes
          # runtime files (plugin/socket scratch) to its root fs.
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
