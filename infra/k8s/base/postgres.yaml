# Postgres — event store (ADR-PC-001).
# StatefulSet for stable storage; single replica (dev). HA (primary +
# synchronous off-site warm standby, ADR-PC-005 §P1) is P.7 (babelstone-ixkp),
# the `overlays/ha` overlay's override of this base — not a change here.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      # PVC ownership: fsGroup chowns the mounted data volume to the postgres gid so the
      # non-root process (runAsUser 70 below) can write PGDATA. Pairs with the container
      # runAsUser — #420 set runAsNonRoot without either, which the kubelet cannot verify.
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:18-alpine
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). readOnlyRootFilesystem
          # is omitted: Postgres writes its unix socket to /var/run/postgresql and
          # scratch to /tmp on the root fs, so a read-only root would break initdb/startup.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70            # 'postgres' user in postgres:18-alpine (Alpine); numeric UID lets the kubelet verify non-root
            runAsGroup: 70
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # POSTGRES_DB / POSTGRES_USER from the postgres-config ConfigMap
            # (mirrors the compose dev defaults); the password is a Secret.
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: POSTGRES_PASSWORD
            # PGDATA subdir keeps the mounted volume root clean for initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "babelstone", "-d", "babelstone"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
