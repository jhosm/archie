# DEV-ONLY placeholder Secret. These values are intentionally trivial and match
# the Compose dev defaults; they exist only so `kustomize build` resolves the
# secretKeyRef wiring (Postgres password, OpenBao dev root token).
#
# NEVER commit real credentials. In any real deployment, swap this for an
# UNCOMMITTED Secret (or a platform-injected one). M.2 (babelstone-puu3)
# replaces this seam with real OpenBao-backed provisioning — see openbao.yaml.
#
# The STAGING overlay does not render this Secret at all (bd babelstone-zla1.12.4:
# overlays/staging/drop-dev-secrets.patch.yaml deletes it from the applied set, so a
# redeploy can never overwrite the operator-provisioned real Secret with these
# placeholders), and scripts/cd-secret-preflight.sh fails the deploy closed if any
# of these values is detected in the render or the live cluster. If you ADD a
# placeholder key here, add its detection there too.
apiVersion: v1
kind: Secret
metadata:
  name: babelstone-dev-secrets
  annotations:
    babelstone.io/secret-boundary: "dev-mode-placeholder — real provisioning is M.2/puu3"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "babelstone"
  OPENBAO_DEV_TOKEN: "root"
  # Logto IAM (ADR-IC-021, staging overlay) — the secret-vault KEK (base64) + the OIDC
  # token-signing key. DEV-ONLY placeholders, the SAME seam as POSTGRES_PASSWORD above:
  # they exist only so the staging Logto manifests' `secretKeyRef` wiring resolves at
  # `kustomize build`. In a real deploy these are OpenBao-injected at deploy time
  # (ADR-PC-004 §A1 — never on the bus); NEVER commit real key material.
  SECRET_VAULT_KEK: "ZGV2LXBsYWNlaG9sZGVyLXZhdWx0LWtlay1kby1ub3QtdXNl"
  OIDC_PRIVATE_KEYS: "dev-placeholder-oidc-signing-key — OpenBao-injected at deploy"
  # Mission Control Boundary-1 OIDC login gate (ADR-IC-021 rollout step 2, staging overlay,
  # bd zla1.10.8.3) — the confidential-client secret for the hand-registered
  # `babelstone-mission-control` Logto app + the HMAC key that signs Mission Control's session
  # cookie. DEV-ONLY placeholders, the SAME seam as the keys above: they exist only so the staging
  # mission-control.yaml `secretKeyRef` wiring resolves at `kustomize build`. In a real deploy these
  # are OpenBao-injected at deploy (runbook staging-ops.md §1 step 5); NEVER commit real material.
  # The Logto app is hand-registered (DCR is the accepted ADR-IC-021 §C6 gap) — see
  # infra/runbooks/mission-control-oidc-registration.md.
  LOGTO_MISSION_CONTROL_CLIENT_SECRET: "dev-placeholder-mission-control-client-secret — OpenBao-injected at deploy"
  MC_SESSION_SIGNING_KEY: "dev-placeholder-mc-session-signing-key — OpenBao-injected at deploy"
