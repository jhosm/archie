apiVersion: v1
kind: Namespace
metadata:
  name: babelstone-dev
  # Pod Security Admission (ADR-IC-016 zero-trust posture, CIS PSA): enforce the
  # `baseline` profile on every Pod admitted to this namespace — privileged
  # containers, host namespaces, and hostPath are rejected. baseline also does
  # NOT permit ADDING Linux capabilities beyond its fixed allow-list — which does
  # NOT include IPC_LOCK — so workloads here drop ALL caps and add none (the
  # OpenBao `-dev` server is in-memory and never mlock()s, so it needs no
  # IPC_LOCK). `warn`/`audit` are pinned a notch stricter at `restricted` as
  # forward-guidance: a deploy that violates the stricter profile is surfaced
  # (warning + audit annotation) without being blocked, so the gap to a future
  # enforce=restricted is visible before it is enforced. The base name is
  # `babelstone-dev`; the staging overlay renames it to `babelstone-staging`,
  # carrying these labels through unchanged.
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
