# Backstage DB provisioning Job (bd babelstone-zla1.6.6 / zla1.6.5; ADR-IC-015).
#
# Plain English: Backstage keeps its catalogue data in Postgres. Instead of a separate
# database pod, it now uses a dedicated `backstage` role + `backstage` database INSIDE the
# shared cluster Postgres. This one-shot Job creates both, idempotently, so a re-apply is a
# no-op. It runs wherever Backstage runs (it lives in base, alongside backstage.yaml), and
# uses the shared Postgres superuser to issue the CREATE ROLE / CREATE DATABASE — the same
# shape as the Logto DB-init Job (overlays/staging/logto-jobs.yaml) and the orchestrator's
# create-DB init (infra/k8s/apps/orchestrator.yaml). Both credentials come from the Secret
# seam — never inline literals (ADR-PC-004 §A1).
#
# The `backstage` role holds CREATEDB so Backstage manages its own per-plugin storage; it
# owns the `backstage` database (its default connection target). CREATE DATABASE cannot run
# inside a transaction, so it is guarded by a pg_database check (not a DO block), mirroring
# the orchestrator/Logto create-DB inits. CI VALIDATES SHAPE ONLY (kustomize build +
# kubeconform); the live apply is account-gated.
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-db-init
  labels:
    app.kubernetes.io/name: backstage-db-init
    app.kubernetes.io/part-of: babelstone
spec:
  backoffLimit: 6
  # Let a completed Job be recreated cleanly on the next apply (the SQL is idempotent).
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-backstage-db
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -h "$PGHOST" -p 5432 -U "$PGUSER" -d "$PGDATABASE" >/dev/null 2>&1; do
                echo "waiting for postgres ..."; sleep 2
              done
              # Role: create it if absent, then always (re)set LOGIN/CREATEDB + the current
              # password so a rotated Secret takes effect on the next run. :'pw' is psql's
              # quoted-literal substitution — safe against injection.
              if [ "$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='backstage'")" = "1" ]; then
                echo "role backstage already exists"
              else
                echo "creating role backstage"
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE backstage LOGIN CREATEDB"
              fi
              psql -v ON_ERROR_STOP=1 -v pw="$BACKSTAGE_DB_PASSWORD" \
                -c "ALTER ROLE backstage WITH LOGIN CREATEDB PASSWORD :'pw'"
              # Database (owned by backstage). CREATE DATABASE can't run in a transaction, so
              # guard with a pg_database check rather than a DO block.
              if [ "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='backstage'")" = "1" ]; then
                echo "database backstage already exists"
              else
                echo "creating database backstage"
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE backstage OWNER backstage"
              fi
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            # Connect to the existing babelstone DB (as the superuser) to issue the CREATEs.
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: POSTGRES_PASSWORD
            # The dedicated backstage role's password — from the Secret seam, never inline.
            - name: BACKSTAGE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: BACKSTAGE_DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
