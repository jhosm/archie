# Redpanda Console — web UI for topics + schema registry (dev convenience).
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redpanda-console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  labels:
    app.kubernetes.io/name: redpanda-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-console
    spec:
      containers:
        - name: redpanda-console
          image: docker.redpanda.com/redpandadata/console:v2.8.0
          ports:
            - name: http
              containerPort: 8080
          env:
            # Reach Redpanda over the internal listener on the cluster network.
            - name: KAFKA_BROKERS
              value: redpanda:9092
            - name: KAFKA_SCHEMAREGISTRY_ENABLED
              value: "true"
            - name: KAFKA_SCHEMAREGISTRY_URLS
              value: http://redpanda:8081
