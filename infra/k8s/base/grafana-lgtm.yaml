# Grafana LGTM — all-in-one observability backend, Loki + Grafana + Tempo +
# Prometheus (ADR-IC-007).
#
# ADR-IC-007 §P1 (single OTLP entry point): the LGTM appliance's own OTLP ports
# (4317/4318) are NOT exposed. Only the OTel Collector ingests OTLP; it fans out
# to this backend cluster-internally. The Service here exposes ONLY the Grafana
# UI (3000). CI asserts 4317/4318 are absent from this Service.
apiVersion: v1
kind: Service
metadata:
  name: grafana-lgtm
  labels:
    app.kubernetes.io/name: grafana-lgtm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana-lgtm
  ports:
    # Grafana UI only. Do NOT add OTLP (4317/4318) here — ADR-IC-007 §P1.
    - name: grafana-ui
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-lgtm
  labels:
    app.kubernetes.io/name: grafana-lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-lgtm
    spec:
      # Non-root posture (bd zla1.5.8). The grafana/otel-lgtm image is USER root by default, so
      # runAsNonRoot with no numeric uid yields CreateContainerConfigError ("image will run as
      # root"). A numeric runAsUser fixes that — but the bundled Grafana, Loki, Tempo, Prometheus
      # and Pyroscope all write under /data (a path absent from the image), plus the optional
      # AI-tool MCP hint under root-owned /etc/lgtm, which a non-root uid can't create. fsGroup +
      # the emptyDir mounts below make both writable at the chosen uid. Verified locally: every
      # bundled component reaches "up and running" as uid 1000 with exactly this shape.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-lgtm
          image: grafana/otel-lgtm:0.28.0
          # Hardened container posture (ADR-IC-016 zero-trust, CIS PSA). readOnlyRootFilesystem is
          # omitted: the appliance also writes scratch to the image's world-writable (1777) /tmp,
          # so a read-only root would break it; its data dirs are the emptyDir volumes below.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            # Only the Grafana UI port is declared. The container also listens
            # on OTLP internally, reachable only via the Collector fan-out
            # (grafana-lgtm:4317), never published on the Service (ADR-IC-007 §P1).
            - name: grafana-ui
              containerPort: 3000
          volumeMounts:
            # The all-in-one appliance's writable state (bd zla1.5.8): Grafana (/data/grafana),
            # Loki (/data/loki), Tempo (/data/tempo), Prometheus (/data/prometheus) and Pyroscope
            # (/data/pyroscope) all live under /data; /etc/lgtm holds the optional AI-tool MCP hint.
            # emptyDir + the pod fsGroup above make both writable by the non-root uid. Ephemeral —
            # as the appliance's state already was (it wrote to the container fs before, no volume).
            - name: data
              mountPath: /data
            - name: etc-lgtm
              mountPath: /etc/lgtm
      volumes:
        - name: data
          emptyDir: {}
        - name: etc-lgtm
          emptyDir: {}
