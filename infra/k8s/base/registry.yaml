# OCI registry — distribution registry for oras-pushed regulatory packs, pulled
# by digest (ADR-PC-007). StatefulSet for stable storage; single replica (dev).
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  serviceName: registry
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      containers:
        - name: registry
          image: registry:3.1.1
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). The distribution
          # storage driver writes all blobs and upload scratch under its rootdirectory
          # (/var/lib/registry, the mounted PVC below), so readOnlyRootFilesystem is feasible.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - name: registry
              containerPort: 5000
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
  volumeClaimTemplates:
    - metadata:
        name: registry-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
