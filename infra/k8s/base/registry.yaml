# OCI registry — distribution registry for oras-pushed regulatory packs, pulled
# by digest (ADR-PC-007). StatefulSet for stable storage; single replica (dev).
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  serviceName: registry
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      # registry:3.1.1 runs as root by default; run it as an arbitrary non-root uid and
      # fsGroup-chown the blob PVC so it can write /var/lib/registry. Pairs with the
      # container runAsUser (#420 set runAsNonRoot without a numeric UID the kubelet can verify).
      securityContext:
        fsGroup: 1000
      containers:
        - name: registry
          image: registry:3.1.1
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). The distribution
          # storage driver writes all blobs and upload scratch under its rootdirectory
          # (/var/lib/registry, the mounted PVC below), so readOnlyRootFilesystem is feasible.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000          # registry:3.1.1 has no baked non-root user; run as an arbitrary non-root uid (PVC is fsGroup-chowned above)
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - name: registry
              containerPort: 5000
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
  volumeClaimTemplates:
    - metadata:
        name: registry-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
