# Kong — edge API gateway, DB-less declarative mode (ADR-IC-006).
# KONG_DATABASE=off is the load-bearing ADR-IC-006 commitment (asserted in CI).
# The declarative config is the SAME infra/kong/kong.yml the Compose stack
# mounts, carried in via the kong-config ConfigMap (single source of truth).
apiVersion: v1
kind: Service
metadata:
  name: kong
  labels:
    app.kubernetes.io/name: kong
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: admin
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app.kubernetes.io/name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
    spec:
      containers:
        - name: kong
          image: kong:3.9.1
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). readOnlyRootFilesystem
          # is omitted: Kong writes nginx prefix runtime files (temp paths, pids, sockets)
          # under /usr/local/kong at startup, so a read-only root would break boot.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001          # 'kong' user in kong:3.9.1; numeric UID lets the kubelet verify non-root
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            # DB-less: no gateway database, no migrations (ADR-IC-006).
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            # Keep the Lua sandbox ON but allowlist the two modules the kong.yml pre-functions
            # require — cjson.safe (SCA + body decode) and resty.http (SoR resolution). kong:3.9.1
            # defaults untrusted_lua=sandbox with an EMPTY requires-allowlist, so without this every
            # edge request 500s (bd babelstone-39jl); the abig/1z0r runtime harness is the guard.
            - name: KONG_UNTRUSTED_LUA
              value: "sandbox"
            - name: KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES
              value: "cjson.safe,resty.http"
          volumeMounts:
            - name: kong-config
              mountPath: /kong
              readOnly: true
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
