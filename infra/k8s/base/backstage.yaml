# Backstage catalogue portal host (ADR-IC-015) — supersedes the retired EventCatalog
# nginx placeholder (ADR-IC-008, retired). Backstage is the chosen portal (Apache-2.0,
# CNCF-graduated) that RENDERS the governed AsyncAPI catalogue; it restates no schema —
# its only catalogue source is the registered contracts/catalog/catalog-info.yaml
# descriptor (the no-drift invariant, ADR-IC-015 Decision §1–§2).
#
# In plain English: this runs the real, self-contained Backstage image. It stores its state in
# a lightweight in-process database (SQLite), NOT Postgres — there is no separate DB pod. Nothing
# is persisted: the portal rebuilds its entire catalogue from the /catalog descriptor baked into
# the image on every boot, so an in-memory DB costs zero memory and loses nothing.
#
# TOPOLOGY (maintainer's call recorded on bd babelstone-zla1.6.1 — NO ADR governs it):
#   * DB: SQLite (better-sqlite3), in-memory (:memory:) — see infra/backstage/app-config.yaml.
#     No Postgres of any kind: not a separate pod, not the shared cluster instance. Backstage is
#     a read-only catalogue portal whose state is fully reconstructible from the baked /catalog
#     tree, so it re-ingests on boot in seconds; nothing to persist, nothing to back up.
#   * Image: ghcr.io/jhosm/babelstone-backstage:latest — the multi-stage image built by
#     backstage/Dockerfile (bd babelstone-zla1.6.3). It BAKES the governed app-config
#     (infra/backstage/app-config.yaml → /app/app-config.production.yaml) AND the whole
#     contracts/catalog/ tree (→ /catalog/), so the portal is self-contained: no app-config
#     ConfigMap mount and no flat catalog ConfigMap mount (a flat ConfigMap cannot carry the
#     events/ + reconciliation/ SUBDIRS the descriptor $text-references). cd.yml pins the
#     digest at deploy, matching the :latest convention infra/k8s/apps/engine.yaml uses.
#   * GDPR (ADR-IC-015 Residual Risk): once user/team identity data is entered for
#     ownership/access control, it MUST go in the GDPR data inventory.
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: catalogue-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backstage
  ports:
    - name: http
      port: 7007
      targetPort: 7007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: catalogue-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      containers:
        - name: backstage
          # The real, self-contained catalogue-portal image (backstage/Dockerfile, bd
          # babelstone-zla1.6.3): it bakes the governed app-config + the whole contracts/catalog/
          # tree, so no config/catalogue volumes are mounted. :latest matches the apps/ convention;
          # cd.yml pins the digest at deploy.
          image: ghcr.io/jhosm/babelstone-backstage:latest
          imagePullPolicy: IfNotPresent
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). readOnlyRootFilesystem
          # is omitted: the Backstage Node app writes caches/scratch to /tmp and its working
          # dir at runtime, so a read-only root would break it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000          # the 'node' user in node:22-bookworm-slim (backstage/Dockerfile USER node).
                                     # The image declares its user by NAME, which the kubelet cannot verify as
                                     # non-root at admission — so runAsNonRoot alone fails the container with
                                     # CreateContainerConfigError. Pinning the numeric UID lets the kubelet verify.
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 7007
          # No DB env: the baked app-config uses in-memory SQLite (no Postgres connection). Only
          # the public base URL is wired.
          env:
            - name: BACKSTAGE_BASE_URL
              value: http://localhost:7007
          readinessProbe:
            httpGet:
              path: /
              port: 7007
            initialDelaySeconds: 20
            periodSeconds: 15
