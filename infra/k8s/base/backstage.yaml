# Backstage catalogue portal host (ADR-IC-015) — supersedes the retired EventCatalog
# nginx placeholder (ADR-IC-008, retired). Backstage is the chosen portal (Apache-2.0,
# CNCF-graduated) that RENDERS the governed AsyncAPI catalogue; it restates no schema —
# its only catalogue source is the registered contracts/catalog/catalog-info.yaml
# descriptor (the no-drift invariant, ADR-IC-015 Decision §1–§2).
#
# In plain English: this runs the real, self-contained Backstage image and points it at a
# dedicated `backstage` database + role INSIDE the shared cluster Postgres — there is no
# longer a separate backstage-db pod. The DB password comes from the Secret seam, and the
# catalogue + config are BAKED into the image, so nothing is file-mounted here.
#
# TOPOLOGY (maintainer's call recorded on bd babelstone-zla1.6.1 — NO ADR governs it):
#   * DB: a dedicated `backstage` role + `backstage` database living in the shared `postgres`
#     StatefulSet (base/postgres.yaml), NOT a separate pod and NOT the product `babelstone`
#     DB. Provisioned idempotently by the init Job in backstage-db-init.yaml (modelled on the
#     Logto DB-init Job, overlays/staging/logto-jobs.yaml); the role holds CREATEDB so
#     Backstage manages its own per-plugin storage. Removing the separate backstage-db pod
#     folds the catalogue DB into the shared cluster's own durability + backup path.
#   * Image: ghcr.io/jhosm/babelstone-backstage:latest — the multi-stage image built by
#     backstage/Dockerfile (bd babelstone-zla1.6.3). It BAKES the governed app-config
#     (infra/backstage/app-config.yaml → /app/app-config.production.yaml) AND the whole
#     contracts/catalog/ tree (→ /catalog/), so the portal is self-contained: no app-config
#     ConfigMap mount and no flat catalog ConfigMap mount (a flat ConfigMap cannot carry the
#     events/ + reconciliation/ SUBDIRS the descriptor $text-references). cd.yml pins the
#     digest at deploy, matching the :latest convention infra/k8s/apps/engine.yaml uses.
#   * Credentials: BACKSTAGE_PG_PASSWORD comes from the babelstone-dev-secrets Secret (key
#     BACKSTAGE_DB_PASSWORD) — never an inline literal (ADR-PC-004 §A1, bd babelstone-zla1.6.5).
#   * GDPR (ADR-IC-015 Residual Risk): once user/team identity data is entered for
#     ownership/access control, it MUST go in the GDPR data inventory.
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: catalogue-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backstage
  ports:
    - name: http
      port: 7007
      targetPort: 7007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: catalogue-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      containers:
        - name: backstage
          # The real, self-contained catalogue-portal image (backstage/Dockerfile, bd
          # babelstone-zla1.6.3): it bakes the governed app-config + the whole contracts/catalog/
          # tree, so no config/catalogue volumes are mounted. :latest matches the apps/ convention;
          # cd.yml pins the digest at deploy.
          image: ghcr.io/jhosm/babelstone-backstage:latest
          imagePullPolicy: IfNotPresent
          # Hardened pod posture (ADR-IC-016 zero-trust, CIS PSA). readOnlyRootFilesystem
          # is omitted: the Backstage Node app writes caches/scratch to /tmp and its working
          # dir at runtime, so a read-only root would break it.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 7007
          # The baked app-config reads the DB connection from these ${BACKSTAGE_PG_*} env vars
          # (infra/backstage/app-config.yaml), so the shared-Postgres wiring is env-driven — no
          # config file is overridden here. The database name defaults to the role name
          # (`backstage`) that backstage-db-init.yaml creates.
          env:
            - name: BACKSTAGE_BASE_URL
              value: http://localhost:7007
            - name: BACKSTAGE_PG_HOST
              value: postgres
            - name: BACKSTAGE_PG_PORT
              value: "5432"
            - name: BACKSTAGE_PG_USER
              value: backstage
            - name: BACKSTAGE_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: babelstone-dev-secrets
                  key: BACKSTAGE_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: 7007
            initialDelaySeconds: 20
            periodSeconds: 15
