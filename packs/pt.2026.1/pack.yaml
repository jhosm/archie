# pt.2026.1 — PT term-deposit regulatory pack (ADR-PC-007).
# The manifest: identity, metadata, dependencies, pins. Primitives, parameters,
# rate-sheet refs and the sealed test corpus live in sibling files/dirs (§P1
# layout — pack.yaml is NOT where primitives are inlined). Auditor-readable:
# `cat` + `diff`, no tooling.
pack_id: pt
pack_version: "2026.1"
namespace: pt
manifest_schema_version: 1

publisher: pt-pack-team@engine.internal
pack_effective_from: 2026-01-01

# First pack in the PT line.
based_on_pack_version: null

delta_summary: |
  Initial PT term-deposit (depósito a prazo) pack. Covers the v1 regulatory
  surface (02 §2.2): Act/360 day-count, 28% IRS withholding on interest paid
  to resident individuals (gross-interest basis, flow-by-flow), deposit-
  guarantee-fund coverage, and the BdP retail-deposit interest-rate statistics
  reporting hook. No prior pack.

  F.7 delivers the full v1 INPUT surface only (declarative data, no computed
  results): five /product-configs variants spanning every interest shape the
  family schema carries — AT_MATURITY single-coupon (dpz_pt_12m_juros_venc),
  periodic-monthly (dpz_pt_12m_juros_mensal), periodic-quarterly
  (dpz_pt_24m_juros_trimestral), advance/juros-antecipados
  (dpz_pt_6m_juros_antecipados), and a banded early-termination schedule
  (dpz_pt_18m_resgate_escalonado) — plus one canonical sealed-corpus instance
  per shape. Each variant references the rate sheet by ref only (no inline
  rate); withholding stays the 2800 bps irs_juros primitive on gross interest;
  the only day-count is act_360. No new primitives.

  RESOLVED upstream (Epic 0.3/0.4, bd babelstone-oa3i + babelstone-gjyl):
  pack-effective-date semantics — v1 pins everything at constitution, no new
  machinery (ADR-PC-009 §P5). BdP signal inventory — v1 is three named returns,
  all declared here: BdP rate stats (bdp_estatisticas_taxas_juro), Modelo 39
  (withholding.yaml reporting.modelo_39), and FGD coverage
  (fgd_cobertura_depositos); the engine emits subject-reference-only signals and
  a downstream application assembles each return (04 §Q-AX, no PII on the bus).

  STILL DEFERRED (documented, not stubbed): TANB/TANL/TAE/TAEG remain
  engine-computed derived figures, never pack fields. expected-events.yaml stays
  the GENERATED empty placeholder (ADR-PC-007 §P5) until the engine substrate
  (C.3/C.5) can run the corpus. FIN data-field reconciliation (02 §2.4.1 payload
  sketches vs canonical .avsc) is tracked in bd babelstone-50vy. Any rate sheet a
  variant references must be published before deploy (C.6 prerequisite).

breaking_changes: []

dependencies:
  # v1 engine series. Published with every engine release (surface §3.8).
  engine_compatible_versions: ">=1.0.0,<2.0.0"

# The family-schema version this pack's bundled schemas/ carries (authoring §6).
schema_pins:
  term_deposit: term_deposit@2026.1

rate_sheet_refs:
  - deposits-pt

test_corpus_ref: oci://babelstone-packs/pt-deposit-tests@2026.1

# Q-P reserve (surface §3.11) — multi-pack composition; no-op in v1.
primitive_overlays: []
