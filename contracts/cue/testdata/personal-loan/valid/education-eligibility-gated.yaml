# An education-purpose (lower legal cap) 24-month loan that DECLARES the upstream
# origination verdicts it requires (ADR-PC-024): solvency assessment + CRC
# consultation. The engine RECORDS the decision for audit; upstream EVALUATES and
# the saga passes the resolved verdicts on the disbursement command; the decider
# REFUSES if a required verdict is absent or satisfied:false. Origination stays
# UPSTREAM (ADR-PC-030 §P1) — this config only names which verdicts gate disbursement.
variant_id: cp_pt_education_24m_gated
schema: personal_loan@2026.1
pack: pt.2026.1
currency: EUR
term_months: 24
purpose: education
rate:
  fixed:
    rate_ref: { sheet: live, role_selector: standard }
early_repayment:
  commission_basis_points: 25
required_preconditions:
  - solvency_assessed
  - crc_consulted
principal_bounds:
  min_cents: 50000
