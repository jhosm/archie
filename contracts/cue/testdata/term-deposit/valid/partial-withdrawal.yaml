# Variant exercising the optional F.12 partial_withdrawal block (02 §2.4.1):
# a 12-month AT_MATURITY deposit declaring all three gates plus a principal
# corridor with a ceiling. Accept fixture — the block + its two depth-4
# coherence invariants (lockup_period_days < term_days; min_remaining_balance_cents
# < principal_bounds.max_cents) all hold, so it passes depths 1–4.
variant_id: dpz_pt_12m_partial_withdrawal
schema: term_deposit@2026.1
pack: pt.2026.1
term_days: 365
day_count: pt.act_360
currency: EUR
interest_variant: AT_MATURITY
rate:
  flat:
    rate_ref: { sheet: live, role_selector: deposit_origin }
early_termination:
  flat:
    up_to_days: null
    penalty_basis_points: 10000
    basis: ACCRUED_INTEREST
auto_renewal_policy: NONE
principal_bounds:
  min_cents: 100000      # €1,000.00 — corridor floor (≥ min_remaining_balance_cents)
  max_cents: 50000000    # €500,000.00 — corridor ceiling (> min_remaining_balance_cents)
partial_withdrawal:
  min_withdrawal_cents: 50000         # €500.00
  min_remaining_balance_cents: 100000 # €1,000.00
  lockup_period_days: 90              # 90-day lock-up (< 365-day term)
