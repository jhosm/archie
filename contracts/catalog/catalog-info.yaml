# Backstage catalogue descriptor for the engine's integration events — across ALL product
# families (term_deposit and personal_loan today; ADR-IC-015, ADR-PC-031) plus the engine-declared
# cross-cutting (operations) events — and the per-consumer reconciliation contracts (event-store
# §7.3, bd babelstone-y1t7).
#
# This file makes the SAME source-of-truth artefacts discoverable in a Backstage instance:
#   * the AsyncAPI events under ./events/*.asyncapi.yaml — one `kind: API` entity per event,
#     `spec.type: asyncapi`, `spec.definition.$text` -> the relative AsyncAPI file;
#   * the reconciliation contracts under ./reconciliation/*.reconciliation.yaml — one
#     `kind: API` entity per consumer, `spec.type: reconciliation`, `spec.definition.$text`
#     -> the relative descriptor (Backstage resolves $text relative to this file's location);
#   * the OpenAPI REST contracts under ../openapi/specs/*.openapi.yaml (ADR-IC-020; bd
#     babelstone-ax0b.3) — one `kind: API` entity per spec, `spec.type: openapi`,
#     `spec.definition.$text` -> the relative OpenAPI file (never inlined — the specs are
#     gated by scripts/openapi-catalog-validate.sh, the REST mirror of the AsyncAPI gate).
#
# The descriptors ship as the source of truth; the Backstage HOST that renders them is
# deployed by the infra/ manifests (infra/compose.yaml `backstage` service, infra/k8s/base/
# backstage.yaml; ADR-IC-015 §9, bd babelstone-s4ol.1), which mount this file as the portal's
# ONLY catalogue source. The remaining human-handoff step is building+pushing the Backstage
# app image (no turnkey image exists) — until then the source files + the CI gate
# (scripts/asyncapi-catalog-validate.sh) remain the live governance surface (the Git-native
# fallback posture). No PII lives here or in any referenced AsyncAPI / Avro / reconciliation
# artefact (ADR-PC-004 §P2): the reconciliation contracts carry references (consumer names,
# projection-kind discriminators, §7.1 pattern flags), never PII.
#
# Register it later with, e.g.:
#   catalog:
#     locations:
#       - type: url
#         target: https://github.com/jhosm/babelstone/blob/main/contracts/catalog/catalog-info.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-term-deposit-events
  description: The governed AsyncAPI catalogue of the term-deposit integration events.
spec:
  type: url
  targets:
    - ./events/DepositConstituted.asyncapi.yaml
    - ./events/InterestPaid.asyncapi.yaml
    - ./events/DepositMatured.asyncapi.yaml
    - ./events/DepositTerminatedEarly.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-personal-loan-events
  description: The governed AsyncAPI catalogue of the personal_loan (personal-loan) integration events.
spec:
  type: url
  targets:
    - ./events/LoanDisbursed.asyncapi.yaml
    - ./events/LoanInstallmentPaid.asyncapi.yaml
    - ./events/LoanRepaidEarly.asyncapi.yaml
    - ./events/LoanSettled.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-operations-events
  description: The governed AsyncAPI catalogue of the engine-declared cross-cutting (operations) integration events.
spec:
  type: url
  targets:
    - ./events/operations.PersonalDataErasureRequested.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-reconciliation-contracts
  description: The per-consumer reconciliation contracts (event-store §7.3).
spec:
  type: url
  targets:
    - ./reconciliation/engine-projection-runtime.reconciliation.yaml
    - ./reconciliation/acl.reconciliation.yaml
    - ./reconciliation/notification.reconciliation.yaml
---
# The governed OpenAPI catalogue of the synchronous REST surfaces (ADR-IC-020; bd
# babelstone-ax0b.3) — the second catalogue spec format alongside AsyncAPI. Same $text-pointer
# no-drift discipline: the *.openapi.yaml files under ../openapi/specs/ are the source of
# truth (gated by scripts/openapi-catalog-validate.sh — Spectral governance fields, oasdiff
# breaking diff, Kong-route reconciliation); the schema is NEVER inlined here.
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-rest-apis
  description: The governed OpenAPI catalogue of the public (and marked-internal) REST surfaces (ADR-IC-020).
spec:
  type: url
  targets:
    - ../openapi/specs/orchestrator-edge.openapi.yaml
    - ../openapi/specs/engine-reads.openapi.yaml
    - ../openapi/specs/engine-sor-ops.openapi.yaml
    - ../openapi/specs/orchestrator-process-status.openapi.yaml
    # The INTERNAL catalogue (../openapi/internal/, bd babelstone-ax0b.5): never-public-by-design
    # surfaces — the mTLS-only engine command ingress and the operator/admin-ops planes. Each
    # carries info.x-internal (a required reason string) and the gate's NEVER-PUBLIC reconcile
    # proves none of their operations is an exposed Kong route.
    - ../openapi/internal/engine-deposit-commands.openapi.yaml
    - ../openapi/internal/engine-rate-sheets.openapi.yaml
    - ../openapi/internal/engine-pack-migrations.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orchestrator-edge-api
  title: Edge — Deposit Constitution API
  description: >
    The public edge front door (ADR-IC-006): POST /api/v1/deposits/constitute starts the
    constitution saga; the SSE stream reports its progress. JWT + PSD2-SCA + rate limits at
    the Kong gateway.
spec:
  type: openapi
  lifecycle: production
  owner: platform-edge
  definition:
    $text: ../openapi/specs/orchestrator-edge.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: engine-deposit-reads-api
  title: Engine — Deposit Query Reads
  description: >
    The CQRS read surface (ADR-IC-005 / ADR-PC-027): the canonical deposit point-read (with
    as-of and read-your-writes) and the maturities range scan. Read-only — the engine command
    surface is deliberately not public.
spec:
  type: openapi
  lifecycle: production
  owner: platform-engine
  definition:
    $text: ../openapi/specs/engine-reads.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: engine-sor-ops-api
  title: Edge — SoR-Routed Instance Operations
  description: >
    The single client-facing surface for state-changing operations on an EXISTING instance
    during coexistence (ADR-PC-018): the gateway resolves instance_id -> sor -> backend and
    fails closed (503 SOR_UNRESOLVED) rather than guess a backend.
spec:
  type: openapi
  lifecycle: production
  owner: platform-engine
  definition:
    $text: ../openapi/specs/engine-sor-ops.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orchestrator-process-status-api
  title: Orchestrator — Process Status Snapshot
  description: >
    The poll-once saga-status snapshot (Document 11 Pattern 2) the MCP get_process_status
    tool reads. NOT yet a public Kong route — an mcp->orchestrator internal read, marked
    x-internal-route in the spec (the documented routing nuance).
spec:
  type: openapi
  lifecycle: production
  owner: platform-edge
  definition:
    $text: ../openapi/specs/orchestrator-process-status.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: engine-deposit-commands-api
  title: "INTERNAL — Engine Deposit Commands (mTLS-only)"
  description: >
    The engine's deposit command / money-mover ingress (ADR-PC-029) — INTERNAL by design,
    deliberately absent from the Kong edge (ADR-IC-006 §P5 Boundary 2). Callers: the
    orchestrator saga dispatcher, the MCP deposit tools, and the ADR-PC-036 lifecycle driver
    (maturity/interest via the scoped service principal). Mandatory Idempotency-Key on the
    caller-keyed commands; step-up SCA on the irreversible money-movers. NEVER a public route
    (the gate's never-public reconcile proves it).
spec:
  type: openapi
  lifecycle: production
  owner: platform-engine
  definition:
    $text: ../openapi/internal/engine-deposit-commands.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: engine-rate-sheets-api
  title: "INTERNAL — Engine Rate-Sheet Deploy (admin-ops)"
  description: >
    The treasury/ALM forward-only rate-sheet deploy plane (ADR-PC-008): synchronous
    validation against the verified pack bound, idempotent on rate_sheet_version_id
    (identical re-POST replays 200, a different body under an existing id is 409). Served by
    the standalone Babelstone.RateSheets.Api host on the internal network — not a Kong route.
spec:
  type: openapi
  lifecycle: production
  owner: platform-engine
  definition:
    $text: ../openapi/internal/engine-rate-sheets.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: engine-pack-migrations-api
  title: "INTERNAL — Engine Pack Migrations (admin-ops)"
  description: >
    The operator pack-migration plane (ADR-PC-009 §P3): the only sanctioned way to re-pin
    existing instances to a newer regulatory pack — previewable, audited, idempotent on
    (migration_id, instance_id); distinct from adoption (which pins NEW constitutions). A
    host-level family-agnostic route on the internal network — not a Kong route.
spec:
  type: openapi
  lifecycle: production
  owner: platform-engine
  definition:
    $text: ../openapi/internal/engine-pack-migrations.openapi.yaml
---
