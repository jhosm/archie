# Backstage catalogue descriptor for the term-deposit integration events (ADR-IC-015).
#
# This file makes the SAME AsyncAPI source of truth under ./events/*.asyncapi.yaml
# discoverable in a Backstage instance — one `kind: API` entity per event, each with
# `spec.type: asyncapi` and `spec.definition.$text` pointing at the relative AsyncAPI
# file (Backstage resolves $text relative to this catalog-info.yaml's location).
#
# The descriptors ship NOW; the Backstage HOST deployment is deferred to platform work
# (ADR-IC-015 Decision §9, bd babelstone-s4ol.1). Until a Backstage instance exists this
# file is inert — the AsyncAPI files + the CI gate (scripts/asyncapi-catalog-validate.sh)
# remain the live governance surface (the Git-native fallback posture). No PII lives here
# or in any referenced AsyncAPI/Avro artefact (ADR-PC-004 §P2).
#
# Register it later with, e.g.:
#   catalog:
#     locations:
#       - type: url
#         target: https://github.com/jhosm/babelstone/blob/main/contracts/catalog/catalog-info.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-term-deposit-events
  description: The governed AsyncAPI catalogue of the term-deposit integration events.
spec:
  type: url
  targets:
    - ./events/DepositConstituted.asyncapi.yaml
    - ./events/InterestPaid.asyncapi.yaml
    - ./events/DepositMatured.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: deposit-constituted
  title: DepositConstituted
  description: The term deposit is opened — principal, resolved TAN, and the fixed schedule.
spec:
  type: asyncapi
  lifecycle: production
  owner: term-deposit
  definition:
    $text: ./events/DepositConstituted.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: interest-paid
  title: InterestPaid
  description: Interest is paid out on the term deposit (coupon/advance payout) — the coarse payout fact GL, notifications, and reporting react to (ADR-IC-017 §P4).
spec:
  type: asyncapi
  lifecycle: production
  owner: term-deposit
  definition:
    $text: ./events/InterestPaid.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: deposit-matured
  title: DepositMatured
  description: The term deposit reaches maturity.
spec:
  type: asyncapi
  lifecycle: production
  owner: term-deposit
  definition:
    $text: ./events/DepositMatured.asyncapi.yaml
