  description: >
    The engine's deposit command / money-mover ingress (ADR-PC-029) — INTERNAL by design,
    deliberately absent from the Kong edge (ADR-IC-006 §P5 Boundary 2). Callers: the
    orchestrator saga dispatcher, the MCP deposit tools, and the ADR-PC-036 lifecycle driver
    (maturity/interest via the scoped service principal). Mandatory Idempotency-Key on the
    caller-keyed commands; step-up SCA on the irreversible money-movers. NEVER a public route
    (the gate's never-public reconcile proves it).
spec:
  type: openapi
  lifecycle: production
  owner: platform-engine
  definition:
    $text: ../openapi/internal/engine-deposit-commands.openapi.yaml
