# Backstage catalogue descriptor for the engine's integration events — across ALL product
# families (term_deposit and personal_loan today; ADR-IC-015, ADR-PC-031) plus the engine-declared
# cross-cutting (operations) events — and the per-consumer reconciliation contracts (event-store
# §7.3, bd babelstone-y1t7).
#
# This file makes the SAME source-of-truth artefacts discoverable in a Backstage instance:
#   * the AsyncAPI events under ./events/*.asyncapi.yaml — one `kind: API` entity per event,
#     `spec.type: asyncapi`, `spec.definition.$text` -> the relative AsyncAPI file;
#   * the reconciliation contracts under ./reconciliation/*.reconciliation.yaml — one
#     `kind: API` entity per consumer, `spec.type: reconciliation`, `spec.definition.$text`
#     -> the relative descriptor (Backstage resolves $text relative to this file's location).
#
# The descriptors ship as the source of truth; the Backstage HOST that renders them is
# deployed by the infra/ manifests (infra/compose.yaml `backstage` service, infra/k8s/base/
# backstage.yaml; ADR-IC-015 §9, bd babelstone-s4ol.1), which mount this file as the portal's
# ONLY catalogue source. The remaining human-handoff step is building+pushing the Backstage
# app image (no turnkey image exists) — until then the source files + the CI gate
# (scripts/asyncapi-catalog-validate.sh) remain the live governance surface (the Git-native
# fallback posture). No PII lives here or in any referenced AsyncAPI / Avro / reconciliation
# artefact (ADR-PC-004 §P2): the reconciliation contracts carry references (consumer names,
# projection-kind discriminators, §7.1 pattern flags), never PII.
#
# Register it later with, e.g.:
#   catalog:
#     locations:
#       - type: url
#         target: https://github.com/jhosm/babelstone/blob/main/contracts/catalog/catalog-info.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-term-deposit-events
  description: The governed AsyncAPI catalogue of the term-deposit integration events.
spec:
  type: url
  targets:
    - ./events/DepositConstituted.asyncapi.yaml
    - ./events/InterestPaid.asyncapi.yaml
    - ./events/DepositMatured.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-personal-loan-events
  description: The governed AsyncAPI catalogue of the personal_loan (personal-loan) integration events.
spec:
  type: url
  targets:
    - ./events/LoanDisbursed.asyncapi.yaml
    - ./events/LoanInstallmentPaid.asyncapi.yaml
    - ./events/LoanRepaidEarly.asyncapi.yaml
    - ./events/LoanSettled.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-operations-events
  description: The governed AsyncAPI catalogue of the engine-declared cross-cutting (operations) integration events.
spec:
  type: url
  targets:
    - ./events/operations.PersonalDataErasureRequested.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: babelstone-reconciliation-contracts
  description: The per-consumer reconciliation contracts (event-store §7.3).
spec:
  type: url
  targets:
    - ./reconciliation/engine-projection-runtime.reconciliation.yaml
    - ./reconciliation/acl.reconciliation.yaml
    - ./reconciliation/notification.reconciliation.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: deposit-constituted
  title: DepositConstituted
  description: The term deposit is opened — principal, resolved TAN, and the fixed schedule.
spec:
  type: asyncapi
  lifecycle: production
  owner: term-deposit
  definition:
    $text: ./events/DepositConstituted.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: interest-paid
  title: InterestPaid
  description: Interest is paid out on the term deposit (coupon/advance payout) — the coarse payout fact GL, notifications, and reporting react to (ADR-IC-017 §P4).
spec:
  type: asyncapi
  lifecycle: production
  owner: term-deposit
  definition:
    $text: ./events/InterestPaid.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: deposit-matured
  title: DepositMatured
  description: The term deposit reaches maturity.
spec:
  type: asyncapi
  lifecycle: production
  owner: term-deposit
  definition:
    $text: ./events/DepositMatured.asyncapi.yaml
---
# The personal_loan (personal-loan) integration events (ADR-PC-031). The closed-end-asset
# family's published events: disburse -> amortize (installments / early repayment) -> settle,
# plus the cross-cutting GDPR erasure. LoanDisbursementFailed and LoanWrittenOff are
# store-internal only (no .avsc, no catalogue entry — they never ride the durable bus).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: loan-disbursed
  title: LoanDisbursed
  description: The personal loan is disbursed — lump-sum principal out, the amortization schedule fixed.
spec:
  type: asyncapi
  lifecycle: production
  owner: personal-loan
  definition:
    $text: ./events/LoanDisbursed.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: loan-installment-paid
  title: LoanInstallmentPaid
  description: One scheduled installment is paid — the interest/capital split and the amortizing balance.
spec:
  type: asyncapi
  lifecycle: production
  owner: personal-loan
  definition:
    $text: ./events/LoanInstallmentPaid.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: loan-repaid-early
  title: LoanRepaidEarly
  description: Early repayment of outstanding capital plus the legally-capped commission.
spec:
  type: asyncapi
  lifecycle: production
  owner: personal-loan
  definition:
    $text: ./events/LoanRepaidEarly.asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: loan-settled
  title: LoanSettled
  description: The loan is fully amortized and settled (terminal) — total capital and interest paid.
spec:
  type: asyncapi
  lifecycle: production
  owner: personal-loan
  definition:
    $text: ./events/LoanSettled.asyncapi.yaml
---
# The engine-declared cross-cutting (operations) integration events (ADR-PC-004 Amendment A4,
# event-store §4.1/§4.3). Facts that apply to ANY instance regardless of family — declared once in
# the spine and folded per family. GDPR Article 17 erasure is the first bus-promoted member; it
# supersedes the previously family-scoped term_deposit / personal_loan erasure events.
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: operations-personal-data-erasure-requested
  title: PersonalDataErasureRequested (operations)
  description: GDPR right-to-be-forgotten — the subject's PII key was crypto-shredded (ADR-PC-004 §P3/A4). Cross-cutting, engine-declared.
spec:
  type: asyncapi
  lifecycle: production
  owner: platform
  definition:
    $text: ./events/operations.PersonalDataErasureRequested.asyncapi.yaml
---
# The per-consumer reconciliation contracts (event-store §7.3, bd babelstone-y1t7). Each is
# a consumer's declared statement of what it reconciles against the engine's emitted events;
# the executable side is ReconciliationContract in ProjectionReconciler.cs. References only,
# no PII (ADR-PC-004 §P2).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: reconciliation-engine-projection-runtime
  title: Reconciliation — engine projection runtime
  description: The engine's own projection runtime reconciles under all three §7.1 patterns.
spec:
  type: reconciliation
  lifecycle: production
  owner: term-deposit
  definition:
    $text: ./reconciliation/engine-projection-runtime.reconciliation.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: reconciliation-acl
  title: Reconciliation — ACL / core-banking + GL + IFRS 9 + tax
  description: The out-of-process downstream projection self-reports progress and rebuilds quarterly.
spec:
  type: reconciliation
  lifecycle: production
  owner: integration-platform
  definition:
    $text: ./reconciliation/acl.reconciliation.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: reconciliation-notification
  title: Reconciliation — notification
  description: Event-triggered confirmations — event-count only, no checksum or rebuild.
spec:
  type: reconciliation
  lifecycle: production
  owner: notification
  definition:
    $text: ./reconciliation/notification.reconciliation.yaml
