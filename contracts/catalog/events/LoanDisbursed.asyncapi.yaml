asyncapi: '3.0.0'
info:
  title: LoanDisbursed
  version: '1'
  description: |
    The loan is disbursed: the lump-sum principal is paid out to the borrower (a settlement
    DEBIT against the lender's funding at t=0) and the closed-end French-system amortization
    schedule is fixed at constitution. The closed-end-asset analogue
    of term_deposit.DepositConstituted — but where a deposit takes the principal IN, a loan
    pays it OUT and amortizes it over term_months installments.

    Emitted: exactly once, as the personal_loan stream's first event, when the engine
    resolves the rate sheet, computes the amortization schedule, settles the disbursement
    debit, and appends the disbursement that transitions the aggregate to Active.

    NOT emitted: when disbursement is refused by a config/rule check — that is the
    store-internal LoanDisbursementFailed (no .avsc, never on the bus).

    No PII (ADR-PC-004 §P2): the payload carries only computed facts + opaque references
    (disbursement_account_ref is a token, never an IBAN). Origination stays upstream
    (ADR-PC-024 / ADR-PC-030 §P1): the engine disburses an already-approved, already-priced
    loan; it never models solvency / CRC / KYC / scoring.
  x-owner: personal-loan
  x-owner-contact: loans-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  x-authorized-consumers:
    - acl                 # downstream core-banking disbursement settlement projection (ADR-IC-012)
    - notification        # borrower-facing disbursement confirmation (ADR-IC-011)
channels:
  personal_loan:
    description: |
      Event-carried-state-transfer stream for the personal_loan aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema
      per event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      LoanDisbursed:
        $ref: '#/components/messages/LoanDisbursed'
operations:
  publishLoanDisbursed:
    action: send
    channel:
      $ref: '#/channels/personal_loan'
    messages:
      - $ref: '#/channels/personal_loan/messages/LoanDisbursed'
components:
  messages:
    LoanDisbursed:
      name: LoanDisbursed
      title: Loan Disbursed
      summary: The loan is disbursed and its amortization schedule fixed.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2).
          key:
            type: string
            description: 'aggregate_id (LoanId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.loans.LoanDisbursed.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific loan this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. personal_loan.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate
      # resolves the .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: loans.personal_loan.LoanDisbursed-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/loans/personal_loan/LoanDisbursed.avsc'
