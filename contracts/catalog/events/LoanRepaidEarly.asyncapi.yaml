asyncapi: '3.0.0'
info:
  title: LoanRepaidEarly
  version: '1'
  description: |
    The borrower repays the loan early: a partial or full prepayment
    of the outstanding capital plus the LEGALLY-CAPPED early-repayment commission. The
    commission is computed command-side as min(charged, statutory_cap) × capital_repaid,
    capped further at the interest the borrower would still have paid (the lost-interest
    ceiling). The PT consumer-credit statutory caps are 0.50% with more than one year of term
    remaining, 0.25% with one year or less (DL 133/2009 art. 19º).

    Emitted: once per early repayment on an Active loan. A FULL repayment drives the
    outstanding balance to zero and is paired with a LoanSettled on the same transition; a
    PARTIAL repayment reduces the balance and the loan stays Active.

    No PII (ADR-PC-004 §P2): the payload carries only computed cents amounts and the repayment
    date.
  x-owner: personal-loan
  x-owner-contact: loans-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  x-authorized-consumers:
    - acl                 # downstream core-banking early-repayment settlement projection (ADR-IC-012)
    - notification        # borrower-facing early-repayment confirmation (ADR-IC-011)
    - orchestrator        # the substrate-owned settlement saga auto-starts off the Movement headers (ADR-PC-032 / ADR-IC-018 §P5)
channels:
  personal_loan:
    description: |
      Event-carried-state-transfer stream for the personal_loan aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema
      per event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      LoanRepaidEarly:
        $ref: '#/components/messages/LoanRepaidEarly'
operations:
  publishLoanRepaidEarly:
    action: send
    channel:
      $ref: '#/channels/personal_loan'
    messages:
      - $ref: '#/channels/personal_loan/messages/LoanRepaidEarly'
components:
  messages:
    LoanRepaidEarly:
      name: LoanRepaidEarly
      title: Loan Repaid Early
      summary: Early repayment of outstanding capital plus the capped commission.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2).
          key:
            type: string
            description: 'aggregate_id (LoanId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.loans.LoanRepaidEarly.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific loan this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. personal_loan.' }
          # Movement-routing extension attributes (ADR-PC-032 / ADR-IC-018 §P5) — promoted from the
          # event's Originated Movement(s) by the engine-spine MovementHeaders seam. Closed-enum strings,
          # never PII (ADR-PC-004 §P2). Present whenever the event carries an Originated Movement (an early
          # repayment always does), absent otherwise. The substrate settlement saga auto-starts on
          # ce_movementorigin == Originated and fans out / branches on the ordered ce_movementdirections list
          # (one settlement instance per Movement — ADR-PC-032 §A9/§A10).
          ce_movementorigin:     { type: string, enum: ['Originated', 'Observed'], description: 'The Movement origin — Originated for an early repayment (a cash leg to drive).' }
          ce_movementdirections: { type: string, pattern: '^(Debit|Credit)(,(Debit|Credit))*$', description: 'The ordered, comma-separated list of every Originated Movement direction relative to account_ref, in carrier order — a single entry for a standalone leg (Debit for an early repayment, value leaves the borrower repayment account), N for a multi-direction event. The substrate fans out one settlement instance per entry.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate
      # resolves the .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: loans.personal_loan.LoanRepaidEarly-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/loans/personal_loan/LoanRepaidEarly.avsc'
