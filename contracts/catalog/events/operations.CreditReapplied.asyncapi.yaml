asyncapi: '3.0.0'
info:
  title: CreditReapplied
  version: '1'
  description: |
    A previously-unapplied credit was reapplied once a live destination existed (ADR-PC-043 slot 5). The
    account that could not receive the payout became receivable again (re-opened, reactivated, or a
    re-target to a valid account), so the held IOU is discharged and the money lands.

    Emitted: when a held undeliverable credit is resolved and the engine records the landing. The
    resolution key is a PURE FUNCTION of the original intent (resolution_intent_id =
    g(original_intent_id), from SettlementReferences.DeriveResolutionIntentId), never freshly minted, so
    a late apply of the ORIGINAL credit and this resolution structurally reference the same intent and
    the CA-apply command_id collapses at command_dedup to ONE landing. A second CreditReapplied for an
    already-resolved intent is a reconciliation signal, not a double-pay.

    A CROSS-CUTTING engine-declared event, declared once in the spine under the synthetic `operations`
    aggregate_type (event-store §4.3) and folded per family as a no-op (the IOU/escheat ledger is
    spine-owned).

    No PII (ADR-PC-004 §P2): opaque beneficiary/intent references, integer cents, an input date.
  x-owner: platform
  x-owner-contact: platform-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  x-authorized-consumers:
    - acl                 # downstream core-banking escheat/IOU reconciliation close (ADR-IC-012)
    - notification        # customer-facing 'payout delivered' advice (ADR-IC-011)
channels:
  operations:
    description: |
      The engine-declared cross-cutting operational stream (event-store §4.1/§4.3). Topic name ==
      `aggregate_type` — the synthetic `operations` aggregate_type. One Avro schema per event type
      (Option A, doc 08).
    x-compacted: false
    messages:
      CreditReapplied:
        $ref: '#/components/messages/CreditReapplied'
operations:
  publishCreditReapplied:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/CreditReapplied'
components:
  messages:
    CreditReapplied:
      name: CreditReapplied
      title: Credit Reapplied
      summary: A held undeliverable credit was reapplied exactly once when the destination became receivable.
      contentType: application/avro
      bindings:
        kafka:
          key:
            type: string
            description: 'resolution_intent_id — the Kafka record key (the resolution axis).'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.operations.CreditReapplied.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'resolution_intent_id — the resolution this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type — operations.' }
      x-schema-registry-subject: operations.CreditReapplied-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/operations/CreditReapplied.avsc'
