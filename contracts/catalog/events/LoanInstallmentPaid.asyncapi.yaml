asyncapi: '3.0.0'
info:
  title: LoanInstallmentPaid
  version: '1'
  description: |
    One scheduled installment is paid: the period's interest + capital split (P(t) = J(t) +
    A(t)) and the outstanding balance after it. The amortization kernel computed the split
    command-side; the event records the already-computed facts. The interest leg accrues on
    the opening balance (J(t) = S(t-1) × r); the capital leg reduces the outstanding balance
    (S(t) = S(t-1) − A(t)) toward zero.

    Emitted: once per scheduled installment paid, on an Active loan, while the outstanding
    balance is positive. The FINAL installment that drives the balance to zero is paired with
    a LoanSettled on the same transition.

    No PII (ADR-PC-004 §P2): the payload carries only computed cents amounts, the installment
    index, and the paid date.
  x-owner: personal-loan
  x-owner-contact: loans-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  x-authorized-consumers:
    - acl                 # downstream core-banking installment-collection projection (ADR-IC-012)
    - notification        # borrower-facing installment receipt (ADR-IC-011)
channels:
  personal_loan:
    description: |
      Event-carried-state-transfer stream for the personal_loan aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema
      per event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      LoanInstallmentPaid:
        $ref: '#/components/messages/LoanInstallmentPaid'
operations:
  publishLoanInstallmentPaid:
    action: send
    channel:
      $ref: '#/channels/personal_loan'
    messages:
      - $ref: '#/channels/personal_loan/messages/LoanInstallmentPaid'
components:
  messages:
    LoanInstallmentPaid:
      name: LoanInstallmentPaid
      title: Loan Installment Paid
      summary: One scheduled installment is paid; the balance amortizes.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2).
          key:
            type: string
            description: 'aggregate_id (LoanId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.loans.LoanInstallmentPaid.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific loan this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. personal_loan.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate
      # resolves the .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: loans.personal_loan.LoanInstallmentPaid-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/loans/personal_loan/LoanInstallmentPaid.avsc'
