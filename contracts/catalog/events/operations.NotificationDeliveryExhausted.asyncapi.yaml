asyncapi: '3.0.0'
info:
  title: NotificationDeliveryExhausted
  version: '1'
  description: |
    Webhook delivery of one customer notification has been abandoned after exhausting the
    ADR-IC-011 §D4 retry schedule (10 attempts, roughly 12 hours of exponential backoff): the
    notification service dead-lettered the delivery record and published this event to the
    backbone in the same breath (§P3 step 7). It is an OPERATIONAL fact, not a domain one — the
    producing flow behind the notification (a matured deposit, a settled loan) is long committed
    and unaffected (ADR-PC-025 slot 5, post-flag); the only thing that failed is the outbound
    HTTP leg to the communications-system consumer.

    Producer: the NOTIFICATION service's own exhausted-event outbox (ADR-IC-004: the outbox row
    is written in the SAME PostgreSQL transaction as the DEAD_LETTERED status flip, so a crash
    between "give up" and "announce it" can never lose the announcement), drained by the
    notification host's backbone relay. NOT the engine — this entry carries the ADR-IC-017
    (2026-06-26 amendment) downstream-producer marker `x-producer: notification`, the same
    exemption posture as the SCHEDULED NotificationDue leg.

    Idempotency: at-least-once via the producer's outbox; ONE exhausted event exists per
    notification_id ever (the delivery store admits a notification_id once and dead-letters it
    at most once), so notification_id is the consumer's dedupe anchor. Per-instance order
    (partition_key = instance_id).

    No PII (ADR-PC-004 §P2): customer_id is an opaque recipient reference; last_error is
    transport-status diagnostics only (an HTTP status summary, a timeout message) — the bus
    never carries the subject's name, NIF, contact data, or the webhook payload itself.
  x-owner: platform
  x-owner-contact: platform-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  # ADR-IC-017 (2026-06-26 amendment) §3: the producing service. `notification` (NOT `engine`) — a
  # registered in-house estate service (ADR-IC-013): the exhausted event is produced by the
  # notification service's own delivery-exhausted outbox (ADR-IC-011 §P3 step 7 / ADR-IC-004), so
  # this entry is EXEMPT from the §P3 reverse-orphan relay-capable-ENGINE-event leg only. It still
  # carries every other catalogue obligation (validity, governance fields, no-PII, BACKWARD diff,
  # deprecation lifecycle, subject well-formedness).
  x-producer: notification
  x-authorized-consumers:
    - operations-alerting   # the operator/alerting surface that picks the undelivered notification up out of band (ADR-IC-011 §D4 — human/ops intervention, nothing retries off this event)
channels:
  operations:
    description: |
      The cross-cutting operational stream (event-store §4.1/§4.3). Topic name == `aggregate_type`
      (the relay's documented convention) — the synthetic `operations` aggregate_type for facts that
      apply to ANY instance regardless of product family. NotificationDeliveryExhausted is produced
      onto this stream by the notification service's own exhausted-event outbox (ADR-IC-011 §P3),
      not the engine relay. One Avro schema per event type (Option A, doc 08): each event is its own
      message on this channel.
    x-compacted: false
    messages:
      NotificationDeliveryExhausted:
        $ref: '#/components/messages/NotificationDeliveryExhausted'
operations:
  publishNotificationDeliveryExhausted:
    action: send
    channel:
      $ref: '#/channels/operations'
    messages:
      - $ref: '#/channels/operations/messages/NotificationDeliveryExhausted'
components:
  messages:
    NotificationDeliveryExhausted:
      name: NotificationDeliveryExhausted
      title: Notification Delivery Exhausted
      summary: Webhook delivery of a customer notification was dead-lettered after exhausting the §D4 retry schedule.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers; the value is the
          # Avro business payload. No PII (ADR-PC-004 §P2): the payload carries only structural fields
          # + opaque references (customer_id; last_error is transport-status text only).
          key:
            type: string
            description: 'aggregate_id (InstanceId) — the Kafka record key (partition_key = instance_id).'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (producer outbox event_id — fresh per exhausted row).' }
          ce_source:           { type: string, description: 'URI of the producing service: urn:babelstone:notification (the delivery estate) — never the engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.operations.NotificationDeliveryExhausted.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific instance the undelivered notification is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type — operations (the synthetic cross-cutting aggregate_type).' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate resolves the
      # .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: operations.NotificationDeliveryExhausted-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/operations/NotificationDeliveryExhausted.avsc'
