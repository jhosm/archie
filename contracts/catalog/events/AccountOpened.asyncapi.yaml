asyncapi: '3.0.0'
info:
  title: AccountOpened
  version: '1'
  description: |
    The demand account (conta à ordem) is opened and starts transacting (ADR-PC-037: Pending ->
    Active). The current_account family is the first transactional instance of the Account
    abstraction: the account's accounting and available balances and its hold set are NOT carried
    here — both are spine-owned folds over the movement ledger + hold set (ADR-PC-033), zero at
    opening. This event carries only the structural product identity fixed at opening.

    Emitted: exactly once, as the current_account stream's first event, when the engine records the
    open and the aggregate transitions to Active.

    NOT emitted: when opening is rejected by a config/rule/precondition check — that is the
    store-internal AccountOpeningFailed (no .avsc, never on the bus; a recorded verdict only).

    No PII (ADR-PC-004 §P2): the payload carries only computed/structural facts + an opaque
    account reference (account_id is a token, never identity data). Account opening (KYC / onboarding)
    stays upstream (ADR-PC-024 / ADR-PC-030): the engine records the opened account, it never runs
    the checks that approve it.
  x-owner: current-account
  x-owner-contact: accounts-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  x-authorized-consumers:
    - acl                 # downstream core-banking account registry mirrors the account's existence/status (ADR-IC-012)
    - notification        # customer-facing account-opening confirmation (ADR-IC-011)
channels:
  current_account:
    description: |
      Event-carried-state-transfer stream for the current_account aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema per
      event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      AccountOpened:
        $ref: '#/components/messages/AccountOpened'
operations:
  publishAccountOpened:
    action: send
    channel:
      $ref: '#/channels/current_account'
    messages:
      - $ref: '#/channels/current_account/messages/AccountOpened'
components:
  messages:
    AccountOpened:
      name: AccountOpened
      title: Account Opened
      summary: The demand account is opened and starts transacting.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2).
          key:
            type: string
            description: 'aggregate_id (AccountId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.accounts.AccountOpened.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific account this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. current_account.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate resolves the
      # .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: accounts.current_account.AccountOpened-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/accounts/current_account/AccountOpened.avsc'
