asyncapi: '3.0.0'
info:
  title: PersonalDataErasureRequested
  version: '1'
  description: |
    The data subject's GDPR Article 17 right-to-be-forgotten was exercised on a deposit:
    the subject's encryption key has been crypto-shredded (IPiiKeyStore.DestroyKeyAsync,
    ADR-PC-004 §P3), so every PII ciphertext under that key is now permanently unrecoverable.
    After this fact, only the deposit's non-personal structural fields (id, amounts, dates,
    lifecycle, opaque references) remain queryable.

    Emitted: exactly once, when the engine processes a verified erasure request, destroys the
    subject's key, and appends the audit fact that transitions the aggregate to Erased.

    No PII rides this event (ADR-PC-004 §P2): subject_pseudonym is a salted one-way hash of the
    data-subject id (ADR-IC-016 §8), an opaque correlation reference a downstream consumer can
    cascade its own deletion on — never the raw subject id. The bus carries the erasure SIGNAL,
    never the recoverable identity, so the fact can be published without re-leaking what was erased.
  x-owner: term-deposit
  x-owner-contact: deposits-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: LEGAL_OBLIGATION
  x-authorized-consumers:
    - acl                 # downstream core-banking erasure cascade (delete related records)
    - notification        # suppress further depositor-facing messaging once erased (ADR-IC-011)
channels:
  term_deposit:
    description: |
      Event-carried-state-transfer stream for the term-deposit aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema
      per event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      PersonalDataErasureRequested:
        $ref: '#/components/messages/PersonalDataErasureRequested'
operations:
  publishPersonalDataErasureRequested:
    action: send
    channel:
      $ref: '#/channels/term_deposit'
    messages:
      - $ref: '#/channels/term_deposit/messages/PersonalDataErasureRequested'
components:
  messages:
    PersonalDataErasureRequested:
      name: PersonalDataErasureRequested
      title: Personal Data Erasure Requested
      summary: GDPR right-to-be-forgotten — the subject's PII key was crypto-shredded.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2): the payload carries only structural fields + a salted pseudonym.
          key:
            type: string
            description: 'aggregate_id (DepositId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.deposits.PersonalDataErasureRequested.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific deposit this erasure is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. term_deposit.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate
      # resolves the .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: deposits.term_deposit.PersonalDataErasureRequested-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/deposits/term_deposit/PersonalDataErasureRequested.avsc'
