asyncapi: '3.0.0'
info:
  title: DepositTerminatedEarly
  version: '1'
  description: |
    The term deposit is broken before maturity and settled net of the configured penalty:
    NetSettlementAmount = PrincipalReturned + NetAccruedInterest − PenaltyAmount, in EUR cents,
    with the break date. The accrued NET interest is settled back; only the penalty is forfeited.

    Promoted to an integration event (bd t7o3.13 / t7o3.13.1) so the early-termination payout's
    Movement reaches the substrate-owned settlement saga off the bus: the gated, confirmation-only
    ACL credit replaces the old eager in-engine settle (ADR-PC-032 slot 5 / ADR-IC-017 §P4). The
    fine-grained accrual mechanics (InterestAccrued, WithholdingApplied) stay internal/store-only;
    this coarse payout fact carries the settlement amount the named contexts react to.

    Emitted: exactly once, when an early-termination command is accepted on an Active deposit and
    the aggregate transitions to the terminal TerminatedEarly state.

    NOT emitted: at maturity (that is DepositMatured), nor on a partial withdrawal (which leaves
    the deposit Active and settles nothing), nor before the deposit is Active.
  x-owner: term-deposit
  x-owner-contact: deposits-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  # The ADR-IC-017 §P4 recorded consumer map: the named bounded contexts that react to an early
  # termination's payout (modelled on DepositMatured's payout-fact consumer list). No PII consumer
  # is listed — the event carries only an opaque deposit_id reference (ADR-PC-004 §P2).
  x-authorized-consumers:
    - notification        # depositor-facing early-termination/payout confirmation (ADR-IC-011)
    - acl                 # downstream core-banking settlement projection (ADR-IC-012)
    - orchestrator        # the substrate-owned settlement saga auto-starts off the Movement headers (ADR-PC-032 / ADR-IC-018 §P5)
channels:
  term_deposit:
    description: |
      Event-carried-state-transfer stream for the term-deposit aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema
      per event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      DepositTerminatedEarly:
        $ref: '#/components/messages/DepositTerminatedEarly'
operations:
  publishDepositTerminatedEarly:
    action: send
    channel:
      $ref: '#/channels/term_deposit'
    messages:
      - $ref: '#/channels/term_deposit/messages/DepositTerminatedEarly'
components:
  messages:
    DepositTerminatedEarly:
      name: DepositTerminatedEarly
      title: Deposit Terminated Early
      summary: The deposit is broken before maturity and settled net of the penalty.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2).
          key:
            type: string
            description: 'aggregate_id (DepositId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.deposits.DepositTerminatedEarly.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific deposit this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. term_deposit.' }
          # Movement-routing extension attributes (ADR-PC-032 / ADR-IC-018 §P5) — promoted from the
          # event's Originated Movement(s) by the engine-spine MovementHeaders seam (bd t7o3.13). Closed-enum
          # strings, never PII (ADR-PC-004 §P2). Present whenever the event carries an Originated Movement (an
          # early-termination payout always does), absent otherwise. The substrate settlement saga auto-starts
          # on ce_movementorigin == Originated and branches on the ordered ce_movementdirections list (one
          # settlement instance per Movement — ADR-PC-032 §A9/§A10). NOT in `required` — additive, BACKWARD.
          ce_movementorigin:     { type: string, enum: ['Originated', 'Observed'], description: 'The Movement origin — Originated for an early-termination payout (a cash leg to drive).' }
          ce_movementdirections: { type: string, pattern: '^(Debit|Credit)(,(Debit|Credit))*$', description: 'The ordered, comma-separated list of every Originated Movement direction relative to account_ref, in carrier order — a single entry for a standalone leg (Credit for an early-termination payout, value enters the payout account), N for a multi-direction event. The substrate fans out one settlement instance per entry.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate
      # resolves the .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: deposits.term_deposit.DepositTerminatedEarly-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/deposits/term_deposit/DepositTerminatedEarly.avsc'
