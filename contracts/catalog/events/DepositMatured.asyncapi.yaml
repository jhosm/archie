asyncapi: '3.0.0'
info:
  title: DepositMatured
  version: '1'
  description: |
    The deposit reaches maturity and pays out: TotalPayout = PrincipalReturned +
    NetInterestPaid, in EUR cents, with the maturity date.

    Emitted: exactly once, when the engine settles the deposit at its maturity date and
    the aggregate transitions to a terminal Matured state.

    NOT emitted: on early termination (a distinct transition, not modelled on this topic
    in v1), nor before the maturity date is reached.
  x-owner: term-deposit
  x-owner-contact: deposits-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: CONTRACT_PERFORMANCE
  x-authorized-consumers:
    - notification        # depositor-facing maturity/payout confirmation (ADR-IC-011)
    - acl                 # downstream core-banking settlement projection (ADR-IC-012)
    - orchestrator        # the substrate-owned settlement saga auto-starts off the Movement headers (ADR-PC-032 / ADR-IC-018 §P5)
channels:
  term_deposit:
    description: |
      Event-carried-state-transfer stream for the term-deposit aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema
      per event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      DepositMatured:
        $ref: '#/components/messages/DepositMatured'
operations:
  publishDepositMatured:
    action: send
    channel:
      $ref: '#/channels/term_deposit'
    messages:
      - $ref: '#/channels/term_deposit/messages/DepositMatured'
components:
  messages:
    DepositMatured:
      name: DepositMatured
      title: Deposit Matured
      summary: The deposit matures and pays out.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2).
          key:
            type: string
            description: 'aggregate_id (DepositId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.deposits.DepositMatured.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific deposit this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. term_deposit.' }
          # OPTIONAL CloudEvents extension attribute (ADR-IC-018 §P5, registered in ADR-IC-015):
          # the renewal policy promoted from the auto_renewal_policy payload field by the outbox
          # relay (OutboxDrainer.BuildHeaders) so a header-only consumer (the renewal saga) can
          # route without decoding the Avro value. Present only when the deposit declared a policy;
          # absent for pre-seam streams. A structural enum token, not PII (ADR-PC-004 §P2). NOT in
          # `required` — an additive, BACKWARD-compatible header.
          ce_autorenewalpolicy: { type: string, enum: ['NONE', 'SAME_TERM_CURRENT_RATE', 'SAME_TERM_SAME_RATE'], description: 'Renewal policy extension attribute (ADR-IC-018 §P5).' }
          # Movement-routing extension attributes (ADR-PC-032 / ADR-IC-018 §P5) — promoted from the
          # event's Originated Movement(s) by the engine-spine MovementHeaders seam (bd t7o3.13). Closed-enum
          # strings, never PII (ADR-PC-004 §P2). Present whenever the event carries an Originated Movement (a
          # maturity always does), absent otherwise. The substrate settlement saga auto-starts on
          # ce_movementorigin == Originated and branches on the ordered ce_movementdirections list (one
          # settlement instance per Movement — ADR-PC-032 §A9/§A10). Co-carried with ce_autorenewalpolicy on the
          # same hop (distinct keys, no double-populate). NOT in `required` — additive, BACKWARD-compatible.
          ce_movementorigin:     { type: string, enum: ['Originated', 'Observed'], description: 'The Movement origin — Originated for a maturity payout (a cash leg to drive).' }
          ce_movementdirections: { type: string, pattern: '^(Debit|Credit)(,(Debit|Credit))*$', description: 'The ordered, comma-separated list of every Originated Movement direction relative to account_ref, in carrier order — a single entry for a standalone leg (Credit for a maturity payout, value enters the payout account), N for a multi-direction event. The substrate fans out one settlement instance per entry.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate
      # resolves the .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: deposits.term_deposit.DepositMatured-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/deposits/term_deposit/DepositMatured.avsc'
