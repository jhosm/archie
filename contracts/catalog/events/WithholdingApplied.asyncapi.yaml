asyncapi: '3.0.0'
info:
  title: WithholdingApplied
  version: '1'
  description: |
    Withholding tax applied to a gross-interest flow, carrying the tax and the resulting
    net, with Net = Gross - Tax conserved to the cent.

    Emitted: once per interest flow that is subject to withholding, paired with the
    InterestAccrued event for the same period. The tax is computed flow-by-flow so the
    conservation invariant (Net = Gross - Tax) holds exactly in integer cents.

    NOT emitted: for flows exempt from withholding, nor before the corresponding interest
    has accrued.
  x-owner: term-deposit
  x-owner-contact: deposits-team@babelstone.example
  x-status: active
  x-gdpr-legal-basis: AML_OBLIGATION
  x-authorized-consumers:
    - acl                 # downstream core-banking + tax-reporting projection (ADR-IC-012)
channels:
  term_deposit:
    description: |
      Event-carried-state-transfer stream for the term-deposit aggregate. Topic name ==
      `aggregate_type` (the relay's documented convention, OutboxDrainer). One Avro schema
      per event type (Option A, doc 08): each event is its own message on this channel.
    x-compacted: false
    messages:
      WithholdingApplied:
        $ref: '#/components/messages/WithholdingApplied'
operations:
  publishWithholdingApplied:
    action: send
    channel:
      $ref: '#/channels/term_deposit'
    messages:
      - $ref: '#/channels/term_deposit/messages/WithholdingApplied'
components:
  messages:
    WithholdingApplied:
      name: WithholdingApplied
      title: Withholding Applied
      summary: Withholding tax applied to a gross-interest flow.
      contentType: application/avro
      bindings:
        kafka:
          # CloudEvents 1.0 Binary Content Mode — attributes ride as Kafka headers
          # (OutboxDrainer.BuildHeaders); the value is the Avro business payload. No PII
          # (ADR-PC-004 §P2).
          key:
            type: string
            description: 'aggregate_id (DepositId) — the Kafka record key.'
          bindingVersion: '0.5.0'
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_time
          - ce_subject
          - ce_aggregatetype
          - ce_datacontenttype
        properties:
          ce_specversion:      { type: string, const: '1.0' }
          ce_id:               { type: string, format: uuid, description: 'Unique event ID (outbox event_id).' }
          ce_source:           { type: string, description: 'URI of the producing service, e.g. urn:babelstone:engine.' }
          ce_type:             { type: string, description: 'Reverse-DNS event type, e.g. com.bank.deposits.WithholdingApplied.' }
          ce_time:             { type: string, format: date-time }
          ce_datacontenttype:  { type: string, const: 'application/avro' }
          ce_subject:          { type: string, description: 'aggregate_id — the specific deposit this event is about.' }
          ce_aggregatetype:    { type: string, description: 'Aggregate type, e.g. term_deposit.' }
      # §P6: payload is the governed Avro schema, referenced (not restated). The PR gate
      # resolves the .avsc on disk hermetically; the main lane reconciles the subject below.
      x-schema-registry-subject: deposits.term_deposit.WithholdingApplied-value
      payload:
        schemaFormat: 'application/vnd.apache.avro+json;version=1.9.0'
        schema:
          $ref: '../../avro/deposits/term_deposit/WithholdingApplied.avsc'
