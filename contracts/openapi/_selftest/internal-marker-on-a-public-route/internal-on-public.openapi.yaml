openapi: 3.1.0
# NEGATIVE FIXTURE — a governance-complete spec that marks a route x-internal-route while that
# route IS an exposed public Kong route (GET /v1/deposits/maturities, engine-query service).
# The reconcile's CONTRADICTION check MUST fail this: the x-internal-route waiver only covers
# operations Kong does NOT expose — when a route goes public the marker must be dropped in the
# same change (lock-step, never silent drift; bd ax0b.3). This proves the waiver is not a
# blanket REVERSE bypass.
info:
  title: Babelstone — Internal marker on a public route (must fail)
  version: 1.0.0
  x-owner: platform-engine
  x-owner-contact: platform-engine@babelstone.example
  x-status: active
  x-gdpr-legal-basis: contract
  x-authorized-consumers:
    - retail-web
servers:
  - url: https://api.babelstone.example
paths:
  /v1/deposits/maturities:
    get:
      operationId: listMaturitiesInternalMarked
      summary: A PUBLIC Kong route wrongly carrying the internal waiver (the defect under test).
      x-internal-route: pretending this public route is internal — the contradiction check must catch it
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
