[project]
name = "babelstone-mcp"
version = "0.1.0"
description = "Babelstone dev MCP server — term-deposit tools/resources over the engine HTTP API (ADR-IC-010, E.5)."
requires-python = ">=3.10"
# Pinned per ADR-IC-010 P1 (deliberate upgrades; the MCP protocol version 2025-11-25 is pinned in
# the SDK negotiation). The official Python SDK + an async HTTP client to reach the engine
# command/query boundary (Babelstone.Engine.Api).
dependencies = [
    "mcp==1.27.2",
    "httpx>=0.28,<1",
    # Epic J (babelstone-e50n): decode the gateway-validated bearer JWT at the MCP app layer to
    # re-check `aud` authoritatively (ADR-IC-010 §P3). Kong's jwt plugin already verified the
    # SIGNATURE upstream, so the middleware decodes with verify_signature=False and asserts the
    # audience itself — defense-in-depth alongside the Kong pre-function aud check.
    "pyjwt>=2.8,<3",
    # OpenTelemetry (ADR-IC-007 Layer 1, bd babelstone-scd2.1 — the mcp-server leg of the estate
    # OTel work). The SDK + the OTLP/HTTP span exporter export to the OTel Collector (§P1 — never
    # direct-to-backend); the ASGI + httpx instrumentations make every MCP request a SERVER span and
    # every engine/orchestrator call a CLIENT span, on the SAME service.namespace=babelstone resource
    # and the SAME babelstone.* attribute contract the .NET hosts use — so an MCP-driven deposit is one
    # connected trace through the engine. OTLP/HTTP (not gRPC) keeps the dependency surface small (no
    # grpcio). Bounded <2 in the spirit of the project's deliberate-upgrade discipline.
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-instrumentation-asgi>=0.48b0,<1",
    "opentelemetry-instrumentation-httpx>=0.48b0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Line + branch coverage for the MCP server (Q.y, babelstone-2t16.13). pytest-cov
    # wraps coverage.py; CI runs it with --cov --cov-branch and emits cobertura XML.
    "pytest-cov>=5",
]
# The real-Claude demo agent (bd babelstone-f0ic.6.1) — an OPTIONAL extra so the core MCP server
# install stays lean (it needs no LLM SDK). The Anthropic SDK with the MCP helpers binds the deposit
# tools to Claude and runs the agentic loop. Bounded to <1 in the spirit of the project's
# deliberate-upgrade discipline (this is the LLM SDK, distinct from the MCP SDK + protocol version
# that ADR-IC-010 §P1 pins hard as `mcp==1.27.2`). The agent loop's unit tests use fakes and do NOT
# require this extra installed.
agent = [
    "anthropic[mcp]>=0.92,<1",
]

[project.scripts]
babelstone-mcp = "babelstone_mcp.__main__:main"
# The real-Claude demo agent host (bd babelstone-f0ic.6.2) — POST /agent/stream -> SSE. Needs the
# `agent` extra (anthropic) + ANTHROPIC_API_KEY at request time.
babelstone-agent = "babelstone_mcp.agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babelstone_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
