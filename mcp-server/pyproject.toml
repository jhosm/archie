[project]
name = "babelstone-mcp"
version = "0.1.0"
description = "Babelstone dev MCP server — term-deposit tools/resources over the engine HTTP API (ADR-IC-010, E.5)."
requires-python = ">=3.10"
# Pinned per ADR-IC-010 P1 (deliberate upgrades; the MCP protocol version 2025-11-25 is pinned in
# the SDK negotiation). The official Python SDK + an async HTTP client to reach the engine
# command/query boundary (Babelstone.Engine.Api).
dependencies = [
    "mcp==1.27.2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
babelstone-mcp = "babelstone_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babelstone_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
