# INVALID @ depth 4: a partial_withdrawal block on an ADVANCE (juros antecipados)
# variant. ADVANCE pays the whole term's interest up front on the full principal,
# so a later partial withdrawal would strand pre-paid interest on money no longer
# on deposit with no flow to re-base it. The engine refuses the withdrawal at
# runtime (PartialWithdrawalDecider); this forbids AUTHORING the dead combination.
# CUE could express this presence-given-enum constraint (as it does for
# payment_period_months), but it is checked here in Go alongside the sibling F.12
# coherence invariants (carencia<term, remaining<max) so the whole partial_withdrawal
# authoring contract — and one precise, named diagnostic — lives in one place
# (bd babelstone-emtr).
variant_id: dpz_pt_6m_advance_partial_withdrawal
schema: term_deposit@2026.1
pack: pt.2026.1
term_days: 180
day_count: pt.act_360
currency: EUR
interest_variant: ADVANCE        # pre-paid interest — cannot host a partial withdrawal
rate:
  flat: { rate_ref: { sheet: live, role_selector: deposit_origin } }
early_termination:
  flat: { up_to_days: null, penalty_basis_points: 10000, basis: ACCRUED_INTEREST }
auto_renewal_policy: NONE
principal_bounds: { min_cents: 100000, max_cents: 50000000 }
partial_withdrawal:               # forbidden on ADVANCE
  min_withdrawal_cents: 50000
  min_remaining_balance_cents: 100000
  carencia_days: 60
